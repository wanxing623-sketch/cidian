sub":"近义辨析","type":"four","expl":"形容人或物高大，横在空中，浮出人世，或比喻卓尔不群。（侧重突出、明显）","core":"形容人或物高大，横在空中，浮出人世，或比喻卓尔不群","exs":["四十载波澜壮阔，一批批拓荒者、先行者、攻关者，闯关夺隘、攻坚克难，把一个个“不可能”变成“可能”，让一串串惊世奇迹横空出世。","“矩阵游戏”横空出世，AI首次创建高效准确数学算法。","本届展会是科技企业与艺术机构同台碰撞与融合的会展新物种，既有全球最新智能设备和创意软件的亮相，有顶级艺术家和科技大咖的加盟，也有校园新势力横空出世，看点十足。"]},{"id":80,"w":"异军突起","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"近义辨析","type":"four","expl":"异军：另一支军队。比喻一支新生力量突然崛起。（侧重新生事物）","core":"比喻一支新生力量突然崛起","exs":["今年夏天，选秀节目被互联网再次引爆。《中国有嘻哈》异军突起，让“嘻哈”这一小众音乐备受关注。","面对近年来外部形势的新变化，延边州抓住机遇，寻找新的发展空间，探索新的发展出路，不断推动纺织服装加工产业成为“十三五”期间异军突起的新动能产业。","从无到有、从低到高，着手打造性能可靠、功能互补、性价比较高的“无人机军团”，不少外媒以“异军突起”来形容伊朗无人机的发展，并对该国生产的无人机冠以“空中波斯弯刀”的名号。"]},{"id":81,"w":"应运而生","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"近义辨析","type":"four","expl":"应运：应天命。指顺应天命而降生。后泛指顺应时机而产生。","core":"指顺应天命而降生","exs":["现代经济学已经失灵，适应信息时代的新型经济学将应运而生。","帮助更多人科学养宠，新兴职业宠物训练师应运而生。","新时代新需求：智慧养老服务模式应运而生。"]},{"id":82,"w":"落地生根","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"近义辨析","type":"four","expl":"字面意思指植物落到地面上便扎根生长，引申义表示某人或某事在一个地方稳定下来，生根发芽，形容生活、工作或事业的稳定发展。","core":"字面意思指植物落到地面上便扎根生长，引申义表示某人或某事在一个地方稳定下来，生根发芽，形…","exs":["加速推动新经济形态落地生根，引导青年有效把握其变革性影响与发展机遇。","从西北沙漠到东部海岸，“勇担使命、不畏艰辛、久久为功”的精神落地生根，化作“春天的事业”。","健全党的领导制度体系，必须狠抓制度执行力，确保各项制度落地生根。"]},{"id":83,"w":"高歌猛进","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"意思是高声歌唱，勇猛前进；形容在前进的道路上，充满乐观精神。","core":"意思是高声歌唱，勇猛前进","exs":["自去年开工以来，项目建设一路高歌猛进，预计年底验收手续办理后即可试生产。","这30多年，是改革开放波澜壮阔的30多年，是上海高歌猛进的30多年。","3月15日晚，CBA联赛第35轮，回到绍兴柯桥主场的浙江稠州金租男篮迎来了江苏男篮的挑战，凭借全队在外线的滚烫手感，最终121比80轻取对手，继续在连胜道路上高歌猛进。"]},{"id":84,"w":"如火如荼","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"原比喻军容之盛，现在形容旺盛、热烈或激烈。","core":"原比喻军容之盛，现在形容旺盛、热烈或激烈","exs":["放眼北疆各大项目现场，处处呈现出如火如荼的建设场面。","春节假期，浙江省宁波舟山港船舶往来频繁，生产如火如荼，工人们坚守岗位，忙碌装卸货物，确保供应链、物流链的高效顺畅，力争龙年“开门红”。","时下，走进三都县各个早春蔬菜种植基地，到处可见群众翻犁田土、开厢起垄、施肥、覆膜的忙碌身影，各地春耕备耕正如火如荼地进行着。"]},{"id":85,"w":"如日中天","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"像太阳正运行到正午。比喻正发展到最兴盛的阶段。","core":"比喻正发展到最兴盛的阶段","exs":["2013年热播的《徐悲鸿》更是让他的演艺事业如日中天。","二人长期在外做虫草生意、搞建筑，事业如日中天。","这座令聂鲁达久久驻足的古城，名叫马丘比丘，在15世纪印加帝国如日中天的年代里，工匠以极高的建筑技艺建成了它，作为贵族的休养地与祭祀地。"]},{"id":86,"w":"势如破竹","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"势：形势。破竹：劈开竹子。形势如同劈竹子一样，劈开头上几节，下面各节就顺着刀口裂开了。后用来形容节节胜利，毫无阻碍。","core":"后用来形容节节胜利，毫无阻碍","exs":["尽管《私人订制》在上映后遭遇恶评，但无论是在排片上还是票房上都势如破竹。","一切围着项目转，一切为了项目干，全市招商引资势如破竹。中建材凯盛集团、海螺集团等大企业大集团纷纷投资通辽。","末节中国队势如破竹，连入四球大胜。"]},{"id":87,"w":"突飞猛进","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"形容发展十分迅速。","core":"形容发展十分迅速","exs":["我可以肯定地认为，中国会继续实现突飞猛进的发展。","从去年10月开始，随着张之臻、吴易昺、商竣程等新生代球员集体崛起，中国男网的成绩突飞猛进。","当下，生命科学、生物技术发展突飞猛进。在医疗领域深耕多年的华大集团首席执行官、执行董事尹烨对此深有体会。"]},{"id":88,"w":"日臻完善","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"意指一天天逐步达到完美的境地，用于描述事物在持续改进中趋于完善。","core":"意指一天天逐步达到完美的境地，用于描述事物在持续改进中趋于完善","exs":["从本体论上看，自我的存在是道德行为之所以发生的前提，道德境界的日臻完善也是以道德自我为出发点和实现路径。","数据的跃升，得益于阅读基础设施体系的日臻完善。","中国特色社会主义生态环境保护法律体系日臻完善，生态文明体制改革向纵深推进，人与自然和谐共生的制度基石更加稳固。"]},{"id":89,"w":"枝繁叶茂","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"本义是指树木枝条繁多、绿叶茂密的自然生长状态，引申为比喻家族兴旺或事业繁荣。","core":"本义是指树木枝条繁多、绿叶茂密的自然生长状态，引申为比喻家族兴旺或事业繁荣","exs":["理论基础牢固深厚，哲学社会科学自主知识体系的大树就会枝繁叶茂、硕果累累。","院内古松挺拔苍翠，枝繁叶茂；古建错落有致，典雅大气。","“前人栽树、后人乘凉”，栽树之人未必能等到枝繁叶茂，但正因有一批批甘于奉献的栽树人，才有了后人头上这片郁郁葱葱，进而创造出了荒原变林海的绿色奇迹。"]},{"id":90,"w":"势不可挡","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"发展势头好","type":"four","expl":"形容事物或力量的发展趋势非常强劲，无法阻挡，常用于描述某种强大的力量或趋势，表示其来势迅猛，无法抵挡。","core":"形容事物或力量的发展趋势非常强劲，无法阻挡，常用于描述某种强大的力量或趋势，表示其来势迅…","exs":["特别是党的十八大以来，我们党团结带领全国各族人民自信自强、开拓进取，依靠劳动创造扎实推进中国式现代化，全面建成小康社会，踏上第二个百年奋斗目标新征程，中华民族伟大复兴势不可挡！","当前，全球数字化、网络化、智能化发展势不可挡，数字中国建设正加快从单点突破迈向体系化发展，迫切需要坚持系统推进、深化集约建设。","坚持“以人民之心为心”，一步一个脚印坚定朝前走，海可填、山可移，中国亿万人民同心同行、势不可挡。"]},{"id":91,"w":"一日千里","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"形容发展迅速","type":"four","expl":"一天跑一千里。也比喻进步、发展很快。","core":"也比喻进步、发展很快","exs":["从时代的大趋势看，无论世界还是中国的发展都好像有一种加速度，真是日新月异、一日千里，新情况新问题格外多。","昌都交通事业发展综述：人背畜驮到“一日千里”。","连日来，前来参观的香港市民络绎不绝，纷纷感叹国家建设成就一日千里，对香港背靠祖国发展更有信心。"]},{"id":92,"w":"日新月异","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"形容发展迅速","type":"four","expl":"形容发展变化很快，新事物、新气象不断出现。","core":"形容发展变化很快，新事物、新气象不断出现","exs":["我工作的地方，如今建起了高楼大厦，马路变宽了，环境变美了，城市面貌日新月异的变化令人振奋。","跟随“大地飞歌·山水人文秀”之“幸福歌”，感受邕城日新月异。","初春时节，在5270平方公里的瓷都大地上，到处都是活跃的创造，到处都是日新月异的进步。"]},{"id":93,"w":"与日俱增","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"形容发展迅速","type":"four","expl":"指随着时间的推移不断增长。","core":"指随着时间的推移不断增长","exs":["全球文旅价值链、供应链与服务链重构带来新机遇，中华文化影响力与日俱增，“文化出海”与国际传播打开新局面。","领导干部怀揣真情主动沉下身去，走到群众中间听民声、察民情、解民忧，感情就会与日俱增，群众也自然愿意敞开心扉、接纳干部、信任干部。","“中文热”是贴近中国、读懂中国的必然产物，更是中国国际影响力与日俱增的生动注脚。"]},{"id":94,"w":"愈演愈烈","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"形容发展迅速","type":"four","expl":"形容某种事件、矛盾或情况随着时间发展而越加严重或恶化，通常用于负面情境，表达一种不良或不可控的发展趋势。","core":"形容某种事件、矛盾或情况随着时间发展而越加严重或恶化，通常用于负面情境，表达一种不良或不…","exs":["在经济全球化遭遇逆流，单边主义、保护主义愈演愈烈的背景下，中国进一步主动向非洲国家敞开超大规模市场大门，是“减法”更是“加法”，以关税之“减”，撬动发展之“增”，串联市场之“通”，实现价值之“融”，充分彰显中国“计利当计天下利”的大国胸襟与责任担当。","面对霸权霸道霸凌愈演愈烈、联合国权威一再遭受侵蚀，国际社会特别是全球南方国家更加期盼改革国际治理架构，维护国际公平正义。","当前，围绕以生成式AI为主的军事智能化全球竞赛愈演愈烈，世界各国纷纷加大投入，推进生成式AI在军事领域的应用。"]},{"id":95,"w":"日渐式微","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"逐渐衰落","type":"four","expl":"事物逐渐地由兴盛而衰落。","core":"事物逐渐地由兴盛而衰落","exs":["牛墟鼎盛时日交易量上千头，牛客来自全国各地，如今随着时代变迁，日渐式微。","整体实力相对衰落、内部矛盾不断，G7在全球的影响力日渐式微。","越来越多的拉美国家对美国大声说“不”，凸显出在拉美乃至全球范围内，美国的影响力日渐式微，霸权主义不得人心。"]},{"id":96,"w":"每况愈下","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"逐渐衰落","type":"four","expl":"指情况越来越坏，越来越糟糕。（也可形容身体或精神越来越糟糕）","core":"指情况越来越坏，越来越糟糕","exs":["7年多来，饱受动荡之苦的突尼斯人民生活水平每况愈下。","在这个时代里，人人都讲究社交，白天要勤奋工作，晚上还得与同事应酬、放松，殊不知，彻夜的狂欢非但不能把压力排遣出去，反而会令身体每况愈下。","美国一边为本国每况愈下的人权状况寻找借口，一边傲慢地以“人权教师爷”的姿态对别国指手画脚，四处挥舞人权大棒。"]},{"id":97,"w":"江河日下","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"逐渐衰落","type":"four","expl":"长江大河的水，日夜流向下游而不止。比喻事物日趋衰落，情况一天不如一天。（多指国势等事物发展趋势）","core":"比喻事物日趋衰落，情况一天不如一天","exs":["历史上，诸葛亮长于谋事短于谋人，最后造成蜀国江河日下，走向衰落。","自从那笔生意亏了本后，他的事业便江河日下了。","随着互联网的发展，传统出版社已经处于江河日下的境地。"]},{"id":98,"w":"水涨船高","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"水位上涨，船体也随着上升。比喻事物随着它所凭借的基础而增长。","core":"比喻事物随着它所凭借的基础而增长","exs":["人民网发表评论文章《明星片酬为啥屡“限”屡高？》，文章指出，市场认明星，有人认有人买单，明星片酬自然就水涨船高。","在浙江宁波，不少市民表示“五一”假期的出行意愿较高，从宁波出发的国内机票价格也“水涨船高”。","新的组训模式推行后，不仅本场训练时间不足的问题得到有效解决，还倒逼任务飞行员更加注重理论学习和模拟训练，任务完成质量水涨船高。"]},{"id":99,"w":"此消彼长","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"指这个下降，那个上升。","core":"指这个下降，那个上升","exs":["传统媒体和新兴媒体融合发展，不是一个此消彼长的概念，而是此长彼长的过程。","改革开放以来，随着社会的巨变，各种各样的思潮也此消彼长。","传统产业和现代化产业不是此消彼长，而是相辅相成。"]},{"id":100,"w":"波澜壮阔","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"原形容水面辽阔，现比喻声势雄壮或规模宏大。","core":"原形容水面辽阔，现比喻声势雄壮或规模宏大","exs":["此次演出不仅为观众带来一幅波澜壮阔的运河音画，也通过“民乐联合”的形式彰显出大运河的文化活力。","百年征程波澜壮阔，百年初心历久弥坚。","庆祝中国共产党成立100周年文艺演出《伟大征程》，以大型情景史诗形式呈现，分为“浴火前行”“风雨无阻”“激流勇进”“锦绣前程”4个篇章，综合运用多种艺术手段，生动展现中国共产党波澜壮阔的百年历史。"]},{"id":101,"w":"柳暗花明","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"垂柳浓密，鲜花夺目。形容柳树成荫，繁花似锦的春天景象。也比喻在困难中遇到转机。","core":"形容柳树成荫，繁花似锦的春天景象","exs":["成绩虽然不尽如人意，但辽篮如果调整得当，第三阶段和季后赛有望迎来柳暗花明的新局面。","海峡论坛的召开，无论是伴着热情红火的夏季凤凰花，还是明媚动人的冬季异木棉，都看得到“柳暗花明”的光明美景，都绽放着万树繁花。","从山重水复到柳暗花明，路是从荆棘丛生处开辟出来的。只要方向对了，就不怕山高路远。"]},{"id":102,"w":"拨云见日","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"拨开乌云见到太阳。比喻冲破黑暗见到光明。也比喻疑团消除，心里顿时明白。","core":"比喻冲破黑暗见到光明","exs":["“拨云见日终有时，一碧万顷醉晴空。”不容辩驳的数据事实击碎造谣与谎言编织的黑幕，东方明珠光芒更加耀眼夺目。心中有“数”，脚下有路。","17年的风风雨雨一路走来，赵昭有过白手起家的迷茫困惑，也有过小有成就的激动喜悦，遭受过突遇险阻的步履维艰，也感受过拨云见日的豁然开朗。","全国各大美院的资深教授亲临现场，以权威之姿进行深度分享，精准剖析新时代美术教育的发展趋势，为行业发展拨云见日、指明方向。"]},{"id":103,"w":"浩浩荡荡","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"原意指水势汹涌广阔，后引申为事物规模宏大、气势磅礴，也可形容人流或群体活动声势浩大。","core":"原意指水势汹涌广阔，后引申为事物规模宏大、气势磅礴，也可形容人流或群体活动声势浩大","exs":["大变局中的世界，见证着日益凸显的中国作用，“向东看”成为浩浩荡荡的时代潮流。","经济全球化历史潮流浩浩荡荡、不可阻挡，开放合作的国际环境是各国发展所需。","历史大势浩浩荡荡，强国强军进程不可阻挡。任何风浪考验都撼动不了人民军队铁心向党的如磐信念，任何艰难险阻都阻挡不了人民军队向强图强的坚定步伐。"]},{"id":104,"w":"汹涌澎湃","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"“汹涌”表示水流奔腾、波涛翻滚的样子；“澎湃”表示水声或声势浩大。形容水势或声势非常猛烈、浩大，也比喻感情、力量或气势强烈、不可阻挡。","core":"“汹涌”表示水流奔腾、波涛翻滚的样子","exs":["各级工会紧紧围绕党的中心任务，搭舞台、建机制、畅通道，将产业工人的积极性、主动性、创造性更加充分地调动起来，智慧火花竞相迸发，创新创造活力汹涌澎湃。","放眼神州大地，创新浪潮汹涌澎湃。","放眼全球，AI与教育深度融合已不是“未来时”，而是汹涌澎湃的“现在进行时”。"]},{"id":105,"w":"大气磅礴","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"“大气”指盛大宏伟的气势，“磅礴”意为广大无边的样子。形容气势浩大、雄伟壮观，常用于描写景象、场面或文艺作品的宏大气势。","core":"“大气”指盛大宏伟的气势，“磅礴”意为广大无边的样子","exs":["器乐合奏《东方》音律恢宏、大气磅礴，尽显山河壮阔、奋进向上的时代风貌。","纪念中国人民抗日战争暨世界反法西斯战争胜利80周年活动，是一次庄严隆重、大气磅礴、震撼人心、激励奋进的抗战纪念盛典。","整首词不仅用大气磅礴的笔触勾勒场景、以诗情画意的意境打动人心，更描绘出一往直前的光明远景，读起来总能强烈震撼心灵。"]},{"id":106,"w":"气壮山河","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"形容气势如高山大河般雄壮豪迈，使祖国山河因而更加壮丽。","core":"形容气势如高山大河般雄壮豪迈，使祖国山河因而更加壮丽","exs":["为了保家卫国、维护和平，中国人民志愿军奔赴朝鲜战场，谱写了气壮山河的英雄赞歌，锻造了伟大抗美援朝精神。","一代代中国共产党人舍生忘死、百折不回，以坚不可摧的强大精神力量，带领人民救国、兴国、强国，缔造了彪炳史册的伟大胜利，谱写了气壮山河的英雄史诗，将千秋功勋镌刻在民族丰碑上。","新装备、新体系、新战法，一幅气壮山河的强军画卷，生动展示了新时代人民军队现代化建设新进展。"]},{"id":107,"w":"峰回路转","part":"c","gn":"九","gt":"事物出现、发展、衰落","sub":"其他","type":"four","expl":"原指山势曲折致道路迂回，后多比喻事情经历挫折或低谷后出现转机或变化。","core":"原指山势曲折致道路迂回，后多比喻事情经历挫折或低谷后出现转机或变化","exs":["如若突破久久难逢，那就心怀期待、一往无前，“峰回路转”终会到来。","跋山涉涧，荆棘塞途，不一样的风景常在坚持到最后的峰回路转。","观众在语言密集轰炸中，感受人物不同职业、个性和内心的复杂变化，感受逻辑的严整、情节峰回路转的推进。"]},{"id":108,"w":"相形见绌","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"形：对照，比较。绌：不够，不足。跟同类的人或同类事物相比较，显出很不足。","core":"对照，比较","exs":["与中国的西进战略比起来，西澳大利亚州吸引东部诸州人口的努力相形见绌。","此外，最新量子计算机用激光束制成的“光镊”使量子比特相互靠近，从而相互作用并交换信息，而IBM和谷歌制造的基于芯片的量子计算机，必须使用多条导线来控制每个量子比特，控制能力相形见绌。","建好建强领导干部队伍，至关重要的是要发扬彻底的自我革命精神，既要持之以恒正风肃纪反腐，坚决清除各种腐败变质分子，又要持续推进能上能下、能进能出，把忠诚干净担当的干部选拔出来，把相形见绌的干部调整下去，实现干部队伍新陈代谢。"]},{"id":109,"w":"出类拔萃","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"出：超出。类：同类。拔：高出。萃：指聚在一起的人或物。指人的品德才能出众，高出同类之上。（侧重能力或品德）（高于同类）","core":"指聚在一起的人或物","exs":["这感人的姿态，正是出类拔萃的外交家周恩来的特色。","这些创新工作室由“点”成“面”、聚“线”成“网”，实现信息共享、资源共享、项目共享、人才共享，在“链”上汇聚产业发展动能，深入挖掘改进产业链技能人才协同创新机制的办法，让出类拔萃的创新团队、创新人才成为培育发展新质生产力的新动能。","正如中国近代教育家、早期话剧活动家张彭春在为梅兰芳访苏撰写的《中国舞台艺术纵横谈》中谈到的，一个卓越的演员只有在对一般剧目做出了出类拔萃的成绩以后，才能创造新格局。"]},{"id":110,"w":"无与伦比","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"意思是指事物非常完美，没有能够与它相比的同类的东西。","core":"意思是指事物非常完美，没有能够与它相比的同类的东西","exs":["弋江区既是高新技术产业集聚区，也是高科技人才汇集地，境内有安徽师范大学等七所高等院校，在校学生10万多人，这是弋江区无与伦比的独特优势和宝贵财富。","中华文明具有无与伦比的包容性。","要全面贯彻落实党的二十大精神和习近平总书记视察江西重要讲话精神，认真落实李书磊同志有关工作要求，按照省委和省政府部署安排，积极探索实践，合力攻坚克难，提升建设质效，让千年瓷都重振辉煌，让无与伦比的景德镇陶瓷文化永远享誉世界。"]},{"id":111,"w":"先发制人","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"发：发动；制：控制。原指在战争中的双方，先采取行动的往往处于主动地位，可以制伏对方。后来泛指先下手采取行动。","core":"原指在战争中的双方，先采取行动的往往处于主动地位，可以制伏对方","exs":["把科技创新作为发展新质生产力的核心要素，就是要勇于打破守旧观念，摆脱固化的思维模式，进行超前谋划，甚至是颠覆性的创新设计，可以“无中生有”，能够先发制人，创造出新的“生态位”，从而在激烈的竞争中拥有绝对优势。","沙场上硝烟弥漫，红蓝双方“险招”“奇招”频出：要点夺控战中，扮演“蓝军”的陆军第81集团军某旅连长于江涛先发制人，运用无人机确定“红军”方位，引导直升机实施火力突袭，打出凌厉的立体攻势。","共同社报道称，所谓“对敌基地攻击能力”，是指如果认定敌方已着手发动攻击，那日本可以在实际损失发生前使用这些武器予以“反击”，而一旦误判，则有可能成为国际法所禁止的先发制人的“攻击”行为。"]},{"id":112,"w":"百舸争流","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"舸：大船。上百条大船争着向前行驶。形容竞争激烈，人人都奋勇争先。","core":"形容竞争激烈，人人都奋勇争先","exs":["当前，树立和践行正确政绩观学习教育正在全党深入开展，以此为契机，坚持改革创新、真抓实干、久久为功，我们定能不断开创千帆竞发、百舸争流的发展新局面。","因地制宜，是习近平总书记反复强调的工作方法。从实际出发，各展所长，才能成百舸争流之势。","毛泽东同志以革命英雄主义的豪迈、革命理想主义的乐观，抒发着革命现实主义的深刻思考，江面上万千船只劈波斩浪的壮阔图景，便在笔端凝成“百舸争流”的千古佳句。"]},{"id":113,"w":"千帆竞发","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"竞：竞赛。数不清的船只争相出发。形容竞争激烈，也形容事物蓬勃发展、气势磅礴。","core":"形容竞争激烈，也形容事物蓬勃发展、气势磅礴","exs":["融合两岸，千帆竞发。河套深港科技创新合作区不仅是地理交汇点，更是丰富“一国两制”实践内涵、支持香港更好融入和服务国家发展大局的重要平台，将推动粤港澳大湾区高质量发展、打造世界级创新平台和增长极。","战略科学家引领前沿突破，大国工匠创造工程奇迹，“土专家”“田秀才”扎根田间地头，形成千帆竞发、万马奔腾的图景。","从载人航天事业捷报频传，到量子科技、人工智能等科技成果竞相涌现……我国工人阶级和广大劳动群众在党的领导下集中精力办好自己的事，在千帆竞发的经济建设大潮中干事创业、奋楫争先。"]},{"id":114,"w":"争先恐后","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"争着向前，唯恐落后。形容竞争激烈，人人都不甘落后。","core":"形容竞争激烈，人人都不甘落后","exs":["同学们争先恐后体验装甲模拟射击、自救互救、战场防护、战术基础动作等内容，过足了一把“军事瘾”。","渐渐地，春的姿容就失去了秩序，争先恐后、扑面而来。","长条桌案前，书法爱好者们挥毫泼墨，一副副饱含新春祝愿的春联和“福”字墨迹未干，便被争先恐后地领走，火红的纸页映照着旅客的笑脸，年意盎然。"]},{"id":115,"w":"大浪淘沙","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"淘：用水冲洗，去掉杂质。在大浪中洗净沙石。比喻经过激烈的竞争或时代变迁的筛选，淘汰不好的，留下好的。侧重在“经历改变而完成筛选”。","core":"比喻经过激烈的竞争或时代变迁的筛选，淘汰不好的，留下好的","exs":["技术的跨越式发展，让赛场呈现出大浪淘沙之势。","经典并非由出版社或某个人随意命名，而是经由千百年来一代代读者大浪淘沙、反复检验，由时间最终确立的。","坚定理想信念不是一阵子而是一辈子的事，要常修常炼、常悟常进，无论顺境逆境都坚贞不渝，经得起大浪淘沙的考验。"]},{"id":116,"w":"无出其右","part":"c","gn":"十","gt":"竞争比较","sub":"和别人相比较","type":"four","expl":"右：古时以右边为上位，古人写字从右往左竖写，右则在前。指无人能战胜或超过。","core":"指无人能战胜或超过","exs":["NHK以纪录片形式对中国持久而强烈的关注在世界电视机构中无出其右。","清代张鹏翮，康熙看重他的廉洁品质，任命他为河道总督，朝廷称他“天下廉吏无出其右”。","尽管汽车产业抓住电动化、智能化转型机遇，在过去10年间催生出了智能网联新能源汽车这一战略性新兴产业，并且在市场增速、产业链延展性、资本市场热度等方面一度无出其右，但是，“内卷式”竞争导致的“增量增收不增利”困境，逼迫越来越多的车企探寻第二增长曲线。"]},{"id":117,"w":"脱颖而出","part":"c","gn":"十","gt":"竞争比较","sub":"表现突出","type":"four","expl":"颖：细长物体的尖端。比喻才能完全显露出来。（侧重能力）（明显地）","core":"比喻才能完全显露出来","exs":["近来，张杨执导的《冈仁波齐》脱颖而出，创造了近期国产文艺片的票房新纪录。","但仇安和车组成员包扎伤口后又咬牙坚持训练，最终凭借顽强战斗精神在比赛中脱颖而出，荣获陆军“优胜战斗车组”。“‘杨根思连’的荣光是打出来的，荣誉是拼出来的！”","经过层层筛选，来自成都新都公安各科所队的20余名民警脱颖而出，在射击场上尽锐出战，在真枪实弹中展开巅峰对决。裁判员下达比赛口令后，比武正式拉开帷幕。"]},{"id":118,"w":"崭露头角","part":"c","gn":"十","gt":"竞争比较","sub":"表现突出","type":"four","expl":"崭：高出。比喻突出地显露出才能。（侧重能力）","core":"比喻突出地显露出才能","exs":["近日，记者发现上海一批高学历、广视野、敢创新，且经过多年基层磨炼的年轻干部，正在崭露头角。","上等兵胡海鹏大学期间学的是光电技术应用专业，入伍后凭借专业优势很快崭露头角。前段时间，他参加上级组织的专业考核表现出色，被旅队遴选担任专业教练员。","第一打击中心共有民警11人，他们都是在港区基层派出所摸爬滚打后“穗选”而出的热血民警，他们怀着对群众的深厚情感，敢拼善学、精益求精，在各起案件中崭露头角，他们是具有巨大潜能的后浪。"]},{"id":119,"w":"鹤立鸡群","part":"c","gn":"十","gt":"竞争比较","sub":"表现突出","type":"four","expl":"鹤站在鸡群中间。比喻仪表或才能在人群中显得很突出。","core":"比喻仪表或才能在人群中显得很突出","exs":["高擎蓝天的鱼尾葵鹤立鸡群，酷似热带鱼尾巴的叶子在空中摇曳。","31岁的李发彬从东京奥运会“金鸡独立”惊艳世界，到巴黎奥运会以绝对实力“鹤立鸡群”，毫无悬念夺冠。看似轻描淡写的成功，背后也是一路艰辛。","1960年，一个寻常的课后，他在校外的早稻试验田里发现一棵“鹤立鸡群”的稻禾：一株足有10余穗，挑一穗数有籽粒200多粒，他如获至宝，收获时把这一株的籽粒全收了。"]},{"id":120,"w":"独占鳌头","part":"c","gn":"十","gt":"竞争比较","sub":"表现突出","type":"four","expl":"鳌头：古代宫殿门前台阶上的鳌鱼浮雕，科举进士发榜时状元站在鳌头之上迎榜。原指科举考试中了状元，后比喻在某个领域或竞争中位列首位或第一名。","core":"原指科举考试中了状元，后比喻在某个领域或竞争中位列首位或第一名","exs":["油脂借着生物燃料政策东风独占鳌头，粮食谷物等则因供应充足表现平淡。展望2026年，大宗商品市场或将延续走势分化特点，这与“弱复苏+宽货币”的宏观经济政策背景分不开。","新疆林果产业在多个领域表现突出：红枣产量排名全国第一、葡萄产量稳居榜首、杏产量全国夺冠、巴旦木产量独占鳌头……新疆向全国人民捧出的特色“大果盘”深受广大消费者喜爱。","市场竞争态势本来就是动态变化的，没有谁可以一劳永逸地独占鳌头。谁尊重市场规律，及时抓住科技革命和产业变革的历史机遇，谁就能勇立潮头、快速发展。"]},{"id":121,"w":"一枝独秀","part":"c","gn":"十","gt":"竞争比较","sub":"表现突出","type":"four","expl":"指一枝花独自开放，比喻在同类人或同类事物中出类拔萃。","core":"指一枝花独自开放，比喻在同类人或同类事物中出类拔萃","exs":["中国机器人的崛起，可不是某个行业的“一枝独秀”，而是整体工业实力托举下的水到渠成。汉诺威工博会上的火爆场景，正是中国机器人海外走红的生动缩影。","博物馆经济的未来，不在一枝独秀，而在全域开花。","激活改革主动性，树立重思路、重口碑的鲜明导向，谁的思路好就总结谁，谁的群众口碑好就推广谁，优质案例迅速从“一枝独秀”走向“百花齐放”。赶得上/赶不上"]},{"id":122,"w":"望其项背","part":"c","gn":"十","gt":"竞争比较","sub":"近义辨析","type":"four","expl":"项：脖子的后部。能够看到别人的颈项和脊背。比喻有能力赶得上。（常用于否定句：难以～、无法～、不能～）","core":"比喻有能力赶得上","exs":["AI音乐的创作效率，让传统音乐制作难以望其项背。","此后，两国间经济差距逐渐扩大，到2000年，日本的经济规模已跃升为德国的2.5倍，使得德国难以望其项背。时过境迁，到了2024年，日本的“神话”终于被德国赶超。"]},{"id":123,"w":"望尘莫及","part":"c","gn":"十","gt":"竞争比较","sub":"近义辨析","type":"four","expl":"莫：不能。及：到，赶上。指望见前面人马扬起的尘土而追赶不上。比喻远远落在后面，相差甚远。也用以表示自谦。","core":"指望见前面人马扬起的尘土而追赶不上","exs":["中国移动一骑绝尘，联通和电信望尘莫及，这或许是对三家运营商4G用户发展最形象的描述。","最终，这两次半决赛的结果都是辽宁队翻盘成功，他们在绝境中所展现出的比赛韧性和反弹力，以及关键时刻把握机会的能力，都令对手望尘莫及。这是久经历练后的队伍才会呈现出的状态，也是辽宁队此前多年积淀的结果。","一部300多万字的《资治通鉴》，毛主席竟看了17遍之多，令人望尘莫及。毛泽东诗词植根于中华优秀文化的深厚土壤，蕴涵着丰富多彩的中国文化元素。"]},{"id":124,"w":"相提并论","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"把不同的人或不同的事情放在一起谈论或看待。（侧重于评价几个人或事物之间有没有差距/能否比得上。多用于否定句中）","core":"（侧重于评价几个人或事物之间有没有差距/能否比得上","exs":["他们两人差别太大，怎么可以相提并论。","“无论逮捕令可能意味着什么，绝不能把以色列与哈马斯相提并论。”","幸运的是，目前在各行各业中AI替代的大多是重复性、程序性的工作，在创造性和情感的表达上，AI制造暂时还无法与人类相提并论。但是，未来呢？"]},{"id":125,"w":"同日而语","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"指相提并论。（侧重于强调时间上的对比，多形容与自身的比较。现有时也有例外）（多用于否定句中）","core":"指相提并论","exs":["俄罗斯目前的经济状况同2008年的危机不能同日而语。","相比之下，缺少了亲情为纽带的智能家居，单纯依靠智能化控制电器的行业局限，早已在行业升级的梯度上落下了明显差距，远不能与智慧家庭同日而语。"]},{"id":126,"w":"等量齐观","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"等：同等。齐：一样。把不同的事物一律同等看待。","core":"同等","exs":["他们二人的工作成绩不可等量齐观。","在传统文明中，确实存在着许多与现代文明相近的话语、箴言、观念等，但在其具体内容和精神实质上又不能等量齐观。","书籍固然数量浩如烟海，但其轻重分量不同，不可等量齐观。大量的书实际上可有可无，不读也没有明显的损失。只有极少数才真正具有原创意义，是那种被称为经典的书籍，是书中之书。"]},{"id":127,"w":"一概而论","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"用同一标准来对待或处理（多用于否定）：不能～。","core":"用同一标准来对待或处理（多用于否定）：不能～","exs":["其实，服中药时能否喝绿豆汤，不可一概而论，应根据病情的寒热虚实以及所服中药的性味而定。","用工自主权与平等就业权的边界应当结合具体岗位的内在要求具体分析，不能一概而论，但应该明确的是，用人单位不得以与工作岗位内在要求无关的身体条件而对劳动者予以差别对待，限制劳动者平等就业和自主择业的权利。","褒扬西安交大等高校院士给本科生上课的传统，并不是苛求所有院士都去给本科生上课，毕竟每个院士研究的领域不同、擅长的工作不同、承担的任务也不同，不能一概而论。"]},{"id":128,"w":"一视同仁","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"原指圣人对百姓一样看待，同施仁爱。后多表示对人同样看待，不分厚薄。","core":"原指圣人对百姓一样看待，同施仁爱","exs":["全球治理基本原则包括：主权平等原则，主权平等的关键在于国家不分大小、强弱、贫富，治理规则一视同仁，约束别国的规则必须同时约束自己。","落实好境外投资者以在华取得的利润直接投资税收抵免、鼓励外商投资产业目录等政策措施，一视同仁支持外资企业参与提振消费、政府采购、招投标等活动，助力外资企业在华长期深耕发展。","“主动破除地方保护、市场分割和‘内卷式’竞争”“一视同仁对待各种所有制企业”“稳步扩大制度型开放”，总书记在讲话中深刻阐释了通过深化改革开放不断除障碍、增动能的发展路径，为各地提供根本遵循。"]},{"id":129,"w":"不偏不倚","part":"c","gn":"十","gt":"竞争比较","sub":"同等地位","type":"four","expl":"偏：偏向；倚：歪斜。不偏向任何一方，保持中立、公正。形容态度或立场公正，没有偏向。","core":"形容态度或立场公正，没有偏向","exs":["对“国之大者”心中有数，坚决落实党中央决策部署，才能不偏不倚走对路。","读书，是为了明理；明理，是为了正行；正行，才有可能不偏不倚地走好“脚下的路”。","染三色、现五色，既需精准把控染色位置，不偏不倚，又要掌握好停留时间，使其自然晕染、柔和过渡。独特技艺若是无人继承实在可惜。"]},{"id":130,"w":"力有未逮","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"指有意愿却做不到。","core":"指有意愿却做不到","exs":["虽然我们强调政府应尽可能为民服务，但单纯靠政府来解决民生问题力有未逮。","关口辖区面积这么大，要向道路扬尘和垃圾“宣战”，仅靠环卫工人清扫，显然力有未逮。近日来，在关口辖区各村主干道和浏东公路沿线，时刻可见党员、志愿者和学生清扫道路，清洗指示牌和护栏。","部分路段逢雨“看海”，排水管网力有未逮，我市城市路面防涝又临“大考”。"]},{"id":131,"w":"爱莫能助","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"爱：爱惜；莫：不。虽然心中关切同情，却没有力量帮助。","core":"爱惜","exs":["家里经济条件有限，这也并不是危及到生命的残疾，父母也爱莫能助。","“虽然事不大，但双方的矛盾却很尖锐，几十户业主围满了物业公司办公室，物业公司表示爱莫能助，武某当场拍着桌子说，就算法院判了，他也不交！”回想起当时的调解场景，李青仍心有余悸。","但他们一个是肢体二级残疾、卧床不起，另一个患严重心脏病，再加上同样患有心脏病、无法工作的儿子，每个月的医药费开销很大，按照现行政策，他们家有机动车无法申请低保边缘家庭，我们想“雪中送炭”，却又受政策限制爱莫能助。"]},{"id":132,"w":"鞭长莫及","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"及：到。原意是鞭子虽长，也不能打马肚子。比喻相隔太远，力量达不到。（有时会用于形容“虽有能力，但能力有限”）","core":"比喻相隔太远，力量达不到","exs":["为有效缓解火灾扑救鞭长莫及的不足，提高抗御火灾和抢险救援能力，遏制农村重特大火灾事故的发生，芜湖市繁昌区平铺镇将消防站建设纳入重要议事日程，在上级主管部门支持下，不断加强消防站建设力度。","该部领导看在眼里、急在心上，“其实，我们也想了不少办法……无奈两地相隔太远，鞭长莫及”。杨斌的困境，并非个例。在前期调研中，空军领导发现，像杨斌这样需要异地解难的诉求不在少数。","在强烈的不稳定大风作用下，沙土被卷入空中，并伴随蒙古气旋和冷锋，通过平流过程输送南下，其输送高度可达4000米以上，在这样的高度下，防护林也鞭长莫及了。"]},{"id":133,"w":"望洋兴叹","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"望洋：仰视的样子。仰望海神而兴叹。原指在伟大事物面前感叹自己的渺小。现多比喻做事时因力不胜任或没有条件而感到无可奈何。","core":"原指在伟大事物面前感叹自己的渺小","exs":["面对如此浩瀚的古籍，即便是焚膏继晷、皓首博览的文人学士，也只能侧重于某些具体范围和方面，而对于普通读者来说，更难免望洋兴叹之感。","10年前，作为“三不沿”的内陆城市，遵义要“绕一大圈”才能走出国门、联通世界。遵义的产品囿于交通的不顺畅，“豆腐运出了肉价钱。”令不少投资者望洋兴叹。","数字变革正在深刻地改变人们的生活习惯，但对大多数老年人来说，信息化服务的操作门槛让一些老年人望洋兴叹，不少老年人不会上网、不会使用智能手机，在出行、就医、消费等日常生活中遇到不便，无法充分享受智能化服务带来的便利。"]},{"id":134,"w":"回天乏术","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"回天：比喻力量大，能移转极难挽回的时势；乏术：缺少方法。比喻局势或病情严重，已无法挽救。","core":"比喻力量大，能移转极难挽回的时势","exs":["对于一些晚期肿瘤和罕见病，再高明的医生也回天乏术，再先进的医学也无能为力。但是，如果人们具有一定的医学常识，在疾病初期就发现苗头，尽早诊治，结果就可能大不一样。","由于蜀汉政权诸多先天不足，到蒋琬执政时北伐已显乏力，“光复汉室”的愿望在现实面前日渐渺茫，因而蒋琬的经历中也多少透着回天乏术的无奈。","落后的情况下奋力追赶比分，将对手拖入抢七局，在6∶3领先的情况下未能抓住3个盘点，好在最终仍拿下抢七局，以7∶6险胜；第三盘王欣瑜率先破发，一度3∶1领先，然而又被对手反超，虽然在盘末挽救4个赛点仍回天乏术。"]},{"id":135,"w":"力不从心","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"心里很想做某事，但能力、体力或条件达不到，做不到。","core":"心里很想做某事，但能力、体力或条件达不到，做不到","exs":["这一机制打破了条块分割的阻碍，原本需要反复协调、层层审批的复杂问题，得以在协同联动中高效解决，推动基层干部从解难题力不从心向办难事有心有力、用情用力转变。","过去，一名网格员要服务四五百户居民，难免力不从心，现在有热心力量加入，我们可以腾出更多精力做好精细化服务了。","过去引进技术型人才力不从心，如今有了市里的支持，企业在人才市场的竞争力明显增强了。"]},{"id":136,"w":"杯水车薪","part":"c","gn":"十一","gt":"能力不足","sub":"能力有限","type":"four","expl":"原义是用一杯水去扑灭一车燃烧的柴草；比喻力量太小，无法解决问题。","core":"比喻力量太小，无法解决问题","exs":["自掏腰包帮助贫困学子的事，支部党员们过去做了不少，但仅靠个人力量是杯水车薪，还得依靠党组织，撬动社会力量。","农村不像城里的社区，有物业公司管护，村里清运垃圾，每家每户确实也出了点钱，如果投入人力物力管护农村人居环境，只能说是杯水车薪。","通过设置停车泊位，科学选址筹建停车场，智慧停车“平顶山模式”引导停车等方式治理乱停乱放，虽然有效缓解了交通拥堵，但对于全市尤其是中心城区的停车问题仍然是杯水车薪，停车问题依然严峻。"]},{"id":137,"w":"捉襟见肘","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"捉襟：整理衣襟。肘：胳膊肘儿。形容衣裳破旧。也比喻困难很多，应付不过来。（侧重人力、物力等资源有限）","core":"形容衣裳破旧","exs":["然而作为新旅游区，这里在配套设施方面一时有些捉襟见肘。特别是到了凤凰花开时节或者节假日，游客大量涌入，停车成了难题。","梅花只会务农，一双儿女都在上学，家庭支出大，仅靠低保和务农，捉襟见肘。以往，监测户认定主要以家庭收入为依据，梅花虽享受低保补贴，可面对巨大生活压力，没有政策引导寻求致富门路，实在难以为继。","曾几何时，提起思想政治教育，官兵有不少“槽点”——“出差、休假回来就有一堆笔记要补”“笔记记了好几本，真正记得住的课却没几堂”……以往上级“刚性”教育内容多，时间和精力上捉襟见肘。"]},{"id":138,"w":"顾此失彼","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"顾了这个，丢了那个。形容忙乱或慌张的情景。（侧重考虑不周全）","core":"形容忙乱或慌张的情景","exs":["保障粮食安全、促进农民增收、推进农业可持续发展等，都是我国农业支持政策要实现的重要目标，不能顾此失彼甚至对立起来。","头痛医头、脚痛医脚，“九龙治水”、各吹各调，很容易顾此失彼、事倍功半，甚至造成生态破坏。","“与普通高校相比，职业院校教师教学工作量较为繁重，教学和科研往往顾此失彼，学校采取的这种转化方式解决了老师们开展科研的后顾之忧。”扬州市职业大学生物与化工工程学院孙长花老师激动地说。"]},{"id":139,"w":"左支右绌","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"支：支持；绌：屈曲，引申为不足。原指弯弓射箭的姿势，左手支持，右手屈曲。指力量不足，应付了这方面，那方面又出了问题。（侧重能力有限，应付不过来）","core":"原指弯弓射箭的姿势，左手支持，右手屈曲","exs":["有一名美国国务院官员因不满美国在巴以冲突中持续向以色列供应武器愤然辞职。外有以色列“不听劝”，内有自家人“唱反调”，巴以冲突爆发迄今，拜登政府左支右绌，大选年里“很犯愁”。","美国想同时压垮中俄两个大国，只能是左支右绌，反而让中俄背靠背协作关系越来越紧密。而中俄越是走得近、站得稳、发展得好，美国就越担心害怕。","近年来，英国“脱欧”，美国撕裂，西方民粹主义蔓延，种族矛盾、仇恨犯罪愈演愈烈，很多西方国家社会思潮紊乱失序，“后真相”“后秩序”等成为西方自我反思的高频词，一连串国际地缘政治冲击令西方左支右绌，力不从心。"]},{"id":140,"w":"独木难支","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"一根木头支不住高大的房子。比喻一个人的力量单薄，维持不住全局。","core":"比喻一个人的力量单薄，维持不住全局","exs":["祛除未成年人的网瘾光靠王波一人独木难支，近期三建乡将组织文服中心、司法所、平安办、派出所共同开展网络宣传相关活动，一方面走进校园开展防沉溺网络专题活动，另一方面再组织专业老师上门家访。","末节决战，尽管眼看分差只有个位数，但浙江东阳光队始终差了一口气，孙铭徽独木难支，最终球队没能实现逆转。","钢价未出现明显下跌，可能仅仅是原料矿石价格坚挺支撑所致，但独木难支，下游需求不济终将让钢材价格支撑不住。"]},{"id":141,"w":"应接不暇","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"暇：空闲。原指景物很多，顾不上观赏。后形容太繁忙，应付不过来。（主语是人）（侧重人或事物太多忙不过来）","core":"原指景物很多，顾不上观赏","exs":["火车站的问事处挤满了人，工作人员应接不暇。","上下左右键控制出脚，层出不穷的指令，让你应接不暇。","火车外的风景让人应接不暇。"]},{"id":142,"w":"自顾不暇","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"自顾：顾及自己；不暇：没有空闲、来不及。连自己都照顾、应付不过来，没有多余精力去管别人的事。","core":"顾及自己","exs":["第一天她就被分到记录道岔数据的任务，此时对道岔部位不熟的她想请教师兄师姐，却发现他们检查道岔自顾不暇。","“以前我们村里上了年纪的老人，因为年纪大了都自顾不暇，照顾起自己的孙孙来，总感觉力不从心。现在好了，有了工作室和志愿者的上门服务，我们省心省力也省事很多。”提及乡里的周末关爱新模式，茶寨村62岁的老人朱成文赞不绝口。","杨火苟向妻子讲述回村的缘由，“姐弟俩的舅舅和奶奶，不是家庭困难自顾不暇，就是身体不好力不从心，实在无力照看他们。”"]},{"id":143,"w":"分身乏术","part":"c","gn":"十一","gt":"能力不足","sub":"应付不了","type":"four","expl":"没法分出精力同时做几件事，忙不过来、顾此失彼、没有多余精力。","core":"没法分出精力同时做几件事，忙不过来、顾此失彼、没有多余精力","exs":["一边是病重的妻子亟待照料，一边是大棚里7.5亩成熟待售的大葱，这可是一家人的救命钱，分身乏术的他急得寝食难安。","一名机关科长坦言，机关向基层下发通知时，有时未充分考虑基层工作实际和官兵承受能力，导致官兵分身乏术、疲于应付。","连队近期一直忙于专项任务，干部骨干实在分身乏术。"]},{"id":144,"w":"浮光掠影","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"浮光：水面上的反光。掠影：一闪而过的影子。比喻因事物很快消逝而使人对它的印象不深。（侧重抽象语境）","core":"比喻因事物很快消逝而使人对它的印象不深","exs":["在评价问题上，不能“浮光掠影”“点到为止”，应进行更加细致地研究。","当下，对“现实题材”舞剧来说，“现实”应当是对时代内核的深刻反映，是对人性与社会内涵的细致剖析，而非仅停留于表面的浮光掠影。","搞调查研究必须深入一线，不能只坐在办公室中看汇报材料，更不能浮光掠影，将调查研究变成“旅游”。"]},{"id":145,"w":"走马观花","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"走马：骑马快跑。比喻观察事物或者了解情况不深入细致。（侧重于用眼看具体事物的过程）（一般不形容读书）","core":"比喻观察事物或者了解情况不深入细致","exs":["有的上级督查检查考核兴师动众但又各行其是，基层没有那么多人力、物力，往往只能应付，而检查组也是走马观花。","随着经济社会的发展和消费需求的升级，越来越多的游客愿意选择休闲游，从走马观花转向深度体验。","景区在配套设施完善上下功夫，增设服务站点、提供优质餐饮、举办节庆活动，把过去单纯的“走马观花”式消费变成可互动可参与的深度体验消费。"]},{"id":146,"w":"蜻蜓点水","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"比喻进行某些动作时只轻轻接触表面。也比喻肤浅不深入。","core":"比喻进行某些动作时只轻轻接触表面","exs":["治标不治本、蜻蜓点水式的清理，最终只能是“换汤不换药”。","在安全生产工作中，我们要严防“蜻蜓点水”式隐患排查等形式主义做法，做到隐患早发现、问题早处置，切实维护人民群众生命财产安全和社会大局稳定。","坚决杜绝粉饰太平、蜻蜓点水现象，对待前进过程中党内出现的各种问题决不能反应迟钝，慢腾腾、软绵绵。"]},{"id":147,"w":"浅尝辄止","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"辄：立即，就。只略微尝试一下就停止。比喻做事不求深入。（侧重停止）","core":"比喻做事不求深入","exs":["可惜的是，我尽管出于爱好选修了足够多的人文类课程，但终是浅尝辄止、不成体系。","要注重实际效果，坚决防止学习教育浅尝辄止，坚决杜绝不必要的形式创新。","读书是一个长期地需要付出辛劳的过程，不能心浮气躁、浅尝辄止。"]},{"id":148,"w":"囫囵吞枣","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"囫囵：整个的。把枣子整个吞下。比喻笼统地接受，不加分析、甄别，不求甚解。","core":"比喻笼统地接受，不加分析、甄别，不求甚解","exs":["事实上世界上还是有那么一些人做到，区别只在于，是认真阅读还是囫囵吞枣。","特别是要注意警惕和克服对上级精神和实际情况吃不透、盲目照搬照抄上级文件、囫囵吞枣地传给下级去落实的现象和问题。","面上轰轰烈烈的传达，口号式、机械式的传达，不加消化、囫囵吞枣地传达，上下一般粗的传达，比比皆是。"]},{"id":149,"w":"不求甚解","part":"c","gn":"十二","gt":"印象和效果","sub":"形容学习粗浅","type":"four","expl":"甚：很，极。原指读书只领会要旨，不必在一字一句上下功夫。后指只求懂个大概，不去深入理会。","core":"原指读书只领会要旨，不必在一字一句上下功夫","exs":["碎片化的阅读或观看，是快节奏生活下的产物，却也带来不求甚解。","我们虽然不必提倡不求甚解的态度，但是，盲目地反对不求甚解的态度同样没有充分的理由。","一方面，也不能把读书看得太容易，不求甚解，囫囵吞枣，抓不住实质，把握不住精髓。形容学到一点就能推知更多"]},{"id":150,"w":"举一反三","part":"c","gn":"十二","gt":"印象和效果","sub":"近义辨析","type":"four","expl":"反：类推，推论。指举出一件事，就可以触类旁通，类推出许多同类事物来。（侧重于具象的事物层面。）（侧重类推）","core":"指举出一件事，就可以触类旁通，类推出许多同类事物来","exs":["数字的背后，是海南对环保督察中所反映出问题的重视：不仅要立行立改，而且要真正做到举一反三。","不少地方、部门和单位不光认真分析和解决一个个具体问题，还举一反三，推动解决更多同类问题。","小样本的“小”并不是不需要数据，而是希望通过提高数据利用率，实现举一反三。"]},{"id":151,"w":"融会贯通","part":"c","gn":"十二","gt":"印象和效果","sub":"近义辨析","type":"four","expl":"融会：融合。贯通：全面透彻地了解。指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟。（侧重融合）","core":"指把各方面的知识、道理融合贯穿，从而获得对事物全面、透彻地理解和领悟","exs":["如何做到在讲好中国故事的同时与世界对话，把我们的好东西介绍到国外，把国外好的东西引进来，洋为中用，做到中西合璧、融会贯通，是文学工作者必须破解的难题。","坚持把学和做结合起来、把查和改贯通起来，做到融会贯通。","开展党纪学习教育，不能孤立割裂地学，而要全面系统学、融会贯通学。"]},{"id":152,"w":"触类旁通","part":"c","gn":"十二","gt":"印象和效果","sub":"近义辨析","type":"four","expl":"触：接触。通：通晓。指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物。（侧重于抽象的思维层面。）（侧重类推）","core":"指掌握了某一事物的规律或知识，就能够以此类推，了解同类的其他事物","exs":["大多数人其实是被“狼来了”骗过之后才醒悟，并没有触类旁通，学会辨别这类假新闻，因而不时被低劣的造假手段“套路”。","突出从细处入手、从实处着力，以问题整改为抓手，举一反三、触类旁通，做到整改一个问题、避免一类问题，规范一个领域。","研究解决高频共性难题的方法，汇集各方面力量开展协同攻关，于典型问题中触类旁通，推动一类问题迎刃而解。"]},{"id":153,"w":"相辅相成","part":"c","gn":"十三","gt":"搭档配合","sub":"合作配合","type":"four","expl":"辅：辅助，帮助。指两种事物互相辅助，互相促成，缺一不可。","core":"指两种事物互相辅助，互相促成，缺一不可","exs":["丰富的知识和健康的身体是事业成功的基础，二者相辅相成，缺一不可。","巩固文化主体性和文明交流互鉴并不矛盾，而是相辅相成、相互促进的。","作为交叉学科门类下的一级学科，区域国别学应与交叉学科的整体发展相辅相成、相互促进，推动更多学科和人才投入区域国别研究中。"]},{"id":154,"w":"相得益彰","part":"c","gn":"十三","gt":"搭档配合","sub":"合作配合","type":"four","expl":"相得：互相投合。益：更加。彰：明显。两个人或两件事相互配合，双方的能力和作用更能显示出来。","core":"互相投合","exs":["小王的男中音和老张的手风琴伴奏相得益彰，更富有艺术感染力。","评弹声与吉他声遥相呼应，烟火气与文艺范相得益彰，古老与现代的融合共生，铺就了一座城市温暖的底色。","当然，“减量化”“轻量化”不意味着“简陋化”，在简化的基础上优化设计，使包装与茶品相得益彰，才能助推茶产业和茶文化齐头并进。"]},{"id":155,"w":"锦上添花","part":"c","gn":"十三","gt":"搭档配合","sub":"合作配合","type":"four","expl":"指在有彩色花纹的丝织品上再绣上花朵。比喻美上加美，喜上加喜。","core":"指在有彩色花纹的丝织品上再绣上花朵","exs":["也许，对中国的银行来说，已经习惯了做锦上添花，而不是雪中送炭的事了。这些年来，中国的企业，所以寿命都十分短暂。","本身愉快的交易关系，因为赠品和“保价”这样本该是锦上添花的事变了味，哪头是便宜哪头是吃亏，值得商家仔细掂量！","促进区域协调发展，需要处理好政府与市场的关系，既做好锦上添花、培育增长极的事情，更做好雪中送炭、增强欠发达地区发展能力的事情。"]},{"id":156,"w":"珠联璧合","part":"c","gn":"十三","gt":"搭档配合","sub":"合作配合","type":"four","expl":"珠联：像珍珠一样串在一起。璧合：像碧玉一样合在一起。原指一种日月重合、五星相联的天相。后多比喻美好的人及事物凑在一起。同“珠连璧合”。（侧重结合）","core":"原指一种日月重合、五星相联的天相","exs":["天文专家介绍说，日落后，天宇将上演“金星合木星”的奇特天象，届时这两颗最明亮的行星将近距离“珠联璧合”，上演一幕虽短暂却精彩的“二人转”。","共享与旅行的结合可谓珠联璧合，旅行的“吃、住、行、游、购、娱”几个环节都涉及到资源信息的共享和充分利用。","有为政府与有效市场的珠联璧合，为外贸稳增长打下坚实基础。"]},{"id":157,"w":"互为表里","part":"c","gn":"十三","gt":"搭档配合","sub":"合作配合","type":"four","expl":"甲为乙的外表，乙为甲的内里；比喻互相依存，互相接受。","core":"比喻互相依存，互相接受","exs":["官僚主义与形式主义互为表里。两者往往是你中有我、我中有你，或你就是我、我就是你。","不正之风与腐败现象相互交织、互为表里，严重影响党的先进性和纯洁性，侵蚀党的健康肌体，损害党群干群关系。","“四风”和腐败互为表里、同根同源，蜕化变质往往始于吃喝玩乐。"]},{"id":158,"w":"交相辉映","part":"c","gn":"十三","gt":"搭档配合","sub":"二者都好","type":"four","expl":"各种光亮、色彩相互照耀、映射。常用语形容美好的景象。","core":"常用语形容美好的景象","exs":["让我们为青春之中国放歌，让青春梦想与中国梦交相辉映！","风电是工业发展的产物，作为工业景观，与环境交相辉映，实现生态、人文、工业、产业深度融合，协同发展，让人民从中体验到幸福感和获得感。","走进2024成都世园会主会场，具有典型中国元素、东方美学的国内城市展园与充满异国风情、多元特色的国际园艺展区交相辉映，相映成趣。"]},{"id":159,"w":"相映成趣","part":"c","gn":"十三","gt":"搭档配合","sub":"二者都好","type":"four","expl":"映：映衬。趣：意趣。相互衬托着，显得很有情趣，很有意思。","core":"映衬","exs":["法国游客“玩”的“糟评”，与法国作家莫迪亚诺“写”的“诺奖”相映成趣，让人不乏有些联想。","清风穿竹林，水溪绕山川，与白墙黛瓦的中式建筑相映成趣，氤氲出水墨画般的盎然诗意。初夏时节，不少游客相聚于此，享露营、住民宿，揽碧水青山入怀，拥清风暖阳入袂，体验桃花源般归隐避世慢生活。","5月23日，黔江区麒麟盖光伏发电站的光伏板、麒麟盖风电场的风电塔与山峦、民居、农田、公路相映成趣，勾勒出山村独特的夏日风景。"]},{"id":160,"w":"双峰并峙","part":"c","gn":"十三","gt":"搭档配合","sub":"二者都好","type":"four","expl":"意思通常指的是两座高大的山峰彼此对立地耸立着。这个成语不仅用来形容自然界的景观，也常用于比喻在某一领域或文化上同时达到极高成就的两个人物或事物。","core":"意思通常指的是两座高大的山峰彼此对立地耸立着","exs":["在《红楼梦》里，薛宝钗和林黛玉共用一首判词，排名第一，双峰并峙，各具风采。","战国时期，屈原行吟于江上，赋予长江浪漫瑰丽的诗意想象，形成以楚辞为代表的诗歌艺术形式，奠定了中国文学史上南《骚》北《诗》双峰并峙的格局。","鲁迅研究专家、绍兴文理学院阳明文化研究中心主任卓光平认为，王阳明与鲁迅是双峰并峙的越地思想家，也是前后相继的精神独异者，还是引领时代的思想源泉者。"]},{"id":161,"w":"并行不悖","part":"c","gn":"十四","gt":"工作开展顺序","sub":"工作开展顺序","type":"four","expl":"悖：违反，违背。指同时进行而互相不违背。","core":"指同时进行而互相不违背","exs":["科技与法律，承载着人类社会的两种价值指向：前者不断突破人类智慧的前沿，后者则兜住公序良俗的底线。两种价值取向其实并行不悖，都服务于人类的生存状态的改善。","抢位发展强调积极进取、抢抓机遇，错位发展强调立足实际、因地制宜，二者并行不悖，都是构建现代化产业体系的重要路径。","徜徉在钟楼街，中西合璧、明净沉稳的建筑风格协调统一，美陈装置、绿化景观精致多样，传统风格与时尚元素并行不悖。"]},{"id":162,"w":"齐头并进","part":"c","gn":"十四","gt":"工作开展顺序","sub":"工作开展顺序","type":"four","expl":"指几方面同时前进。","core":"指几方面同时前进","exs":["我们的教育、教学、科研，要齐头并进。","提高粮食生产效益、增加农民种粮收入，实现农民生产粮食和增加收入齐头并进，应当成为政策制定的关切所在。种粮收益一端是价格，一端是成本。","“双11”多平台齐头并进、商家努力争先的场景，体现了我国企业昂扬奋进的意志。"]},{"id":163,"w":"双管齐下","part":"c","gn":"十四","gt":"工作开展顺序","sub":"工作开展顺序","type":"four","expl":"管：笔管。比喻一件事同时采用两种办法或两件事同时进行。","core":"比喻一件事同时采用两种办法或两件事同时进行","exs":["治理社会公德失范，需要双管齐下，既要建立社会公共规则，又要重视社会公德教育。","自进入新一轮森林草原防火期以来，文山市通过“技防”和“人防”双管齐下，不断增强森林防灭火能力。","乌审旗牢固树立“人才是第一资源”的理念，大力实施“人才乌审”战略，坚持“走出去”+“引进来”的方式，双管齐下进行招才引智，不断拓宽人才引进渠道，为全旗经济社会高质量发展注入新活力、增添新动能。"]},{"id":164,"w":"并驾齐驱","part":"c","gn":"十四","gt":"工作开展顺序","sub":"工作开展顺序","type":"four","expl":"并驾：几匹马并排在一起拉车。齐驱：共同快跑。比喻相互之间不相上下。","core":"比喻相互之间不相上下","exs":["必须坚持民生优先，科学重建，让房屋重建与产业发展并驾齐驱。","十余年间，中国品牌发展迅速，背后的产业基础逐步壮大，由奋力追赶、并驾齐驱、弯道超车，到今天的“全球车企看中国，发展机遇在中国”。","技能与理财培训并驾齐驱才能让农民工的“钱袋子”真正鼓起来。"]},{"id":165,"w":"本末倒置","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"本：树根。末：树梢。比喻把事情的轻重主次颠倒了过来。","core":"比喻把事情的轻重主次颠倒了过来","exs":["搞政治理论和业务学习，却以“停止办公”之举直接违背这个最基本的“政治理论”，实在是本末倒置。","在这样的现代法治体制面前，大数据、云计算、信息技术、人工智能都只是实现合法正义的辅助手段，切不可本末倒置，这是我们始终应该铭记的一条基本原则。","因此，将媒体传播作为国际传播的主战场，纵然是本末倒置、不得要领，却也是在文化输出上没有知识积累、缺少人脉网络、基础条件薄弱的一种尴尬选择。"]},{"id":166,"w":"舍本逐末","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"舍：放弃。本：根本。逐：追求。末：枝节。比喻放弃根本，追求末节，轻重主次倒置。","core":"比喻放弃根本，追求末节，轻重主次倒置","exs":["这样的分析和议论，选择性忽视了两个赞助对于体育事业发展的裨益，而纠结于所谓的营销效果，属于舍本逐末的“跑偏”。","追求厚重感绝不能以牺牲价值观为代价，否则便成了舍本逐末。","做好食物、营造良好的就餐环境才是餐厅应当走上的正途，内卷高分无异于舍本逐末。"]},{"id":167,"w":"喧宾夺主","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"喧：吵吵嚷嚷。客人的声音压倒了主人的声音。比喻外来的或次要的事物占据了原有的或主要的事物的位置。","core":"比喻外来的或次要的事物占据了原有的或主要的事物的位置","exs":["麻辣语录走红，折射出社会各界对学校加快教学法改革的期待，但喧宾夺主分散学生学习知识的注意力，就不值得提倡了。","茶点滋味略带咸，结合乌龙茶的香醇，不会喧宾夺主的同时，使得茶汤滋味更上一层楼。","强调兼容用途对主用途的辅助支撑作用，兼容用途不能反超主用途，喧宾夺主。"]},{"id":168,"w":"因小失大","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"因：为了。指为了小的利益造成大的损失。","core":"指为了小的利益造成大的损失","exs":["有的人就看着鼻子底下这点实利，算盘珠子拨得很精，看起来很聪明，实际上常常因小失大。","要处理好抓大与放小，抓住关系全局的大事，防住影响大局的小事，防止因小失大。","警惕各类打着“内幕消息”“高额回报”旗号的私下换汇、投资理财、优惠购物、刷单赚钱信息，切勿因一时贪图便宜而因小失大。"]},{"id":169,"w":"因噎废食","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"废：停止。比喻因为碰到挫折，连该做的事情也不做了。","core":"比喻因为碰到挫折，连该做的事情也不做了","exs":["在这样的背景下，这两个项目进展不理想只能作为个案处理，我们不能因噎废食。","慎独慎微不是谈友色变，守住交往关也不是要因噎废食，在不违反纪律和规矩的前提下，需遵循一定的“尺度”。","盲目的禁止犹如因噎废食，与公共交通的便民性和利民性背道而驰。"]},{"id":170,"w":"非此即彼","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"错误抉择","type":"four","expl":"不是这个，就是那个。指在两者之间必选其一，不容许中间状态存在。","core":"指在两者之间必选其一，不容许中间状态存在","exs":["干净与担当、勤政与廉政，不是非此即彼的对立面，而是有机统一于共产党人的政治品格要求，统一于人民公仆的根本定位之中。","从经济发展底层逻辑来看，产业自主与提振消费从来不是非此即彼的单选题，二者互为支撑。","正能量和大流量并不是非此即彼的二元对立关系，而是相辅相成、辩证统一的。"]},{"id":171,"w":"背道而驰","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"近义辨析","type":"four","expl":"背：逆着。道：道路。向着相反的道路奔驰。比喻彼此方向目标完全相反。也比喻背离正确的目标，朝相反的方向走。","core":"比喻彼此方向目标完全相反","exs":["以零售和餐饮经营的服务业都应该向日本学，正如日本餐饮业的赚钱大王西腾公司，其经营技术与一般餐饮企业背道而驰，但却成为日本餐饮界当之无愧的赚钱大王。","社会舆论应该理性地跳出何涛“道德模范”的特殊身份，严格按照法律来进行公允的评判，才能真正救赎这个和法律“背道而驰”的“道德标杆”。","倘若搞“拍脑袋”“一刀切”，甚至为了所谓政绩好看搞摊派，就会与初衷背道而驰。"]},{"id":172,"w":"南辕北辙","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"近义辨析","type":"four","expl":"辕：车辕，车前驾牲口的直木。辙：车轮经过留下的痕迹。本要往南边去却驾车向北。比喻行动和目的截然相反。（多形容同一个主语、侧重目标与做法相反）","core":"比喻行动和目的截然相反","exs":["如果一方面盼望有功于“世道人心”的文艺，而同时又不许文艺作品带着强心和清泻的药品，这何异南辕北辙？","司机以为我是人生地不熟的外来客，南辕北辙地大兜圈子。","如果政绩观不端正，抓落实就会失去方向、脱离轨道，看似做了很多工作，却可能是无用功，甚至南辕北辙。"]},{"id":173,"w":"分道扬镳","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"近义辨析","type":"four","expl":"道：道路。镳：马嚼子。分开道路，驱马前进。指分道而行。也比喻思想、志趣不同而各人干各人的事。也作“扬镳分路”。","core":"指分道而行","exs":["经历了两年半的短暂“联姻”，青岛啤酒与三得利最终分道扬镳。","欧洲政客与科学家正在抗击新冠的战斗中分道扬镳。","研究发现，在晚白垩纪时期，这两大鸟类谱系便已经分道扬镳，远早于著名的恐龙灭绝事件。"]},{"id":174,"w":"缘木求鱼","part":"c","gn":"十五","gt":"错误抉择和方向","sub":"近义辨析","type":"four","expl":"缘木：爬树。比喻方向、方法不对，就不可能达到目的。（侧重方法错误）","core":"比喻方向、方法不对，就不可能达到目的","exs":["脱离经济发展抓环境保护是“缘木求鱼”，离开环境保护搞经济发展是“竭泽而渔”，正确的经济政策就是正确的环境政策。","诚信有着坚实的精神内核，诚在于仁，信近乎义，离开仁义谈诚信如同舍本逐末，缘木求鱼。","牢固树立和践行绿水青山就是金山银山的理念，既不能在发展经济的过程中对生态环境竭泽而渔，也不能在保护生态环境的过程中舍弃经济发展而缘木求鱼，而是坚持走绿水青山和金山银山双赢的可持续发展道路。"]},{"id":175,"w":"拔苗助长","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"用来比喻违反事物的发展规律，急于求成，反而坏事。也作“揠苗助长”。","core":"用来比喻违反事物的发展规律，急于求成，反而坏事","exs":["超前教育无异于拔苗助长，看似成绩领先，特长傍身，实则根基不稳，不能行稳致远。","中国电影这些年高速增长有目共睹，但在各路人马疯狂携资进入影视领域的当下，中国电影也有泡沫之虞，需重塑“好心态”，莫急功近利，更不能拔苗助长。","但仍有部分家长安排孩子“超前学习”，这到底是在帮孩子赢在起跑线，还是在拔苗助长毁其未来？"]},{"id":176,"w":"越俎代庖","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"越：超过。俎：古代盛牛羊等祭品的器具。庖：厨师。比喻处理超过自己职权范围的事情。","core":"比喻处理超过自己职权范围的事情","exs":["孩子能做的事，父母不要越俎代庖。","野生动物往往有其独特习性，保护不能越俎代庖、事事包办，而要“有所为有所不为”。","要加强规范，专业问题专业办，切忌妄图省事越俎代庖。错误做法（寓言故事）（10个）"]},{"id":177,"w":"削足适履","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"履：鞋。鞋小脚大，把脚削去一块来凑合鞋的大小。比喻不合理地迁就凑合或不顾具体条件，生搬硬套。","core":"比喻不合理地迁就凑合或不顾具体条件，生搬硬套","exs":["倘若作者如此牺牲了书写的自由，即使极小部分，也无异于削足适履。","我国幅员辽阔、人口众多，各地的资源禀赋、产业基础、人才结构和发展状况不尽相同，不能简单套用单一发展模式，削足适履地盲目追“新”。","习近平总书记指出：“现代化道路并没有固定模式，适合自己的才是最好的，不能削足适履。”"]},{"id":178,"w":"闭门造车","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"关起门来造车子。比喻不管客观情况如何，只凭主观愿望办事。（多形容不开放、自我封闭）","core":"比喻不管客观情况如何，只凭主观愿望办事","exs":["广义的开放没有问题，不能闭门造车，不能单打独斗，不能不学习人家的先进技术。","要践行“身入心至”的求实作风，从“闭门造车”中摆脱出来，从“纸上谈兵”中解放出来。","流芳百世的作品都是需要实践检验的，都是需要大众认可的，都是饱含生活之中的真情实感，不是坐在屋子里闭门造车写出来的，不是钱财名利所能左右的。"]},{"id":179,"w":"刻舟求剑","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"求：寻找。比喻拘泥、不变通，不懂得根据实际情况处理问题。也比喻徒劳无功，达不到目的。","core":"比喻拘泥、不变通，不懂得根据实际情况处理问题","exs":["人的一切身家性命信息都是在变动的，如果非要像填表时代那样记录静态的数据，那就像刻舟求剑，永远难以还原一个人的全息图景。","在此背景下，如果继续用传统的观念来看待和分析问题，继续用高速增长阶段的逻辑来解读经济指标和经济数据，无异于“刻舟求剑”。","习近平总书记在陕西榆林考察时强调：“要坚持马克思主义基本原理，同时坚持实事求是，不断推进马克思主义中国化、时代化，学马克思主义不能刻舟求剑。”"]},{"id":180,"w":"守株待兔","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"株：树桩子。比喻心存侥幸，不劳而获。也比喻死守狭隘经验，不知变通。","core":"比喻心存侥幸，不劳而获","exs":["他说自己的投资理念其实很简单，就是找估值最低的个股，重仓布局，守株待兔。","习近平总书记强调，“推进中国式现代化是一个探索性事业，还有许多未知领域，需要我们在实践中去大胆探索，通过改革创新来推动事业发展，决不能刻舟求剑、守株待兔”。"]},{"id":181,"w":"掩耳盗铃","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"掩：掩盖，遮盖。比喻自欺欺人。同“掩耳偷铃”。","core":"比喻自欺欺人","exs":["个人主义严重的人，常常会干出掩耳盗铃的蠢事，这又有什么奇怪呢！","“包装式”落实，表现形式多为“雷厉风行”装点敷衍塞责，以“假把式”装饰门面欺上瞒下，这种掩耳盗铃的做法，最终必将是搬起石头砸自己的脚。","安全生产是实打实、硬碰硬的工作，说了不等于做了，做了不等于做成了，做完了也不等于做好了，既不能流于形式，更不能搞掩耳盗铃、弄虚作假那一套。"]},{"id":182,"w":"邯郸学步","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了。","core":"比喻一味地模仿别人，不仅没学到本事，反而把原来的本事也丢了","exs":["各地文旅在“抄作业”时，也要谨防“邯郸学步”，阻碍了当地旅游产业的发展壮大。","创新之思：邯郸学步，走不出强军之路。","论文要得文中天，邯郸学步终不然。"]},{"id":183,"w":"东施效颦","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"比喻盲目地胡乱模仿，效果适得其反。","core":"比喻盲目地胡乱模仿，效果适得其反","exs":["虽然“西方甄选”及时被封，难挡南方甄选、北方甄选、中方甄选们继续东施效颦。","如果城市营销一味追求流量而“东施效颦”，丢掉了城市的文化根脉和自身特色，将被流量所抛弃。","“东施效颦”不成，通过制造舆论挑唆“一带一路”合作，企图“花小钱办大事”，似乎也成为了美国的“权宜之计”。"]},{"id":184,"w":"与虎谋皮","part":"c","gn":"十六","gt":"错误做法（寓言故事）","sub":"错误做法（寓言故事）","type":"four","expl":"跟老虎商量取下它的皮来，比喻跟坏人商量要其牺牲自己的利益，是绝对办不到的。","core":"跟老虎商量取下它的皮来，比喻跟坏人商量要其牺牲自己的利益，是绝对办不到的","exs":["美国民众要指望着这些政客来做出回应性的改革和调整，完全是与虎谋皮、毫无可能。","国际联盟，是帝国主义压迫弱小民族的工具，希望国际联盟来帮助中国，无异与虎谋皮。","在这样的情况下，国际社会若要与美国“团结一致”，岂不是与虎谋皮？"]},{"id":185,"w":"潜移默化","part":"c","gn":"十七","gt":"教育影响批评","sub":"影响感化","type":"four","expl":"潜：暗中。默：毫无声息。指受到外来影响而在不知不觉中发生变化（侧重长时间）。","core":"指受到外来影响而在不知不觉中发生变化（侧重长时间）","exs":["精神文明建设关键要认真抓、切实干，做到潜移默化、春风化雨，引导群众树立文明观念、争当文明公民。","我想，军歌的魅力，就是能够在潜移默化中发挥教育引导作用，产生直抵人心的力量。","我们党高度重视发展积极健康的政治文化，以良好政治文化涵养政治生态，潜移默化地影响着政治环境建设，不仅使党内正气充盈，而且推动经济社会发展环境日益优化。"]},{"id":186,"w":"耳濡目染","part":"c","gn":"十七","gt":"教育影响批评","sub":"影响感化","type":"four","expl":"濡：沾染。因经常听到看到而不知不觉受到影响。同“耳染目濡”“目染耳濡”“目濡耳染”。（侧重身处某种外在环境中）","core":"（侧重身处某种外在环境中）","exs":["环保行为的养成仅靠大道理还不够，还需要家庭的耳濡目染和社会的良好氛围。","洪海涛生动讲述了身为“航二代”，从小耳濡目染受到父母熏陶，在航天精神引领下，多年坚守航天生产一线的故事。","让师生在耳濡目染之中深刻感悟英雄的不朽，深切感受方志敏烈士对共产主义理想的坚定信仰和对祖国人民的无限热爱。"]},{"id":187,"w":"如沐春风","part":"c","gn":"十七","gt":"教育影响批评","sub":"影响感化","type":"four","expl":"通常用来形容人感到非常舒适和愉悦。它的意思是像沐浴在春风里一样，感受到舒适的感觉。","core":"通常用来形容人感到非常舒适和愉悦","exs":["“芜湖正在建设省域副中心城市，因为坐拥长三角，覆盖了我们80%以上的客户，最关键的是当地让企业如沐春风的营商环境，没有理由不选择这里。”","良好的营商环境已成为酒泉市一道新的亮丽风景线，不仅让企业如沐春风，而且使得磁场效应加速显现。","鼓舞人心的话语，浓浓暖意让人如沐春风，铿锵力量令人意气风发。"]},{"id":188,"w":"润物无声","part":"c","gn":"十七","gt":"教育影响批评","sub":"影响感化","type":"four","expl":"指有大胸怀者，做了贡献而不张扬，默默奉献。（也指文化教育等对人的潜移默化的影响）","core":"指有大胸怀者，做了贡献而不张扬，默默奉献","exs":["道德是一种力量，它春风化雨，润物无声；道德是一面旗帜，它鼓舞人们，引领方向。","教书育人，润物无声。在人才培养和教学工作方面，刘老师坚持走在本科教学第一线。","通过继古开今、润物无声的方式，习近平新时代中国特色社会主义思想一定能得到更好地传播，我们弥足珍贵的中华优秀传统文化一定能得到更好的传承。"]},{"id":189,"w":"成风化人","part":"c","gn":"十七","gt":"教育影响批评","sub":"影响感化","type":"four","expl":"成风，倡树一种社会风气。化人，感染人、影响人、教育人。通过倡导树立一种社会风气来影响、教育感化社会大众。","core":"成风，倡树一种社会风气","exs":["我们要深入学习领会、认真贯彻落实这些重要论述精神，切实传承发展好中华传统美德，用中华传统美德成风化人。","以优秀历史文化铸魂，用艺术作品成风化人。","既依法治理高额彩礼，也做好成风化人的文章，加强精神文明建设，发挥好村规民约、道德公约等激励约束作用。"]},{"id":190,"w":"耳提面命","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"“耳提”，提着耳朵叮嘱；“面命”，当面指教，形容教诲殷切。多指（长辈对晚辈、上级对下级）恳切地教导。","core":"“面命”，当面指教，形容教诲殷切","exs":["父亲经常教育我们兄弟俩要“一心为公、两袖清风”，他也深知我工作的重要性，对我更是耳提面命。","坚决守牢安全底线，最大限度保障人民群众生命财产安全，决不辜负总书记对四川安全发展工作的耳提面命和谆谆教诲。","长时间的网课，师生之间没有那么多面对面交流的机会，老师不再像以前那样“耳提面命”。"]},{"id":191,"w":"苦口婆心","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"用来形容一个人善意且耐心地反复劝导他人。","core":"用来形容一个人善意且耐心地反复劝导他人","exs":["走街串巷查隐患、苦口婆心解纷争、一丝不苟办实事……在日常生活中，一群来回穿梭在社区、乡村的网格员，用他们忙碌的身影，提升了群众的安全感。","今年4月以来，他和战友们一道，与犯罪分子斗智斗勇，对诈骗高危人员苦口婆心，已经累计成功劝阻10余起，为群众及时止损70余万元。","要求大家落实好“一岗双责”，认真领会各项规章制度要求，做到“苦口婆心地讲”，对于苗头性倾向性问题要及时谈话教育。"]},{"id":192,"w":"循循善诱","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"循循：有次序的样子。诱：引导。指善于有步骤地引导别人。多形容教育得法。","core":"指善于有步骤地引导别人","exs":["社会文明的形成，需要自律，也需要他律；需要循循善诱地劝导，也需要法律制度的规范。","在谈心谈话环节，落落大方、循循善诱、入情入理、用心用情，充分展现了我校辅导员扎实的理论水平、专业技能素养和工作实践能力。","选手们需要通过良好的沟通技巧，就学业困惑、人际关系、恋爱失意、职业规划等问题循循善诱、答疑解惑。"]},{"id":193,"w":"诲人不倦","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"诲：教诲，教导。教导人时很有耐心而不知疲倦。","core":"教诲，教导","exs":["从经师到人师，从教书先生到大国良师，好的教师学而不厌、诲人不倦，为党育人、为国育才。","他们都在三尺讲台展现出了甘于奉献、诲人不倦的师者风范和言为士则、行为世范的道德情操。","新时代教师要更加坚定历史自信、文化自信，弘扬中华民族崇文重教、有教无类的传统和历代教育家因材施教、诲人不倦的精神。"]},{"id":194,"w":"春风化雨","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"宜于万物生长的和风，适时的雨。后用来比喻良好的教育。多用来称颂师长对学生及晚辈潜移默化的教诲。（也可用来形容文化或教育等对人的影响）","core":"后用来比喻良好的教育","exs":["把党史学习教育做到青少年心坎上，春风化雨般滋润青少年的心田，让他们与党史故事和人物产生情感共鸣、与优秀文化与民族精神发生思想共振，汲取奋发向上的力量。","优秀传统文化与核心价值观建设有机结合起来，经过每天每月耳濡目染，如春风化雨般滋润着各地人民的心田。","在科室人文建设中，极力避免形式大于内容，搞作秀式的人文活动，而是与科室特色相结合，立足长远，春风化雨，润物无声。"]},{"id":195,"w":"和风细雨","part":"c","gn":"十七","gt":"教育影响批评","sub":"教育和批评","type":"four","expl":"意思是比喻耐心地和颜悦色地批评或劝说。","core":"意思是比喻耐心地和颜悦色地批评或劝说","exs":["周口下大力气打造精神文明建设品牌项目，开展了道德模范的感人事迹、无私奉献的志愿服务精神、内容丰富的公益剧场等活动，这样的活动犹如和风细雨，在潜移默化中改变着市民的思想素质、生活方式和精神面貌。","一个个感人的家风家训故事，如和风细雨，滋润着现场听众的心田。","群众和企业的发声有时“和风细雨”，有时也许尖锐甚至刺耳。"]},{"id":196,"w":"醍醐灌顶","part":"c","gn":"十七","gt":"教育影响批评","sub":"近义辨析","type":"four","expl":"醍醐：从牛乳中提炼出的纯酥油，佛教比喻最高的佛法。灌：浇。顶：头顶。比喻给人灌输智慧，使人从迷惑中醒悟或彻底觉悟。也比喻舒适畅快。","core":"从牛乳中提炼出的纯酥油，佛教比喻最高的佛法","exs":["母亲漫不经心说出的一句“有钱难买回头看”，让我顿时有一种醍醐灌顶的顿悟和追悔莫及的反思。","讲授内容条理清晰、通俗易懂，令人醍醐灌顶，茅塞顿开。","系统内容主要由楷模风范、廉诗警句、案例警示等组成，图文并茂，既赏心悦目，又醍醐灌顶，全力营造崇廉、尊廉、促廉、守廉的良好氛围。"]},{"id":197,"w":"振聋发聩","part":"c","gn":"十七","gt":"教育影响批评","sub":"近义辨析","type":"four","expl":"比喻唤醒糊涂麻木之人。","core":"比喻唤醒糊涂麻木之人","exs":["总书记的讲话振聋发聩，语重心长。","面对民族生死存亡，这座小院率先回应了历史转折时期人民的呼声，率先发出了振聋发聩的救国强音。","人类命运共同体理念一经提出，就以振聋发聩的力量引发强烈反响，得到国际社会越来越广泛的认同和支持。"]},{"id":198,"w":"如履薄冰","part":"c","gn":"十八","gt":"工作学习状态","sub":"工作谨慎认真","type":"four","expl":"履：踩，走过。形容战战兢兢、小心谨慎的样子。","core":"形容战战兢兢、小心谨慎的样子","exs":["这任务关系着几千人的身家性命，我们如履薄冰，哪容有丝毫的疏忽大意？","每一次抢救都是一场没有硝烟的战争，步步惊心、如履薄冰。患者的信任，专家团队的精诚合作，使产妇和胎儿最终渡过难关恢复健康。","所谓“畏则不敢肆而德以成，无畏则从其所欲而及于祸”，始终如临深渊、如履薄冰，人生的路才能免于灾祸，越走越宽。党规党纪是令行禁止的高压线，换个角度看也是自我保护的安全线。"]},{"id":199,"w":"兢兢业业","part":"c","gn":"十八","gt":"工作学习状态","sub":"工作谨慎认真","type":"four","expl":"原形容畏惧的样子。后多用来形容小心谨慎、不敢懈怠的样子。","core":"原形容畏惧的样子","exs":["要用最强有力的作风建设，引导党员干部从不为到有为、从避事到干事，形成堂堂正正为官、兢兢业业干事的好风气。","沈中明是一名老党员，扎根基层工作数十余年，工作兢兢业业、清正廉洁，在当地德高望重。对于父亲的病逝，沈结方及家人果断简化丧事办理流程，实施一次性安葬，为当地移风易俗开了先例。","这份荣誉不属于我一个人，应属于千千万万在平凡岗位上兢兢业业的快递员。苏金姬表示，将一如既往立足本职、扎根基层，在岗位上贡献光和热，把最好的服务带给市民。"]},{"id":200,"w":"一丝不苟","part":"c","gn":"十八","gt":"工作学习状态","sub":"工作谨慎认真","type":"four","expl":"一丝：极小的事物；苟：敷衍了事、马虎。连最细微的地方也不马虎，形容办事认真细致，一点儿不马虎。","core":"连最细微的地方也不马虎，形容办事认真细致，一点儿不马虎","exs":["近日，国家文物局公布了“全国文物大工匠”宣传选树对象名单。旨在弘扬执着专注、精益求精、一丝不苟、追求卓越的工匠精神和文物人“择一事终一生”的职业精神。","机库内灯火通明，机务官兵一丝不苟，对战机进行细致检查维护，为次日训练做好准备。","戈壁风沙大，吹得他脸颊发红，可他眼睛始终盯着标尺，一丝不苟地核对着数据。"]},{"id":201,"w":"殚精竭虑","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"殚：竭尽。用尽精力和心思。","core":"竭尽","exs":["王教授为了钻研这个课题，殚精竭虑，废寝忘食。","一百多年前，为了唤醒中国“睡狮”，为了挽救“神州陆沉”，一群仁人志士殚精竭虑，探寻救国救民的真理。在文化的觉醒中，我们选择了马克思主义思想和社会主义道路，同时葆有中国道路的独特性和中华文明的独立性。","徐建寅殚精竭虑，日夜攻求，又于3月25日亲手试制出数磅优质无烟火药，烧后已没有渣滓，爆炸后产生的气体是原来旧式火药的三倍，其威力已达到当时世界领先水平。至此，中国人终于掌握了属于自己的无烟火药技术。"]},{"id":202,"w":"呕心沥血","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"呕：吐。沥：滴。形容费尽心思。","core":"形容费尽心思","exs":["他，呕心沥血把生命最后的光辉都奉献给中国的外宣事业。","运营国内首座文物保护领域多场耦合实验室、成立国内目前唯一的国家古代壁画保护工程技术研究中心、初步建成具有行业示范和影响力的“安全管理平台及安全应急指挥中心”……保护好敦煌这座文明交流互鉴的生动样本，几代敦煌人呕心沥血。","“马兰花，默默人间美丽；马兰花，静静岁月流传……”这是清华大学原创话剧《马兰花开》主题曲中的歌词，深情歌颂了“两弹元勋”邓稼先为祖国核事业呕心沥血、忘我奋斗的不平凡人生。"]},{"id":203,"w":"苦心孤诣","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"苦心：用尽心思。诣：（学业、技能等）所达到的程度。孤诣：别人达不到的程度。指尽心竭力钻研，达到了别人所达不到的地步。也指为了达到目的而费尽心思。","core":"指尽心竭力钻研，达到了别人所达不到的地步","exs":["要改良社会，不得不这样，别人哪里会懂我们的苦心孤诣。","近些年，中国的“老三样”（手机、电脑、家用电器）和“新三样”（新能源汽车、锂电池、光伏产品）之所以在国际市场上广受欢迎，靠的是海量细分行业中持续的技术创新和极致的效率改进，靠的是中国企业家的苦心孤诣、精益求精。","姜治莹强调，哲学社会科学始终是吉大引以为傲的闪亮名片和一流建设的重要力量，一大批创业先贤曾在这里苦心孤诣、奋斗终身，为学科发展夯基垒台、架梁立柱，留下了伟大的足迹，镌刻下不朽的功勋。"]},{"id":204,"w":"废寝忘食","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"顾不上睡觉，忘记了吃饭。形容对某事专心致志。","core":"形容对某事专心致志","exs":["对于如此繁杂的调试工作，调试团队这半年多来几乎废寝忘食地投入。","2023年，煤矿设备需要对监测监控系统进行全面升级，由于当时的监控系统传输稳定率较差，闪断时而产生，李岩那段时间每天与厂家交流试用新设备、学习掌握新系统的原理和性能，他废寝忘食、手不释书，成为第一个全面熟练掌握新监测监控系统性能的人。","经过连续12天废寝忘食、奋战在一线，他克服晕船呕吐的问题，登轮进舱作业、检测30多次，从测试论证到登轮注氮作业，从船舶靠泊、油品过驳到清舱处理直至险情解除。"]},{"id":205,"w":"皓首穷经","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"皓：白。穷经：彻底钻研经书。钻研经籍直到人老头白。也作“白首穷经”。（也可形容长期钻研）","core":"（也可形容长期钻研）","exs":["古人常说，稚年入学，皓首穷经，书好像一辈子读不完似的。","图书编辑，是一份严谨细致的工作，编纂一部66个学科门类、1.264亿字的皇皇巨著，更要历经皓首穷经、字斟句酌的艰辛。","一些学者皓首穷经，对甲骨文研究工作孜孜以求，既以对甲骨文的深刻研究探究汉字形成和演变的历史，完善对中国文化史的了解，又据此锚定中华文明史的起始时间，考据商代最原始、最真实的时事和生活。"]},{"id":206,"w":"心无旁骛","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"旁；另外的。骛：追求。心思没有另外的追求，形容心思集中，专心致志。","core":"心思没有另外的追求，形容心思集中，专心致志","exs":["只有逐步建立与现实对接的待遇增长机制，才能让我们的干部干事创业心无旁骛、后顾无忧。","“实实在在、心无旁骛做实业，这是本分。”丁世忠建议，通过深化改革，进一步优化营商环境，用科技改造提升传统产业，坚定民营企业扎实发展的信心。从最开始的来料加工为主到现在创立自己的品牌，进而超过国际品牌，我观察这些异军突起的企业，就是心无旁骛、一以贯之。","这里不仅有优惠的政策，更有高效的服务，让我们能够心无旁骛地投入到产品研发和市场开拓中。如今，营山县正以“聚沙成塔”的决心，一步一个脚印地推进工业发展。"]},{"id":207,"w":"乐此不疲","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"因酷爱干某事而不感觉厌烦。形容对某事特别爱好而沉浸其中。","core":"形容对某事特别爱好而沉浸其中","exs":["变废为宝是该公司一直以来乐此不疲的事情，但随着生产经营规模的扩大，企业遇到了融资难问题。","在这个春天，观察、拍摄鸟类让不少年轻人乐此不疲。","村民唐高友正在家门口的小菜园里浇水，自从村内统一开辟了小菜园，他每天乐此不疲。"]},{"id":208,"w":"挖空心思","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"想方设法，费尽心机。（多含贬义）","core":"想方设法，费尽心机","exs":["为了持续制造爽感、快感，一些微短剧创作者挖空心思，甚至无所不用其极——有的鼓吹炫富拜金，大肆描写不正当的婚恋观；有的宣扬以暴制暴，渲染血腥暴力；有的故意贩卖焦虑，挑起年龄对立、性别对立、地域歧视。","一些人将吃吃喝喝遁入“地下”，披上“隐身衣”，躲进“青纱帐”，挖空心思躲避监督。","同时美方基于对华遏制打压和“以激烈竞争定义中美关系”的执念挖空心思，又抛出一套“中国产能过剩威胁”的奇谈怪论，诬称中国对电动车、光伏和新能源产业的持续补贴导致“产能过剩”，并“廉价输出海外”，对美国和其他国家的相应产业造成威胁。"]},{"id":209,"w":"千锤百炼","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"经过无数次锤打、锻炼。形容反复磨炼，使技艺或诗文达到极高水平。","core":"形容反复磨炼，使技艺或诗文达到极高水平","exs":["没有与生俱来的坚定，只有千锤百炼的坚韧；没有凭空而来的担当，只有风雨历练后的成熟。新时代的青年，当以破空之声回应百余年前的呐喊，以笃行之姿奔赴山河之约。","这份游刃有余背后，是中国航天在稳扎稳打中千锤百炼、在攻坚克难中矢志创新的奋斗精神。","4届冬奥会的坚守，千锤百炼后的圆梦，让我明白上场的意义。不要执迷成败，上场就是勋章。"]},{"id":210,"w":"持之以恒","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"持：指坚持、保持；之：代指所要坚持的事物；恒：指恒心、长久。指用恒心长久地坚持下去，不中途松懈。","core":"指坚持、保持","exs":["今年是“十五五”开局之年……持之以恒推进全面从严治党的重要举措。被巡视党组织要提高政治站位，切实把思想和行动统一到党中央决策部署上来。","会干事、干成事，是创造经得起实践、人民、历史检验实绩的必然要求。具备这一过硬本领，非一朝一夕之功，必须持之以恒学思践悟，保持攻坚克难的锐气和斗志。","领导干部“一到节假日就不见了”的现象消失了，自觉坚守岗位“时时放心不下”的责任感变强了；推杯换盏、违规吃喝等“四风”问题少了，为群众服务的时间多了……此消彼长间，正是持之以恒抓作风、正党风的结果。"]},{"id":211,"w":"精益求精","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"已经很好了，还要做得更好。形容追求卓越、不断进步。","core":"形容追求卓越、不断进步","exs":["中国营商环境的优化，为企业心无旁骛做强主业、精益求精打造品牌夯实了底气，也为企业品牌更好参与国际合作、打开海外市场提供了支撑。","分队采取“分层夯实、精准找平、二次养护”的方法，从测量放线、定点标定、墙体砌筑，到土方回填、混凝土浇筑、表面抹平，每一道工序都做到精益求精。","友好、开放、包容的胸襟，不怕困难、精益求精的品格，这些精神气质在任何时候都是一个国家、一个民族最宝贵的财富。"]},{"id":212,"w":"夜以继日","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"日夜不停地做某事。多形容十分勤奋、勤恳、忙碌。","core":"多形容十分勤奋、勤恳、忙碌","exs":["现在每一天的状态就是夜以继日，所做的工作事无巨细。","陈庆川说，以人工智能技术在聚变领域中的研究应用为例，团队成员来自各个专业、各个领域，夜以继日地守着装置做实验、分析实验数据、优化迭代实验方案，最终实现了装置的安全稳定和各成果的可靠产出。","凭着夜以继日的努力，一段时间以后，余林成功化解了94起各类纠纷，为龙潭村的和谐团结夯实了群众基础。走万里路，进千家门，解百家难。别人“躲着走”的难事、愁事，余林积极走访，为群众化解矛盾纠纷。"]},{"id":213,"w":"焚膏继晷","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"焚：点燃；膏：灯油或蜡烛；继：接续；晷：日影、日光。意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作。","core":"意思是点燃灯烛来接替日光照明，形容夜以继日地用功读书或努力工作","exs":["人类的美好理想，都不可能唾手可得，都离不开手胼足胝、焚膏继晷的艰苦奋斗。","一项项“卡脖子”技术被攻克，背后是每个科研尖兵勇做攀登高峰的开拓者，焚膏继晷、孜孜以求……无数“每个”构成了14亿多人的奋进姿态，绘就奔跑的中国的壮美画卷。","百年来，一代又一代的考古学人薪火相传、焚膏继晷，就人类起源、农业起源、文明起源、国家起源等重大研究课题，交出了令世界瞩目的“中国答卷”，为构建中华文明史、弘扬中华优秀传统文化做出了考古人的独特贡献。"]},{"id":214,"w":"夙兴夜寐","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"夙：早。兴：起来。寐：睡觉。早起晚睡，形容勤奋辛劳。","core":"早起晚睡，形容勤奋辛劳","exs":["他们夜以继日、夙兴夜寐，默默奋战在每一个白天和夜晚，以实际行动尽职担当，全力以赴投入到疫情防控阻击战中。","全市上下以踏石留印、抓铁有痕的精神，坚定不移强作风，持之以恒优环境，夙兴夜寐、奋勇争先，扎扎实实抓好各项工作，为龙江全面振兴、全方位振兴贡献双鸭山力量。","从夙兴夜寐的临床护理，到严谨细致的病区管理，再到科学规范的全院护理管理，从一线成长起来的包满珍几乎对医院护理的所有事项了然于胸。“护士的工作应以专业护理为主，在实际中，大量的琐事也会找到护士。”"]},{"id":215,"w":"目不窥园","part":"c","gn":"十八","gt":"工作学习状态","sub":"近义辨析","type":"four","expl":"窥：看。形容学习专心致志，十分刻苦。","core":"形容学习专心致志，十分刻苦","exs":["他搞这些研究已经很久了，目不窥园，终于成功了。","他从唐诗下手，目不窥园，足不下楼，兀兀穷年，沥尽心血。杜甫晚年，疏懒得“一月不梳头”。闻先生也总是头发凌乱，他是无暇及此。闻先生的书桌，零乱不堪，众物腾怨，闻先生心不在焉，抱歉地道一声：“秩序不在我的范围以内。”饭，几乎忘记了吃，他贪的是精神食粮；夜间睡得很少，为了研究，他惜寸阴、分阴。深宵灯火是他的伴侣，因它大开光明之路，“漂白了四壁”。","作为一名企业家，要以目不窥园的眼光看待市场的整体格局，才能更好地把握商机。"]},{"id":216,"w":"栉风沐雨","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"栉：梳头。沐：洗头。形容人辛苦地四处奔波。","core":"形容人辛苦地四处奔波","exs":["栉风沐雨、砥砺奋进。前进的道路少了磨难反倒是少了亮丽的风景，唯有经历磨难，才能不畏艰险。","在我国960多万平方公里的广袤大地上，红色资源星罗棋布，一处处革命旧址、一座座革命纪念馆、一件件革命文物，记录和见证了我们党团结带领人民栉风沐雨、接续奋斗的红色往事，凝聚和展现了中国共产党人抱定初心、忠贞不渝的红色精神。","满院字迹中，我们看到一位栉风沐雨的农民，在大地上勤劳耕耘；看到一个热爱生活的老人，留心记录平凡日子里的幸福；看到一名操碎了心的父亲，唠唠叨叨里满是对子女的深情。"]},{"id":217,"w":"风餐露宿","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"在风中吃饭，在露天住宿。形容旅途中的辛苦劳累。","core":"形容旅途中的辛苦劳累","exs":["该团官兵担负国防通信光缆施工任务，常年身处荒漠戈壁、深山密林，部队分散流动，生活保障是个难题，官兵风餐露宿是常态。","三年来，每年用工高峰时达2000余人，他们从四方汇集而来，不惧艰苦、风餐露宿，面对恶劣的劳作环境，一锹锹、一镐镐，硬是将山川变了个样。面对万千株随风摇曳的绿苗，不由得让人肃然起敬。","作为国内知名的大型建筑央企，工作的性质决定着中铁四局的工程人风餐露宿、四海为家。许多年轻人主动推迟婚期，奋战在国家重点工程建设一线，奉献了青春的智慧和汗水。"]},{"id":218,"w":"筚路蓝缕","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"筚路：柴车。蓝缕：又旧又破的衣服。意思是驾着柴车穿着破旧衣服去开辟山林。现用来形容创业的艰难与辛苦。也作“荜路蓝缕”。（词义有拓展，也可形容事情发展的初期阶段）","core":"意思是驾着柴车穿着破旧衣服去开辟山林","exs":["随着“洋机器”的进入，才出现了第一代荜路蓝缕的企业家，他们推动着中国进入现代文明的序列。","人类从洪荒的远古走来，向着希望的明天走去，昨天与今天，看似短暂，但人类在其间荜路蓝缕、上下求索，又是何等漫长与艰辛。","台湾是经过一代代中国人筚路蓝缕辛勤开发，才有今天的建设成就。赖清德为了其“台独”妄想，企图泯灭岛内青少年和民众的中华民族意识，把荷兰殖民者抢占台湾的1624年，当作“开启台湾全球化的开端”。"]},{"id":219,"w":"披星戴月","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"身披星光，头顶月色。形容早出晚归或连夜赶路。也作“戴月披星”。","core":"形容早出晚归或连夜赶路","exs":["北京建工养护集团八公路处工程部部长温冬梅介绍，洪水退后，抢修队伍披星戴月施工，人歇设备不歇。","《大漠春归》以习近平生态文明思想和习近平文化思想为指引，讲述了在党中央作出“在西北、华北、东北地区建设防护林体系重大战略决策”背景下，时任和林格尔县县长的云福祥带领当地群众披星戴月、战天斗地，将昔日黄沙漫漫、寸草不生的12万亩沙地变成绿洲的故事。","和大多数新警察一样，张洋川最初的梦想是当一名刑警，“为破案绞尽脑汁，为抓捕披星戴月”。在巡警（防暴）大队5年后，张洋川如愿以偿去了光荣派出所任刑警。当时的张洋川只有20多岁，血气方刚。"]},{"id":220,"w":"摩顶放踵","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"意思是从头顶到脚跟都擦伤了；形容不辞劳苦，不顾身体。","core":"意思是从头顶到脚跟都擦伤了","exs":["如今，这位94岁的老人仍然坚持给每年新入校的博士生上课，并亲自带博士生。从1984年招收第一位博士生，至今40年，摩顶放踵培养人才，从未间断。","判若霄壤的历史嬗变背后，是一代代国人摩顶放踵、胼手胝足铸就的两个大字：奋斗！","墨家代表人物墨翟，他主张“兼爱非攻”，认为攻掠他国的战争是最大的不义行为，应该挺身而出坚决抵制。为此他不惜摩顶放踵，长途跋涉“行十日十夜而至于郢”，完成“止楚攻宋”伟大壮举。他既深入浅出讲“非攻”的道理，又付诸行动伸张正义，即使牺牲性命也在所不惜。"]},{"id":221,"w":"胼手胝足","part":"c","gn":"十八","gt":"工作学习状态","sub":"辛苦奔波","type":"four","expl":"意思是手脚生茧。形容劳动十分辛勤。","core":"意思是手脚生茧","exs":["哺育万物的土地，胼手胝足的农民，在习近平总书记心中有着沉甸甸的分量：“我们党成立以后就一直把依靠农民、为亿万农民谋幸福作为重要使命。”","放眼齐鲁大地，正是无数党员干部、经营主体、基层群众扎根于各个领域，奋斗在各条战线，胼手胝足、砥砺奋进，靠勤劳智慧的双手、稳扎稳打的精神、拼搏进取的干劲，才打开了山东发展的崭新面貌。","哥德巴赫猜想具有极强的逻辑性和极为缜密的推算过程，无法用电子计算机（当时陈景润也没有此种设备），陈景润仅靠一双手，一支笔，胼手胝足，终成大业，何其不易。"]},{"id":222,"w":"孜孜不倦","part":"c","gn":"十八","gt":"工作学习状态","sub":"勤勉不懈怠","type":"four","expl":"孜孜：勤奋的样子。形容勤奋、不知疲倦。","core":"形容勤奋、不知疲倦","exs":["希望两位院士孜孜不倦投身科研，准确把握攻关方向，深入谋划科研项目，广泛培养专业人才，推动科研创新水平不断提升。","通过建立青少年江南丝竹团队，挖掘和整理新泾地区江南丝竹曲目，开展江南丝竹曲目配器，一系列孜孜不倦地探索为新泾镇的江南丝竹注入新的活力和生机，让江南丝竹在新泾镇重新绽放出夺目光彩。","经过1年9个月孜孜不倦地努力，国内首个全铝合金副车架在齐嵩宇手中诞生。如今，一汽自主品牌全系列车型都安装着这种车架。“较之钢质副车架，全铝合金副车架减重40%，整车减重16公斤。”"]},{"id":223,"w":"孜孜以求","part":"c","gn":"十八","gt":"工作学习状态","sub":"勤勉不懈怠","type":"four","expl":"孜孜：勤勉的样子。意思是不知疲倦地探求。","core":"意思是不知疲倦地探求","exs":["建设现代化强国、实现中华民族伟大复兴，是中国共产党人孜孜以求的宏伟目标，凝结着毛泽东同志等老一辈革命家的毕生心血。","走在前，是习近平总书记对山东一以贯之的殷切期望，是亿万齐鲁儿女孜孜以求的奋斗目标。党的十八大以来，总书记多次亲临山东视察，作出重要指示批示，为山东发展精准把脉、定向引航。","为民初心、情暖万家，共创美好人民对美好生活的向往，是成都银行孜孜以求的努力方向。2023年成都银行通过数字金融赋能，强化适老化服务改造，提升客户体验，进一步巩固了其“市民银行”的地位。"]},{"id":224,"w":"条分缕析","part":"c","gn":"十九","gt":"正确做法","sub":"分析问题","type":"four","expl":"缕：线。一条条分析。形容分析得有条理，很细致。","core":"形容分析得有条理，很细致","exs":["越是面对复杂多变的社会环境，越应该注重身教重于言传、具体强于抽象，教育引导、舆论宣传、文化熏陶、实践养成、制度保障都应该条分缕析，在现实针对性上做足功夫。","为厘清史实，年逾古稀的作者历时5年，搜集了2000多万字的资料，仔细爬梳整理，并且努力在写作中做到条分缕析、详略得当。","作者对新时代治国理政丰富宝藏深稽博考、取精用弘，既有宏观勾勒架构，也有细节深入浅出分析，学理上条分缕析、抽丝剥茧，深入解答新时代十年伟大变革的成功奥秘。"]},{"id":225,"w":"抽丝剥茧","part":"c","gn":"十九","gt":"正确做法","sub":"分析问题","type":"four","expl":"意思是丝得一根一根地抽，茧得一层一层地剥；形容分析事物极为细致，而且一步一步很有层次。","core":"意思是丝得一根一根地抽，茧得一层一层地剥","exs":["从事纪检监察工作10多年来，罗功新一直在反腐败斗争第一线，面对重大疑难案件，他总能从纷乱如麻的线索中抽丝剥茧，找到案件的突破口。","条分缕析，寻找蛛丝马迹；抽丝剥茧，查找火灾根源。","抽丝剥茧理清事实，精准适用法律，这是黄登魁办理行政诉讼案件的缩影。"]},{"id":226,"w":"深入浅出","part":"c","gn":"十九","gt":"正确做法","sub":"分析问题","type":"four","expl":"指讲话或文章的内容深刻，语言文字却浅显易懂。","core":"指讲话或文章的内容深刻，语言文字却浅显易懂","exs":["这篇文章立论新颖，行文却深入浅出，明白易懂。","作者把一些严肃重大的话题用漫谈的方式铺展开来，深入浅出，把深邃的思想、深刻的道理讲述得通俗易懂、娓娓动听。","只有坚持理论为基、内容为王，以理服人、以情动人，以更深入的理论阐释、更前沿的知识传授、更深层的价值引导，把深刻的思想讲得深入浅出，把宏大的理论讲得有滋有味。"]},{"id":227,"w":"纲举目张","part":"c","gn":"十九","gt":"正确做法","sub":"抓住问题关键","type":"four","expl":"指提起大网的总绳一撒，所有的网眼就都张开。比喻抓住事物的主要环节，就可带动一切。","core":"指提起大网的总绳一撒，所有的网眼就都张开","exs":["在中央经济工作会议上，习近平总书记强调：“明年经济工作千头万绪，要从战略全局出发，抓主要矛盾，从改善社会心理预期、提振发展信心入手，抓住重大关键环节，纲举目张做好工作。”","推进经济体制改革要从现实需要出发，从最紧迫的事情抓起，在解决实践问题中深化理论创新、推进制度创新。其他领域改革也要聚焦全局性、战略性问题谋划改革举措，实现纲举目张。","政治纪律作为管方向、管立场、管根本的要求，对党组织和党员起着根本引领作用，对其他纪律起着统领提携、纲举目张的作用，决定着党的纪律的效力和效能。"]},{"id":228,"w":"提纲挈领","part":"c","gn":"十九","gt":"正确做法","sub":"抓住问题关键","type":"four","expl":"意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达。","core":"意思是抓住事物的关键部分或者核心要点，然后用简洁明了的方式进行概述或表达","exs":["面对错综复杂的矛盾问题，要善于抓住主要矛盾，做到提纲挈领，才能精准聚焦、迎刃而解。","鲁迅从理论的高度和艺术史的发展链条上，最早对中国的版画给出了提纲挈领的意见。","一般而言，鸿篇巨制如《光荣与梦想》，会有一个“提纲挈领”的宏大开端。"]},{"id":229,"w":"以一持万","part":"c","gn":"十九","gt":"正确做法","sub":"抓住问题关键","type":"four","expl":"用来形容抓住了关键的环节或因素，从而能够控制和影响整个局面。它强调的是在处理问题时识别并把握住核心部分的重要性，以此来驾驭复杂的情况或者广泛的领域。","core":"用来形容抓住了关键的环节或因素，从而能够控制和影响整个局面","exs":["改革，如秉轴持钧，以一持万。深入基层沉到一线，以实际调研筑牢工作基础，将成为各地公安机关下一步推动人员职能整合、业务工作融合、机制流程衔接的发力点。","荀子培养人的理想目标是“圣人”“大儒”，“大儒”不仅知识渊博，而且能“以浅持博，以古持今，以一持万”，是能实现“法后王，统礼义，一制度”的“圣人”。","千头万绪，以一持万。"]},{"id":230,"w":"博采众长","part":"c","gn":"十九","gt":"正确做法","sub":"向他人学习","type":"four","expl":"博采：广泛搜集采纳。从多方面吸取各家的长处。","core":"广泛搜集采纳","exs":["搞科学研究，也需博采众长。","在兼容并蓄、博采众长的过程中，还要把握好借鉴与自立、开放与自主的辩证关系，实现“不忘本来”与“吸收外来”相结合。","各县（市、区）要认真总结创城经验，博采众长、补己之短，实现创建文明城市工作实现大突破，见到新气象。"]},{"id":231,"w":"见贤思齐","part":"c","gn":"十九","gt":"正确做法","sub":"向他人学习","type":"four","expl":"指见到有才德的人就想着与他齐平。","core":"指见到有才德的人就想着与他齐平","exs":["社会主义核心价值观“十进”活动和“文明城市复审”，催生出25890户“文明家庭”、43562户“星级文明户”，涌现了石丽平、刘仁平、姚少军、杨正文、李春学等23名身边好人，使人人见贤思齐、户户崇德向善。","以榜样的作用和力量，让向善向美向上的道德风尚潜移默化，让见贤思齐成为一种社会常态和精神自觉，才能让良好的政治生态成为社会进步的不竭之源。","大家一致认为，党员干部要不忘初心、牢记使命，见贤思齐、当好先锋，为全面建设社会主义现代化河南、谱写新时代中原更加出彩的绚丽篇章不懈奋斗。"]},{"id":232,"w":"量力而行","part":"c","gn":"十九","gt":"正确做法","sub":"踏实的做法","type":"four","expl":"意思是指根据自身的实际能力和条件来决定行动的范围，做事不要超过自己的能力范围，以免出现意外问题。","core":"意思是指根据自身的实际能力和条件来决定行动的范围，做事不要超过自己的能力范围，以免出现意…","exs":["尽力而为也要量力而行，这就要求我们在推进共同富裕过程中必须具备充分考虑发展实际的科学精神。","各地确定年度改造计划应从当地实际出发，尽力而为、量力而行，不层层下指标，不搞“一刀切”。","面向未来，始终坚持以人民为中心的发展思想，既尽力而为、积极回应群众所需，又量力而行、充分尊重客观规律，不懈奋斗、永远奋斗，我们就一定能逐步实现全体人民共同富裕，创造新的更大奇迹。"]},{"id":233,"w":"厚积薄发","part":"c","gn":"十九","gt":"正确做法","sub":"踏实的做法","type":"four","expl":"厚积：充分积累。薄发：少量地慢慢地释放。形容积累丰富的学问而不轻易表现出来。","core":"形容积累丰富的学问而不轻易表现出来","exs":["从百年奋斗史中总结成功经验，坚定信念，确保在未来的日子里厚积薄发，永葆党的生机活力、团结带领全国各族人民实现中华民族伟大复兴的中国梦。","前4个年头毛竹并不急着向上生长，而是拼命地向下扎根，方能为后面的快速生长提供充足养分，正可谓“厚积薄发”。","通过“巧方法”形成鼓励、支持创新的良好氛围，集聚各方面的创新资源，才能厚积薄发、掌握主动。"]},{"id":234,"w":"脚踏实地","part":"c","gn":"十九","gt":"正确做法","sub":"踏实的做法","type":"four","expl":"原意是脚踏在坚实的土地上，比喻做事踏实、认真、稳重，不浮夸、不好高骛远。","core":"原意是脚踏在坚实的土地上，比喻做事踏实、认真、稳重，不浮夸、不好高骛远","exs":["地方党委在谋发展保安全上责无旁贷，要脚踏实地、真抓实干。","脚踏实地，不要好高骛远，珍惜当下的每一个瞬间，珍惜年轻时的每一段时光。这不仅是我对广大青年的希望，同时也是激励我自己，我们一起共勉。","新征程上，广大劳动群众要脚踏实地、奋发进取，用创造拥抱新时代，以奋斗铸就新辉煌。"]},{"id":235,"w":"返璞归真","part":"c","gn":"十九","gt":"正确做法","sub":"踏实的做法","type":"four","expl":"璞：未经雕琢的玉。去掉外在的修饰，回归到本真、朴素的状态。","core":"未经雕琢的玉","exs":["抓作风建设，就要返璞归真、固本培元，重点突出坚定理想信念、践行根本宗旨、加强道德修养。","从大拆大建到绣花功夫，从人工建造到崇尚原生态，返璞归真的背后，是城市发展逻辑的变化——不是单一指标的突飞猛进，而是经济和人文深度融合、人与自然和谐相处的综合效能。","深入推进作风建设，必须把加强党性修养作为关键之举和重要一环，返璞归真、固本培元，重点突出坚定理想信念、践行根本宗旨、加强道德修养，从思想根源上解决问题，为推动党的作风持续向好打基础增动力。"]},{"id":236,"w":"行稳致远","part":"c","gn":"十九","gt":"正确做法","sub":"踏实的做法","type":"four","expl":"指行进平稳才能达到长远的目标。比喻脚踏实地、稳扎稳打做事，才能走得长远。","core":"指行进平稳才能达到长远的目标","exs":["党中央决定，在全党开展树立和践行正确政绩观学习教育，这是今年党的建设的重要任务。悟其理，行其道，方能一往无前、行稳致远。","要建成高标准、高水平自由贸易港，海南仍需在破局攻坚中夯实高质量发展根基，推动自贸港建设行稳致远。","让我们锚定目标任务，结合实际、因地制宜，以龙马精神策马扬鞭，推动中国经济行稳致远。"]},{"id":237,"w":"当仁不让","part":"c","gn":"十九","gt":"正确做法","sub":"勇于承担责任义务","type":"four","expl":"当：面对。仁：符合道义的事。后指遇到应该做的事，勇于承当，不推诿。（侧重情理上）","core":"后指遇到应该做的事，勇于承当，不推诿","exs":["为战而生、向战而行，汉中舰赓续着“英雄快艇”的红色血脉，急难险重任务面前打头阵、当先锋，以当仁不让、舍我其谁的担当，在转型备战中勇立时代潮头。","陶瓷文化的传承和创新，今天的陶瓷人重担在肩、当仁不让，希望有更多朋友关注并参与进来。","2020年新冠疫情暴发，作为一名医学专业留学生，他目睹江苏大学医学专业学生，自己平日里朝夕相处的同窗们，当仁不让，星夜驰援奔赴多地开展核酸检测。"]},{"id":238,"w":"义不容辞","part":"c","gn":"十九","gt":"正确做法","sub":"勇于承担责任义务","type":"four","expl":"义：道义。辞：推辞。道义上不容许推辞。指理应接受。（侧重良心、道义上）","core":"指理应接受","exs":["钟南山认为自己只是一个医生，须对人民的生命安全负责，他的出声是义不容辞的。","呼伦贝尔作为国家重要农畜产品生产基地，提升农牧业综合生产能力，保障国家粮食安全是我们义不容辞的责任。","提升中国的国际话语权，当代中国青年义不容辞。"]},{"id":239,"w":"责无旁贷","part":"c","gn":"十九","gt":"正确做法","sub":"勇于承担责任义务","type":"four","expl":"责：责任。贷：推卸。指自己应尽的责任，不能推给别人。（侧重责任、职责上）","core":"指自己应尽的责任，不能推给别人","exs":["作为邮件运送的起点，企业在保证邮件安全方面，可谓责无旁贷。","优化消费环境对于激发消费活力、释放消费潜能至关重要，企业在切实保护消费者权益、更好满足人民群众美好生活需要方面责无旁贷。","这要求我们要始终高度重视节约粮食，节约粮食每一个人都责无旁贷，必须从餐桌抓起，从每一份外卖抓起，让节约粮食在全社会蔚然成风。"]},{"id":240,"w":"过犹不及","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"过：过分。不及：不够。事情做得过了头，就跟做得不够一样，都不合适。","core":"过分","exs":["偶尔、适量的召回，可被看作车企责任感的体现。然而，过犹不及，如若因为有召回制度的存在，便放松对于质量的要求，将召回当饭吃、当枪使，则绝非一个负责任的车企该有的态度。","凡事过犹不及，宣传“用力过猛”，不仅容易让受众审美疲劳、产生抵触情绪，也会过于拉高游客的期待值，产生“货不对板”的印象。","要想使工作中多些“精准滴灌”，少些“大水漫灌”；多些“恰如其分”，少些“过犹不及”，就必须在精准把脉问题症结上下功夫，把情况摸清、把问题找准、把对策提实。"]},{"id":241,"w":"矫枉过正","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"矫枉：矫正弯曲。指纠正偏失错误，超过了应有的限度。","core":"指纠正偏失错误，超过了应有的限度","exs":["对于经济连续下行的走势，不必惊恐悲观，宏观政策既要加强预调微调，也要防止用力过猛，矫枉过正。","跨周期调节是指在较长的期限内，通过宏观调控减少经济顺周期风险累积，防止“政府之手”矫枉过正，为暂时利益而牺牲长远利益。","家长切不可粗暴地制止孩子，以免矫枉过正，打击孩子发展表达能力的积极性。"]},{"id":242,"w":"于事无补","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"指某种言行对于解决问题没有帮助。","core":"指某种言行对于解决问题没有帮助","exs":["一些企业经常提及追赶“新赛道”，什么火就转做什么，认为只有追赶新风口，业绩才能起飞；如果赛道老旧，那么企业再努力也于事无补。","倘若不能对问题一个一个彻底整改、一条一条逐个销号，即便列出再长、再详细的问题清单，也无异于只“诊脉”不“开方”、只“填病历”不“除病灶”，本末倒置，于事无补。","直至今年初，岛内陷入“史上最长蛋荒”，民进党当局才突然宣布“专案进口鸡蛋”，然而此举非但于事无补，反倒惹出更多祸端。"]},{"id":243,"w":"作茧自缚","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"蚕吐丝作茧，把自己包在里面。比喻自己束缚了自己或使自己陷入困境。","core":"比喻自己束缚了自己或使自己陷入困境","exs":["全球化时代，人才的跨国流动推动了全球范围内科技和经济进步，盲目上演自我封闭、仇恨、排外的闹剧，无异于作茧自缚。","因为莫名的安全焦虑而打压别国、阻断合作、阻碍发展，动不动就“砌墙”，无法让一个国家或地区的产业壮大变强，只会作茧自缚，自绝于全球化的进步大潮。","在信息爆炸、思想多元、交融紧密的当今时代，封闭和对抗只会作茧自缚，只有胸怀世界、顺势而为才能乘上大变革、大发展的时代潮流。"]},{"id":244,"w":"扬汤止沸","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"把开水从锅中舀出来，再倒回去，以阻止锅中的水沸腾。比喻不能解决根本问题的做法。","core":"比喻不能解决根本问题的做法","exs":["“大病提取住房公积金”此种做法只是一种扬汤止沸的应急之策，而无益于从根本上解决问题。","制度层面看似瞄准公平，然而依据既往经验，此类计划执行起来无异于扬汤止沸，难免漏洞百出。","与其扬汤止沸不如釜底抽薪，必须坚决摒弃杀鸡取卵、竭泽而渔的发展方式和生活方式，把绿色发展方式和生活方式作为根本之策，从源头上解决生态环境问题。"]},{"id":245,"w":"隔靴搔痒","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"比喻说话、做事、写文章不中肯，没有抓住关键。","core":"比喻说话、做事、写文章不中肯，没有抓住关键","exs":["对此，有家长直呼大快人心，也有家长持悲观态度，指称在现行高考、中考制度没有根本性改变的前提下，任何给学生减负的举措都只能是“隔靴搔痒”。","虽然这是美国近30年首次就控枪立法，但外界普遍认为这是“隔靴搔痒”，无法从根本上解决美国枪支暴力问题。","全党正在深入开展学习贯彻习近平新时代中国特色社会主义思想主题教育，要把开好专题民主生活会作为主题教育检视整改工作的一个重要载体，以及确保主题教育成效的一项重要举措，切实防止形式主义，防止蜻蜓点水、隔靴搔痒。"]},{"id":246,"w":"临渊羡鱼","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"比喻有欲望想得到某种东西，但却没有实际行动。","core":"比喻有欲望想得到某种东西，但却没有实际行动","exs":["临渊羡鱼，不如退而结网。做好招商、安商、稳商工作，打造一流的营商环境是重中之重。要大力加强诚信建设，打造高效透明政务流程，让政策兑现有力度、服务企业有温度，增强招商引资区域竞争力。","临渊羡鱼，不如退而结网。2022年4月，卷包车间提出“嵌入式”人才培育理念，将后备青年人才分为积极分子、培养对象、预备人选三个阶段，实现“进阶”培养。"]},{"id":247,"w":"有恃无恐","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"因有所依仗而毫不害怕。","core":"因有所依仗而毫不害怕","exs":["这个过程，普通用户难以察觉，维权举证困难，在违法成本低的情况下，当顶格罚款远不及违法违规的营收所得，企业自然有恃无恐。","过去两年的事实足以证明，菲律宾将更加有恃无恐，继续走上危险的道路，威胁地区和平与稳定。对日本而言，与菲律宾的防务协定是日本在亚洲签署的首个此类协定，这一事实本身就令人警觉。","一些中介机构的不规范行为，给租户造成财务或者时间成本的损失，但是维权成本却不低，所以很多人只能无奈选择忍让，这让一些中介更加有恃无恐。"]},{"id":248,"w":"堂而皇之","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"形容公然而毫不掩饰（多含贬义），强调表面上的正当性或气势宏大，可能隐含虚伪或掩饰。","core":"形容公然而毫不掩饰（多含贬义），强调表面上的正当性或气势宏大，可能隐含虚伪或掩饰","exs":["象棋职业化改革不能总是停留在浅水区，任由商品交换原则堂而皇之遍布全行业、破坏起码的赛事公平。越是推进职业化改革，越需要筑牢制度防火墙，绝不能任由商品交换那一套搬到赛事竞技中来。","在养殖场内，犯罪团伙通过伪造猴牌、伪造繁殖档案等手段，“洗白”野生猕猴身份后，再披着所谓合法外衣，堂而皇之地出售。问题三：监管漏洞出在哪里？跨省作案、多次作案，是上述案件中犯罪团伙的显著特征。","湖南省宁远县纪委监委第七纪检监察室主任肖云辉介绍，有群众反映，有些公租房长期被一些公职人员占用，有的长期空置，有的甚至堂而皇之发布出租信息。按照群众提供的线索，该县纪委监委工作人员迅速开展调查核实。"]},{"id":249,"w":"明目张胆","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"强调公开、毫无顾忌地做坏事，带有明显的贬义。","core":"强调公开、毫无顾忌地做坏事，带有明显的贬义","exs":["发言人指出，黎智英作为反中乱港事件主要策划者和煽动者，甘当美“以港遏华”马前卒，明目张胆勾结外部势力危害国家安全，铁证如山。","这场力度空前的整治最初来源于群众举报，反映在某项目招投标过程中，几名评审专家收受了中标企业好处，甚至在评标现场明目张胆地违规沟通。赤峰市纪委监委调取当天评标现场录像，发现果然存在举报反映的情况。","针对美国商务部以“侵犯人权”为由将两家中国高科技企业列入“实体清单”，外交部发言人毛宁11日在例行记者会上表示，所谓制裁是明目张胆打着人权的幌子打压中国高科技企业。"]},{"id":250,"w":"浑水摸鱼","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"趁水浑浊抓鱼。指先在敌人或者对手内部制造混乱，然后乘其混乱之际，获取利益。","core":"指先在敌人或者对手内部制造混乱，然后乘其混乱之际，获取利益","exs":["由于平台内容审核能力参差不齐、部分账号实名制落实不严、监管机制尚未完全跟上，一些不法分子浑水摸鱼，将传统骗局搬进直播间，以虚假人设博取信任，进而实施诱导消费、虚假宣传甚至诈骗犯罪，严重扰乱网络秩序，侵害消费者合法权益。","由于多种原因，有的小区从未公示过收益明细，有的公示栏贴着几年前的旧账，一些物业公司甚至浑水摸鱼、擅自处置或私自挪用公共收益。","假冒新闻事件当事人浑水摸鱼，高仿甚至冒充名人开设账号混淆视听……类似假冒仿冒账号成了网络空间“牛皮癣”，让不少网民不堪其扰。"]},{"id":251,"w":"虚张声势","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"假装强大的声势来吓唬人。形容虚假夸张地造势。","core":"形容虚假夸张地造势","exs":["与“作秀”者的虚张声势不同，勇于作为者心系党的事业和军队建设，在工作中能够坚持求真务实、真抓实干。","领导干部是党和国家事业发展的“关键少数”，掌握着定政策、作决策、抓落实等各项权力，在重大事项、人事任用、资源配置等方面拥有较大话语权、决策权，一旦失去有效监督和约束，各项制度在权力的影响下很容易变成虚张声势的“稻草人”、只照别人的“手电筒”、任意拉扯的“橡皮筋”。","要坚决杜绝形式主义，不搞虚张声势的假动作，不做简单粗暴的大动作，多在实效上用功、少在形式上费劲。"]},{"id":252,"w":"落井下石","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"有人掉进井里，不但不救，反而往井里扔石头。比喻趁人有难时加以陷害或打击。","core":"比喻趁人有难时加以陷害或打击","exs":["为什么年轻人也开始长斑块？“高果糖浆（奶茶）+高反式脂肪酸（外卖）”的组合，使日均血脂负荷超中老年人。隐形盐陷阱更是落井下石，预包装食品中的钠含量，让许多年轻人每日摄盐量超标。","善良的人总是会在你难堪时，给予适时的鼓励和赞美，而不是落井下石。","绝不要在人落魄的时候落井下石，因为你也会落魄；绝不要在人衰老之时轻蔑伤害，因为你迟早要进入老年。"]},{"id":253,"w":"投机取巧","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"指利用时机和不正当手段谋取利益，不走正道。","core":"指利用时机和不正当手段谋取利益，不走正道","exs":["企业需坚守诚信经营底线，摒弃投机取巧心态，真正将重心放在产品研发上，聚焦用户需求打磨产品、提升智能化水平，以过硬品质赢得市场认可。","现实中，反观一些落马官员，因为投机取巧、攀附钻营而丢了本色、失了本分，最终身败名裂、自尝苦果。","现实中，有的党员干部政绩观出现偏差，为了树立个人形象、达到个人目的，通过投机取巧甚至弄虚作假，一心想弄点大动静引起领导关注。"]},{"id":254,"w":"以偏概全","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"用片面的情况去概括整体，得出错误的结论。","core":"用片面的情况去概括整体，得出错误的结论","exs":["创新发展、协调发展、绿色发展、开放发展、共享发展，在工作中都要予以关注，使之协同发力、形成合力，不能畸轻畸重，不能以偏概全。","某些西方媒体执意以偏概全，它们可以基于单一指标或局部现象，直接推导出“中国经济低迷已成常态”的结论，却对中国制造业转型升级、新旧动能持续转换以及科技创新能力加速提升等积极因素视而不见。","劣质科普往往夸大其词、以偏概全、缺乏科学依据。"]},{"id":255,"w":"吹毛求疵","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"疵：小毛病。吹开皮上的毛，寻找里面的小毛病。比喻刻意挑剔别人或事物的细小缺点。","core":"比喻刻意挑剔别人或事物的细小缺点","exs":["让部分问题分析不透、措施不实的研究成果“回炉”。这不是吹毛求疵，而是对战斗力负责。","人都有缺点，夫妻之间由于是近距离的接触，更能发现错误和缺点，因此作为夫妻更应有一颗宽容大度的心，能正确和理性地看待对方身上的缺点和所犯的错误，既不吹毛求疵，也不无原则地纵容。","不做“挂名过客”，不搞吹毛求疵，把全部心思和精力聚焦到解决真问题、真解决问题上。"]},{"id":256,"w":"抱薪救火","part":"c","gn":"二十","gt":"错误做法","sub":"错误做法","type":"four","expl":"薪：柴草。怀抱柴草去救火。比喻以错误的方式消灭祸患，反而使祸患加重。","core":"比喻以错误的方式消灭祸患，反而使祸患加重","exs":["个别国家大搞关税壁垒、脱钩断链，无异于抱薪救火，最终将反噬其身。","历史经验一再证明，制裁解决不了问题，反而是“抱薪救火”，只会激化新的矛盾。","纵观近代以来的历史，传统国际关系理论固守西方中心主义，信奉“弱肉强食”“赢者通吃”，迷信“丛林法则”“文明冲突”，面对一日千里的深刻变局拿不出破解老矛盾新问题的钥匙，甚至重蹈抱薪救火、饮鸩止渴的覆辙。"]},{"id":257,"w":"画地为牢","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"不能这样做","type":"four","expl":"牢：牢狱。在地上画个圈儿，作为牢狱。比喻局限在小圈子里活动。","core":"比喻局限在小圈子里活动","exs":["当前互联网巨头发展面临的集体问题：在疯狂追求“平台效应”和用户数量的盲目扩张中，为维护自身市场优势地位，正纷纷“画地为牢”，平台内自我导流，对竞争对手选择性屏蔽。这种行为正在动摇互联互通这一互联网的根本基石。","任何国家画地为牢、搞单边主义和保护主义，或者通过打压遏制别国现代化来维护自身发展“特权”，都将损害世界现代化进程。","习近平总书记强调：“在实践中，我们要注意防范一些认识误区”，其中之一是“各自为政、画地为牢，不关心建设全国统一的大市场、畅通全国大循环，只考虑建设本地区本区域小市场、搞自己的小循环”。"]},{"id":258,"w":"以邻为壑","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"不能这样做","type":"four","expl":"壑：深沟。意为把邻国当成排洪水的沟壑。后用来比喻把困难、灾祸推给别人。（多宏观语境，国家、城市、地区等）","core":"后用来比喻把困难、灾祸推给别人","exs":["全球化时代，以邻为壑的利己主义做法换不来独善其身，惟有秉持科学、理性和负责任的态度，加强国际合作，携手应对挑战。","但要看到，中国的产业政策并不违背市场规律，没有通过产业政策“以邻为壑”，排除别国竞争，也没有“拔苗助长”，盲目发展产业。","事实证明，以邻为壑的“逆全球化”做法不仅解决不了自身的沉疴痼疾，而且扰乱全球产业链供应链，阻碍世界经济健康发展，导致各国利益受到损害。"]},{"id":259,"w":"穿凿附会","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"不能这样做","type":"four","expl":"意思是把讲不通的或不相干的道理、事情硬扯在一起进行解释。","core":"意思是把讲不通的或不相干的道理、事情硬扯在一起进行解释","exs":["事实上，改革开放以来中国人道德出现滑坡的说法既不符合事实，也不符合辩证法，是以偏概全、穿凿附会的谬见。客观上说，互助友爱的风气是这个时代的主流，也是人们美好生活的重色。","然而，一些中医研究者过度沉浸于为中医科学性正名的焦虑，动辄移花接木、穿凿附会，用不相干的科学理论来解释中医，实则违背了科学精神和科学研究的规律。","为打压其他地方的发展权利和安全利益而堆砌故事穿凿附会，是明显为服务美国自身政治利益而创作的制成品。"]},{"id":260,"w":"亦步亦趋","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"不能这样做","type":"four","expl":"步：走。趋：快走。比喻因缺乏主见，任何事都模仿、追随他人。（侧重行动）","core":"比喻因缺乏主见，任何事都模仿、追随他人","exs":["没有一个民族和国家可以通过依赖外部力量、跟在他人后面亦步亦趋实现强大和振兴。","而那些跟在发达国家后面亦步亦趋、简单搞制度移植的国家，大都陷入发展困境。","中国学术必须立足中国实际才有生命力，跟在别人后面亦步亦趋，不仅难以形成中国特色哲学社会科学，而且解决不了中国的实际问题。"]},{"id":261,"w":"唯利是图","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"不能这样做","type":"four","expl":"唯：只有；图：图谋，追求。只要有利可图，什么事都干。","core":"只有","exs":["“以义取利，不唯利是图”是其中一个重要方面金融行业要树立正确的经营观，把“以义取利，不唯利是图”的实践要求真正落到实处，坚持在有效服务经济社会发展中创造价值和利润，实现社会效益和经济效益的统一。"]},{"id":262,"w":"隔岸观火","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"指站在对岸观望火灾；用来比喻对别人的急难不加救助，而采取看热闹的态度。","core":"指站在对岸观望火灾","exs":["作为二者的共同盟友，美军却选择隔岸观火，并表示由于安全局势过于恶化，停止美军在该地区的巡逻。","身处和平之际，也应学会设身处地，体谅他人战乱之苦，口下留德，对战争理性发言，切勿做隔岸观火的低俗看客。","美国挑拨俄乌之间的关系，本想只是“隔岸观火”，但其或许万万没想到还会“惹火上身”。"]},{"id":263,"w":"置身事外","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"置：安放。把自己放在事情之外。形容毫不关心。","core":"形容毫不关心","exs":["我们生活在一个紧密相连的世界中，各国之间的利益和命运紧密相连。没有哪个国家可以独善其身，也没有哪个国家可以在国际事务中置身事外。","但是，无论此次乌龙事件出于何种原因，购票平台显然都无法置身事外。倘若系统故意“跳票”，自然不必多言。","在同一片蓝天下生活，受同一方水土滋养，我们每个人都是生态环境的保护者、建设者、受益者，没有谁是局外人，也没有人能置身事外。"]},{"id":264,"w":"袖手旁观","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"袖手：把手揣在袖子里。比喻置身事外，既不过问，也不协助别人。（侧重从旁边看）","core":"比喻置身事外，既不过问，也不协助别人","exs":["绝不在朋友落难时袖手旁观，绝不在伸出援手时夹杂私利，这就是中国之义。","中方没有袖手旁观，没有拱火浇油，更没有从中渔利。我们所做的一切，都通往一个目标，就是为止战凝聚共识，为和谈铺路搭桥。","装修公司也要明白，用低价吸引眼球，再挖空心思加价，这种“把戏”并不高明，消费者不可能被牵着鼻子走，管理部门更不会袖手旁观。"]},{"id":265,"w":"作壁上观","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"原指双方交战，自己站在壁垒上旁观。后多比喻站在一旁看着，不动手帮助。","core":"原指双方交战，自己站在壁垒上旁观","exs":["维护国家安全没有“局外人”，国家安全面前你我都不能作壁上观。","在这种背景下，很多地方的文旅部门没有作壁上观，更不甘于“吃瓜”，这是好事。一定程度上说，卷也是履职，既是分内事，也回应了当地民众的关切。想方设法让当地文旅火起来，总胜过碌碌无为。","由此可看，面对那些侵权网暴商品，平台不能作壁上观，更不能任其热销而乐见其成。"]},{"id":266,"w":"坐收渔利","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"比喻利用别人的矛盾而从中获利。","core":"比喻利用别人的矛盾而从中获利","exs":["在欧洲因能源危机承受巨大压力的同时，美国却趁火打劫、坐收渔利，以高价向欧洲国家兜售能源。","一些西方政客近来在台湾问题上不断生事，企图搞“以台制华”，借制造台海紧张局势坐收渔利。","再以炒作明星八卦引发网民互相攻击为例，捕风捉影，无事生非，拉踩引战，让“饭圈”之间互相攻诘，坐收渔利，能不让人深恶痛绝？"]},{"id":267,"w":"坐享其成","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"近义辨析","type":"four","expl":"意思为自己不出力而享受别人取得的成果。","core":"意思为自己不出力而享受别人取得的成果","exs":["习近平总书记在许家冲村考察时强调，乡村振兴不是坐享其成，等不来、也送不来，要靠广大农民奋斗。","中国人民自古就明白，人世间从来没有坐享其成的好事，要幸福就要奋斗。","反之，没有劳动情怀、缺乏劳动锻炼，必然导致不想劳动、不会劳动，滋生坐享其成、贪图享乐等怠惰奢靡之风。"]},{"id":268,"w":"竭泽而渔","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"过度开发","type":"four","expl":"排尽湖中或池中的水捕鱼。比喻取利只顾眼前，不作长远打算。","core":"比喻取利只顾眼前，不作长远打算","exs":["短期来看，提高景区门票会带来更多的地方财政收入，但从长远来看这种“门票经济”无异于竭泽而渔，非但无法带动当地经济发展，甚至会严重影响中国旅游业的发展。","面对短视频领域乱象频发、某些人竭泽而渔、技术应用剑走偏锋，治理当“该出手时就出手”。","我们根据群众意见写了人民网三评“套娃会员”，指出“套娃会员”本质上是一种变相加价，竭泽而渔，旗帜鲜明地为消费者撑腰。"]},{"id":269,"w":"杀鸡取卵","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"过度开发","type":"four","expl":"卵：蛋。为了要得到蛋，不惜把鸡杀了。比喻贪图眼前微小的好处而损害长远的利益。","core":"比喻贪图眼前微小的好处而损害长远的利益","exs":["一面是整个社会的得不偿失，一面却是杀鸡取卵者赚得盆满钵溢，这样的怪象原因何在？","可见，商家为了追逐利益明知故犯的行为无异于“杀鸡取卵”，最终只会自食其果。","短期来看，利润得到了增长，长远来看，却是杀鸡取卵，透支用户信任。"]},{"id":270,"w":"寅吃卯粮","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"过度开发","type":"four","expl":"寅、卯：古代用于纪年等的十二地支中的两个，寅在卯之前。寅年吃了卯年的粮食。比喻经济困难，入不敷出。同“寅支卯粮”。（侧重由于有困难而提前预支）","core":"比喻经济困难，入不敷出","exs":["政府财政长期入不敷出局面是美国近半个世纪以来寅吃卯粮、开支无度恶习导致的结果，也是美国联邦政府债务不断积累膨胀的重要原因。","对各级地方政府来说，有多大财力办多大的事，决不能寅吃卯粮、透支未来，决不允许新增隐性债务上新项目、铺新摊子。","保护环境就是保护生产力，改善环境就是发展生产力，强调“保护生态环境就是保护自然价值和增值自然资本，就是保护经济社会发展潜力和后劲”在生态环境保护上，一定要树立大局观、长远观、整体观，不能因小失大、顾此失彼、寅吃卯粮。"]},{"id":271,"w":"饮鸩止渴","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"过度开发","type":"four","expl":"鸩：毒酒。比喻用有害的方法解决面临的困难，而不顾后果。","core":"比喻用有害的方法解决面临的困难，而不顾后果","exs":["当再一次为了稳增长重复扩张性政策的时候，我们不得不重申历史的教训：扩张性政策只能是饮鸩止渴。","有必要认识到，平台是流量的入口，蹭流量的行为看似可以造就短期“繁荣”，实则饮鸩止渴，加剧的是质疑与焦虑，伤害的是信任与黏性。","依赖美国和北约提供安全保护只能是饮鸩止渴，没有战略自主，欧洲只会是美国的“棋子”，而非平等的伙伴。"]},{"id":272,"w":"急功近利","part":"c","gn":"二十一","gt":"某些国家的错误做法","sub":"过度开发","type":"four","expl":"功：成功；近：眼前的。急于求成，贪图眼前的成效和利益。","core":"成功","exs":["习近平总书记着眼于推动金融高质量发展、建设金融强国，深刻阐明中国特色金融文化五个方面的实践要求，强调要做到“稳健审慎，不急功近利”。","要支持青年学者从事兴趣导向的基础研究，鼓励青年学者做有兴趣的研究，挑战科学难题，不要急功近利。","有的干部抓工作平时不上心、不用力，临近考察时拿出百般气力，忙忙碌碌赶场子、装样子，急功近利招项目、造数据，表演作秀、劳民伤财；有的干部坚守初心、始终如一，兢兢业业、任劳任怨，一步一个脚印谋发展、求突破，几十年如一日奋战在工作一线。"]},{"id":273,"w":"颠沛流离","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"生活不如意","type":"four","expl":"颠沛：跌倒，比喻困顿，受挫折。流离：流转离散。形容生活困苦，流落异乡，无安身之所。（可指人，也可指物）","core":"跌倒，比喻困顿，受挫折","exs":["《伯远帖》《中秋帖》《五牛图》《韩熙载夜宴图》等国宝级艺术品，都曾经颠沛流离，差一点流失海外，直到新中国成立后才顺利回归了祖国的怀抱。","在那段时间，整座城市被淹，学校停发奖学金。之后近一年，他都过着颠沛流离的生活，科研时断时续。","颠沛流离的生活，穷困潦倒的家庭状况，孩子无钱看病夭折的打击，身体饱受疾病的折磨，都没有摧垮马克思的意志，他始终不忘初衷，以顽强的意志走向自己的目标。"]},{"id":274,"w":"流离失所","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"生活不如意","type":"four","expl":"失所：失去安身之处。形容到处流浪，没有安身的地方。（多指因灾荒、战乱等导致的失去居所）","core":"形容到处流浪，没有安身的地方","exs":["强暴雨引发的洪水把也门部分地区房屋夷为平地，近2万户家庭流离失所，国际社会应行动起来进行紧急援助。","现如今我们身处和平年代，没有饥寒交迫，没有流离失所，身处和平年代的我们是幸福的，同样我们也是惶恐的，如何守护住这份幸福往往更加难。","2001年以来，美国在阿富汗、伊拉克、利比亚、叙利亚发动的战争和军事行动造成数十万人死亡，数百万人受伤，数千万人流离失所。"]},{"id":275,"w":"背井离乡","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"生活不如意","type":"four","expl":"背：离开。井：古制八家为井，这里指家宅。指被迫离开家乡，到外地求生。（也指主动离开家乡，到外地生活/工作）","core":"古制八家为井，这里指家宅","exs":["如今，不少老人为了帮忙碌的儿女、照顾年幼的孙辈，背井离乡来到子女工作的大城市。","随着世界人口数量急剧上升、全球气候变化以及各国发展的需求日益增加，造成全球水资源供应日趋紧张，到2030年，预计将有2400万到7亿人会因为缺水而背井离乡。","新市民背井离乡来到大城市打拼，创业就业的保障极为重要。"]},{"id":276,"w":"安居乐业","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"社会安定","type":"four","expl":"安：安定；乐：喜爱，愉快；业：职业。指安定愉快地生活和劳动。","core":"指安定愉快地生活和劳动","exs":["看到来自五湖四海的建设者在这里安居乐业，感到很高兴。城市不仅要有高度，更要有温度。我们的社会主义就是要走共同富裕的路子。外来务工人员来上海作贡献，同样是城市的主人。","各级党委和政府、各有关方面要认真贯彻落实党中央决策部署，再接再厉抓好灾后恢复重建，确保广大人民群众安居乐业、温暖过冬。","确保安全生产、维护社会安定、保障人民群众安居乐业是各级党委和政府必须承担好的重要责任。"]},{"id":277,"w":"海晏河清","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"社会安定","type":"four","expl":"晏：平静。黄河水清了，大海没有浪了。比喻天下太平。","core":"比喻天下太平","exs":["我们必须清醒认识到，腐败和反腐败较量还在激烈进行，并呈现出一些新的阶段性特征，防范形形色色的利益集团成伙作势、“围猎”腐蚀还任重道远，有效应对腐败手段隐形变异、翻新升级还任重道远，彻底铲除腐败滋生土壤、实现海晏河清还任重道远，清理系统性腐败、化解风险隐患还任重道远。","强化不敢腐的震慑，扎牢不能腐的笼子，增强不想腐的自觉，通过不懈努力换来海晏河清、朗朗乾坤。","前辈奋斗不止，为我们创造了海晏河清、国富民强的中国，历史篇章仍在进行，未来的华彩应交由吾辈书绘。"]},{"id":278,"w":"国泰民安","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"社会安定","type":"four","expl":"泰：太平。国家太平，人民生活安定。形容社会安定，人民生活幸福。","core":"形容社会安定，人民生活幸福","exs":["剪纸、年画及炕围画等传统美术类非遗象征着幸福、吉祥和长寿，表达了民众祈盼万事如意、国泰民安、民族团结等美好愿望，展现了人民群众对幸福美满生活的向往与追求。","此次庆典上，资深寨佬领头进行庄重神圣的祈福，为侗寨祈求平安、丰收和国泰民安。庆典现场，芦笙音乐悠扬响起，伴随着欢快的踩堂舞，表达了人们对丰收的喜悦和对自然恩赐的感激之情。","要想国泰民安、岁稔年丰，必须善于治水。“水利兴而后天下可平，外患可息，而教化可兴矣。”清初地理学家刘继庄说。"]},{"id":279,"w":"安土重迁","part":"c","gn":"二十二","gt":"国家安定与动荡","sub":"社会安定","type":"four","expl":"土：乡土；重：看得重，不轻易。安于本乡本土，不愿轻易迁移。","core":"乡土","exs":["年轻一代在外成家立业、辛勤打拼，父辈祖辈安土重迁、难离故土，老年人没有和子女共同居住生活，是时下许多家庭的现实情况。","土地供给人的生产的有限性，使得中国人很早就懂得知足、克己。土地本身的固定性，又决定了中国人的安土重迁，也形成了中国社会的“熟人社会”特质。","在当时社会条件下，针对农业社会安土重迁、家族纽带强等特点，国家与社会各司其职，有利于合理有效配置资源，提升社会治理效率。"]},{"id":280,"w":"休戚与共","part":"c","gn":"二十三","gt":"国际国内关系","sub":"同呼吸共命运","type":"four","expl":"休：欢乐，吉庆。戚：忧愁，悲哀。指忧喜祸福彼此共同承担。形容关系密切同甘共苦。","core":"指忧喜祸福彼此共同承担","exs":["新形势下，着眼两国人民的光明未来，中方愿同塔方一道努力，全面提升各领域合作水平，推动构建世代友好、休戚与共、互利共赢的中塔命运共同体。","世界各国从未像今天这样互通互联、彼此依存、休戚与共。要跟上时代发展潮流，就要摒弃冷战思维、零和博弈的旧思维、老框框，开创国际交往新格局。","习近平总书记强调：“向上向善的文化是一个国家、一个民族休戚与共、血脉相连的重要纽带。”"]},{"id":281,"w":"同气连枝","part":"c","gn":"二十三","gt":"国际国内关系","sub":"同呼吸共命运","type":"four","expl":"同气：同胞兄弟；连枝：比喻兄弟。比喻同胞兄弟姐妹，现引申为彼此的关系很密切。","core":"比喻兄弟","exs":["两岸同胞不仅血脉相连，在文化上更是同根同源、同气连枝。","汉、壮、瑶、苗等15个民族的居民群众在党组织的带领下，如石榴籽一样紧紧抱在一起，像榕树一样同气连枝，互嵌互融、亲如一家。","在达尔文革命之后，自然生命不再是一成不变的“受造物”，而是构成了一棵同气连枝、根脉相通的演化巨树。"]},{"id":282,"w":"同舟共济","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"济：渡过。同乘一条船过河。比喻齐心协力渡过困难。","core":"比喻齐心协力渡过困难","exs":["抓紧抓实抓细各项防控工作，需要进一步凝心聚力，激发同舟共济、共克时艰的磅礴力量。","新征程上，14亿多中国人心往一处想、劲往一处使，同舟共济、众志成城，就没有干不成的事、迈不过的坎。","抗御突如其来的灾难，我们又一次看到了一方有难、八方支援的感人场景，又一次看到了同舟共济、守望相助的家国情怀。"]},{"id":283,"w":"同心同德","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"思想统一，信念一致。形容大家团结一条心。","core":"形容大家团结一条心","exs":["坚持党的全面领导，同心同德共同奋斗，我们坚信，任何困难都阻挡不了中国人民实现梦想的步伐。","要坚守民族大义，站在历史正确的一边，同心同德为实现民族复兴而共同奋斗。","我们要把对党负责和对人民负责高度统一起来，坚持以党的旗帜为旗帜、以党的方向为方向、以党的意志为意志，始终做到在党言党、在党忧党、在党为党，任何时候都与党同心同德。"]},{"id":284,"w":"和衷共济","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"衷：内心。和衷：指同心。大家同心渡过江河。比喻同心协力，渡过难关。现也可比喻齐心协力。","core":"指同心","exs":["在灾难面前，总有一种力量让人感动。超强台风“威马逊”肆虐海南之时，琼岛儿女在风雨中互帮互助，社会各界和衷共济，谱写了一曲感人肺腑的守望相助之歌。","包括两岸同胞在内的所有中华儿女，要和衷共济、团结向前。","推进中国式现代化是一项前无古人的开创性事业，需要全体中华儿女和衷共济、共襄盛举。"]},{"id":285,"w":"水乳交融","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"水和乳汁融合在一起。比喻意气相投、感情融洽。（侧重融合）","core":"比喻意气相投、感情融洽","exs":["革命胜利来之不易，主要是党和人民水乳交融，党把人民利益放在第一位。","在这一新的文化生命体中，马克思主义和中华优秀传统文化是水乳交融的，我们既可以从中感悟到马克思主义的真理力量，也可以从中体悟到中华优秀传统文化的精髓要义。","此次杭州亚运会为我们生动地展现了体育与文化的水乳交融，不仅呈现了一场奋勇拼搏、万众欢腾的体育盛宴，更提供了一扇全面展示中国、沟通连接世界的文化交流之窗。"]},{"id":286,"w":"相濡以沫","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"濡：沾湿，浸润。沫：唾沫。意为泉水干涸，鱼用唾沫相互湿润。后比喻在困境中用微薄的力量相互帮助。","core":"后比喻在困境中用微薄的力量相互帮助","exs":["结婚二十载，他们相互扶持，相濡以沫，为自己打造了幸福的四口之家。","战士们表情严峻，但老人的话却让我鼻子发酸，眼泪差点儿掉出来。在令人绝望的灾难面前，相濡以沫的感情是那么温暖，那么浓烈。","如今，顾诵芬院士热情丝毫未减，他说“了解航空的进展，就是我的晚年之乐”；携手走过半个多世纪，顾诵芬院士和妻子江泽菲始终相互扶持、相濡以沫。"]},{"id":287,"w":"风清气正","part":"c","gn":"二十三","gt":"国际国内关系","sub":"融洽和谐","type":"four","expl":"指社会风气清新正派，环境整洁，没有污染和腐败。通常用来形容政治环境清明，社会治理健康。","core":"指社会风气清新正派，环境整洁，没有污染和腐败","exs":["通过营造风清气正、干事创业的良好政治生态，让党员干部在遵规守纪中勇闯改革“深水区”、敢啃发展“硬骨头”。","坚持以文养廉，贯彻落实“新时代廉洁文化建设三年行动计划”，涵养风清气正的良好生态。","“五一”假期，各地纪检监察机关紧盯“四风”老问题、新动向，打出监督检查、通报曝光、廉洁提醒等“组合拳”，进一步严明纪律规矩，推动党员干部带头抵制歪风邪气、弘扬新风正气，持续营造风清气正的节日氛围。"]},{"id":288,"w":"守望相助","part":"c","gn":"二十三","gt":"国际国内关系","sub":"和邻居的关系","type":"four","expl":"守：防守。望：瞭望。指彼此关照，互相帮助。","core":"指彼此关照，互相帮助","exs":["亿万人民同舟共济、守望相助，筑起一道抗击疫情的钢铁长城。","《风雨落坡岭》用电影手法记录了K396次列车被困滞留105个小时救援全程，坚守，逆行，挺身而出，守望相助，风雨落坡岭，情暖落坡岭，真实富有感染力促使作品在短视频平台实现了长视频的破圈传播。","2023中国正能量网络精品征集展播活动通过全媒体传播手段，大力弘扬昂扬向上、仁爱勇敢、守望相助的良好风尚，讴歌气象万千的魅力中国，用丰富多彩的精品力作，有力激励人、鼓舞人、引领人。"]},{"id":289,"w":"一衣带水","part":"c","gn":"二十三","gt":"国际国内关系","sub":"和邻居的关系","type":"four","expl":"原形容像一条衣带那样狭窄的河流。现比喻仅隔一水，极其邻近。","core":"原形容像一条衣带那样狭窄的河流","exs":["在大灾大难面前，两国能够携手并进，同舟共济，这正是一衣带水的邻邦情谊的真实体现，也是未来中日关系持续改善发展的重要基础。","一衣带水同心守“沪”，武汉爱心企业捐赠物资驰援上海。","东西协作对口帮扶甘肃的天津市、青岛市、厦门市、福州市，分别在会上“秀”东部援甘“一衣带水”的两地情缘，并表示下一步的结对帮扶还将升级加力。"]},{"id":290,"w":"唇齿相依","part":"c","gn":"二十三","gt":"国际国内关系","sub":"和邻居的关系","type":"four","expl":"嘴唇与牙齿互相依存。比喻关系极为密切。","core":"比喻关系极为密切","exs":["经济建设与国防建设是唇齿相依的两个方面。","粤港澳三地唇齿相依、血脉相连，历史底蕴深厚、中西文化荟萃，是我国最具发展活力的地区之一，也是独具文化特色的地区。","中国与中亚国家是唇齿相依、安危与共的命运共同体，在安全领域有着广泛的共同诉求和利益汇合点。建交以来，中国与中亚五国的安全合作成果斐然，成为彼此高水平互信的集中体现。"]},{"id":291,"w":"波诡云谲","part":"c","gn":"二十三","gt":"国际国内关系","sub":"世界局势","type":"four","expl":"好像云彩和水波那样，形态不可捉摸。","core":"好像云彩和水波那样，形态不可捉摸","exs":["双方你来我往、见招拆招：干扰与反干扰、侦察与反侦察、空袭与反空袭、机降与反机降、突击与反突击……没有了导演部一步步给定条件，战局陡然升级，变得波诡云谲。","没想到支撑宏大叙事的只是13个平均年龄28岁的“一大代表”，没想到熟悉的建党故事竟还有波诡云谲的国际视角，没想到建党历史有那么多惊心动魄的时刻。","外部市场环境波诡云谲，中国汽车的出路在哪里。"]},{"id":292,"w":"风云变幻","part":"c","gn":"二十三","gt":"国际国内关系","sub":"世界局势","type":"four","expl":"风、云：风和云，比喻变幻动荡的局势。变幻：变化不定。像风和云那样变化莫测。比喻局势多变或情况复杂。","core":"风和云，比喻变幻动荡的局势","exs":["中特关系历经半个世纪国际风云变幻的考验，为双方进一步深化各领域合作打下了坚实基础。","风光秀美的广袤国家，经历过反抗斗争、民生凋敝的苦难岁月；劳苦大众遭遇过内外交困的悲惨境遇，开展了抵御外敌、反抗压迫的英勇斗争，知识分子经历过苦闷和觉醒，勇于自我反思，极具生命张力；中国人民在历史激荡、风云变幻的中华大地上砥砺前行。","我们要从中获取智慧和启迪，树立对彼此的正确认知，把牢友好合作的大方向，推动中澳全面战略伙伴关系在国际风云变幻中不断乘风破浪、行稳致远。"]},{"id":293,"w":"纵横捭阖","part":"c","gn":"二十三","gt":"国际国内关系","sub":"世界局势","type":"four","expl":"纵横：用游说来联合。捭阖：开合。指在政治、外交上运用手段进行联合或分化。","core":"指在政治、外交上运用手段进行联合或分化","exs":["当今世界风云激荡，中国外交纵横捭阖。","从深入交流的双边会见，到纵横捭阖的多边外交，习近平主席向各方介绍党的二十大取得的重大成果和确定的中心任务，重点结合中国式现代化的五个特征，阐述中国发展的世界意义：中国14亿多人口实现现代化将给世界提供超大规模市场。","实控人能支配或实际支配上市公司行为，通过持股表决权优势或股权纵横捭阖。"]},{"id":294,"w":"貌合神离","part":"c","gn":"二十三","gt":"国际国内关系","sub":"世界局势","type":"four","expl":"指表面上关系很密切，实际上是两条心。","core":"指表面上关系很密切，实际上是两条心","exs":["统筹高质量发展和高水平安全，要科学把握两者关系，防止“两张皮”，避免“貌合神离”，让发展和安全互促共进。","许多矛盾在当下调解中“貌合神离”，尤其在家暴等类型案件处理中，极易引发后续二次纠纷，甚至引发“危机”。","文化和旅游不是“两张皮”，不能貌合神离，更不是简单“拉郎配”，要善于找到闪光点使其有机融合，实现“1+1＞2”的效果。"]},{"id":295,"w":"沆瀣一气","part":"c","gn":"二十三","gt":"国际国内关系","sub":"坏人坏事","type":"four","expl":"泛指臭味相投的人结合在一起。","core":"泛指臭味相投的人结合在一起","exs":["无论民进党当局怎样歪曲事实、颠倒黑白，都掩盖不了与“台独”分裂势力沆瀣一气的真实面目。","如果任凭不良商贩和失职市场管理方沆瀣一气，消费者受伤害，法律也会蒙羞，而当地的营商环境和公共形象也会受到影响。","然而，仍有一些消费者反映，个别票务平台和“黄牛”沆瀣一气，扰乱市场秩序，存在实名代拍现象，“秒光”等成为常态。"]},{"id":296,"w":"同流合污","part":"c","gn":"二十三","gt":"国际国内关系","sub":"坏人坏事","type":"four","expl":"原指言行与不良的习俗、世道相合。后指跟坏人一起干坏事。","core":"原指言行与不良的习俗、世道相合","exs":["各国在同美国开展安全合作的同时，应当以史为鉴、擦亮眼睛、明辨是非、吸取教训，不搞同流合污、为虎作伥那套，不走对抗较量、零和博弈老路，寻求和深化合作并进、互利共赢的最大公约数，让合作的互信之基、发展之路行稳致远。","中国是绝不会与霸权主义同流合污。","白鲢鱼查出禁用兽药，蜂蜜也“同流合污”，这样的结果太残酷！"]},{"id":297,"w":"因地制宜","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"有针对性","type":"four","expl":"根据不同地方的基本情况，制定相应的办法。","core":"根据不同地方的基本情况，制定相应的办法","exs":["发展农村商品经济必须因地制宜，多种办法，多种路子。","2022年以来，宜川—黄龙地区开展整体研究，深入分析两个地区成藏条件差异，因地制宜刻画不同层系有利区，针对马家沟组、山西组目标实施钻探。","衡水市提出，加快构建区域生态保护格局，全面构建城市蓄排平衡体系，提升污水收集处理能力，因地制宜将“+海绵”理念融入城市绿地、建筑、道路、广场、水系联通等新建改建项目中，整体提升城市对雨水的蓄滞、净化能力。"]},{"id":298,"w":"量体裁衣","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"有针对性","type":"four","expl":"按身材裁剪衣服。也比与按实际情况办事。","core":"按身材裁剪衣服","exs":["大企业是经济发展的顶梁柱，往往也存在着跨区域、多税种的复杂涉税诉求，这就更需要我们聚焦精细服务，做到量体裁衣。","围绕打造现代化区域中心城市，实现“首善之地”目标，呼和浩特市发展改革委出台《2024年支持呼和浩特市高质量发展工作要点》，推出54条新政策、新举措，“量体裁衣”配套梳理出187条具体落实措施。","近年来，农行重庆分行持续加大对文旅产业重点项目支持力度，积极打造“金融+文旅”有效路径，为不同项目量体裁衣，提供创新性解决方案，催生了一系列具有浓郁地方特色的文旅项目，让山城文化底蕴和独特魅力焕发新光彩。"]},{"id":299,"w":"对症下药","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"有针对性","type":"four","expl":"医生针对病症开方用药。比喻针对问题所在确定解决方法。","core":"比喻针对问题所在确定解决方法","exs":["破除顽疾，关键在于对症下药、精准施策。","今年以来，云南各级监察机关在日常监察和调查过程中，针对监察对象所在单位廉政建设和履行职责存在的问题等，“对症下药”向直接责任单位发出监察建议书。","此次活动共解答法律咨询问题15个，梳理后续法律需求事项2个，有效提升了企业经营者守法经营意识，真正做到了针对企业法律需求“对症下药”，帮助企业防范法律风险。"]},{"id":300,"w":"有的放矢","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"有针对性","type":"four","expl":"的：箭靶。矢：箭。对着靶子射箭。比喻目的性强，有针对性。","core":"比喻目的性强，有针对性","exs":["我们在评论工作时要有的放矢。","因地制宜发展新质生产力，首先要深入调查研究，摸清家底，明确发展的优势和短板，这样才能精准施策、有的放矢。","写读书笔记时要扣住原文，有的放矢，这样才能写出自己的真感受。"]},{"id":301,"w":"因时制宜","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"有针对性","type":"four","expl":"是指根据时间变化或不同情况，采取适合的策略或措施。","core":"是指根据时间变化或不同情况，采取适合的策略或措施","exs":["党员干部干事创业、创造政绩，必须立足于本地区本部门的实际，注重因地制宜、因时制宜、因事制宜，加强科学论证、发挥比较优势、找到适己赛道，做到“一把钥匙开一把锁”。","各地发展条件不同、资源禀赋各异，既不折不扣贯彻中央精神，又因地制宜、因时制宜，才能形成城乡融合发展新格局。","顺应时令而生的乐趣，正体现了中国传统生活美学中“因时制宜”的智慧。"]},{"id":302,"w":"因势利导","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"因：顺着。势：趋势。利导：引导。指顺着事物的发展趋势而加以引导。（褒义）","core":"指顺着事物的发展趋势而加以引导","exs":["红寺堡区近年来采取大禹治水的办法，变堵为疏，因势利导，对一个个群众反映强烈的信访硬案采取“软着陆”的方式，实现了群体上访和信访积案双下降。","胡丽梅建议，应因势利导，寻找或设置替代游戏，满足孩子们“同伴游戏”的需求，逐渐远离烟卡。“避免强制或粗暴制止，这样只会让孩子更隐秘地玩耍，引发亲子矛盾。”烟卡游戏背后确实潜藏有一定的不良影响。","近年来，祁阳市纪委监委因势利导，将家风建设、警示教育、清廉单元建设与廉洁文化阵地建设有机结合，积极探索打造陶铸廉洁文化建设阵地、潘市镇文旅精品路线等一批廉洁文化建设新地标。"]},{"id":303,"w":"保驾护航","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"保护某事物能让其能正常发展。","core":"保护某事物能让其能正常发展","exs":["做好机构改革组织实施工作，必须以铁的纪律保驾护航。","习近平总书记走进北京航天飞行控制中心，同神舟十二号航天员亲切通话。当时，为这场“天地对话”保驾护航的航天科技人员许多是“80后”“90后”，让人们看到了青年一代的蓬勃力量。","“我们将始终尊商重商、亲商护商，为广大企业发展保驾护航。”山东向香港和澳门各界友好人士发出邀约，携手并肩、奋楫向前，共同打造鲁港澳合作更加美好的明天，在新时代续写鲁港澳合作新篇章。"]},{"id":304,"w":"穿针引线","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"使线的一头通过针眼。比喻从中联系、拉拢。","core":"比喻从中联系、拉拢","exs":["一年来，按照党中央统一部署，国务院用制度“穿针引线”，补短板、兜底线、保基本，确保“民生安全网”网线结实、网底不破。","长期以来，中国人民对外友好协会贯彻中国奉行的独立自主的和平外交政策，在国际社会和世界各国广交深交朋友，为加深人民友谊深耕细作，为促进国家关系铺路架桥，为推动国际合作穿针引线，做了大量卓有成效的工作，发挥了不可替代的作用。","日前，依托后方的资源和技术优势，为助力本地人才培养和技术提升，经过上海援疆医疗队的穿针引线，一场疑难危重病例远程MDT多学科会诊讨论在巴楚县人民医院进行。"]},{"id":305,"w":"添砖加瓦","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"指建筑施工过程中添加砖块和瓦片，比喻通过具体行动为集体事业增添一分微薄的力量。","core":"指建筑施工过程中添加砖块和瓦片，比喻通过具体行动为集体事业增添一分微薄的力量","exs":["中国携手全球南方联合自强，推动建设金砖国家、上海合作组织，为全球治理机制添砖加瓦。","新征程上，始终树立和践行正确政绩观，以实干担当推动经济社会各项目标任务高质量完成，定能不断开创发展新局面，为中国式现代化建设添砖加瓦。","真正在添砖加瓦建设中国特色社会主义现代化强国大厦的人，他们都是值得我们尊敬的。"]},{"id":306,"w":"各司其职","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"司：主管，经营；职：职务。每人都负责做自己职责范围内的事。","core":"主管，经营","exs":["从日常疾病防治到训练场伴随保障，从伤病员紧急救治到提供心理健康服务，军医、护士、卫生员各司其职，共同织就军营健康防护网。","它以“时间旅行者”身份贯穿全场，与现场主持人高效搭档、各司其职。","然因工作繁忙、各司其职，难以穷尽所有，故善于选择便成为重要的读书方法。"]},{"id":307,"w":"群策群力","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"发挥职能","type":"four","expl":"指大家共同出谋划策、齐心协力，发挥集体的智慧和力量。","core":"指大家共同出谋划策、齐心协力，发挥集体的智慧和力量","exs":["中国之治的秘诀，就藏在基层治理的精细度里，藏在坚强有力的基层党组织中，藏在群策群力的群众智慧中。","通过听取地方工会干部、职工群众等各方面的意见建议，进一步集思广益、群策群力，让《规划》更贴合地方工会和基层工会实际、更契合职工期盼。","那是多少党员干部的但行好事，又是多少群策群力的甘苦与共。"]},{"id":308,"w":"广开言路","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"正确做法","type":"four","expl":"广：扩大；言路：进言的道路。指尽量给下面创造发表意见的条件。","core":"指尽量给下面创造发表意见的条件","exs":["发展社会主义协商民主，要把民主集中制的优势运用好，发扬“团结—批评—团结”的优良传统，广开言路，集思广益，促进不同思想观点的充分表达和深入交流。","兰考教育实践活动落实了中央要求，把学习弘扬焦裕禄精神作为主线，分层分类抓好学习，广开言路汇集民意，原汁原味反馈意见。","近年来，辽宁省以16252个“村（居）民评理说事点”为基础，以1355个乡镇（街道）矛盾调解中心为主阵地新邱区将每个周六固定为群众说事日，社区“两委”成员、老党员、乡贤等围绕社区发展、公德、矛盾纠纷等问题广开言路，一个个矛盾在这里随之化解。"]},{"id":309,"w":"集思广益","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"正确做法","type":"four","expl":"集：积重。思：想法，智慧。广：扩大。益：益处，效果。指集中众人的智慧，可以收到更好的效果。","core":"指集中众人的智慧，可以收到更好的效果","exs":["打开宫门、集思广益才是上佳之选，也才能更知民意、通民心，且吉祥物的设计，也会得到更多的创意和灵感。","参会的村（社区）党总支书记、各煤矿企业负责人、政协委员、群众代表、县直相关部门有关负责人面对面协商，畅所欲言谈想法，集思广益寻良策，推动矿区大治理、矿村大发展。","近年来，为有效巩固拓展脱贫攻坚成果，推动乡村振兴产业振兴，驻村工作队及村“两委”干部集思广益，多措并举，在“谋羊业、做羊事、发羊财”上下“苦”功夫，大力推进特色产业发展，促进脱贫人口增收。"]},{"id":310,"w":"正本清源","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"正确做法","type":"four","expl":"正本：从根本上整顿；清源：从源头上清理。从根本上整顿，从源头上清理。比喻从根本上加以整顿清理。","core":"比喻从根本上加以整顿清理","exs":["山东大学儒学高等研究院教授、孔子研究院原院长杨朝明讲述了他用数十年来的研究，为孔子、为儒学“正本清源”的心路历程。","习近平总书记指出，要在推动学习贯彻新时代中国特色社会主义思想走深走实上下功夫，教育引导党员、干部从思想上正本清源只有“学真理论”“真学理论”，才能正本清源、固本培元。","张汉晖表示，乌克兰危机有着复杂的历史经纬和现实原因，要彻底化解危机，必须正本清源、标本兼治。"]},{"id":311,"w":"慎终如始","part":"c","gn":"二十四","gt":"政府优秀做法","sub":"正确做法","type":"four","expl":"慎：谨慎；如：像。谨慎收尾，如同开始时一样。指始终要谨慎从事。","core":"指始终要谨慎从事","exs":["纪律教育是一项长期性、基础性工作，既要紧盯关键节点靶向发力，又要做到全周期推进、全过程融入，引导党员干部始终保持清醒定力，慎终如始、严守纪律。","修身律己难在慎终如始，职务高并不意味着境界就高、拒腐能力就强、廉洁自律就好。","新时代新征程，面对新的机遇与挑战，更需要从英烈精神中汲取动力，以慎终如始的姿态迈步向前。"]},{"id":312,"w":"开源节流","part":"c","gn":"二十五",
