{"id":780,"w":"从容不迫","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"从容：不慌不忙，很镇静；不迫：不急促。不慌不忙，沉着镇定。","core":"不慌不忙，很镇静","exs":["一边战疫情，一边谋发展，这是多重挑战下一个大国从容不迫的气度，展现出一位大国领袖的远见卓识和领导才能。","当今世界正经历百年未有之大变局。形势越是复杂，越需要我们保持从容不迫的战略定力，越需要我们具备登高望远的全局视野。","要在与困难挑战的正面交锋中占据主动、赢得先机，就必须多一些“泰山崩于前而色不变”的从容不迫，多一些“不畏浮云遮望眼”的深邃洞察。"]},{"id":781,"w":"波澜不惊","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"本义：水面风平浪静，没有波浪。引申义：形容人心态沉稳、遇事淡定，情绪毫无起伏；形容局面、局势平稳无变化，没有风波和动荡。","core":"形容人心态沉稳、遇事淡定，情绪毫无起伏","exs":["下半场开始后，局面波澜不惊。第70分钟，科恩送出助攻，法塔乌冷静破门，为加纳队将比分扳平。","一切看似波澜不惊，“好像什么都没发生”，却正是志愿者最想守护的日常。","中华文化，宛如一池春水，表面波澜不惊，深处却潜藏着不竭动能。中国经济，恰似万顷碧波，因文化的注入而愈发奔流不息。"]},{"id":782,"w":"踌躇满志","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"形容对自己的现状或取得的成就非常得意、满怀信心，志向得到满足，神态得意从容。","core":"形容对自己的现状或取得的成就非常得意、满怀信心，志向得到满足，神态得意从容","exs":["2007年，从石河子大学毕业后，王建平没有返回家乡甘肃，而是怀着打小就有的“卫星梦”，踌躇满志地投身尚在建设中的喀什站。","新年伊始，朱昌瑞和同事们踌躇满志，“三地合力，相信未来发展会更好！”","小说把我们带回到那个充满了激情和理想的年代，让我回想起上世纪80年代县城里的文学社，那些兴高采烈踌躇满志地试图通过文学证明自己的年轻人。"]},{"id":783,"w":"意气风发","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"精神振作、气概豪迈，朝气蓬勃、充满干劲与理想抱负。侧重年轻有朝气、精神昂扬，偏褒义。","core":"侧重年轻有朝气、精神昂扬，偏褒义","exs":["鲜为人知的是，领奖台上意气风发的袁隆平，曾为这项获奖的研究成果打过一场艰难的“保卫战”。","队员们精神抖擞、意气风发，展现出昂扬向上的精神风貌。","比赛全程，参赛选手们精神饱满、意气风发，凭借扎实丰厚的诗词积累、沉着从容的竞技心态和勤学善思的综合素养，充分彰显了红寺堡群众及青少年腹有诗书、笃学向善的良好精神风貌。"]},{"id":784,"w":"心旷神怡","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"心境开阔，精神愉悦舒畅。","core":"心境开阔，精神愉悦舒畅","exs":["游客可乘热气球迎朝阳升空，将壮美的山水田园全景尽收眼底，令人心旷神怡。","游客漫步山下，如入“绿野仙踪”，令人心旷神怡。","雪后的广场公园、街头游园，银装素裹，白雪皑皑，美不胜收，犹如一幅幅静谧而祥和的图画，让人心旷神怡。"]},{"id":785,"w":"无所适从","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"适：往。从：跟随。不知听从哪一个好。指不知该怎么办。（侧重面临选择）","core":"指不知该怎么办","exs":["当碎片化时间、碎片化阅读成为常态，我们也就失去了对大块时间的驾驭能力，甚至在没有手机时感到无所适从。","为了不失去客户，这家小企业硬着头皮做技改、强管理，从转型无所适从到创新无所畏惧，“对标”了整整10年。","AI技术的突飞猛进也带来了新型数字鸿沟的问题，少部分人通过掌握AI技术或者应用正快速融入数智化社会，但大部分人尤其是“一老一少”等信息弱势群体面对AI仍然无所适从。"]},{"id":786,"w":"如坐针毡","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"像坐在插着针的毡子上。形容心神不定，坐立不安。","core":"形容心神不定，坐立不安","exs":["问责结果打断了少数干部“平平安安就可以占位子，舒舒服服就可以领票子，庸庸碌碌就可以混日子”的念想，让为官不为者如坐针毡。","各级干部要克服“坐等”思想，发扬“时不我待”的精神、“紧抓快干”的劲头、“如坐针毡”的紧迫，提振状态，想在先、干在前，昂扬斗志、矢志一流，用实际行动书写赤胆忠诚。","整个团队在项目截止日期临近时如坐针毡，因为他们的进度明显落后于计划。"]},{"id":787,"w":"如芒在背","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"如同芒刺扎于背上，形容焦躁的心情。","core":"如同芒刺扎于背上，形容焦躁的心情","exs":["另一方面，随着国际力量对比持续朝着于我有利的方向发展，美国等西方国家越来越感到如鲠在喉、如芒在背，加紧对我国实施西化、分化战略，两种社会制度、两种意识形态的较量更加激烈。","大赛前夜，他感觉自己的心跳得很快，就像有千万个小小的锤子在胸口猛烈敲打，真是如芒在背。","我感到整个写字楼里的空气就像凝固了似的沉重，特别是那一双双利箭般的目光射向我的时候，更是使我如芒在背。"]},{"id":788,"w":"手足无措","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"措：安放。手脚不知放到哪里才好。形容举止慌乱，或无法应对。","core":"形容举止慌乱，或无法应对","exs":["你渴望三个月内实现梦想，会因时间紧迫而产生焦虑、紧张，变得手足无措。","一次一位外国友人求助，她因语言不通手足无措。为了更好服务，40岁的她下定决心学好英语。没有老师辅导，就跟着孩子学；没有固定学习时间，就利用碎片时间寸积铢累。","不久前，最高人民法院、中央广播电视总台发布新时代推动法治进程治理网络暴力，需要你我携手同行，既要把控自己的“言论边界”，以身作则维护网络文明，又要保护自己的“权利边界”，避免在自身权益遭受侵害时手足无措。"]},{"id":789,"w":"杯弓蛇影","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"将映在酒杯里的弓影误认为蛇。比喻因疑神疑鬼而引起恐惧。","core":"比喻因疑神疑鬼而引起恐惧","exs":["岛内绿营人士和媒体歪曲炒作，只能暴露他们杯弓蛇影下的歇斯底里。","经历了两届多国会的“努力”，美国社会在涉华问题上已经形成了“杯弓蛇影”的心态，任何一点小事都可能成为严重扰动双边关系乃至白宫对华政策的导火索，今年上半年导致布林肯无缘访华的“气球危机”就是突出案例。","不少业内人士认为，文化创作需要空间，要减少不确定性，增加程序透明，使创作者有信心坚持正确的创作方向，不因小失大，因噎废食，杯弓蛇影。"]},{"id":790,"w":"心浮气躁","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"内心轻浮不沉稳，性情急躁不安；做事静不下心、没耐心，容易浮躁冲动。","core":"内心轻浮不沉稳，性情急躁不安","exs":["更要看到，也有少数干部心浮气躁，盲目蛮干，搞“形象工程”“政绩工程”，留下包袱和隐患，陷入了解事实不深、掌握情况不准、出台措施不当、解决问题不实、处理危机不妥的境地。","基层官兵要想成长成才，最忌心浮气躁、好高骛远。","要沉下心来，贵在持之以恒，重在学懂弄通，不能心浮气躁、浅尝辄止、不求甚解。哪怕一天挤出半小时，即使读几页书，只要坚持下去，必定会积少成多、积沙成塔，积跬步以至千里。"]},{"id":791,"w":"举棋不定","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态慌","type":"four","expl":"拿着棋子不知下哪一步好。比喻遇事犹豫不决，拿不定主意。","core":"比喻遇事犹豫不决，拿不定主意","exs":["本质是国防战略定位的选择，加拿大政府在下一代战斗机选型上举棋不定，是在战略、经济、政治等多方面反复权衡的结果。","20多年前，就是在这里，人们对古街民居是拆是留举棋不定：是拆“古”建“新”，还是“原汁原味”地保护？","反之，如果有畏无敬，就可能举棋不定、优柔寡断，难免抵触厌战，做事瞻前顾后、畏首畏尾，不敢为、不作为。"]},{"id":792,"w":"噤若寒蝉","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"有顾虑","type":"four","expl":"噤：闭口不作声。像深秋的蝉那样一声不吭。比喻因害怕有所顾虑而不敢说话。","core":"比喻因害怕有所顾虑而不敢说话","exs":["在构建和谐劳动关系的大背景下，动辄用名誉侵权大棒让员工噤若寒蝉，员工不会沉默，法律也不会答应。","我们的文艺评论，一方面常常在低级趣味、低俗思潮、错误思想面前噤若寒蝉，不敢或不愿发声；另一方面“人情批评”“圈子批评”“红包批评”却喧闹不止。","她的严厉让所有的人都感到噤若寒蝉，不敢随便说话。"]},{"id":793,"w":"谈虎色变","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"有顾虑","type":"four","expl":"色：脸色。比喻一提起可怕的事情，脸色就变了。","core":"比喻一提起可怕的事情，脸色就变了","exs":["近年来，互联网金融行业在蓬勃兴起的同时，也产生了一些乱象。不断曝出的风险事件，更是让大家谈虎色变。","人们之所以对食品添加剂谈虎色变，主要原因是非法添加物让食品添加剂背了黑锅，使消费者产生误解。","新能源车自燃事件高发，消费者“谈虎色变”，安全该如何提升？"]},{"id":794,"w":"畏首畏尾","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"有顾虑","type":"four","expl":"形容做事胆小，多所猜忌顾虑，畏缩不前","core":"形容做事胆小，多所猜忌顾虑，畏缩不前","exs":["有的不敢担当、不愿负责，畏首畏尾，什么都等上面部署，不推就不动；有的疲疲沓沓、拖拖拉拉，情况弄不清、工作没思路；有的敷衍应付、作风漂浮，工作抓而不细、抓而不实，仍然在搞形式主义、官僚主义。","再就是要克服惧怕困难、畏首畏尾思想，保持昂扬奋进状态，看准的事情大胆干。","遇到困难和挑战，不能畏首畏尾，更不能将其留给后人，而要抓铁有痕、踏石留印，以钉钉子精神一步一个脚印向前推进。"]},{"id":795,"w":"投鼠忌器","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"有顾虑","type":"four","expl":"投：用东西去掷；忌：怕，有所顾虑。想用东西打老鼠，又怕打坏了近旁的器物。比喻做事有顾忌，不敢放手干。","core":"比喻做事有顾忌，不敢放手干","exs":["党内存在野心家、阴谋家，从内部侵蚀党的执政基础，我们不能投鼠忌器，王顾左右而言他，采取鸵鸟政策，这个必须说清楚。","一个头部主播只要坚持走大道，“大有大的样子”，应该得到尊重，但也没有必要过度夸大头部主播，忽视腰部和脚部的价值，乃至投鼠忌器，无原则地迁就和放纵头部主播，担心少了一两个顶流“天就塌下来了”。","习近平更是鲜明地指出，不能看人看地方下“菜碟”，对领导同志工作过的地方，不能投鼠忌器，要全部扫描。"]},{"id":796,"w":"肆意妄为","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"毫无顾忌","type":"four","expl":"妄：胡乱，非分的，超出常规的。妄为：胡作非为。指不顾一切由着自己的性子胡作非为。亦作“肆意妄行”。","core":"指不顾一切由着自己的性子胡作非为","exs":["防微杜渐，扎紧约束权力的“笼子”，权力才不会肆意妄为。这样的理念，习近平同志在闽工作期间，一以贯之。","心中无戒，就会肆意妄为、无所不为；纪律戒尺，必须念兹在兹、时时省察。","无论是短期经营还是长期营业，商户都不该肆意妄为，否则长此以往，不仅寒了消费者的心，更会扰乱市场秩序。"]},{"id":797,"w":"肆无忌惮","part":"c","gn":"六十三","gt":"顾忌和无所顾忌","sub":"毫无顾忌","type":"four","expl":"肆：放肆。忌：顾忌。惮：惧怕。非常放肆，毫无顾忌和畏惧。","core":"放肆","exs":["领导干部要带头履行请示报告职责，按规定按程序向组织请示报告工作中重大问题和个人有关事项，决不能随心所欲、百无禁忌，更不能明知故犯、肆无忌惮。","这客观上为假冒仿冒账号提供了曝光度和增粉渠道，也让一些违法违规分子更加肆无忌惮。","但是，一些唯利是图的骗子也盯上了这块“大蛋糕”，他们利用某些老年人重视养生但缺乏判断力的弱点，以各种“名医神药”对老年人进行围猎，肆无忌惮地敛取不义之财。"]},{"id":798,"w":"按图索骥","part":"c","gn":"六十四","gt":"调查相关","sub":"调查相关","type":"four","expl":"索：寻找。骥：良马。照着图像去寻找良马。比喻做事死守教条，而不懂得变通。也比喻依据一定的线索去寻找事物。（中性词）","core":"比喻做事死守教条，而不懂得变通","exs":["文物部门对文物的保护是以“按图索骥”的原则进行的，随之产生的遗憾就是，一些没有被列入保护名录的文物就此成为建设的牺牲品，离开了人们的视野，其历史意义也湮没了。","今后，信访人只要拿着信访清单按图索骥，就能找到相关职能部门反映诉求。","按图索骥，一查到底，才可能让真相浮出水面。"]},{"id":799,"w":"刨根问底","part":"c","gn":"六十四","gt":"调查相关","sub":"调查相关","type":"four","expl":"比喻追究底细。","core":"比喻追究底细","exs":["近日，在广西南宁市兴宁区城中村改造重点项目现场，一线观察团成员正在刨根问底，逐项核验干部的履职细节。","此次实地检查是对全市行政执法备案工作的一次刨根问底，掌握了真实情况，找到了工作短板，为下步工作重点提供了遵循。","经验就在每天的摸索中不断积累，技能在每天的刨根问底中不断提高。"]},{"id":800,"w":"顺藤摸瓜","part":"c","gn":"六十四","gt":"调查相关","sub":"调查相关","type":"four","expl":"摸：寻找。比喻按照某个线索查究事情。","core":"比喻按照某个线索查究事情","exs":["现场没有目击证人，警方在路边一家零食店的监控中发现线索，顺藤摸瓜仅用两天时间就找到了肇事者。","有为政府的意涵不仅是积极做事，而且要“做对事”，以“精准滴灌”的用心护航，以“顺藤摸瓜”的巧劲革新，为市场输送拔节生长的信心和干劲。","尔后，就目睹的工作现状和台账中所显示的各项内容和各类数据以及依据标准，从中顺藤摸瓜向被查单位提出相关问题，以此验证工作开展的“真实性”。"]},{"id":801,"w":"披沙拣金","part":"c","gn":"六十四","gt":"调查相关","sub":"调查相关","type":"four","expl":"从大量数据中筛选有价值信息。","core":"从大量数据中筛选有价值信息","exs":["我们要把握好习近平新时代中国特色社会主义思想的世界观和方法论，坚持好、运用好贯穿其中的立场观点方法，善于从基层群众纷繁复杂的意见中发现好点子、从海量信息中发现思想火花、从个人实践中看到推广路径，切实做到披沙拣金。","我国每年出版图书数十万种，如何披沙拣金，把读者不了解但有价值的图书挑选出来，考验着书店经营者对读者需求的把握。一些小众的学术书店，靠着服务于读者的学术需求经营了数十年，与它和读者的高度契合分不开。","本书作者高建国重返历史现场披沙拣金，在广阔的时代背景下生动再现了焦裕禄精神成长史，艺术而全面地还原和呈现了中国共产党人跨世纪接续、铸造焦裕禄精神的波澜壮阔的历史进程，为新时代推进民族复兴伟业奉上一曲荡气回肠的壮歌。"]},{"id":802,"w":"捕风捉影","part":"c","gn":"六十四","gt":"调查相关","sub":"调查相关","type":"four","expl":"比喻说话或做事时用似是而非的迹象做根据。","core":"比喻说话或做事时用似是而非的迹象做根据","exs":["一段时间以来，少数西方媒体炒作所谓“中国开展间谍活动”的虚假叙事，但除了一些捕风捉影、揣测炒作的言论外，没有任何事实和证据。","但美国自以为拥有了“独门法宝”，此后不断对各国所谓“兴奋剂嫌疑”捕风捉影甚至百般罗织，挥舞着这条自认为好使的“罗琴科夫”长臂。","网络上那些捕风捉影的臆测、夸大其词的言论、断章取义的拼凑，其危害远超“不实”范畴，不仅可能严重侵害他人权益，而且会破坏网络生态和舆论格局，有些谣言甚至可以严重地搅乱社会正常的生产生活秩序。"]},{"id":803,"w":"妄自菲薄","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自卑","type":"four","expl":"妄：不合理地，无根据地。菲薄：轻视，瞧不起。毫无根据地小看自己。形容自轻自贱。","core":"形容自轻自贱","exs":["这种妄自菲薄，动摇的是中国发展的精神支柱，消解的是中华民族的精气神。","讲问题“跟先进比要看到差距，但不要妄自菲薄，要实事求是”“今天的会议主要是围绕进一步全面深化改革，打造‘三中心一基地’主题，面对面听取大家的意见建议。”","不盲目自信，也不妄自菲薄，保持爱拼会赢的精气神，“在困难和挑战中看到前途、看到光明、看到未来”。"]},{"id":804,"w":"自惭形秽","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自卑","type":"four","expl":"惭：惭愧。形：形象，模样。秽：邪恶，丑陋。因为自己模样丑陋而感到惭愧。也泛指自己觉得不如别人而感到惭愧。","core":"也泛指自己觉得不如别人而感到惭愧","exs":["眼下要做的，当然先要给“老实”正名，“老实”绝不可耻，“老实人”大可不必自惭形秽。","苔藓虽然生长在没有阳光的地方，青苔花也很小，但毫不自惭形秽，依然像牡丹一样充满自信地绽放自己的个性。","自从他们拿起画笔，我要采访他们的“贵阳印象”就很难——在专注画画的画家前，这是自讨没趣；在风韵十足的模特儿前，难免自惭形秽。"]},{"id":805,"w":"自暴自弃","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自卑","type":"four","expl":"暴：损害。弃：抛弃。指自己糟蹋自己，自己看不起自己，甘心于落后。（程度较重）","core":"指自己糟蹋自己，自己看不起自己，甘心于落后","exs":["爱迪生面对一次次失败没有灰心，最终成为了“发明大王”；张海迪饱受高位截瘫之苦，而她没有自暴自弃，成为了著名作家。","张启春想过自暴自弃，但看着为了养家起早贪黑打工的妻子和两个成绩优异的儿子，他心里清楚，自己必须挺起腰杆，重拾生活的信心。","面对生活的挫折，徐勇从未自暴自弃。进入学校后，他努力学习，起初连握笔都困难，但他没有放弃，用双手配合写字。"]},{"id":806,"w":"自怨自艾","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自卑","type":"four","expl":"自怨：悔恨自己的错误。自艾：改正自己的错误。原指悔恨并且改正自己的错误，后多指悔恨。（埋怨自己）","core":"原指悔恨并且改正自己的错误，后多指悔恨","exs":["他做官不隐藏自己的才华，但一定按照自己的做人原则办事；他不被任用也不怨恨，遭受困厄也不自怨自艾。","他没有因不幸的遭遇而颓废放弃，也没有因失明而自怨自艾，相反，他勇敢地突破了生理极限，用常人无法想象的坚持和汗水，成功登顶珠峰，用自己布满冻疮的手触摸到世界之巅的永恒光芒。","要适应变化并采取灵活的战术与之周旋，从中找到发挥自身优势的空间，切不可陷入自怨自艾的受害者心态，更不要抱怨“适应不良”，固步自封。"]},{"id":807,"w":"怨天尤人","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自卑","type":"four","expl":"怨：怨恨。天：指命运。尤：责怪。指遇到挫折、麻烦时一味抱怨命运和别人，而不寻找自身的原因。（埋怨他人）","core":"指命运","exs":["假如因无爹可拼终日怨天尤人，或因命运不济而郁郁寡欢，受害的还是年轻人自己。","面对外部环境的复杂多变，越来越多外贸企业选择朝着问题去、迎着困难上，没有怨天尤人，决不坐以待毙。"]},{"id":808,"w":"夜郎自大","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自负","type":"four","expl":"夜郎：汉代时位于我国西南部的一个小国。比喻妄自尊大。","core":"比喻妄自尊大","exs":["挑动极端情绪、肆意传播偏见的后果，容易造成公众走进夜郎自大、自吹自擂狂妄误区，导致社会陷入信息碎片化、思维程序化的认知闭环。"]},{"id":809,"w":"盛气凌人","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自负","type":"four","expl":"盛气：骄横的气势。凌：欺负。指以骄横的气势欺负人。","core":"指以骄横的气势欺负人","exs":["现实中，总有少数党员干部摆不正位置。或是盛气凌人、高高在上，让群众望而生畏；或是只顾眼前、不顾长远，做一些政绩工程、表面文章。","在政权中工作的党员自高自大，盛气凌人，自以为是，看不起非党员，自己可以不守法，不遵守政权的纪律和秩序。","面部表情既要自然得体，也要和蔼和善，喜怒哀乐不宜表露太过，切忌神态僵硬或盛气凌人。"]},{"id":810,"w":"孤芳自赏","part":"c","gn":"六十五","gt":"自我评价不当","sub":"形容自负","type":"four","expl":"比喻自命清高、自我欣赏，脱离群体，看不起别人，只顾陶醉在自己的才华或品性里。多为贬义。","core":"比喻自命清高、自我欣赏，脱离群体，看不起别人，只顾陶醉在自己的才华或品性里","exs":["文化不是孤芳自赏，而是让主理人们搭台，让更多人参与、认同、共享；“四会合一”不是简单合并，而是功能互补、资源统筹、服务升级。","科技创新不应是实验室里的“孤芳自赏”，应是产业沃土上的“繁花似锦”。","“非遗不能孤芳自赏”“没人买就没人做”……采访过程中，最触动我的是田静跳出手艺人思维，对非遗传承与市场、就业关系的深入思考。"]},{"id":811,"w":"刮骨疗毒","part":"c","gn":"六十六","gt":"自我革命语","sub":"自我革命语","type":"four","expl":"刮去骨中的毒素，彻底清除伤害。比喻彻底整治、根除问题，强调决断和勇气。","core":"比喻彻底整治、根除问题，强调决断和勇气","exs":["要以刮骨疗毒的勇气经常检视思想观念、工作方法上的不足，对实践暴露出的认知偏差和决策失误，要敢于正视、坚决纠正，决不讳疾忌医。","要坚持唯实务实，精准把握政策策略，切实把从严管理监督和鼓励担当作为统一起来，既刮骨疗毒、去腐生肌，又惩前毖后、治病救人，引导广大党员干部在遵规守纪前提下大胆干事创业。","叶建春强调，全省各级政府要保持战略定力，保持清醒头脑，以刮骨疗毒、壮士断腕的勇气正风反腐，以抓铁有痕、踏石留印的韧劲做好巡视整改“后半篇文章”，为实现“十五五”良好开局、奋力谱写中国式现代化江西篇章提供强有力保障。"]},{"id":812,"w":"壮士断腕","part":"c","gn":"六十六","gt":"自我革命语","sub":"自我革命语","type":"four","expl":"勇士手腕被毒蛇咬伤，立刻斩断手腕，防止毒液蔓延全身。比喻在紧要关头，能当机立断，知所取舍。","core":"比喻在紧要关头，能当机立断，知所取舍","exs":["据悉，海南医科大学附属医院改革将充分运用海南自贸港政策优势，聚焦海南头部医院功能定位，推动卫生健康事业高质量发展，以壮士断腕的决心破除体制机制障碍；坚持结果导向，紧扣公立医院高质量发展，依托咨询委员会“开方抓药”，做到逢山开路、遇水架桥。","为了守住绿水青山，东高河村下定决心关停所有煤矿和煤场，以壮士断腕的决心开启生态修复之路。","空气质量改善的背后，是乌海市以壮士断腕的勇气决心，举全市之力整治生态沉疴痼疾的攻坚之举。"]},{"id":813,"w":"刀刃向内","part":"c","gn":"六十六","gt":"自我革命语","sub":"自我革命语","type":"four","expl":"把刀子的锋芒对准自己内部。比喻敢于正视自身问题、整治内部弊病，不护短、不遮掩。侧重于自我反省、自我整改、从严治内。","core":"比喻敢于正视自身问题、整治内部弊病，不护短、不遮掩","exs":["纪检监察机关始终保持刀刃向内的自觉，对系统内部的问题线索做到件件有处置、事事有回音，才能管好自己人、管住手中权，以自身纯洁性与战斗力为新征程上的反腐败斗争注入更为坚实的力量。","深入学习领会总书记关于党的建设的重要思想、关于党的自我革命的重要思想，坚持刀刃向内，勇于自我革命，以更高标准、更实举措推进全面从严治党。","广大党员干部必须时常叩问和守护初心，及时修枝剪叶、补钙壮骨，以刀刃向内的自我革命精神把这堂必修课、常修课修炼好。"]},{"id":814,"w":"去腐生肌","part":"c","gn":"六十六","gt":"自我革命语","sub":"自我革命语","type":"four","expl":"中药医术用语，去掉腐烂的皮肉，长出新的肌肉。比喻清除腐朽落后、有害的事物，催生新生力量、焕发新活力。","core":"比喻清除腐朽落后、有害的事物，催生新生力量、焕发新活力","exs":["把习主席这一重要指示落到实处，各级必须以去腐的速度提升生肌的速度，保持“去腐生肌”的坚韧执着，坚持不敢腐、不能腐、不想腐一体推进，坚定不移把军队反腐败斗争进行到底，坚定捍卫人民军队政治本色。","习近平总书记指出：“自我革命就是补钙壮骨、排毒杀菌、壮士断腕、去腐生肌，不断清除侵蚀党的健康肌体的病毒，不断提高自身免疫力，防止人亡政息。","只有敢于揭短亮丑、刮骨疗毒，才能正心明道、去腐生肌。堤溃蚁穴，气泄针芒。常破“心中贼”，必须时刻保持正视问题的思想自觉，本着彻底的唯物主义精神深入查摆问题，时时把“探照灯”对准自己、经常用“显微镜”检视自身。"]},{"id":815,"w":"猛药去疴","part":"c","gn":"六十六","gt":"自我革命语","sub":"自我革命语","type":"four","expl":"疴：重病、顽疾。用药力猛烈的药治好重病。比喻用严厉、强硬的手段，整治根深蒂固的顽疾和积弊。","core":"比喻用严厉、强硬的手段，整治根深蒂固的顽疾和积弊","exs":["更恶劣的是，当项目暴露出违规占地的苗头，当地并没有“猛药去疴”，反而出现每平方米罚款8元的“挠痒痒”式执法。","整治高标准农田建设领域的歪风邪气，既要猛药去疴、严肃查处已暴露的腐败问题，也要抓早抓小、防微杜渐，对苗头性、倾向性问题及时“亮红灯”。","坚持猛药去疴、重典治乱，继续起底清理，做到有腐必反、有贪必肃、除恶务尽。"]},{"id":816,"w":"弹冠相庆","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"弹冠：掸掉帽子上的灰尘。指即将做官而互相庆贺，多用于贬义。","core":"指即将做官而互相庆贺，多用于贬义","exs":["特别是搞任人唯亲、排斥异己的有之，搞团团伙伙、拉帮结派的有之，搞匿名诬告、制造谣言的有之，搞收买人心、拉动选票的有之，搞封官许愿、弹冠相庆的有之。","当时推杯换盏、弹冠相庆，如今局终人散，痛悔已晚。","20世纪80年代末90年代初，苏联解体、东欧剧变犹如多米诺骨牌倒塌，世界社会主义陷入低潮，资本主义世界弹冠相庆，全人类的解放事业遭遇至暗时刻。"]},{"id":817,"w":"额手相庆","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"额手：把手举到额头上。把手举到额头上互相庆贺。","core":"把手举到额头上","exs":["新中国成立的消息传到海外后，海外侨胞奔走相告、额手相庆。","海内外爱国人士痛心疾首，国际上正义人士摇头叹息，而日本右翼势力额手相庆。","2021年永济市大象农牧有限公司实现销售收入32355.18万元，今年1月～6月实现销售收入6.02亿元，养殖户们欢欣鼓舞、额手相庆。"]},{"id":818,"w":"优胜劣汰","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"指生物在生存竞争中适应力强的保存下来，适应力差的被淘汰。","core":"指生物在生存竞争中适应力强的保存下来，适应力差的被淘汰","exs":["要增强微观主体活力，发挥企业和企业家主观能动性，建立公平开放透明的市场规则和法治化营商环境，促进正向激励和优胜劣汰，发展更多优质企业。","要把增加绿色优质农产品供给放在突出位置，狠抓农产品标准化生产、品牌创建、质量安全监管，推动优胜劣汰、质量兴农。","农业产业发展中存在的问题逐渐显现，优胜劣汰的自然法则和市场规律对农业产业发展的影响不可小觑。"]},{"id":819,"w":"弱肉强食","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"弱者的肉是强者的食物。比喻弱者被强者所欺凌、吞并等。（常用于形容竞争）","core":"比喻弱者被强者所欺凌、吞并等","exs":["没有这些国际社会共同制定、普遍公认的国际法则，世界最终将滑向弱肉强食的丛林法则，给人类带来灾难性后果。","尽管这个制度还不完善，又遭受了破坏，但是无论如何，社会主义制度总比弱肉强食、损人利己的资本主义制度好得多。","弱肉强食是丛林法则，不是国与国相处之道。"]},{"id":820,"w":"粉墨登场","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"粉墨：傅粉施墨，指化妆。场：戏场，舞台。化好妆登台演戏。也比喻登上政治舞台，含讥讽义。（字面义时为中性词，比喻义时为贬义词）","core":"傅粉施墨，指化妆","exs":["戏迷票友粉墨登场，台上台下热情互动，掌声不断。","一所饭店内，十天封锁，各路势力粉墨登场，尔虞我诈。","形式主义、官僚主义这对顽瘴痼疾，虽然近年来已经大为收敛，但在一些地方时不时地会变换“马甲”，以各种变种粉墨登场。"]},{"id":821,"w":"登堂入室","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"堂、室：古代宫室前为堂后为室。比喻学识由浅入深，逐步达到很高的成就。同“升堂入室”。","core":"比喻学识由浅入深，逐步达到很高的成就","exs":["龙舟、柔力球等基层开展活跃的群众体育项目登堂入室，进入全运赛场，本身就是对近几届全运会执行奥运战略的一次重新认识和扩展。","普洱茶既是西南地区各民族日常饮品，更是西藏、内蒙古、甘肃等地游牧民族每天不可缺少的生活必需品，并且登堂入室，成为王公贵胄杯中的佳品。","国际奥委会需要电竞，但电竞赛事被冠以“奥林匹克”的头衔后，并不意味着一些主流电竞项目可以轻易登堂入室。"]},{"id":822,"w":"百家争鸣","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"比喻各种学术派别竞相争辩鸣放。","core":"比喻各种学术派别竞相争辩鸣放","exs":["要坚持为人民服务、为社会主义服务，坚持百花齐放、百家争鸣，坚持创造性转化、创新性发展，不断铸就中华文化新辉煌。","春秋战国时期的中原地区，百花齐放，百家争鸣，盛况空前。","目前，国内不同领域、不同地区的企业加快平台布局，站上风口的工业互联网已从概念普及阶段快速迈入百家争鸣的实践生根阶段。"]},{"id":823,"w":"百花齐放","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"各色的鲜花一齐开放。后多比喻文艺上不同的形式和风格自由地发展。","core":"后多比喻文艺上不同的形式和风格自由地发展","exs":["花城广州在和风细雨的滋润下，百花姹紫嫣红，争奇斗艳，成为城市里一道亮丽的风景线。百花齐放，万象更新，给花城增添一种欣欣向荣、奋发向上的朝气。","如果今年真能形成各地春晚百花齐放的形势，那绝对是件大好事。选择多样化、市场细分，总比单一的大一统更合理。","记者在会上获悉，在这次文博之“旅”，安庆着眼文化产品多条“赛道”，产品类型“百花齐放”。"]},{"id":824,"w":"耸人听闻","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"耸：惊动。指故意夸大或捏造事实，使人听后感到震惊。","core":"指故意夸大或捏造事实，使人听后感到震惊","exs":["重大疫情面前，借助便利的移动网络与迅捷的传播手段，搭载着耸人听闻的标题，各种谣言借机流窜。","有的不择手段蹭炒社会热点，假冒热点事件当事人、亲属或相关人员发布信息，或针对热点事件，以虚构、歪曲等方式炮制事件原因、细节、进展等，发布耸人听闻的信息。","当前，移动互联网技术快速发展，网上信息纷繁芜杂，甚至常常有耸人听闻的谣言在网上蔓延传播。"]},{"id":825,"w":"骇人听闻","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"骇：震惊。使人听了非常吃惊、害怕。","core":"震惊","exs":["一部人类文明史可以说是人类同瘟疫斗争的历史。天花、鼠疫、出血热等重大疾病都造成了骇人听闻的致死人数和巨大的破坏。","侵华日军一手制造的这一灭绝人性的大屠杀惨案，是第二次世界大战史上“三大惨案”之一，是骇人听闻的反人类罪行，是人类历史上十分黑暗的一页。","萧鸾政变得手后大开杀戒，猛烈的程度骇人听闻，估计“韩公”也逃不出这样的大劫。"]},{"id":826,"w":"不易之论","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"易：更改。指不可更改的言论。","core":"指不可更改的言论","exs":["在学术百家争鸣的今天，提出不易之论是几近艰难的。因此，能开创一个新的研究体系、言前人之所未言的著作，就显得弥足珍贵。","这里既有从大的方面着眼的“文运同国运相牵，文脉同国脉相连”的不易之论，又有从文艺的具体发展得出的“因时而兴，乘势而变，随时代而行，与时代同频共振”的至理名言。","他说夏商之间、殷周之间的礼制是一脉相承的关系，我们认为的确是不易之论，学术界那种认为中国古代礼制起源于周初的观点是有失偏颇的。"]},{"id":827,"w":"不刊之论","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"刊：削，修改。不可改动或不可磨灭的言论。","core":"削，修改","exs":["这是观照历史、植根现实的不刊之论。","智者千虑，必有一失，权威的注释也未必句句都是不刊之论。","中国古代家训和中国古代文化一样，并非皆为金科玉律、不刊之论，其中有精华也有糟粕。"]},{"id":828,"w":"曲高和寡","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"曲：音乐曲调。高：高深。和：跟着唱。意为曲调越高深，能跟着唱的人越少。比喻思想、言行、文艺作品等高深，不能为多数人所理解接受。","core":"比喻思想、言行、文艺作品等高深，不能为多数人所理解接受","exs":["通俗读物就应该写通俗些，否则曲高和寡，看的人不会多。","把道理讲透，不是曲高和寡，而是要以启发式教育帮助学生发现问题、分析问题、思考问题，深入剖析学生关注的困惑。","我们创作芭蕾作品，也要做中国人自己的东西，而不是一味模仿西方，或者脱离群众，曲高和寡、孤芳自赏。"]},{"id":829,"w":"阳春白雪","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"原为战国时楚国的深奥高雅的歌曲。后泛指高雅、不通俗的文学艺术。","core":"后泛指高雅、不通俗的文学艺术","exs":["在很多人看来，交响乐、踢踏舞这样的“阳春白雪”对基层农民来说太陌生，文化水平不高的他们能接受吗？","传统文化已不再是主流媒体的阳春白雪，年轻人的文化认同和文化自信，打破了“年轻”与“古老”的传播“次元壁”，更激发起他们积极地自发传播和广泛参与。","在新媒介语境中，不能一味阳春白雪，雅俗共赏才是文学的人间正道。"]},{"id":830,"w":"戎马倥偬","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"戎马：本指战马，借指军事；倥偬：繁忙。形容军务繁忙。","core":"本指战马，借指军事","exs":["从少年毛泽东的狂放不羁到青年毛泽东的执着豪迈，从中流击水、浪遏飞舟说到战争年代、戎马倥偬，用生动的话语塑造了一个真实可信、血肉丰满的伟人形象。","在实地走访中，史料中的一个个地名变得生动起来，秦皇古道上的车水马龙、戎马倥偬仿佛就在眼前。","他的前半生戎马倥偬，能征善战，富有传奇，是一名出色的军事指挥员。"]},{"id":831,"w":"厉兵秣马","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"厉：同“砺”，磨；兵：兵器；秣：喂牲口。磨好兵器，喂好马。形容准备战斗。","core":"形容准备战斗","exs":["新年伊始，万象更新，全军上下厉兵秣马，练兵正当时。","强军路在脚下，实干铸就梦想。从神十飞天到嫦娥奔月，从芦山抗震救灾到东北抗洪抢险，从远洋护航到跨区联演……三军将士龙腾虎跃，厉兵秣马，自觉投身强军兴军火热实践，努力练就能打仗、打胜仗的过硬本领。","中国人民解放军厉兵秣马，严阵以待，坚决捍卫国家主权和领土完整，坚定维护台海地区和平稳定。"]},{"id":832,"w":"不容置喙","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"喙：嘴。不容许插嘴。","core":"嘴","exs":["香港特区司法机关依照法律规定、符合法定职权、遵循法定程序秉公办案，严正处置危害国家安全的犯罪分子，天经地义，不容置喙。","大多时候书本是霸道和冷漠的，它们的态度总是判断或者告知，即便是最温和的表达其实也都是读书人不容置喙的主张。","反中乱港分子涉嫌煽动分裂国家、勾结外国或境外势力危害国家安全，警方对其关联人员采取必要的侦查和执法行动，依法依规、合情合理，无可指摘，不容置喙。"]},{"id":833,"w":"不容置疑","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"容：允许。不允许加以怀疑。指绝对真实可信。","core":"指绝对真实可信","exs":["“九二共识”的基本事实和全部过程是十分清楚，不容置疑的。","尽管国企还有种种问题需要进一步解决，但其在长达七十年的奋斗中所取得的巨大功绩不容置疑。","数据在推动经济高质量发展和新质生产力形成中的作用不容置疑，但实践中数据价值尚未得到充分释放。"]},{"id":834,"w":"不以为然","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"表示不认为某观点或行为是正确的，带有明确的否定态度，强调对他人意见的反对或不认同。","core":"表示不认为某观点或行为是正确的，带有明确的否定态度，强调对他人意见的反对或不认同","exs":["多数持反对意见的网友反对的并不是维护食品安全，而是略显生硬的《管理规范》——因为对高风险食品原材料缺乏足够了解，所以对《管理规范》不以为然，而这种抵触情绪本身就是一种食品安全隐患。","对于穿凿附会、削足适履的立题方式，王国维很不以为然，甚至指斥“诗有题而诗亡，词有题而词亡”。","对于“摇摆”的说法，雷格拉吉不以为然。“这是纯粹的足球。我代表摩洛哥队，世界杯是最好的橱窗，我们要展示最好的足球。”"]},{"id":835,"w":"不以为意","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"指对事物不重视、不放在心上，侧重表达对事件或提醒的漠视或轻视态度。","core":"指对事物不重视、不放在心上，侧重表达对事件或提醒的漠视或轻视态度","exs":["2023年秋天，一则偏岩即将升级改造的消息传遍古镇，但谢亲奎不以为意。作为古镇旅游从业者，他看到过太多失败案例。","中央八项规定实施之初，有人不以为意，认为“雷声大雨点小”；有人心存侥幸，觉得法不责众。习近平总书记指出，“不能让制度成为纸老虎、稻草人。”","我们在实地走访中发现，部分群众仍习惯于土方法种植，对科学种田不以为意，特别是对工厂化育秧、飞防植保和精准化施肥等科学种植方法缺乏认识，影响农业生产提质增效，亟需农技指导。"]},{"id":836,"w":"移花接木","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"把枝条、嫩芽从一种花木嫁接到另一种花木上。比喻暗中更换。","core":"比喻暗中更换","exs":["这篇文章以移花接木的形式，将美国一名专栏作家早在2008年奥运会期间的文章，与另一位国内人士的文章，用复制+粘贴的方式移植。","无论是党委换届还是人大、政府、政协换届，都要体现工人阶级领导的、以工农联盟为基础的人民民主专政的国体，要保证基本群众代表比例，党政干部、企业负责人不要挤占应该给基本群众的名额，不得搞偷天换日、移花接木的欺骗手段。","还有的单位为了应付检查，采取无中生有、移花接木、指鹿为马等手法，看似在表格上完成了考核指标，实际上没有多少改变。如此等等。这就说明，教育实践活动有期限，但贯彻群众路线没有休止符，作风建设永远在路上。"]},{"id":837,"w":"偷梁换柱","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"比喻暗中耍手段改变事物内容，以假代真，以劣代优。","core":"比喻暗中耍手段改变事物内容，以假代真，以劣代优","exs":["他组织审计某部经济适用房高层住宅楼工程，通过审核、变更签证等结算资料发现，施工单位采用偷梁换柱的方式更换了项目经理。","云南一些市州天然林毁坏屡禁不止，公益林管理漏洞频出，经济林更新偷梁换柱，森林保护不到位。","这主要是指以学习培训、考察调研、党建活动、招商参展等为借口，实则游山玩水，偷梁换柱搞变相公款旅游。"]},{"id":838,"w":"李代桃僵","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"李：李树。桃：桃树。僵：枯死。李树代桃树而死。比喻兄弟相爱相助，患难与共。也比喻以此代彼（多贬义）或代人受过。","core":"比喻兄弟相爱相助，患难与共","exs":["电影《战狼2》中的RACHEL是一名援非医生，她冷静沉着，医术高超。在雇佣兵搜捕传染病专家陈博士时，试图李代桃僵掩护真正的陈博士。","有人说电影院就好像是超市，电影就是货架上的商品，偷票房便是典型的监守自盗，某些电影院通过双系统、手写票、捆绑套餐、废票再用等等花样繁多的方式，以假乱真、李代桃僵。","作者另辟蹊径地融入了粤闽两省方言元素，以“粒”作为圆形物体的量词称呼，如“一粒苹果”“一粒足球”等，将诗中表示粟米的量词别解为圆球量词，大有“李代桃僵”之妙，谐趣盎然。"]},{"id":839,"w":"张冠李戴","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"冠：帽子。比喻弄错了事实或对象。（主观上故意或者不故意）","core":"比喻弄错了事实或对象","exs":["近年来，出现一种侵犯知识产权的新趋势：驰名商标在其主打产品之外，被“张冠李戴”，冠名为其他商品。","自媒体出现了混淆视听的“标题党”和张冠李戴的“拼接手”；短视频用算法将青少年困在“信息茧房”，推送散播“低级趣味”。","长期以来，因资料缺乏等原因，国内学界很难将留俄学生中俄名字准确对应，张冠李戴的情况时有发生。"]},{"id":840,"w":"错综复杂","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"形容头绪多、关系纷乱，情况繁杂、很难理清。","core":"形容头绪多、关系纷乱，情况繁杂、很难理清","exs":["人脑是由数十亿个神经细胞构成的错综复杂的网络，不断处理着各种信号，使人们能够认知、思考、回忆或进行身体活动。","习近平总书记高度重视运用系统思维，强调：“经济社会发展中矛盾错综复杂，必须从系统观念出发加以谋划和解决”。这为科学应对极端天气风险提供了根本遵循。","应对错综复杂的发展形势，确保“十五五”实现良好开局，需要各级领导干部继续埋头苦干、真抓实干，做党中央决策部署的执行者、行动派、实干家，以抓落实的实际行动，一步一个脚印，不断推动各项工作迈上更高水平，推动中国式现代化取得新进展新突破。"]},{"id":841,"w":"盘根错节","part":"c","gn":"六十七","gt":"近似成语","sub":"近义辨析","type":"four","expl":"树木树根盘绕、枝节交错。比喻事情关系复杂、牵连众多，难以处理和厘清。","core":"比喻事情关系复杂、牵连众多，难以处理和厘清","exs":["对于涉及法律纠纷、债权债务盘根错节的地块，石嘴山高新区通过司法拍卖途径“刮骨疗毒”。","面对盘根错节的利益网络，县纪委监委坚持边查边治，及时推动白沙镇平田村委会按法律程序收回村集体土地2000余亩。","权属争议、边界纠纷、补偿诉求、施工干扰，种种问题盘根错节，任何一环处理不当都可能导致项目停滞。"]},{"id":842,"w":"铭刻","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"“雕刻”和“绘画”","type":"two","expl":"侧重指在器物、石碑等表面刻下文字或图案，也常用于抽象语境，如将情感、记忆深深记在心中。","core":"侧重指在器物、石碑等表面刻下文字或图案，也常用于抽象语境，如将情感、记忆深深记在心中","exs":["中国人民抗日战争的伟大胜利，将永远铭刻在中华民族史册上，永远铭刻在人类正义事业史册上！","一名勇于担当的共产党员，李志宏用赤胆忠心和英勇无畏，把平安的承诺铭刻在金色盾牌。"]},{"id":843,"w":"镌刻","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"“雕刻”和“绘画”","type":"two","expl":"强调用工具在坚硬物体上精细雕刻，侧重“雕刻”的动作本身，多用于艺术创作、碑文等正式场景。","core":"强调用工具在坚硬物体上精细雕刻，侧重“雕刻”的动作本身，多用于艺术创作、碑文等正式场景","exs":["云冈石窟始建于1500多年前，是中外文化、中国少数民族文化和中原文化、佛教艺术与石刻艺术相融合的一座文化艺术宝库，被誉为一部镌刻在石头上的史书。","守土尽责的誓言笃行在脚印里，忠诚和大爱镌刻在界碑上。“雕刻”和“绘画”（7个）进行相关艺术创作的"]},{"id":844,"w":"描绘","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"一些动作","type":"two","expl":"强调画出，描画，描述。","core":"强调画出，描画，描述","exs":["八百多年前宋代夏日一定也极为炎热，感同身受，我仿佛置身诗人所描绘的环境，一句“时有微凉不是风”让人觉得微凉袭来，心神安宁，燥热的感觉一扫而光。","河池市罗城仫佬族自治县第二小学组织部分学生来到成龙湖公园开展写生活动，近距离接触春日美景，感受春天的蓬勃生机，用画笔描绘多彩春光。"]},{"id":845,"w":"刻画","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"一些动作","type":"two","expl":"本义指通过雕刻和绘画等艺术手段在物体上创造出图案或形象。通常用来形容通过文字、绘画或其他艺术形式对人物、景象等进行细致入微的描绘，以突出其形象和性格特征。","core":"本义指通过雕刻和绘画等艺术手段在物体上创造出图案或形象","exs":["在这部反映农村改革的小说中，作者以细腻的笔触刻画了一位坚韧不拔的农民形象。他面对生活的重重困难，始终保持着乐观向上的态度，生动地展现了新时代农民的精神风貌。","这幅油画以宏大的场面和精细的刻画，展现了红军长征的壮丽景象。画面中，红军战士们身着破旧的军装，但眼神坚定，步伐豪迈。他们翻越雪山，跋涉草地，克服重重困难，最终取得了胜利。"]},{"id":846,"w":"擘画","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"一些动作","type":"two","expl":"指对事务进行规划、设计和安排，常用于形容对重大事务的宏观布局和细致规划，对事情有深远的考虑和计划，含有策略性和智慧性的意味。","core":"指对事务进行规划、设计和安排，常用于形容对重大事务的宏观布局和细致规划，对事情有深远的考…","exs":["在党的十九届五中全会上，习近平总书记深刻分析了国内外形势，科学擘画了我国未来五年乃至更长时期的发展蓝图。","舟山正以基础设施的全面升级激活开放发展的“任督二脉”，用实干与创新书写着新时代的“海上答卷”，构筑起支撑高质量发展的四梁八柱，擘画现代海洋城市的壮美蓝图。"]},{"id":847,"w":"描摹","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"一些动作","type":"two","expl":"本义指通过透明纸覆盖在原件上，按照可见的线条或文字进行复制，如描摹图画、版画或手抄本。在文学创作中，描摹指通过文字细腻地描绘人物、场景、情感等，使读者能够形象地感受到所描述的内容。这种技巧强调对细节的捕捉和生动的表达，以增强作品的表现力和感染力。","core":"本义指通过透明纸覆盖在原件上，按照可见的线条或文字进行复制，如描摹图画、版画或手抄本","exs":["在这篇描写黄山的散文中，作者用细腻的笔触描摹了黄山云海、奇松、怪石的壮丽景色。","这幅人物画以工笔细描的手法，生动地描摹了一位古代仕女的形象。她面容姣好，眉目传情，身着华丽的服饰，手持团扇，尽显古代女性的优雅与娴静。"]},{"id":848,"w":"勾勒","part":"s","gn":"一","gt":"“雕刻”和“绘画”","sub":"一些动作","type":"two","expl":"指用线条画出轮廓，也表示用简单的笔墨描写事物的大致情况。","core":"指用线条画出轮廓，也表示用简单的笔墨描写事物的大致情况","exs":["近年来，琉璃河遗址又出新成果，为我们勾勒出三千年前北京城的样貌。","画面中，山峦层层叠叠，气势磅礴；河流曲折蜿蜒，宛如玉带；树木郁郁葱葱，生机勃勃。画家通过对山水景色的勾勒，展现了大自然的壮丽景色和宁静之美。"]},{"id":849,"w":"凝聚","part":"s","gn":"二","gt":"集中到一起","sub":"由分散状态聚集","type":"two","expl":"侧重指通过吸引力或共同作用，使思想、力量、情感等抽象事物聚集在一起。","core":"侧重指通过吸引力或共同作用，使思想、力量、情感等抽象事物聚集在一起","exs":["团结凝聚力量，奋斗铸就伟业。","“各民主党派、工商联和无党派人士要围绕中心、服务大局，发挥各自优势，更加广泛地凝聚人心、凝聚共识、凝聚智慧、凝聚力量。”"]},{"id":850,"w":"凝结","part":"s","gn":"二","gt":"集中到一起","sub":"由分散状态聚集","type":"two","expl":"原指液体遇冷变成固体（如“水汽凝结成冰”），引申为抽象事物通过过程逐渐固定、形成。","core":"原指液体遇冷变成固体（如“水汽凝结成冰”），引申为抽象事物通过过程逐渐固定、形成","exs":["两国人民用鲜血和生命凝结的深厚情谊，如黄河之水奔腾不息，似伏尔加河宽广深沉，成为中俄世代友好的不竭源泉。","环球金融中心顶部“冒烟”实为蒸汽遇冷后凝结而成。"]},{"id":851,"w":"凝固","part":"s","gn":"二","gt":"集中到一起","sub":"由分散状态聚集","type":"two","expl":"原指在温度降低时，物质由液态变为固态的过程，引申为形容事物因某种原因（如情绪、氛围等）变得固定、停滞或不再变化，多用来描述氛围、表情、时间感等。","core":"原指在温度降低时，物质由液态变为固态的过程，引申为形容事物因某种原因（如情绪、氛围等）变…","exs":["连日低温，黄河青铜峡大坝处形成独特景观：一半凝固一半流水。","艺术家们以深厚的艺术造诣和真挚的情感投入，将历史瞬间凝固成永恒的艺术形象。"]},{"id":852,"w":"汇聚","part":"s","gn":"二","gt":"集中到一起","sub":"向一处集中","type":"two","expl":"侧重指像水流一样从多个方向集中到一处，强调动态的“汇合过程”，对象多为水流、人群、力量等，带有较强的方向性和流动性。","core":"侧重指像水流一样从多个方向集中到一处，强调动态的“汇合过程”，对象多为水流、人群、力量等…","exs":["本届展会汇聚了来自广东、浙江、福建的文创产业链供应商，一站式助力成都文创产品和产业升级。","多年来，国家公益彩票事业聚沙成塔，集腋成裘，汇聚亿万购彩者的点滴爱心，在社会公益领域写下浓墨重彩的一笔。"]},{"id":853,"w":"汇集","part":"s","gn":"二","gt":"集中到一起","sub":"向一处集中","type":"two","expl":"更侧重把分散的事物收集、整合到一起，强调“集中的结果”，适用范围较广。","core":"更侧重把分散的事物收集、整合到一起，强调“集中的结果”，适用范围较广","exs":["近年来，我国各级人大在吸纳民意、汇集民智方面积极探索，不断丰富形式和内容，取得了良好成效。","合作使我们能够汇集资源、分享专业知识、扩大影响力。"]},{"id":854,"w":"聚集","part":"s","gn":"二","gt":"集中到一起","sub":"向一处集中","type":"two","expl":"强调“从各处集合到某一地点”，侧重空间上的集中，对象可以是人和物。","core":"强调“从各处集合到某一地点”，侧重空间上的集中，对象可以是人和物","exs":["美国总统特朗普与加州州长纽森9日互指对方要打“内战”，上千示威者同一天继续在洛杉矶市中心聚集。","北京和雄安协同发力，推动雄安新区创新要素加速聚集，疏解北京非首都功能集中承载地的作用充分显现这里聚集了多家来自京津的创新型企业和科研团队。"]},{"id":855,"w":"承载","part":"s","gn":"三","gt":"表明两者关系","sub":"传递承担某物","type":"two","expl":"支撑，托着物体，承受它的重量，也指某种事物（如文化、情感、信息等）依托于另一事物存在或表达。","core":"支撑，托着物体，承受它的重量，也指某种事物（如文化、情感、信息等）依托于另一事物存在或表…","exs":["通过好的产品、好的创意，激发品牌背后所承载的品质保证、文化价值，才能得到消费者的欢迎。","作为古老生命的遗存，它们不仅记录了地球生态的演替、大自然的沧桑巨变，保存了弥足珍贵的物种资源、孕育了绝美的生态奇观，更是见证了内蒙古悠久的历史和灿烂的文化，承载了各族人民的乡愁情思。"]},{"id":856,"w":"载体","part":"s","gn":"三","gt":"表明两者关系","sub":"传递承担某物","type":"two","expl":"指某些能传递能量或承载其他物质的物质。现也泛指一切能够承载其他事物的事物。","core":"指某些能传递能量或承载其他物质的物质","exs":["2023年以来，不管是在平遥古城、丽江古城等传统意义上的古城，还是在开封、洛阳等城市的古城片（街）区，古装巡游、古风演出、互动演艺等文旅新业态如雨后春笋般涌现，不仅为古城带来人气和活力，也为古城文化传承提供了新的载体。","突出活动的经常性与日常性，创新构建“赶大集、逛庙会、品民俗、促消费”活动载体，通过5600多场不同规模、不同层次的逢会（庙会）、物资交流会、“潮汐摊位”等集市活动，激活物质交流市场，充分展现丰富多彩的民俗文化，实现对乡村产业的“造血赋能”，精心构筑独具特色的文旅大集，极大提升群众的参与感与幸福感。"]},{"id":857,"w":"延伸","part":"s","gn":"三","gt":"表明两者关系","sub":"传递承担某物","type":"two","expl":"指在原有基础上延长、扩展或发展。","core":"指在原有基础上延长、扩展或发展","exs":["在精心策展、丰富活动的同时，不少博物馆持续挖掘文化内涵，更新表达方式，找到文旅融合的秘诀，让文博游的链条持续延伸，让中华优秀传统文化更好地融入生活。","在建设公园城市过程中，苏州将园林花卉文化延伸运用到城市绿化，通过“增花添彩”“拆墙透绿”“留白插绿”“立体增绿”等手法，实现苏州城市绿化的“园林外移”。"]},{"id":858,"w":"代表","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"直接指代或替代某一事物，强调明确的对应关系；通常用于具体事物或概念的指代。","core":"直接指代或替代某一事物，强调明确的对应关系","exs":["以生态文化旅游为代表的“生态文化+”产业发展潜力巨大、前景广阔。","这种基于“行为调控”的“绿色农药”，具有高度靶向性，只影响目标害虫的关键行为，对环境和非靶标生物友好，代表了未来农业害虫绿色可持续防控的重要方向。"]},{"id":859,"w":"象征","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"用具体事物表现某些抽象意义。","core":"用具体事物表现某些抽象意义","exs":["雅万高铁是印尼与中国友谊的象征，是两国人民共同的骄傲。","春节是中华民族的重要传统节日，象征着团圆、和谐与新的希望。"]},{"id":860,"w":"标志","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"表明特征的记号或事物；表明某种特征。","core":"表明特征的记号或事物","exs":["我国建成的首个聚光集热、储换热、汽轮发电机全系统同步投运发电的光热电站，标志着国内光热发电技术迈向更加成熟的新阶段。","长沙麻姑井酒业与承源百年两大企业联合创建的湖南汉隐酒业有限公司正式成立，标志着湘派米酿酒开启强强联合、共谋发展的新篇章。表现客观情况或结果"]},{"id":861,"w":"反映","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"本义把情况或意见等向上级转达、报告，比喻把客观事物的实质表现或显示出来。","core":"本义把情况或意见等向上级转达、报告，比喻把客观事物的实质表现或显示出来","exs":["近日，山东多位网友在“领导留言板”反映垃圾堆放乱象，相关部门积极调查处理，获得网友一致好评。","当前大量的AI文生视频模型在国内的训练数据中，反映中国文化特征的视频素材较为匮乏。"]},{"id":862,"w":"印证","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"通过其他事物进一步证明。","core":"通过其他事物进一步证明","exs":["坑底发现残陶窑2座，印证了陶寺晚期该基址彻底废弃，成为普通生产生活区。","中国式现代化本质上是协调发展的现代化，有力地印证了协调发展伦理的独特意义与实践效力，具体体现在经济发展、区域发展、城乡发展、文明发展、人的发展等诸多方面的全面协调。"]},{"id":863,"w":"见证","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"本义证明证据指证人或证物。","core":"本义证明证据指证人或证物","exs":["它静静地陈列在展柜里，看似普通，却见证着波澜壮阔的革命历史，蕴含着伟大的精神力量。","戈壁滩上的一片片胡杨林，见证了新时代人民军医为了群众健康，一次次远赴大漠的足迹。"]},{"id":864,"w":"桥梁","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"指跨越障碍物（如河流、山谷、道路等）的建筑物，用于连接两地，使交通畅通。比喻义指在人与人、群体与群体、文化与文化之间起连接作用的事物或角色。","core":"指跨越障碍物（如河流、山谷、道路等）的建筑物，用于连接两地，使交通畅通","exs":["走访期间，兰州市就业和人才服务局充分发挥桥梁纽带作用，推动人才培养与产业需求精准对接。","该县累计认定就业见习基地230家，开发青年就业见习岗位610个，覆盖制造、教育、公共服务等多个领域，为青年人才搭建起从校园迈向职场的坚实桥梁。"]},{"id":865,"w":"媒介","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"指在两种事物之间起传递、连接作用的中介物或手段。它可以是具体的物质载体，也可以是抽象的传播方式。","core":"指在两种事物之间起传递、连接作用的中介物或手段","exs":["活动以马戏表演为媒介，旨在传播慈善文化，促进社区慈善事业的发展。","以泡泡玛特小甜豆主题卡为媒介，交通银行与年轻消费者在情感上建立连接，进一步传递“交给生活一点甜”的卡产品价值理念。"]},{"id":866,"w":"枢纽","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"指主门户开合之枢与提系器物之纽。引申义比喻事物中起决定性作用的部分。","core":"指主门户开合之枢与提系器物之纽","exs":["如何用足用好这一区位优势，实现以枢纽带动贸易、以贸易聚集产业、以产业反哺枢纽？一声声嘹亮汽笛中，河南加力发展枢纽经济，正将中原腹地一步步推向开放前沿。","中国证监会主席表示，充分发挥多层次资本市场枢纽功能，推动科技创新和产业创新融合发展。"]},{"id":867,"w":"纽带","part":"s","gn":"三","gt":"表明两者关系","sub":"词义辨析","type":"two","expl":"指用于捆束或连接物品的带子，如绳索、系带等。引申义比喻能够联系、维系人或事物的关系或因素，强调其连接、团结的作用。","core":"指用于捆束或连接物品的带子，如绳索、系带等","exs":["雅安市雨城区巧用“乡愁”纽带，聚焦联络感情、搭建平台、落实关爱等关键环节，激发人才干事创业热情，为区域发展添劲赋能。","随着超市经营与城市文化深度融合，这份以诚相待的信任纽带，让涵轩超市在街坊邻里的口碑中稳稳扎根。"]},{"id":868,"w":"缩影","part":"s","gn":"三","gt":"表明两者关系","sub":"个体反映整体","type":"two","expl":"指可以代表同类整体的微小具体代表；从小处就能看出整体的样子。","core":"指可以代表同类整体的微小具体代表","exs":["一方小店的蝶变，藏着普通人对生活的热忱，更映照出用心扎根、勇敢创新的动人缩影。","从“抢水浇地”到“精准控水”，宁津田间的变化，正是齐鲁大地上科技重塑田间管护的一个缩影。"]},{"id":869,"w":"典型","part":"s","gn":"三","gt":"表明两者关系","sub":"个体反映整体","type":"two","expl":"主要指具有代表性的人、事物或语言现象，能够反映某一类对象的共性特征。","core":"主要指具有代表性的人、事物或语言现象，能够反映某一类对象的共性特征","exs":["重庆隆鑫，是“中国造”摩托车走向世界的另一个典型。","它们体现了隋代两种不同的玻璃工艺：盖罐是典型的中国器型，材质为中国传统的高铅玻璃，表面有冷磨痕迹；扁瓶则是吹制的钠钙玻璃，质地、工艺与西亚玻璃相近，造型也近似西域风格的扁壶。"]},{"id":870,"w":"映照","part":"s","gn":"四","gt":"对外界的反映","sub":"投射反应","type":"two","expl":"侧重客观呈现物体的影像或状态，常用于自然现象或具体场景。","core":"侧重客观呈现物体的影像或状态，常用于自然现象或具体场景","exs":["2025年5月5日，武汉黄鹤楼在晚霞的映照下，美不胜收。","当第一户村民家的门缓缓打开，灯光映照出队员们亲切而温暖的笑容。"]},{"id":871,"w":"折射","part":"s","gn":"四","gt":"对外界的反映","sub":"投射反应","type":"two","expl":"原指光线从一种介质进入另一种介质时，因速度变化而改变传播方向，导致影像变形，侧重物理现象或抽象层面的“间接反映”（如通过现象看本质）。","core":"原指光线从一种介质进入另一种介质时，因速度变化而改变传播方向，导致影像变形，侧重物理现象…","exs":["中国职业“上新”“向新”，折射经济发展活力。","就医选择之变，折射京津冀医疗资源分布格局正在发生变革。"]},{"id":872,"w":"映射","part":"s","gn":"四","gt":"对外界的反映","sub":"投射反应","type":"two","expl":"原指数学中元素与元素的对应关系，引申为“通过某种方式将一事物的特征对应到另一事物上”，强调“对应关系”。","core":"原指数学中元素与元素的对应关系，引申为“通过某种方式将一事物的特征对应到另一事物上”，强…","exs":["一南一北，两座铁路口岸正在加速崛起，映射我国经济发展新气象。","这些年，诞生于青海省海东市互助土族自治县的“互助家政”风生水起、声誉日隆，映射劳务品牌潜能，助力城乡融合发展。"]},{"id":873,"w":"投射","part":"s","gn":"四","gt":"对外界的反映","sub":"投射反应","type":"two","expl":"指光线、影子等直接投向物体，或心理学术语中“将自身特质归因于他人”的心理机制，强调“主动投向”的动作。","core":"指光线、影子等直接投向物体，或心理学术语中“将自身特质归因于他人”的心理机制，强调“主动…","exs":["“当你们把眼光投射在更有意义、更长远的追求上，才能做好‘快与慢’‘长与短’的抉择。”","望奎皮影戏源远流长，是一种以驴皮为主要原材料，制作人物、刀马、动物等造型，借灯光投射形象而表演故事的戏曲形式。"]},{"id":874,"w":"诠释","part":"s","gn":"四","gt":"对外界的反映","sub":"解释","type":"two","expl":"说明，解释，多用于书面。","core":"说明，解释，多用于书面","exs":["为医院的有序运转贡献自己的力量，用实际行动诠释着劳动最光荣。","足球小将奋力奔跑、每球必争，诠释团队协作的力量。"]},{"id":875,"w":"阐释","part":"s","gn":"四","gt":"对外界的反映","sub":"解释","type":"two","expl":"阐述并解释。","core":"阐述并解释","exs":["这需要我们系统阐释其蕴含的本体论、认识论、价值论和方法论。","“新时代新征程，要坚持守正创新，聚焦学习宣传贯彻新时代中国特色社会主义思想，着力深化体系化、学理化研究阐释，着力增强学习宣传的针对性、实效性，推动党的创新理论更加深入人心”。"]},{"id":876,"w":"凸显","part":"s","gn":"四","gt":"对外界的反映","sub":"显示出来","type":"two","expl":"本义是凸出显露。","core":"本义是凸出显露","exs":["4月单月进出口总值、出口额、进口额同比增速全部实现正增长，凸显中国外贸韧性。","这一转变不仅体现在产品质量的显著提升，更在于创新性和时尚感的日益凸显，使世界对中国"]},{"id":877,"w":"彰显","part":"s","gn":"四","gt":"对外界的反映","sub":"显示出来","type":"two","expl":"显赫，明显，显著，鲜明地显示。","core":"显赫，明显，显著，鲜明地显示","exs":["越是风雨兼程，越能彰显其强大的生命力、吸引力与感召力。","把握好“同”与“不同”，方能彰显“1+1+1＞3”的人文湾区独特魅力，进一步增强大湾区文化软实力，促进湾区人心相通，为高质量建设粤港澳大湾区凝心聚力。制造的印象发生积极变化。"]},{"id":878,"w":"渲染","part":"s","gn":"四","gt":"对外界的反映","sub":"词义辨析","type":"two","expl":"原意是国画的一种画法，用水墨或淡的色彩涂抹画面，以加强艺术效果，多用来比喻夸大的形容或者对事物突出的描写和烘托。","core":"原意是国画的一种画法，用水墨或淡的色彩涂抹画面，以加强艺术效果，多用来比喻夸大的形容或者…","exs":["安徽黄山，霞光渲染下的奇峰秀色令人流连忘返。","部分媒体特别是自媒体捏造散布涨价信息、渲染涨价氛围，短期内加剧了市场惜售情绪。"]},{"id":879,"w":"烘托","part":"s","gn":"四","gt":"对外界的反映","sub":"词义辨析","type":"two","expl":"原意是国画的一种画法，用水墨或淡的色彩点染轮廓外部，使物象鲜明，多用来突出气氛或情感。","core":"原意是国画的一种画法，用水墨或淡的色彩点染轮廓外部，使物象鲜明，多用来突出气氛或情感","exs":["携手打造炫彩多元的光影活动，烘托五一节日假期氛围，展现活力、缤纷、多元的静安夜生活。","大家手拉手围着篝火载歌载舞，欢声笑语回荡在夜空，将各民族之间的深厚情感烘托得愈发浓烈，绘就出一幅民族团结、和谐共融的美好画卷。"]},{"id":880,"w":"交融","part":"s","gn":"五","gt":"两者融合","sub":"交汇融合","type":"two","expl":"强调不同事物相互渗透形成新整体。","core":"强调不同事物相互渗透形成新整体","exs":["要鼓励社会组织和民间团体积极参与国际人文交流，开展民间文化交流活动、民间艺术团体互访演出等，促进文化交融。","雪后的波浪谷，以其独特的景致，将诗词中的意境完美呈现，让人们在欣赏美景的同时，也能感受到大自然的鬼斧神工与文化底蕴的深厚交融。"]},{"id":881,"w":"融合","part":"s","gn":"五","gt":"两者融合","sub":"交汇融合","type":"two","expl":"指不同元素结合后失去原有界限，形成统一体。","core":"指不同元素结合后失去原有界限，形成统一体","exs":["辽宁将立足资源优势，做好融合文章，充分激发潜能，着力培育高质量发展新增长点，加快打造高品质文体旅融合发展示范地。","当前，我国工业互联网正迈入规模化发展的新阶段，人工智能与工业互联网深度融合，能够大幅提高生产效率、优化资源配置、降低生产成本，可进一步加速工业体系向高端化、智能化、绿色化迈进，为新型工业化发展提供强大的技术支持和动力。"]},{"id":882,"w":"融入","part":"s","gn":"五","gt":"两者融合","sub":"交汇融合","type":"two","expl":"侧重一方主动适应或加入另一体系。","core":"侧重一方主动适应或加入另一体系","exs":["人工智能是人类发展的新领域，是新一轮科技革命和产业变革的重要驱动力量。今天，人工智能日益融入生产生活的方方面面，为千行百业赋能，为千家万户造福。","让非遗融入现代生活，就要使之回应现代生活情感的触点，结合非遗内容挖掘新的情感锚点，进而引发时代反响。"]},{"id":883,"w":"介入","part":"s","gn":"五","gt":"两者融合","sub":"交汇融合","type":"two","expl":"指外部力量主动干预或参与。","core":"指外部力量主动干预或参与","exs":["美国政府正密切关注叙利亚冲突局势，不会军事介入，但是会重点关注美国国家安全优先事项和利益。","公平正义是司法的价值追求，人工智能介入司法，应当充分体现司法公平、公正、公开、高效、便民、为民，在人工智能介入司法办案中，一切能够体现社会主义司法核心价值的介入都是合适的，一切违背社会主义司法核心价值的介入都是不合适的。"]},{"id":884,"w":"渗透","part":"s","gn":"五","gt":"两者融合","sub":"词义辨析","type":"two","expl":"本义为液体缓慢透入。现多比喻事物或势力逐渐进入，或军队利用敌部署的间隙或有利地形秘密渗入敌纵深或后方的作战行动的军事术语。","core":"现多比喻事物或势力逐渐进入，或军队利用敌部署的间隙或有利地形秘密渗入敌纵深或后方的作战行…","exs":["雨水渗透了干燥的土壤，为植物的生长提供了必要的水分。","在经济全球化的背景下，各国文化相互渗透，形成了多元文化的格局。","智慧城市是人工智能中一项集合了多项要素、复杂的研究项目。随着人工智能越来越多地渗透到我们生产生活的方方面面，整个社会的运行效能也在大幅提高，未来，人工智能将更加广泛、深入地影响着我们的生产生活。"]},{"id":885,"w":"渗入","part":"s","gn":"五","gt":"两者融合","sub":"词义辨析","type":"two","expl":"指液体慢慢地透过孔隙或缝隙进入另一种物质内部。例如，雨水渗入土壤，墨水渗入纸张等，也表示某种思想、文化、影响等逐渐进入或渗透到某个领域或群体中。","core":"指液体慢慢地透过孔隙或缝隙进入另一种物质内部","exs":["夜幕降临，月光透过窗帘的缝隙，悄然渗入房间，洒在地板上，营造出一种宁静的氛围。","这种独特的香料味道能够渗入食材的每一个角落，让菜肴的味道更加丰富和层次分明。"]},{"id":886,"w":"裹挟","part":"s","gn":"五","gt":"两者融合","sub":"词义辨析","type":"two","expl":"本义是指（风、流水等）把别的东西卷入，使随着移动。现比喻（形势、潮流等）把人卷进去，迫使其采取某种态度。","core":"本义是指（风、流水等）把别的东西卷入，使随着移动","exs":["狂风裹挟着暴雨，猛烈地袭击了沿海地区，造成了严重的灾害。","在商业化的浪潮中，许多传统文化被裹挟着改变，失去了原有的纯粹和特色。"]},{"id":887,"w":"嵌入","part":"s","gn":"五","gt":"两者融合","sub":"词义辨析","type":"two","expl":"把一物紧紧镶入、植入另一物内部，融进去、嵌进去。侧重有形。","core":"侧重有形","exs":["截至目前，深圳市离境退税商店总数已突破2000家，仅2025年就新增超千家，6个退税口岸贯通城市东西，14个集中退付点嵌入各大核心商圈，形成布局完整、便捷可达的服务体系。","推行“党支部+合作社（龙头企业）+农户”模式，引导群众以土地、资金、劳务等要素入股，把小农户嵌入产业链实现就近就业增收。"]},{"id":888,"w":"植入","part":"s","gn":"五","gt":"两者融合","sub":"词义辨析","type":"two","expl":"把事物有意识地放进、融入另一事物里，暗中渗透、扎根进去。侧重无形。","core":"侧重无形","exs":["关键在于，赣州将其融成了一套组合拳——赛前有文艺暖场，赛中有文化植入，赛后有消费延伸，形成了一条完整的赛事演艺消费链。","精心植入适老化颐养小场景，打造舒心图书角、银龄棋牌室、茶室及音乐吧，组建“爷爷的棋社”“奶奶的茶话会”等兴趣小组，让老人的精神文化生活有滋有味。"]},{"id":889,"w":"积淀","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"侧重指长期积累后形成的文化、经验、传统等抽象事物，强调过程的漫长性和结果的厚重感，多用于精神层面。","core":"侧重指长期积累后形成的文化、经验、传统等抽象事物，强调过程的漫长性和结果的厚重感，多用于…","exs":["在漫长的历史进程中，中华民族孕育积淀了宝贵的中华文明智慧结晶，也与中西思想文化的大变局同频共振。","中网借助奥运红利和积淀了20年的口碑，在票房销售、商务赞助和网球文化推广等方面展现出了独特的魅力。"]},{"id":890,"w":"沉淀","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"原指液体中杂质下沉或溶液中溶质析出（如“泥沙沉淀”），引申为思想、情感等抽象事物在经历后慢慢凝结、稳定，侧重自然积累或筛选的过程。","core":"原指液体中杂质下沉或溶液中溶质析出（如“泥沙沉淀”），引申为思想、情感等抽象事物在经历后…","exs":["加强统一授信管理，防止信贷资金沉淀淤积金融机构无序竞争容易引发一个问题——信贷资金沉淀淤积。","我们想让年轻一代随手摸到的就是沉淀千年的文化，这个事情可能是需要一代人或者几代人努力去做的。"]},{"id":891,"w":"积累","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"指通过不断收集、聚集具体或抽象的事物，侧重数量的增加，使用范围更广泛。","core":"指通过不断收集、聚集具体或抽象的事物，侧重数量的增加，使用范围更广泛","exs":["中国经济延续回升向好态势，经济运行中的积极因素不断积累。","比亚迪坚持新能源战略，长期主义投入到新能源汽车的研发与技术积累，坚持插混+纯电两条腿走路。供给养分或产生影响"]},{"id":892,"w":"滋润","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"①形容湿润、不干燥状态，指物体含有适量水分，舒适饱满的状态。②补充水分，使不干燥。③形容生活舒适、富足，形容生活宽裕、惬意、手里钱财宽裕。","core":"①形容湿润、不干燥状态，指物体含有适量水分，舒适饱满的状态","exs":["近年来，普安县税务局持续推进“春雨润苗”专项行动，及时响应经营主体涉税诉求，在政策支持、难题解决、合规引导等方面持续发力，以源源不断的税惠“春雨”滋润小微经营主体茁壮成长。","我们也希望这部剧传递的文化价值理念和悦纳自我、从容笃定的人生态度，能以独有的“中式温情”，滋润年轻人的心。"]},{"id":893,"w":"浸润","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"指液体缓慢渗入固体物质中的自然过程。引申义指的是思想和文化的熏陶，情感和氛围的渗透。","core":"指液体缓慢渗入固体物质中的自然过程","exs":["张国忠代表表示，“讲好廉洁故事，有助于廉洁文化浸润人心。”","讲红色故事、唱红色歌曲、建红色校园，充分发挥学校主阵地作用，将红色文化渗透到学校的各个角落，覆盖学生的日常生活，营造浓郁红色文化育人氛围，使学生在红色文化浸润中学知识、育品德。"]},{"id":894,"w":"滋生","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"指生物（多指微生物或有害生物）产生、繁殖的过程。引申义指的是引发不良现象，导致负面事物产生或蔓延。","core":"指生物（多指微生物或有害生物）产生、繁殖的过程","exs":["腐败存量尚未清除，增量还在持续发生，铲除腐败滋生土壤和条件任务仍然艰巨繁重。","各级纪检监察机关坚持严的基调，聚焦违规吃喝等顽疾靶向发力、坚决纠治，深挖细查隐形变异问题，严防不正之风滋生蔓延。"]},{"id":895,"w":"涵养","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"表示内在修养，也指道德、学问等方面的修养。","core":"表示内在修养，也指道德、学问等方面的修养","exs":["何春丽代表的军人家庭，将深沉的家国情怀内化为对社区的责任感，积极参与志愿服务、支持国防教育，成为涵养社会正气、凝聚社区共识的基石。","领导干部应自觉涵养新时代共产党人的良好家风。"]},{"id":896,"w":"滋养","part":"s","gn":"六","gt":"作用下的结果","sub":"词义辨析","type":"two","expl":"提供养分，促进生长，指通过物质或精神养料使生物或事物健康成长。其次指维持生命活力，强调持续供给生存所需的根本养分。","core":"提供养分，促进生长，指通过物质或精神养料使生物或事物健康成长","exs":["今天的人们，如何接续古老的文化传统，滋养当下的美好生活，是需要思考、需要去做的功课。","方家努力尝试把家风建设从亲情层面上升到文化层面，通过文化公益活动，让美学艺术滋养更多家庭。​"]},{"id":897,"w":"腐蚀","part":"s","gn":"六","gt":"作用下的结果","sub":"环境作用下被削弱","type":"two","expl":"引申为人在坏的思想、行为、环境等因素影响下逐渐变质堕落；多用于比喻人的思想或行为的变质；这通常是一个“由里及外”的过程，可能表示更严重的变质或破坏。","core":"多用于比喻人的思想或行为的变质","exs":["奢侈浪费是腐蚀战斗力的毒药，唯有将每一份资源都精准投向战斗力，才是对先辈深沉的致敬。","奇葩论文不仅徒增笑柄，更会破坏公平竞争、腐蚀学术根基、浪费公共资源，甚至阻碍科技进步与创新。"]},{"id":898,"w":"侵蚀","part":"s","gn":"六","gt":"作用下的结果","sub":"环境作用下被削弱","type":"two","expl":"指逐渐侵害使变坏，多指从外部对物体进行侵害，通常包含“由外及里”的过程，程度稍轻。","core":"指逐渐侵害使变坏，多指从外部对物体进行侵害，通常包含“由外及里”的过程，程度稍轻","exs":["面对网络诈骗、不良信息侵蚀等网络风险，法制副校长通过案例讲解、互动问答、情景模拟等多样化方式，提升学生的网络安全意识和自我保护能力。​","另外，商家应停止制造和贩卖“育儿焦虑”，这种短视行为会逐步侵蚀行业的健康发展，最终必将导致自我反噬。"]},{"id":899,"w":"培育","part":"s","gn":"七","gt":"动作","sub":"促进成长或发展","type":"two","expl":"本意为培养幼小的生物，使它发育成长，常用于人才、经济、精神等成长。","core":"本意为培养幼小的生物，使它发育成长，常用于人才、经济、精神等成长","exs":["从国内看，我国深入实施创新驱动发展战略，加快培育壮大新质生产力，科技创新从点状突破向系统集成推进，多领域涌现振奋人心的“DeepSeek时刻”，大步迈向高水平科技自立自强。","从“一村富”到“连片富”，全市以党建联建，有效推动乡村特色产业延链补链强链，成功培育湖羊、蛋鸡、菌菇等特色产业，带动全市69个村集体薄弱村增收1000多万元。"]},{"id":900,"w":"激发","part":"s","gn":"七","gt":"动作","sub":"促进成长或发展","type":"two","expl":"指给予刺激使其奋发出原有的潜力。","core":"指给予刺激使其奋发出原有的潜力","exs":["青年党员代表还结合自身工作经历与现场观看感受分享感悟，激发思考与共鸣，为支部建设注入青春动能。","我们希望通过评选活动，树立榜样，激发大家的工作积极性，为企业群众提供更加优质的服务。"]},{"id":901,"w":"激励","part":"s","gn":"七","gt":"动作","sub":"促进成长或发展","type":"two","expl":"指通过刺激和正面鼓励使其奋发，通常侧重需要鼓励。","core":"指通过刺激和正面鼓励使其奋发，通常侧重需要鼓励","exs":["在新时代新征程上再创佳绩这一张张贺卡既是党组织对每一位忠诚奉献的党员的褒奖，也是对每位党员接续努力奋斗的激励。","这些“服务之星”，成为了大厅里的一面面旗帜，激励着工作人员不断提升服务质量。"]},{"id":902,"w":"引领","part":"s","gn":"七","gt":"动作","sub":"词义辨析","type":"two","expl":"引导；带领，侧重在前带头开路。","core":"带领，侧重在前带头开路","exs":["我们党作为中国特色社会主义事业的坚强领导核心，作风不仅关系自身形象，更是一面高扬的旗帜，引领着整个社会的价值取向和精神风貌。","近年来，鹿邑县充分发挥基层党组织的战斗堡垒作用和党员先锋模范作用，通过支部引领、党员带动，党群合力推动村集体经济发展，鼓起群众“钱袋子”。"]},{"id":903,"w":"引导","part":"s","gn":"七","gt":"动作","sub":"词义辨析","type":"two","expl":"本义是指通过行为帮人走出困境，或是带着人向某个目标集体行动，通过行为帮人走出困境。侧重从旁指点路径。","core":"本义是指通过行为帮人走出困境，或是带着人向某个目标集体行动，通过行为帮人走出困境","exs":["近年来，清华大学以“服务国家战略需求”为导向，通过一系列创新举措，引导毕业生将个人发展融入国家需求，构建起全方位、多层次的高质量就业生态体系。","要持续加大市场化收购力度，多措并举引导各类主体入市，强化人员力量保障。"]},{"id":904,"w":"推动","part":"s","gn":"七","gt":"动作","sub":"词义辨析","type":"two","expl":"通过提供动力或创造条件促使事物发展，对象可以是具体行动（如政策实施）或抽象概念（如科技创新）。","core":"通过提供动力或创造条件促使事物发展，对象可以是具体行动（如政策实施）或抽象概念（如科技创…","exs":["各部门各单位纷纷表示，将把学习宣传贯彻全会精神作为当前和今后一个时期的重要政治任务，找准推进文化和旅游深度融合发展中的切入点和着力点，全力推动文旅产业高质量发展。","全球文明倡议是对甚嚣尘上的“文明冲突论”的有力回应，也提供了为推动构建人类命运共同体奠定文明基础的路径。"]},{"id":905,"w":"发扬","part":"s","gn":"七","gt":"动作","sub":"推广和传播","type":"two","expl":"主要表示发展、推广、提升某种事物，使其更加显著、壮大或广泛传播。","core":"主要表示发展、推广、提升某种事物，使其更加显著、壮大或广泛传播","exs":["广大党员亦要自觉发扬自我革命精神，以强烈忧患意识警醒自己，以自我革命精神锻造自己，将自我革命的理念融入血脉、抓在经常。","望广大青年坚定理想信念，厚植家国情怀，练就过硬本领，发扬奋斗精神，到祖国和人民最需要的地方发光发热。"]},{"id":906,"w":"弘扬","part":"s","gn":"七","gt":"动作","sub":"推广和传播","type":"two","expl":"意思是广泛宣传、发扬光大，通常用于精神、文化、思想等抽象事物的传播与推广。","core":"意思是广泛宣传、发扬光大，通常用于精神、文化、思想等抽象事物的传播与推广","exs":["传承弘扬中华优秀传统文化，是新时代赋予我们的重大使命，是包括两岸同胞在内全体中华儿女的共同责任。","在孔子诞生地开展文明对话，可谓“沟通古今、联通中外”，让我们在不同时代、不同文明的对话中，更好理解、传承与弘扬中华优秀传统文化。"]},{"id":907,"w":"贯穿","part":"s","gn":"七","gt":"动作","sub":"穿透或联通","type":"two","expl":"强调事物在空间或逻辑上的连通性，既可指具体事物穿过或连接空间（如铁路贯穿全国），也可指逻辑或时间维度的持续关联（如主题贯穿始终）。","core":"强调事物在空间或逻辑上的连通性，既可指具体事物穿过或连接空间（如铁路贯穿全国），也可指逻…","exs":["会议指出，要坚决维护以习近平同志为核心的党中央权威和集中统一领导，坚持把党的全面领导贯穿到人大工作全过程各方面，以实际行动坚定拥护“两个确立”、坚决做到“两个维护”。","綦江区将清廉建设贯穿各项工作始终，确保任务干净、高效推进。"]},{"id":908,"w":"贯通","part":"s","gn":"七","gt":"动作","sub":"穿透或联通","type":"two","expl":"更侧重对事物的全面掌握或深层连接；既包含透彻理解，表示对知识体系的全盘掌握（如贯通中西文化），也可指复杂结构的整体连通（如工程贯通多个节点）。","core":"更侧重对事物的全面掌握或深层连接","exs":["该校与300余家知名企业不断拓展产教融合的深度和广度，将产教融合贯通人才培养全过程。","随着党的精神财富的积累，如何整合诸多党的伟大精神，以党的历史为序贯通起来，连接成一个有机整体，成为一个非常重要的问题。"]},{"id":909,"w":"重塑","part":"s","gn":"七","gt":"动作","sub":"改造或重新构造","type":"two","expl":"侧重指在原有基础上进行改造、更新，使形态、结构或形象发生根本性变化，强调“从旧到新的转型”。","core":"侧重指在原有基础上进行改造、更新，使形态、结构或形象发生根本性变化，强调“从旧到新的转型…","exs":["值得注意的是，技术与文化的双重深耕正在重塑中国电影的创作生态。事实上，中国电影的工业化进程，始终伴随着对“技术自主权”的追求。","面对日益复杂的国际贸易形势，我国跨境电商唯有主动应变、求变，才能赢得先机，重塑出海新优势。"]},{"id":910,"w":"重构","part":"s","gn":"七","gt":"动作","sub":"改造或重新构造","type":"two","expl":"侧重指对事物的结构、框架或系统进行根本性的调整或重新设计，强调从底层逻辑或组织形式上优化，常用于技术、理论、流程等理性场景。","core":"侧重指对事物的结构、框架或系统进行根本性的调整或重新设计，强调从底层逻辑或组织形式上优化…","exs":["快递与文旅的深度融合让旅游购物不再成为行李负担，“行前—行中—返程”全链条嵌入正在重构文旅场景服务链，将非标旅游需求转化为标准化的物流产品。","这种融合“人、货、场”重构的新业态，通过专业化内容输出与场景化体验，持续激活消费市场的深层潜力。"]},{"id":911,"w":"演进","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"指逐渐地进化，强调的是事物在长久发展变化中向好的方向推进；常用于描述科技、文化、社会制度等方面在长时间内逐渐进步、完善的过程。","core":"指逐渐地进化，强调的是事物在长久发展变化中向好的方向推进","exs":["从商周时期“周道如砥，其直如矢”的车马驿道，到如今“八纵八横”高铁网织就的流动中国，道路始终是文明演进的具象载体。","要推动跨机构数据共享与技术标准协同，持续推动行业向更智能、更普惠的方向演进。"]},{"id":912,"w":"演变","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"指的是历时较久的发展变化，侧重于描述事物在时间推移中发生的变化；适用于描述各种事物在长时间内发生的变化，无论这种变化是积极的还是消极的。","core":"指的是历时较久的发展变化，侧重于描述事物在时间推移中发生的变化","exs":["修水铀矿从手工挖掘到机械化采矿，从近乎原始过滤方式的水冶到简易水冶厂，再到现代化水冶新工艺的演变，平凡而伟大的铀矿人创造了中国的奇迹。","作风建设要树立治未病理念，及时发现和解决苗头性、倾向性问题，才能防止小问题演变为大问题，为固根本创造条件。"]},{"id":913,"w":"演绎","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"在逻辑学和数学领域指一种从一般到特殊的推理方法，即从普遍认可的前提中必然推出结论。在表演和文化领域指演员或艺术家对角色、作品的诠释和表现；更强调“推理性”或“表现性”，而非“变化性”。","core":"在逻辑学和数学领域指一种从一般到特殊的推理方法，即从普遍认可的前提中必然推出结论","exs":["在真实案例庭审实战训练环节，青年律师围绕一起名誉权纠纷案展开激烈交锋，学员们扮演各方代理人，演绎民事案件开庭审理流程。","通过演绎科学家故事，剧目组成员们将“干惊天动地事，做隐姓埋名人”的信条充分传递给观众，以文化人、以美育人，浸润心灵、汇交融合。"]},{"id":914,"w":"转化","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"指事物性质、形态、功能或归属发生改变的过程，强调从一种状态转变为另一种状态。广泛适用于自然科学、社会科学及日常生活。","core":"指事物性质、形态、功能或归属发生改变的过程，强调从一种状态转变为另一种状态","exs":["近年来，云南省深化科技体制改革，进一步营造科技成果转化的良好环境。","这些新装备，部分是新质作战力量，只有使其转化为新质战斗力，才能为打赢未来战争发挥重要作用。"]},{"id":915,"w":"蜕变","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"原指蝉蜕壳变，后比喻形质的改变、转化；用于形容彻底而剧烈的质变。","core":"原指蝉蜕壳变，后比喻形质的改变、转化","exs":["如今，经过5个月的淬炼，小何已经从当初的业务小白蜕变为业务骨干，不仅业务熟练，性格也开朗不少。","记忆里家乡那些蜿蜒伸展的道路，从泥泞到坦途的蜕变，不仅丈量着土地的厚度，更串联起一个跨越百年的时代奋斗轨迹。"]},{"id":916,"w":"嬗变","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"指事物逐渐演变、更替，尤其强调新旧交替、传承与变化的过程。多用于描述历史、文化、权力或思想体系的变迁。","core":"指事物逐渐演变、更替，尤其强调新旧交替、传承与变化的过程","exs":["在人工智能时代，教师的专业角色正经历着由知识传授者转向学情分析者、由情感支持者转向价值引领者、由被动回应者转向终身学习者的嬗变。","进而带来从“外在规约”到“内在自觉”、从“行政主导”到“全民共建”、从“荣誉驱动”到“人文滋养”等一系列嬗变。"]},{"id":917,"w":"趋势","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"事物发展变化的大体走向、主流动向，是长期慢慢形成的走向。表示未来走向，中性词。","core":"表示未来走向，中性词","exs":["“水肥一体化是现代农业发展的必然趋势，提质增效看得见、摸得着。”农场负责人吴万山坦言，早前多地考察后下定决心推广这项技术。","在专题辅导环节，皖江工学院计算机与人工智能学院负责同志围绕“AI赋能与智能制造”作专题报告，系统讲解了人工智能技术在智能制造领域的前沿应用和发展趋势。"]},{"id":918,"w":"态势","part":"s","gn":"八","gt":"事物变化","sub":"变化和发展","type":"two","expl":"事物当下整体的状态、形势、局面。表示当前状态。","core":"表示当前状态","exs":["坚持“项目为王”理念，形成了“建成投产一批、快速推进一批、储备谋划一批”的良好态势。","在他的示范带动下，马场镇桑蚕产业从无到有、从小到大，如今全镇桑蚕产业逐步呈现规模化、集群化的发展态势。"]},{"id":919,"w":"催生","part":"s","gn":"八","gt":"事物变化","sub":"词义辨析","type":"two","expl":"指通过外部力量促使新事物产生或加速发展，强调人为干预或客观条件推动的生成过程。广泛用于政策、经济、科技等领域，是描述创新发展过程的精准用词。","core":"指通过外部力量促使新事物产生或加速发展，强调人为干预或客观条件推动的生成过程","exs":["在经济社会领域，6G将进一步深化垂直行业智能化、数字化转型发展，催生大量新业态、新模式，为我国经济高质量发展注入强劲动力。","2024年全区汉服店发展至1100余家，催生“妆娘”“簪娘”“跟拍师”等新职业，带动相关从业人员近3万人。"]},{"id":920,"w":"催化","part":"s","gn":"八","gt":"事物变化","sub":"词义辨析","type":"two","expl":"指通过催化剂改变化学反应速率（加快或减慢）而自身不被消耗的过程，比喻某种因素加速事态发展或转变。","core":"指通过催化剂改变化学反应速率（加快或减慢）而自身不被消耗的过程，比喻某种因素加速事态发展…","exs":["在全球技术革命与气候危机的时代交汇点上，撬动可持续发展未来的核心杠杆在于技术革新，而金融则是将技术潜能转化为实现可持续发展的现实动能，加速催化这场深刻转型。","在未来课堂里，教师转型为学习生态设计师，学生“进化”为自主知识建构者，人工智能成为催化认知跃迁的“超级杠杆”。"]},{"id":921,"w":"衍生","part":"s","gn":"八","gt":"事物变化","sub":"词义辨析","type":"two","expl":"指从原有事物中自然发展出新的事物，强调派生关系和自然延伸的特性。","core":"指从原有事物中自然发展出新的事物，强调派生关系和自然延伸的特性","exs":["随着《哪吒之魔童闹海》爆火，其周边衍生产品热销，出现“一吒难求”。","今年“五五购物节”与上海国际咖啡文化节的奇妙联动，更让这缕咖啡香弥漫在上海各区大街小巷，衍生出新的消费场景。"]},{"id":922,"w":"囊括","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"强调全部包含，要求无遗漏；多用于竞赛、全集等需绝对完整的语境","core":"强调全部包含，要求无遗漏","exs":["这本全集囊括了鲁迅先生的全部著作。","馆藏移民档案囊括重庆所有移民区县的三峡移民档案数字资源，是研究三峡地区经济社会建设与发展、见证三峡地区移民搬迁的重要历史记录。"]},{"id":923,"w":"涵盖","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"侧重范围覆盖允许部分缺失；常见于学术、展览等描述广泛领域的场景","core":"侧重范围覆盖允许部分缺失","exs":["本次展览涵盖了从文艺复兴到现代主义的艺术作品。","调查报告涵盖了教育、医疗等民生热点问题。内部存在未直接显露"]},{"id":924,"w":"蕴含","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"指事物内部包含抽象的思想、情感或意义；多用于精神层面，如哲理、情感、深意等（抽象内容）。","core":"指事物内部包含抽象的思想、情感或意义","exs":["邀请各行各业的优秀从业者走进课堂，与学生面对面分享自身经历，增强故事的真实感，引导学生在真情实感的课堂上感悟思政课蕴含的中国道理。","红色旧址、革命圣地蕴含着丰富的文化内涵，是凝心铸魂的鲜活教材。"]},{"id":925,"w":"蕴藏","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"指具体资源或潜在事物隐藏在内部，未被发掘。","core":"指具体资源或潜在事物隐藏在内部，未被发掘","exs":["中国市场蕴藏巨大绿色机遇，跨国企业在此领域的投入将提升其自身运营韧性，创造新价值源。","中华优秀传统文化是中华民族的文化根脉，蕴藏着解决当代人类面临的难题的重要启示。"]},{"id":926,"w":"包蕴","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"与“蕴含”相近，但更强调“包容性”，多用于文学或哲学语境（抽象内容）；书面语色彩较强，侧重整体包含复杂内容。","core":"与“蕴含”相近，但更强调“包容性”，多用于文学或哲学语境（抽象内容）","exs":["每一个成语背后，都包蕴着丰厚的文化内涵，成为中华五千年文明史上民族精神与智慧的结晶。","古典文明既是世界传统文化的精髓，又包蕴着现代文明的萌芽。古典与现代具有内在一致的理论逻辑，文脉赓续，不绝于缕。"]},{"id":927,"w":"意蕴","part":"s","gn":"九","gt":"表示包容","sub":"词义辨析","type":"two","expl":"指事物内在的含义或情调；强调抽象的美感或深层意义，常用于艺术、文学领域。","core":"指事物内在的含义或情调","exs":["深入挖掘中华优秀传统家文化的思想意蕴，把握传统家文化在伦理道德教化、社会秩序维系、民族精神赓续、社会治理创新等方面的独特功能和时代价值，对于推进中国式现代化伟业意义重大。","中轴线建筑从另一方面也具有警示天子正直理政的作用，这也是中国传统建筑哲学意蕴的完美体现。"]},{"id":928,"w":"泥沼","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"本义指湿软的沼泽地，比喻难以摆脱的困境或复杂局面；强调陷入后难以脱身，带有被动性和挣扎感；常用于形容在困境中挣扎。常用动词搭配：陷入泥沼。","core":"本义指湿软的沼泽地，比喻难以摆脱的困境或复杂局面","exs":["这些企业往往独具特色发展优势，手握宝贵的知识产权，却因固定资产匮乏，无法通过抵押获取资金支持，进而陷入资金周转的泥沼，企业发展举步维艰。","部分创作者受商业利益驱使，陷入同质化、套路化创作泥沼，作品缺乏深度与创新。"]},{"id":929,"w":"牢笼","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"指具体的囚禁工具（如笼子），比喻束缚自由的环境或制度；强调物理或精神上的禁锢，带有强制性，形容在困境中挣扎。常用动词搭配：冲破牢笼。","core":"指具体的囚禁工具（如笼子），比喻束缚自由的环境或制度","exs":["19世纪照相技术的诞生迫使绘画走出写实的牢笼，催生了印象派的光影革命。","冲破思想的牢笼、大踏步前行，深圳经济特区引领并见证着中华民族追赶时代、迈向富强的壮阔历程，成为我国改革开放的鲜明标志。"]},{"id":930,"w":"窠臼","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"指陈旧的模式或规矩，多用于批评思维或行为的僵化；强调对创新或突破的阻碍，常与“传统”“习惯”关联；常用于突破创新场景。常用动词搭配：打破窠臼、陷入窠臼。","core":"指陈旧的模式或规矩，多用于批评思维或行为的僵化","exs":["如何才能科学把握原则与尺度，跳出“写试卷、做习题”的窠臼，也走出“为创新而创新”的误区，布置给学生真正“走心”的作业？","撰写学习心得是学习的重要形式，但若以形式代替内容、只重数量忽视质量，表面成果看上去“光鲜亮丽”，实质上却落入了形式主义窠臼，违背了学习教育的初衷。"]},{"id":931,"w":"桎梏","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"原指脚镣手铐，比喻严重的束缚（如思想、制度）；强调强烈的限制性，多用于抽象层面的压抑；常用于形容严重束缚的场景。常用动词搭配：打破桎梏、破除桎梏。","core":"原指脚镣手铐，比喻严重的束缚（如思想、制度）","exs":["一体推进法治监管、信用监管和智慧监管，增强监管穿透力，通过有力监管破除统一市场建设的桎梏。加强对企业的竞争合规宣导和培训，鼓励企业通过自主创新获取市场优势。","针对个体工商户转型难题，推行“个转企零断档”模式，彻底打破“先注销、后设立”的传统桎梏。"]},{"id":932,"w":"藩篱","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"本义为篱笆，比喻界限或隔阂（如文化、国家关系）；中性词，可指保护性屏障或需要突破的障碍；常用于跨越界限的场景。常用动词搭配：超越藩篱、跳出藩篱、消除藩篱、冲破藩篱、破除藩篱。","core":"本义为篱笆，比喻界限或隔阂（如文化、国家关系）","exs":["进一步全面深化改革，既要有道不变、志不改的强大定力，又要有敢创新、敢攻坚的锐气胆魄，不断冲破思想观念束缚，突破利益固化藩篱，破除各方面体制机制弊端，推动改革不断取得新突破。","深入学习贯彻这些重要论述，对于破除制约创新发展的体制机制障碍和文化藩篱，以文化赋能经济社会发展，加快推进建设社会主义现代化强国具有深远的战略意义。"]},{"id":933,"w":"壁垒","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"古代军营的围墙、防御工事。比喻阻碍事物流通、进入或融合的门槛、隔阂、屏障。多指规则、行业、客观门槛。常用动词搭配：突破壁垒、打破壁垒、破除壁垒","core":"比喻阻碍事物流通、进入或融合的门槛、隔阂、屏障","exs":["通过横向协同破除行政壁垒，打通“热线+监督”联动通道，形成上下贯通、左右协同、闭环落实的治理合力。","陈君介绍，在片区带动下，两村打破壁垒共同编制产业发展规划，实现协同发展。两村联合开发“水上巴士”航线等项目，将沿线各村的景点串联成线。"]},{"id":934,"w":"隔阂","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"彼此情意沟通的障碍或思想上的距离。多指人情感情上的距离。常用动词搭配：消除隔阂、产生隔阂、造成隔阂、打破隔阂","core":"多指人情感情上的距离","exs":["只要心存善意、方法妥当，批评指出他人的缺点和错误，不仅不会造成隔阂，还会使其幡然醒悟，增进彼此友谊。可以说，把能容人与守原则有机结合起来，才能构成一个完美的人格。","为打破隔阂，唐国阳每天扎进村民家中问需解难，成了村民的“贴心人”。"]},{"id":935,"w":"障碍","part":"s","gn":"十","gt":"事情不顺利","sub":"象征限制或束缚","type":"two","expl":"阻挡前进、阻碍事情顺利进行的事物或困难。通用泛指，一切挡路、碍事的东西，适用范围最广。常用动词搭配：克服障碍、跨越障碍、移除障碍、设置障碍、突破障碍","core":"通用泛指，一切挡路、碍事的东西，适用范围最广","exs":["一些景区并非因游客需求设置摆渡车，而是人为设置障碍，通过刻意拉长景区大门与景点间的距离、禁止社会车辆使用景区停车场等手段，将原本可以步行或自驾解决的路程，硬生生变成“非坐不可”的摆渡路段。","百姓切身感受到的部分服务流程障碍，折射了互联网医院在发展中的共性问题。"]},{"id":936,"w":"羁绊","part":"s","gn":"十","gt":"事情不顺利","sub":"被限制的状态","type":"two","expl":"侧重指因情感、关系或责任产生的牵连，既有牵挂的温暖感，也可能带来一定限制。常用动词搭配：冲破羁绊、摆脱羁绊。","core":"侧重指因情感、关系或责任产生的牵连，既有牵挂的温暖感，也可能带来一定限制","exs":["我们新时代的青年，必将冲破羁绊，成为华夏文明的坚定捍卫者、传承者！","以制度之严狠刹“酒”风邪气，从根本上铲除官场“酒文化”，避免党员干部从“小酌”滑向“失足”，让事业发展彻底摆脱酒局羁绊。"]},{"id":937,"w":"束缚","part":"s","gn":"十","gt":"事情不顺利","sub":"被限制的状态","type":"two","expl":"强调用强制手段限制自由，带有明显的负面色彩，侧重外界的压迫或规则的禁锢。常用动词搭配：摆脱束缚。","core":"强调用强制手段限制自由，带有明显的负面色彩，侧重外界的压迫或规则的禁锢","exs":["“近年来，陕西省通过努力，已经解开束缚科技成果转化的‘粗绳子’，但是束缚在科研人员身上的一些‘细绳子’还未解开。”","自由全面发展意味着人彻底摆脱了旧式分工的束缚、物质匮乏的压迫和阶级对立的桎梏。"]},{"id":938,"w":"妨碍","part":"s","gn":"十","gt":"事情不顺利","sub":"使事情不顺利","type":"two","expl":"侧重指干扰、阻碍，使事情不能顺利进行，对象可以是具体行为或抽象事物，语气相对较轻。","core":"侧重指干扰、阻碍，使事情不能顺利进行，对象可以是具体行为或抽象事物，语气相对较轻","exs":["省河长办要求，各地各有关单位进一步提高政治站位，将依法依规清理整治妨碍河道行洪问题作为全面强化河湖长制的重要任务。","四部门联合印发通知，部署全面清理妨碍统一市场和公平竞争的各种规定和做法。"]},{"id":939,"w":"阻滞","part":"s","gn":"十","gt":"事情不顺利","sub":"使事情不顺利","type":"two","expl":"强调因阻碍而使进程变慢甚至停滞，侧重动作的持续性和阻碍的强度，常用于水流、交通、进程等。","core":"强调因阻碍而使进程变慢甚至停滞，侧重动作的持续性和阻碍的强度，常用于水流、交通、进程等","exs":["确保这条金融“毛细血管”在关键时期24小时畅通无阻，让丰收的喜悦毫无阻滞地转化为农民实实在在的收益。","长期以来，各地不同程度存在市场分割和地方保护，制约了商品要素跨域流通，阻滞了经济发展的良性循环，制约了企业的发展空间。"]},{"id":940,"w":"制约","part":"s","gn":"十","gt":"事情不顺利","sub":"使事情不顺利","type":"two","expl":"指事物之间相互限制、约束，强调一种客观的因果关系或条件限制。","core":"指事物之间相互限制、约束，强调一种客观的因果关系或条件限制","exs":["作为连接商圈与居民区的重要通道，万达广场东侧夜市曾因摊位无序、时段混乱，影响着居民出行，制约着“夜经济”品质的提升。","国居民消费正在从生存型向品质型、体验型转变，但城市商业设施同质化、公共空间品质不足等问题仍然制约着消费潜能的释放。"]},{"id":941,"w":"踟蹰","part":"s","gn":"十","gt":"事情不顺利","sub":"词义辨析","type":"two","expl":"指心中犹疑，要走不走的样子。","core":"指心中犹疑，要走不走的样子","exs":["数字化转型能为中小企业带来提质升级、降本增效、业务创新等发展红利，但由于前期投入高、不确定性大、回报周期长，不少企业往往踟蹰不前。","路上，一位衣衫褴褛、拄着拐杖在寒风中艰难踟蹰的老人引起了他的注意。"]},{"id":942,"w":"徜徉","part":"s","gn":"十","gt":"事情不顺利","sub":"词义辨析","type":"two","expl":"指悠闲自在地漫步，带有享受、闲适的意味，多用于描写人在特定环境中的惬意状态。","core":"指悠闲自在地漫步，带有享受、闲适的意味，多用于描写人在特定环境中的惬意状态","exs":["游客们徜徉在这片花海之中，纷纷驻足观赏，拍照留念。","嘉兴市科技馆内人头攒动，不少孩子在家长的带领下来到馆内参观玩耍，徜徉在科技王国里，度过暑假的快乐时光。"]},{"id":943,"w":"徘徊","part":"s","gn":"十","gt":"事情不顺利","sub":"词义辨析","type":"two","expl":"表示在一个地方来回走动，或比喻犹豫不决，也比喻事物在某个范围内来回波动、起伏。","core":"表示在一个地方来回走动，或比喻犹豫不决，也比喻事物在某个范围内来回波动、起伏","exs":["我在门口徘徊犹豫，不知道怎么维权时，看到了工会驿站。","拉斯穆斯表示，美国正徘徊在危机边缘，拜登政府非但没有实现“美国梦”，反而正在破坏美国。"]},{"id":944,"w":"圭臬","part":"s","gn":"十一","gt":"准则标准","sub":"准则标准","type":"two","expl":"本指古代测日影的仪器圭表，现多比喻法度、准则或典范，常用来形容把某些言论或事物当作自己的准则。","core":"本指古代测日影的仪器圭表，现多比喻法度、准则或典范，常用来形容把某些言论或事物当作自己的…","exs":["清代书画家、文学家郑燮，人称板桥先生，曾留下“难得糊涂”墨宝，不但受到书家追捧，还被一些人视为人生圭臬，或挂在嘴边，或郑重其事悬诸中堂。","古之贤官良吏，无不将“百姓温饱、农桑丰稔”奉为施政圭臬，把民生福祉放在为政首位。"]},{"id":945,"w":"准绳","part":"s","gn":"十一","gt":"准则标准","sub":"准则标准","type":"two","expl":"原指测定平直的器具，现多比喻言论、行动所依据的原则或标准。","core":"原指测定平直的器具，现多比喻言论、行动所依据的原则或标准","exs":["文昌以府院联动为抓手、以法治为准绳，深化柔性执法、善意执行，用有温度、有力度的司法与政务服务守护企业发展，助力构建亲清统一的新型政商关系。","一言一行皆要以党纪国法为准绳，知敬畏、存戒惧、守底线。心底无私天地宽，心中不清难自安。"]},{"id":946,"w":"剥离","part":"s","gn":"十二","gt":"两组区分","sub":"分开去除","type":"two","expl":"指附着物或覆盖物在物理、化学或外力作用下脱落、分开的过程，在商业语境中也常指企业分离非核心业务或资产的行为。","core":"指附着物或覆盖物在物理、化学或外力作用下脱落、分开的过程，在商业语境中也常指企业分离非核…","exs":["与传统切割相比，用激光剥离碳化硅衬底不仅定位精准，加工均匀，而且出片速度大幅提升，材料损耗降低了一半。","当画面、灯光、现场人群等干扰因素全部被剥离，只剩下声音传递信息，人的感官会变得无比专注。"]},{"id":947,"w":"剔除","part":"s","gn":"十二","gt":"两组区分","sub":"分开去除","type":"two","expl":"指通过辨别筛选将不合格或不需要的部分去除；核心语义包含“辨别”与“清除”双重动作，强调主体对客体进行价值判断后的主动排除行为，通常针对的是“不好的”、“不合适的”或“不合格的”部分。","core":"指通过辨别筛选将不合格或不需要的部分去除","exs":["在党组织的坚强领导下，广游二支队迅速开展整编、训练、教育和人员筛查工作，剔除队伍中的投机分子，逐步将其打造成一支听党指挥、以工农成分为主、战斗力较强的抗日武装。","主创团队走访非遗学者、亲历者与老艺人家属，倾听珍贵的口述记忆，多轮打磨剧本，剔除浮华修饰、留存故事本真。"]},{"id":948,"w":"分离","part":"s","gn":"十二","gt":"两组区分","sub":"分开去除","type":"two","expl":"指事物或人的分开、隔离、离别。兼具具象与抽象维度：既可指物质的分割，亦能表达情感疏离。","core":"指事物或人的分开、隔离、离别","exs":["搭载天舟十号货运飞船的长征七号遥十一运载火箭，在我国文昌航天发射场点火发射，约10分钟后，天舟十号货运飞船与火箭成功分离并进入预定轨道，之后飞船太阳能帆板顺利展开，发射任务圆满成功。","尤其是与女儿被迫分离的重头戏，无声的颤抖、强忍的热泪与细微的肌肉抽搐，将那份椎心之痛传递给观众，成为影片戳中泪点的关键桥段。"]},{"id":949,"w":"甄别","part":"s","gn":"十二","gt":"两组区分","sub":"区分辨认","type":"two","expl":"核心含义是审查、辨别优劣真伪以及考核鉴定能力品质，常用于描述对事物或人员进行仔细筛选的过程。该词具有三重核心内涵：其一指对事物进行审查以区分差异；其二特指古代对官吏资历的核查；其三指通过特定条件筛选淘汰对象。","core":"该词具有三重核心内涵：其一指对事物进行审查以区分差异","exs":["培育体系需要主动适应未来产业的不确定性，建立健全动态甄别评估调整机制，积极研判发展态势，努力甄别重点领域，在此基础上及时调整战略布局。","动态管理机制是进一步精准甄别企业、清理那些“名存实亡”企业的有效举措。"]},{"id":950,"w":"鉴别","part":"s","gn":"十二","gt":"两组区分","sub":"区分辨认","type":"two","expl":"指辨别真假好坏，常用于对事物的真实性或品质进行判断。强调对事物内在属性的评价，通常涉及专业判断或特定知识，不同于普通的视觉区分。","core":"指辨别真假好坏，常用于对事物的真实性或品质进行判断","exs":["对历史文化特别是先人传承下来的价值理念和道德规范，要坚持古为今用、推陈出新，有鉴别地加以对待，有扬弃地予以继承。","做深做实干部政治素质考察，加强党性鉴别，注重考察干部的境界格局和忠诚度廉洁度，增强识人察人的洞察力、穿透力、鉴别力。"]},{"id":951,"w":"辨别","part":"s","gn":"十二","gt":"两组区分","sub":"区分辨认","type":"two","expl":"指通过观察、分析和比较，识别出事物之间的差异，从而在思想上将它们区分开来。这个过程不仅适用于具体事物（如辨别颜色、声音），也适用于抽象概念（如辨别是非、真伪）。","core":"指通过观察、分析和比较，识别出事物之间的差异，从而在思想上将它们区分开来","exs":["国潮崛起背后是越来越浓的文化认同感和自豪感，在这样的环境氛围里，设计师更要用心辨别和传递真正的东方之美，而不是复制传统或是堆砌符号化元素。","今天的中国青年，他们不仅要直面不同文化、多元文明形态与多样价值观念的激烈交融与深刻碰撞，还要在信息洪流和思潮激荡中辨别方向、守住初心。"]},{"id":952,"w":"识别","part":"s","gn":"十二","gt":"两组区分","sub":"区分辨认","type":"two","expl":"指区分、分辨，通过特征分析确认对象的身份或性质，侧重于确认、认出，强调通过特征判断出对象，对象可为人、事物、信息等。","core":"指区分、分辨，通过特征分析确认对象的身份或性质，侧重于确认、认出，强调通过特征判断出对象…","exs":["推进重大基础设施涉灾风险隐患排查，研发推广“北斗”卫星、高德地图“鹰眼守护”系统，有效识别管控桥梁、隧道等因灾垮塌风险。","要坚持严管和厚爱结合、激励和约束并重，进一步完善干部考核评价机制，突出实践导向、实绩导向和基层导向，把敢不敢扛事、愿不愿做事、能不能干事作为识别干部、评判优劣的重要依据。"]},{"id":953,"w":"风向标","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指指示和测定风向的仪器，通常安装在高杆上，其箭头指向风的来向，引申义为表示某种事物的发展方向或趋势。","core":"本义是指指示和测定风向的仪器，通常安装在高杆上，其箭头指向风的来向，引申义为表示某种事物…","exs":["更好促进服务业优质高效发展，要始终锚定需求这个“风向标”，注重供需的适配性，避免出现结构性错配。","政德是整个社会道德建设的风向标。立政德，就要明大德、守公德、严私德。"]},{"id":954,"w":"指南针","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指一种利用磁针在地磁场作用下指示方向的仪器，是中国古代四大发明之一，引申义比喻指导行动的准则。","core":"本义是指一种利用磁针在地磁场作用下指示方向的仪器，是中国古代四大发明之一，引申义比喻指导…","exs":["标准是行业安全的“守护盾”，是产业发展的“指南针”，是国际贸易的“通行证”。","政绩观是干事创业的“指南针”，决定了党员干部的价值追求与行动方向。"]},{"id":955,"w":"助推器","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指一种内含燃料、用于推动火箭或飞船升天的动力装置，引申义为能够对事物发展起到稳定推动、促进作用的内容或力量，常用于形容提升士气、信心或效益的事物。","core":"本义是指一种内含燃料、用于推动火箭或飞船升天的动力装置，引申义为能够对事物发展起到稳定推…","exs":["内需引擎中，服务消费的“助推器”作用愈发凸显，正加快成为拉动经济前行的重要动力。","推动人文经济学发展，要求坚持以人民为中心的发展思想，促进物质文明和精神文明相协调，强调文化是经济发展的“助推器”，经济发展需要人文价值赋能、文化繁荣需要经济基础支撑。"]},{"id":956,"w":"压舱石","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指空船航行时放置在船舱底部以稳定船身的重物（如石块、铸铁），现引申为比喻为维持事物稳定、健康发展的关键因素或可靠保证。","core":"本义是指空船航行时放置在船舱底部以稳定船身的重物（如石块、铸铁），现引申为比喻为维持事物…","exs":["在全球环境不确定性加剧的背景下，强大国内市场既是维护国家经济安全的“压舱石”，也是我国在新一轮国际竞争中的重要筹码。","传统能源发挥压舱石作用：煤炭市场供需平稳，原油、天然气产量保持稳定增长态势，油气输送通道持续完善，产业链供应链韧性不断增强，保供底气更充足。"]},{"id":957,"w":"晴雨表","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指预测天气晴或雨的气压表，引申义为比喻能敏锐地反映某种变化的事物。","core":"本义是指预测天气晴或雨的气压表，引申义为比喻能敏锐地反映某种变化的事物","exs":["青年是标志时代的最灵敏的晴雨表，更是推进强国建设、民族复兴伟业的生力军。","外贸连接国际国内两个市场，是拉动经济的“三驾马车”之一，也是观察经济风向的“晴雨表”。"]},{"id":958,"w":"定盘星","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指传统杆秤上标识零重量起算点的基准星，常引申为比喻行事或决策时所依据的明确标准或主意。","core":"本义是指传统杆秤上标识零重量起算点的基准星，常引申为比喻行事或决策时所依据的明确标准或主…","exs":["回望中美关系历经跌宕起伏实现总体稳定的过程，元首外交始终是中美关系的“定盘星”，发挥着不可替代的战略引领作用，为中美关系的改善和发展提供了重要战略保障。","精神力量是劳动者攻坚克难、砥砺前行的内在支撑，是劳动者不畏艰难、坚定干事创业方向的定盘星。"]},{"id":959,"w":"指挥棒","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指乐队指挥或交通警察指挥时使用的棒状工具，常引申为比喻起导向作用的事物。","core":"本义是指乐队指挥或交通警察指挥时使用的棒状工具，常引申为比喻起导向作用的事物","exs":["要完善推动高质量发展的政绩考核评价办法，发挥好指挥棒作用，推动各级领导班子认真践行正确政绩观，切实形成正确工作导向。","作为为实现科技发展战略目标而建立的制度体系、组织架构及运行规则的总和，科技管理体制既是科技资源配置的指挥棒，也是创新活动有序开展的保障。"]},{"id":960,"w":"试金石","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指一种黑色坚硬的硅质岩石，古人通过在其表面摩擦黄金来辨别成色，现引申为比喻精确可靠的检验方法或依据，常被赋予见证真伪与品质的象征意义。","core":"本义是指一种黑色坚硬的硅质岩石，古人通过在其表面摩擦黄金来辨别成色，现引申为比喻精确可靠…","exs":["互联网可以视作文学价值的试金石，它会迅速淘汰没有生命力的快餐式文学，也会让文学素人那些带着鲜活生命体验的作品脱颖而出。","共享单车打通出行“最后一公里”，是城市绿色交通的重要组成部分，更是检验城市治理精细化水平的“试金石”。"]},{"id":961,"w":"敲门砖","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指临时敲门的砖石，后引申为比喻借以求得名利的初步手段，通常指为了达到特定目标而采用的工具，一旦目标达成，其价值便可能终结或被抛弃。","core":"本义是指临时敲门的砖石，后引申为比喻借以求得名利的初步手段，通常指为了达到特定目标而采用…","exs":["文化认同只是敲门砖，真正要在高端市场站稳脚跟，则离不开行业企业的产品品质与科技创新。","越来越多劳动者意识到，一门技能，既是好工作好岗位的敲门砖，也是长期稳定就业、实现人生价值的金钥匙。"]},{"id":962,"w":"磨刀石","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指用于磨砺刀具（如菜刀、剪刀等）的石块或工具，通过反复摩擦使刀刃变得锋利，现常引申为能使人或事物变得更好、更锋利的磨练工具或环境。","core":"本义是指用于磨砺刀具（如菜刀、剪刀等）的石块或工具，通过反复摩擦使刀刃变得锋利，现常引申…","exs":["广大青年干部自觉为人民出政绩、以实干出政绩，把实践锻炼当“磨刀石”，主动到基层一线磨砺意志、锤炼本领、增长才干。","着力把高水平科研平台建成新质生产力的重要孵化器，把重大科技任务建成人才加快成长的“磨刀石”。"]},{"id":963,"w":"硬通货","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指在国际上被广泛认可，能作为计价、支付和结算手段使用的货币或资产，其核心在于币值稳定且信用良好，常引申为比喻价值稳定、广泛认可、具有高保值性或核心竞争力的资产、商品、技术或资源等。","core":"本义是指在国际上被广泛认可，能作为计价、支付和结算手段使用的货币或资产，其核心在于币值稳…","exs":["中文从来不是单纯的交流工具，而是通往梦想、拥抱未来的“硬通货”。","坚持有效市场与有为政府协同发力，让信用成为市场经济“硬通货”。"]},{"id":964,"w":"牛鼻子","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指牛的鼻子，牛鼻子是控制牛行动的要害部位，牵住这里牛就会顺从，因此常用来比喻事物的主要矛盾或影响全局的关键点。","core":"本义是指牛的鼻子，牛鼻子是控制牛行动的要害部位，牵住这里牛就会顺从，因此常用来比喻事物的…","exs":["需求是服务业生长的土壤，抓好需求这个“牛鼻子”，不仅能释放服务业的巨大潜能，更能促进服务业与各领域深度融合，为经济发展注入源源不断的新动力。","只有抓住管党治党责任这个“牛鼻子”，才能使各级组织和广大党员干部知责明责、守责尽责、各负其责。"]},{"id":965,"w":"桥头堡","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"本义是指设在大桥桥头的装饰性建筑物、为控制桥梁渡口设立的碉堡据点以及泛指进攻的据点与前哨阵地，现多引申为比喻某一领域的前沿阵地、战略据点或对外开放的重要窗口。","core":"本义是指设在大桥桥头的装饰性建筑物、为控制桥梁渡口设立的碉堡据点以及泛指进攻的据点与前哨…","exs":["在高质量共建“一带一路”的机遇里，酒泉还是中国向西开放的“桥头堡”。","香港拥有背靠祖国、联通世界的独特优势，是全球人才进入中国的“南大门”，也是中国人才走向世界的“桥头堡”。"]},{"id":966,"w":"车轮战","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"原为军事术语，是指己方分散兵力，轮流与敌人作战，或采取迂回战术，在体力和智力上使别人疲劳，然后消灭敌人，其核心比喻意义在于利用人数、次数或时间上的轮替优势，对单一目标进行持续不断的消耗。","core":"原为军事术语，是指己方分散兵力，轮流与敌人作战，或采取迂回战术，在体力和智力上使别人疲劳…","exs":["在连续经历31场强降雨、11个台风、2个热带低压等暴雨“车轮战”后，珠江流域控制性工程不仅取得了防洪阶段性胜利，同时也提前完成蓄水目标任务，防洪、蓄水“双线”告捷，为今冬明春持续发挥综合效益奠定了坚实基础。","山东地区民兵在开展“麻雀战”的同时，还开展了沿日军行军路线的“车轮战”、同日军转圈子的“推磨战”，以及一处打响、四处驰援的“蜂窝战”。"]},{"id":967,"w":"持久战","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"是指持续时间较长的作战，战争中正义的一方，在敌强己弱的情况下，通常在战略上采用持久战的方针，通过长期的作战，逐步削弱敌人，转劣势为优势，变被动为主动，最后赢得战争的胜利。","core":"是指持续时间较长的作战，战争中正义的一方，在敌强己弱的情况下，通常在战略上采用持久战的方…","exs":["治沙是个持久战，得一代代人接力干，久久为功。","当前，各地坚持以正确政绩观引领实干硬作风，运用大数据信息化赋能日常监督，强化针对性纪律教育在小事小节上锤炼作风，健全制度刚性约束推动作风建设常态长效，打好作风建设持久战，让清风正气激荡神州大地。"]},{"id":968,"w":"攻坚战","part":"s","gn":"十三","gt":"比喻象征意象词语","sub":"比喻象征意象词语","type":"other","expl":"是指一种战斗的形式，攻克敌方设有坚固防御的要地如城池、关隘、要塞或据点的作战，现引申为广泛应用于需集中优势资源解决的重大任务之中，以实现阶段性或全局性目标。","core":"是指一种战斗的形式，攻克敌方设有坚固防御的要地如城池、关隘、要塞或据点的作战，现引申为广…","exs":["要增强责任感和危机感，丢掉幻想，正视现实，打好关键核心技术攻坚战，加快攻克重要领域“卡脖子”技术。","真正的政绩往往是“功成不必在我”的接力赛，也是“功成必定有我”的攻坚战。"]},{"id":969,"w":"蔓延","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"本义指蔓草一类植物不断向四周延伸、扩展。本义适用于“草”。词义引申，“蔓延”也指向周围扩散、延伸，速度一般较快。","core":"本义指蔓草一类植物不断向四周延伸、扩展","exs":["冬季以来，日本流感感染人数激增，并呈现出迅速蔓延之势。","在此背景下，追求“短平快”的浮躁风气滋生蔓延。"]},{"id":970,"w":"秉承","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"强调接受、承接，按指示办事或处理问题。更侧重于“继承”的意味，常用于正式场合。","core":"强调接受、承接，按指示办事或处理问题","exs":["海信始终坚持可持续发展，将ESG融入企业发展脉络、内化为公司自觉行动，“秉承以人为本、锚定应用导向。"]},{"id":971,"w":"秉持","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"强调个体或集体在行动中所坚守的原则或持有的态度。更侧重于“持有”的意味，适用于各种语境。","core":"强调个体或集体在行动中所坚守的原则或持有的态度","exs":["中国始终秉持“四个充分尊重”的原则发展同太平洋岛国的关系，将继续在平等相待、相互尊重、互利共赢、开放包容的基础上同太平洋岛国开展全方位的合作，助力岛国的发展。","中欧秉持建交初心、始终相向而行，在世界多极化进程中坚持伙伴关系定位，就可以在经济共生的基础上实现共同发展繁荣。"]},{"id":972,"w":"契合","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指十分符合，也可用于表示意气相投。","core":"指十分符合，也可用于表示意气相投","exs":["马克思主义和中华优秀传统文化来源不同，但彼此存在高度的契合性。","让两岸同胞深切感知两岸历史、文化、血缘天然相亲，从而更加坚定中华文化自信，增强民族认同，增进心灵契合。"]},{"id":973,"w":"观照","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指人对事物特性进行观察、体验、判断等特有的心理活动。现泛指仔细观察，审视。","core":"指人对事物特性进行观察、体验、判断等特有的心理活动","exs":["以年轻化的视角观照世界、人以及生命的意义，是青年导演的一次勇敢尝试。","深入生活、观照现实的文艺作品，是可以引发共鸣共情的。"]},{"id":974,"w":"审视","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指仔细地看，含一定的思考意味。","core":"指仔细地看，含一定的思考意味","exs":["此次活动是为了从博大精深的思想遗产中汲取养分，从而更好地观察、审视和认识当下复杂多变的世界。","对于一些高校的搬迁行为，地方政府和高校都有必要进行审视。"]},{"id":975,"w":"沿袭","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"依照旧传统或原有规定办事。","core":"依照旧传统或原有规定办事","exs":["在屈原故里秭归，有着“端午比年大，一个端午三次过”的说法。农历五月初五头端午、十五大端午、二十五末端午，端午习俗在世代沿袭中形成了祈福禳灾、祭祀屈原、粽子寄情、龙舟竞渡等十大特色。","有些线条还沿袭了中国传统水墨画的技法，某些局部甚至可以看到绘画艺术中独有的生命力的律动。"]},{"id":976,"w":"肇始","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指事物或事件的起源和起始阶段，强调某事的初创或初始状态。","core":"指事物或事件的起源和起始阶段，强调某事的初创或初始状态","exs":["奥林匹克圣火的现代启用肇始于一九三六年。","金融市场的信用膨胀肇始于货币的信用化和资本化。"]},{"id":977,"w":"发轫","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"本义是指古代车辆在出发前，需要拿掉支住车轮的木头，使车辆能够开始行驶。借指开始行动或启程，常用于描述旅行、行程的开始，比喻事物的起始阶段，强调某事的开始或初创状态，常用于描述新事物、新局面的出现。","core":"本义是指古代车辆在出发前，需要拿掉支住车轮的木头，使车辆能够开始行驶","exs":["乐至川剧发轫于民国初期，是“资阳河”川剧艺术流派的杰出代表。","习水作为“四渡赤水”发轫地，将深挖长征故事，打造沉浸式红色旅游IP，助力四渡赤水纪念馆实现“破圈”传播，让长征精神历久弥新。"]},{"id":978,"w":"开端","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指事物或事件的起始阶段，强调某事的起始点或初始状态。","core":"指事物或事件的起始阶段，强调某事的起始点或初始状态","exs":["中国人民满怀豪情地迎接新世纪的到来，这是一个充满希望和挑战的开端。","这个条约的签署将成为两国关系持久和平的开端，为未来的合作奠定了坚实的基础。"]},{"id":979,"w":"滥觞","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"原指江河发源处。现比喻事物的开始或起源，在某些文献中，“滥觞”也有波及、影响的意思，指某事对周围事物产生的影响，在某些情况下，“滥觞”还有泛滥、过分的意思，用于描述某事过度发展或超出控制。","core":"原指江河发源处","exs":["中华文明源远流长，其滥觞可追溯至数千年前。从黄河流域的仰韶文化、龙山文化，到长江流域的河姆渡文化、良渚文化，这些古老的文化遗址见证了中华文明的起源和发展。","“这场思想运动滥觞于学术界的激烈辩论，其理念如涟漪般向外扩散，不仅重塑了哲学研究的范式，更波及社会各领域，引发了一场全民参与的价值观重塑，最终成为推动社会转型的重要精神动力。”"]},{"id":980,"w":"孕育","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"本义指对生命或事物的养育和滋养，使其得以成长和发展。多用于比喻在既存的事物中酝酿着新事物，如思想、文化、艺术作品等的形成和发展。","core":"本义指对生命或事物的养育和滋养，使其得以成长和发展","exs":["期待数字力量如涓涓细流，浸润乡土，在田野浇灌出产业兴、农民富、乡村美的新气象，孕育出乡村振兴的蓬勃生机。","海洋草原、高山平原，中国复杂多样的地理结构，孕育形成了多彩纷呈的众多民族。"]},{"id":981,"w":"式微","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指事物由兴盛而衰落，强调渐进性的衰落过程。","core":"指事物由兴盛而衰落，强调渐进性的衰落过程","exs":["越来越多的拉美国家对美国大声说“不”，凸显出在拉美乃至全球范围内，美国的影响力日渐式微，霸权主义不得人心。","专业的起落，背后是行业的变迁。随着社会发展变化，必然有一些行业兴起，一些行业式微。"]},{"id":982,"w":"湮灭","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"通常指彻底消失或毁灭，强调事物从存在到不存在的不可逆过程。","core":"通常指彻底消失或毁灭，强调事物从存在到不存在的不可逆过程","exs":["幸福的生活来之不易，是无数革命先烈用鲜血和生命换来的，他们的事迹不能随着历史的流逝而湮灭。","多年过去，澄迈老城诸多古迹湮灭，这块记有“飞阁俯长桥”的残碑显得尤为珍贵。"]},{"id":983,"w":"共鸣","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"一指物体因共振而发声的现象，二指由别人的某种思想感情引起相同的思想感情。","core":"一指物体因共振而发声的现象，二指由别人的某种思想感情引起相同的思想感情","exs":["温暖而熟悉的文化符号，总能拨动每一个中华儿女的心弦。“吒儿”在港澳圈粉，是一场中华优秀传统文化引发的心灵共鸣。"]},{"id":984,"w":"升华","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"一指固态物质不经液态直接变为气态，二指比喻事物的提高和精炼。","core":"一指固态物质不经液态直接变为气态，二指比喻事物的提高和精炼","exs":["此剧不仅是一次艺术的盛宴，更是一次心灵的洗礼与情感的升华。","教育家群体在这片热土上孕育成长，教育家精神在这片热土上凝合升华。"]},{"id":985,"w":"支撑","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指让物体不倒塌，让事物发展不失败、不崩溃，用于积极的语境。","core":"指让物体不倒塌，让事物发展不失败、不崩溃，用于积极的语境","exs":["近年来，云南省西双版纳傣族自治州工会以扎实举措深化“产改”，为边疆民族地区高质量发展提供人才支撑。","科学成就离不开精神支撑，进入新时代，中国科技由跟跑逐步转向在更多领域中并跑、领跑，向建设科技强国目标迈进，我们比以往任何时候更加需要大力弘扬科学家精神。"]},{"id":986,"w":"塑造","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指用语言文字等艺术手段描写形象，或对原材料或已有的事物进行改造或加工，使其呈现出新的形态或特征；亦指用石膏、黏土等做成人或物的形象。用于积极的语境。","core":"指用语言文字等艺术手段描写形象，或对原材料或已有的事物进行改造或加工，使其呈现出新的形态…","exs":["针对此亟待塑造中国企业形象，做强做大民族品牌，增强国内大循环韧性和可靠性，为积极参与重塑国际经贸格局提供坚实基础。","习近平总书记强调：“要以科技创新为引领，大力培育壮大新兴产业和未来产业，占据国际竞争制高点，塑造经济发展新动能、新优势。”"]},{"id":987,"w":"媲美","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指美好的程度可以相比，类似比美之意。一般都用于一种东西可以和另一种东西相比。","core":"指美好的程度可以相比，类似比美之意","exs":["这种“小众”主食，蛋白质可媲美鸡蛋。","它展示了中国制作世界级内容的雄心和能力，可以与迪士尼和皮克斯等西方动画巨头相媲美。"]},{"id":988,"w":"凝视","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指聚精会神地观看，不眨眼睛，神情专注。适用多种语境，后面可接抽象和具体名词。","core":"指聚精会神地观看，不眨眼睛，神情专注","exs":["“凝视三星堆——四川考古新发现”的文物展品已从四川广汉三星堆博物馆及成都金沙遗址博物馆安全运抵香港。","重温习近平总书记这些深情凝视，一起致敬英雄。"]},{"id":989,"w":"引擎","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"本义指把（如热能、化学能、核能、辐射能和升高的水的势能等形式的）能量转变为机械力和运动的机器。现在常引申为推动事物发展的动力。一般用于积极语境。","core":"本义指把（如热能、化学能、核能、辐射能和升高的水的势能等形式的）能量转变为机械力和运动的…","exs":["只要把组织建在“链”上、服务做到“心”里、先锋树在“岗”上，就能让党建引领成为驱动发展的最强引擎。","中国进出口银行山东省分行积极拥抱科技创新，以科技为强大引擎驱动统计工作，以数智之力赋能，开启统计工作新篇章。"]},{"id":990,"w":"审慎","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"指周密谨慎、细致稳重，强调在决策、行动前要权衡利弊，妥善行动。","core":"指周密谨慎、细致稳重，强调在决策、行动前要权衡利弊，妥善行动","exs":["明确列出不能交往的对象范围，能让干部在社会交往对象的选择上更加审慎。","既看当下，更看长远，不贪图短期暴利，不急躁冒进，不超越承受能力而过度冒险，做到稳健经营、审慎监管、有序推进，才能持续推动我国金融机构、金融行业实现由大到强的转变。"]},{"id":991,"w":"耦合","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"两个或多个事物（系统、部分、因素）相互关联、彼此影响、联动配合，牵一发而动。","core":"两个或多个事物（系统、部分、因素）相互关联、彼此影响、联动配合，牵一发而动","exs":["在习近平强军思想指引下，该支队以体系思维破解转型难题，以要素耦合释放联动效能，在战斗力提升道路上全速疾驰。","我惊奇地发现，即使是在新技术的背景下，我们仍然面对着和古人相似的难题，在利用工程思维解决它们的时候，其表现出的像素集合竟然可以与最古老的意象完美耦合。"]},{"id":992,"w":"赓续","part":"s","gn":"十四","gt":"需要积累的其他词语","sub":"需要积累的其他词语","type":"two","expl":"继续、延续、继承并传承下去。","core":"继续、延续、继承并传承下去","exs":["革命老区，在新时代如何赓续红色血脉，弘扬伟大长征精神？","我们愿同台湾同胞一道，赓续传统文化根脉，深入开展文化交流合作，让两岸在弘扬中华文化中，激发情感共鸣、共促民心相通，增强中华民族归属感、认同感、荣誉感。"]}],"clusters":[{"part":"c","gn":"一","gt":"中华文明传统文化","sub":"中华文明传统文化","ws":["源远流长","连绵不绝","博大精深","历久弥新","兼收并蓄"]},{"part":"c","gn":"二","gt":"文化传承","sub":"传承不间断","ws":["一脉相承","血脉相通","薪火相传","不绝如缕","陈陈相因"]},{"part":"c","gn":"二","gt":"文化传承","sub":"传承方式","ws":["口耳相传","难以为继","后继无人"," s":1},{"no":28,"part":"c","src":"2023 年国考","stem":"当前背景下，宏观调控既要“防风险”又要“稳增长”。传统的逆周期调节能够较好地应对经济的短期波动，面对国内外经济的长期结构性调整则常常________。这就要求宏观调控________而跨周期调节正是在顶层设计的宏观调控框架下，促进不同政策工具的关联匹配，因此更能满足现阶段的调控要求。","blanks":2,"o":[["捉襟见肘","与时俱进"],["左支右绌","另辟蹊径"],["有心无力","推陈出新"],["难以为继","统筹兼顾"]],"ans":1},{"no":29,"part":"c","src":"2017 年联考","stem":"虽然没有法律强制力做支撑的道德是虚妄的，但是法律在面对道德问题时，也总是会显得________，这种力不从心的根本原因还是由于法律的外在属性与道德的内在属性之间的矛盾。社会秩序的大厦是法律与道德共同支撑的，如果道德不立，人心善变，那法律终会________。","blanks":2,"o":[["相形见绌","回天乏术"],["爱莫能助","孤立无援"],["左支右绌","独木难支"],["捉襟见肘","力所不逮"]],"ans":2},{"no":30,"part":"c","src":"2026 年国考","stem":"把握好动静之度，是解决问题的关键。过度求静易陷入消极懈怠、________的泥潭。在面对新问题时，往往会因为害怕承担责任或者担心打破现有秩序，一味地观望等待，致使问题越积越多。相反，情况不明时过于求动会让很多事情变得杂乱无章，往往________。","blanks":2,"o":[["安于现状","分身乏术"],["固步自封","事与愿违"],["裹足不前","措手不及"],["自暴自弃","适得其反"]],"ans":1},{"no":31,"part":"c","src":"2021 年广西区考","stem":"区块链的诸多特征使其成为一项备受期待的革命性技术，而目前这一技术的应用潜能还远未被完全开发。今天我们看到的区块链技术在金融、物流、医疗、保险等领域的应用，仅是________般的一瞥所见，尚有许多应用正在被尝试、推广。填入画横线部分最恰当的一项是：","blanks":1,"o":[["浮光掠影"],["走马观花"],["蜻蜓点水"],["浅尝辄止"]],"ans":0},{"no":32,"part":"c","src":"2023 年甘肃省考","stem":"针对人民教育出版社小学数学教材插图问题，教育部高度重视，________，对全国中小学教材教辅和进入校园课外读物的插图及内容进行了全面排查整改，确保体现正确的政治方向和价值导向，弘扬中华优秀文化，符合大众审美习惯。填入画横线部分最恰当的一项是：","blanks":1,"o":[["举一反三"],["一蹴而就"],["融会贯通"],["见微知著"]],"ans":0},{"no":33,"part":"c","src":"2022 年浙江省考","stem":"改革和法治如鸟之两翼、车之两轮。党的十八大以来，全面深化改革的一个鲜明特点，就是把法治贯穿于改革全过程，在法治下推进改革、在改革中完善法治，保证改革和法治相互促进、________。填入画横线部分最恰当的一项是：","blanks":1,"o":[["交相辉映"],["相映成趣"],["相得益彰"],["相为表里"]],"ans":2},{"no":34,"part":"c","src":"2021 年青海省考","stem":"实际上普通话和方言不是同一层次上的交际工具。普通话是全民共同语，是官方语言，而方言是区域性的，是民间语言。通过明确________，普通话和方言可以做到并行不悖，甚至________，相得益彰。","blanks":2,"o":[["规定","齐头并进"],["划分","互为表里"],["区分","珠联璧合"],["界定","相辅相成"]],"ans":3},{"no":35,"part":"c","src":"2020 年国考","stem":"古城区发展到一定阶段，适度地提升改造是必要的，但如果是通过“拆真”来为“建假”腾出地方，这样的开发改造必然是________。其实，提升改造与对老建筑的保护本来可以________，恰当地修缮，不但可以让历史建筑重新焕发活力，也能够提升城区的整体质量，达到提升改造的目的。","blanks":2,"o":[["顾此失彼","齐头并进"],["暴殄天物","双管齐下"],["得不偿失","并行不悖"],["舍本逐末","并驾齐驱"]],"ans":2},{"
