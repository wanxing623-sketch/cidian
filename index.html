括地写，也要落到一些典型画面上，通过不露声色的铺陈，为副歌抒情提供情绪的支撑和升华的动能。"]},{"id":548,"w":"闪烁其词","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"指说话故意含糊其辞、回避真相或要害问题，带有遮掩或推诿的意味。","core":"指说话故意含糊其辞、回避真相或要害问题，带有遮掩或推诿的意味","exs":["记者调查发现，通信营销人员在电话里常使用“免费升级”“限时优惠”等模糊话术或夸大套餐的优惠力度，却对限制性条款闪烁其词，消费者容易被误导。","《朝日新闻》在报道中称，石破茂在国会论战中一方面展现认真探讨姿态，另一方面却很少触及具体结论，有时甚至闪烁其词，反映了少数派执政党领袖难以发挥主导权的困境。","习近平总书记思之深、言之切：“对政治纪律和政治规矩，要十分明确地强调、十分坚定地执行，不要语焉不详、闪烁其词。”"]},{"id":549,"w":"扑朔迷离","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"出自《木兰诗》：“雄兔脚扑朔，雌兔眼迷离”，形容事情错综复杂、难以分辨清楚。","core":"出自《木兰诗》：“雄兔脚扑朔，雌兔眼迷离”，形容事情错综复杂、难以分辨清楚","exs":["国际社会普遍期待通过对话谈判按下战争的“停止键”，但各方围绕谈判接连给出相互矛盾的说法，让动荡的中东局势更加扑朔迷离。","青海都兰热水墓群出土的唐代扎经染色织物（斑布），在刘大玮团队的多重分析下揭开了扑朔迷离的身世。","人们很难解释，在战局最扑朔迷离的时刻，远在延安窑洞中的毛泽东，为何能如此准确地“预言”这场战争的每一阶段进程、形态和结果。"]},{"id":550,"w":"雾里看花","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"原指年老眼花，看花像隔了一层雾一样。现形容对事物看不真切。","core":"原指年老眼花，看花像隔了一层雾一样","exs":["过去看预算草案总有“雾里看花”之感，如今对数字背后的逻辑一目了然。","在传统的法律史研究中，研究者惯于从宏观制度和抽象理论层面展开论述，普通读者如同“雾里看花”。","随着平台生态日趋复杂，平台收费规则“雾里看花”、收费标准“任性随意”等问题，制约了平台内青年创业者的发展空间。"]},{"id":551,"w":"似是而非","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"指好像是对的，实际上不对；好像是，又好像不是。形容相似而不同但又容易被混淆的事物。","core":"指好像是对的，实际上不对","exs":["人们似乎在休息这件事上运用了太多的创造力，以至于有的时候造成了似是而非的内耗型休息，结果越歇越累，身体没法舒缓，心理也得不到放松。","从市场层面看，人工智能、物联网、元宇宙等前沿概念自带流量与关注度，企业将其作为包装产品的“招牌”，搞一些似是而非的创新，短期内或许能收割市场红利，但终会被市场淘汰。","写字的偏差，折射一个值得深思的现象：不少人对汉字的写法与内涵不甚了了，导致一些似是而非的用法。"]},{"id":552,"w":"高深莫测","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"高深：山川高而且深；测：测量。指为人或事深沉不可测，使人难以理解。","core":"指为人或事深沉不可测，使人难以理解","exs":["在他眼中，这本中国古代哲学思想的经典之作，看似高深莫测，实则处处指向现实人生。","有的另辟蹊径，以幽默诙谐的语言搭配妙趣横生的漫画，将认知神经科学方面高深莫测的研究成果以一种轻松愉悦的方式呈现给读者。","石阡县中医院聚焦广大群众养生需求，探索中医特色诊疗途径，积极搭建多维体验平台，将千年中医药文化融入新时代健康养生潮流，使中药智慧从“高深莫测”变得“触手可及”。"]},{"id":553,"w":"含糊其辞","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"辞：话。话说得不清不楚，含含糊糊。形容有顾虑，不敢把话照直说出来。","core":"形容有顾虑，不敢把话照直说出来","exs":["不少开锁商家在宣传时打着“几十元上门开锁”的旗号，当消费者咨询是否存在其他增项费用时，回复往往含糊其辞。","然而现实中，个别干部仍习惯于做“好好先生”：面对原则问题含糊其辞，面对歪风邪气明哲保身，面对矛盾冲突绕道而行。","有的在商品展示页清一色是坚果特写，宣传语反复强调“坚果”，却对非坚果产品的占比含糊其辞，甚至只字不提。"]},{"id":554,"w":"置若罔闻","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"置：放，指放在一边。若：好像。罔：没有。放在一边，好像没有听到。指不加理睬。","core":"放，指放在一边","exs":["对学校的规章制度，有的同学置若罔闻。","该严管的准入规则形同虚设，该审核的内容置若罔闻，该斩断的谣言任其滋生，自然就会让丑恶的、虚假的、庸俗的流量大行其道。","对于这些问题，如果置若罔闻、熟视无睹，就会积重难返，最终造成无法弥补的损失；如果守着过去的认识不思变化，那就难以继续前进。"]},{"id":555,"w":"熟视无睹","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"熟视：细看，经常看。睹：看见。看惯了就像没看见一样。也指对眼前的事物或现象漠不关心。","core":"也指对眼前的事物或现象漠不关心","exs":["让人费解的是，警示牌和停泊的车“共存”的原因，是此处的车对警示牌熟视无睹呢，还是警示牌在此处毫无用处？","既然都是假的，平台为何熟视无睹？诚然，如果守土失责，平台有意无意就成了骗子的帮凶。","一些学校并未重视，该监管却疏于监管，该对未成年人心理健康教育却走过场，该密切注意学生心理变化却熟视无睹，由此导致欺凌事件发生。"]},{"id":556,"w":"闭目塞听","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"塞：堵塞。闭着眼睛，堵住耳朵。指不与外界接触，脱离实际。","core":"指不与外界接触，脱离实际","exs":["成人动漫市场的开拓不但要广开言路，更需要身体力行。不然，闭目塞听，闭门造车，不但新市场难有拓展，产业发展的方向很可能会走入另一个没有出路的死胡同。","当然，这绝不意味着我们要刚愎自用、闭目塞听。中国共产党和中国人民取得的历史性成就，离不开世界各国人民的大力支持。","热爱生活不能掩耳盗铃，积极向上不能头脑简单、闭目塞听。"]},{"id":557,"w":"充耳不闻","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"充：塞住。形容故意不听别人的话。也形容对某些事漠不关心。也作“听而不闻”。（主观上故意或不重视）","core":"形容故意不听别人的话","exs":["有一些地方反应迟钝、动作迟缓，固守当时特定环境下的过度防疫举措，对社会叫停“一刀切”、扩大化等简单粗暴的阻隔举措的呼声充耳不闻。","长期以来，国际社会对此类问题严重关切，但美国政府却充耳不闻、漠不关心。","一些企业在业务做大后，便把需要担负起的责任抛之脑后，以开设售后维修网点需要房屋租赁成本、人工成本和技术成本等为借口，当起了甩手掌柜，将安装、售后等服务业务授权给第三方或者直接外包出去，对山寨维修点坑蒙消费者充耳不闻。"]},{"id":558,"w":"置之不理","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"置：放置。理：理睬。指放在一边而不予理睬。也作“置之不顾”。","core":"指放在一边而不予理睬","exs":["久而久之，政府信息公开就成为政府的“自愿行为”，一些政府部门对于公众的批评充耳不闻、置之不理。","落叶不扫，并非对落叶置之不理，而是要立足实际、倾听民意，统筹考虑城市交通安全、市容环境、道路管网等因素，予以优化调整。","尽管《鱿鱼游戏》全球火爆，但对青少年的影响却不能置之不理。“游戏”是虚构的，可孩子们是缺乏判断力的。除了家长、学校帮他们树立正确的人生观、价值观，也需要社会各界的配合。"]},{"id":559,"w":"嗤之以鼻","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"嗤：讥笑。用鼻子发出笑声，表示轻蔑，不以为然。","core":"用鼻子发出笑声，表示轻蔑，不以为然","exs":["自古以来，人们就对这种人嗤之以鼻。孔子说：“乡愿，德之贼也。”就是说那些不分是非、不得罪乡里的“好好先生”，其实是破坏道德的人。","若把每次的努力都看作内卷，对此嗤之以鼻，这既是对自我内心的麻痹，也是在为自己停滞不前的现状找借口。","问题的关键在于，家长是否以“少年不知愁滋味”嗤之以鼻，甚至是以“为赋新词强说愁”为名横加指责、无情打压？"]},{"id":560,"w":"视如敝屣","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"敝屣：破鞋子。像破烂鞋子一样看待。比喻非常轻视。","core":"比喻非常轻视","exs":["福建在新世纪的产业结构调整中，要正确处理发展高新技术产业与传统产业的关系，不能将传统产业视如敝屣抛在一边，去专门发展高新技术产业，这既不正确，也不现实。","他对金钱视如敝屣，只是追求心灵的满足。","对他来说，名利都视如敝屣，他真正追求的是艺术。"]},{"id":561,"w":"不屑一顾","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"不屑：认为不值得。顾：回头看。不值得一看，表示轻视、看不起。","core":"不值得一看，表示轻视、看不起","exs":["对这种流言蜚语，她向来是不屑一顾的。","当然，高校在专业设置上不应过分追逐热点，要避免对冷门专业“不屑一顾”。","当时美国主流媒体和科学家对此不屑一顾，《纽约时报》和《华盛顿邮报》直斥之为“阴谋论”。"]},{"id":562,"w":"束之高阁","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"不重视","type":"four","expl":"阁：放东西的架子。把东西捆绑起来，放在高高的架子上。比喻弃置不用。（多形容有价值的东西）","core":"比喻弃置不用","exs":["虽然时代在不断变迁，但社会的道德要求与价值坚守未变，传统家庭美德不应成为束之高阁的冰冷道理。","保护不是将文物束之高阁，让历史文化遗产走进日常生活才是最好的保护。","缩微拍摄后，古籍原件可以被更好地保护起来，古籍的内容也能“化身千百”、广为传播，而不是被“束之高阁”。"]},{"id":563,"w":"爱不释手","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"重视","type":"four","expl":"释：放下。喜爱得舍不得放手。","core":"放下","exs":["习近平总书记带来的学习用品，让马麦志的儿子马麦二苏和马奴龙吉爱不释手。“这是我们收到的最珍贵的礼物，我们一定要好好学习。”","是北京五十七中的学生，老是在我面前吹牛，说他有《浮士德》。我就去找他，说借我看看吧，我肯定还你。当时，我看了也是爱不释手。","视频网站带来的“连播”“刷剧”“追剧”的便利，显然让消费者爱不释手，但为了几集电视剧或者一部热门电影，花钱充个用不了几次的会员，让一些消费者有种“心痛的感觉”。"]},{"id":564,"w":"手不释卷","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"重视","type":"four","expl":"卷：古代指抄写的卷帙，即书籍。手中一直拿着书籍片刻不放。形容勤勉好学或读书入迷。","core":"古代指抄写的卷帙，即书籍","exs":["有一次在一位乡村教师那里发现很多好书，有《红与黑》《战争与和平》等，让他喜出望外，手不释卷，读了个够。","数字化阅读日益普及的当下，有人习惯于手不释卷，独爱翰墨书香，在纸质书卷中感受阅读的魅力；有人钟情于视听兼备，喜欢声画共赏，在数字化世界里享受读书的乐趣。","回望峥嵘岁月，许多革命先辈把学习当作一种追求、一种习惯，无论条件多么艰苦，始终手不释卷、勤学不辍。"]},{"id":565,"w":"视若珍宝","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"重视","type":"four","expl":"形容十分珍爱，将其当成无价之宝。","core":"形容十分珍爱，将其当成无价之宝","exs":["走进连队，习近平主席与巡逻官兵亲切合影的大幅照片映入眼帘。照片上，站在习近平主席身边的吴景伟防寒面罩上结了霜。战士们视若珍宝的这张照片，承载着统帅对边防的牵挂与厚爱。","这件曾国藩亲笔书写的家训，曾氏后人把它视若珍宝，悉心保藏百余年，并不为世人所知。","2019年，在四川凉山木里县的森林火灾中，27名森林消防队员为了他们视若珍宝的森林、为了肩上沉甸甸的使命，献出了宝贵的生命。"]},{"id":566,"w":"奉为圭臬","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"重视","type":"four","expl":"奉：信奉，尊奉。圭臬：古代用以测日影的仪器，比喻法度或准则。指把某些事物或言论尊奉为准则。","core":"古代用以测日影的仪器，比喻法度或准则","exs":["十八世纪末，自然主义风靡一时，政治、经济、社会、教育、文艺等等，无不奉为圭臬。","如果对此我们不去很好地继承和发扬，非要弃之如敝履，转而把西方的散文奉为圭臬，对之亦步亦趋，一味学习和效仿，这种所谓的“转型”，显然是不可取的。","然而，细心的人们会发现今年“双十一”各大平台在公布数据时都非常谨慎，不再把成交额奉为圭臬。"]},{"id":567,"w":"举足轻重","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"是否重要","type":"four","expl":"形容有实力，地位重要，能左右局势的发展。","core":"形容有实力，地位重要，能左右局势的发展","exs":["今天的经济，某种程度上说是一种信心经济，社会预期对经济走向起着举足轻重的作用。","实践证明，不断推动教育数字转型、智能升级、融合创新，对于推进教育现代化、办好人民满意的教育具有举足轻重的意义。","西部地区在全国改革发展稳定大局中举足轻重。长期以来，由于历史和自然条件等原因，西部地区经济基础相对薄弱，开放开发程度滞后于东部地区。"]},{"id":568,"w":"无足轻重","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"是否重要","type":"four","expl":"没有它并不轻些，有它也并不重些。指无关紧要。","core":"指无关紧要","exs":["那种无视我国工人阶级成长进步的观点，那种无视我国工人阶级主力军作用的观点，那种以为科技进步条件下工人阶级越来越无足轻重的观点，都是错误的、有害的。","6000元的胶原蛋白，6800元的轮廓针，18000元的少女针……在医美消费者眼里，这些不菲的花费与由此带来的精致容貌及愉悦心情相比变得无足轻重。","在这个竞争激烈的社会中，越来越多的人感到没有立足之地，仿佛自己是一个无足轻重的人。"]},{"id":569,"w":"细枝末节","part":"c","gn":"四十五","gt":"重视、重要相关","sub":"是否重要","type":"four","expl":"末节：小事情，小节。细小的树枝，微末的环节。比喻事情或问题的细小而无关紧要的部分。","core":"比喻事情或问题的细小而无关紧要的部分","exs":["日新月异的发展质量，既体现在高楼大厦、车水马龙的繁华景象里，也蕴含在日常生活的细枝末节和基层治理的末梢神经之中。","新时代中国青年在基层一线磨砺无怨无悔。基层舞台小到细枝末节都要关心、大到民生疾苦都要操劳，可正是在这个过程中青年才长了才干、壮了筋骨。","这些被忽略之处，如果是细枝末节，也许没什么损失，如果恰恰是全书的精华所在，岂不是“入宝山而空返”？"]},{"id":570,"w":"驾轻就熟","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"比喻对所做的事情熟悉，办起来容易。","core":"比喻对所做的事情熟悉，办起来容易","exs":["刘云今年61岁，对网络购物、线上支付驾轻就熟。","他们都是有着多年管理经验的种植能手，清楚花椒树的“脾气秉性”，种植不再是技术难题，剪枝更是驾轻就熟。","持之以恒开展防灾减灾教育，让学生们对灾害知识“了如指掌”，对防灾减灾技能“驾轻就熟”。"]},{"id":571,"w":"轻车熟路","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"轻车：负载轻的车子。驾着负载很轻的车子，走熟悉的道路。比喻事情又轻松又熟悉，办起来很容易。","core":"比喻事情又轻松又熟悉，办起来很容易","exs":["对于写信息写调研我可以说是轻车熟路，至于讲这个政治课题，当时着实难为我了。","我们和土地打了大半辈子交道，种蔬菜可谓轻车熟路。","村民苑忠国正在准备春耕，多年来通过参与县里的培训，春耕物资的采购对他来说已是轻车熟路。"]},{"id":572,"w":"了如指掌","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"了：明了，明白。指掌：指着手掌。指对事物的了解非常清楚，像把东西放在手掌里让人看一样。","core":"指着手掌","exs":["老百姓天天跟地方官员直接打交道，对政府官员的作风，对“放管服”的好政策在下面是否严格执行了如指掌。","因为有了每个田块的精细化记录，让刘香富对田块信息了如指掌、有凭有据，真正可以做到“缺什么、补什么”，“缺多少、补多少”。","当农业生产有了数字科技的“加持”，只需一台电脑、一个屏幕，动动鼠标，农民就能对无人农场的运行情况“了如指掌”。"]},{"id":573,"w":"耳熟能详","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"详：详细地说出来。指听得多了，也就能详尽地讲述出来。","core":"指听得多了，也就能详尽地讲述出来","exs":["大家耳熟能详的诗人杜甫，曾在这里泛舟。","通过一幕幕场景、一个个耳熟能详的名字，一张张忏悔笔录、一件件触动心灵的警示案例，让大家再一次接受思想和灵魂的洗礼，受到深刻的警示教育。","当耳熟能详的歌曲在夜色中隔空传来，立即引发市民临时组建“跟唱团”。"]},{"id":574,"w":"如数家珍","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"家珍：家中收藏的珍宝。如同数自己家藏的珍宝那样清楚。形容对所讲述的东西非常熟悉。","core":"形容对所讲述的东西非常熟悉","exs":["我跟着老工程师来到成果展览室，他如数家珍，讲得很详细。","派出所辖区的265个治安监控探头，位于什么路段、具体朝向哪里、点位编号多少，他都如数家珍。","她和家人对牡丹、芍药的生长、花色以及栽培等问题如数家珍。"]},{"id":575,"w":"烂熟于心","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"形容很熟悉","type":"four","expl":"烂：程度很深。心中有数，十分熟悉。","core":"程度很深","exs":["要想做到脱稿讲话，必须对自己的工作和工作中的问题烂熟于心，照本宣科反映出一个人思维方式的呆板。","认认真真研读《条例》原文，深刻领会主旨要义，熟练掌握规定要求，特别是对“六项纪律”要烂熟于心。","污泥处理系统错综复杂，我们必须对系统的运行机制烂熟于心。"]},{"id":576,"w":"妇孺皆知","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"谁都知道","type":"four","expl":"孺：小孩。妇女、小孩全都知道。指众所周知。","core":"指众所周知","exs":["这些倡导人与人之间友爱互助的名言，在中华民族历史上可谓家喻户晓、妇孺皆知，并产生了世界性影响。","“朱德的扁担”故事家喻户晓，妇孺皆知。","“不贪不义之财，不做损人之事”“勤劳踏实，戒贪守矩”……这些是在永德县广为流传、妇孺皆知的俐侎人谚语。"]},{"id":577,"w":"家喻户晓","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"谁都知道","type":"four","expl":"喻：知道，明白。家家户户都知道。形容人人皆知。","core":"形容人人皆知","exs":["中国女排夺取世界冠军的消息，已是家喻户晓，尽人皆知了。","他的名字家喻户晓，他的事迹温暖人心，他的精神滋养着一代代中国人。","开展宣讲活动400余场次，受众群众达20余万人，进一步推动党的创新理论家喻户晓。"]},{"id":578,"w":"不甚了了","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"不知道","type":"four","expl":"意思是指心里不太明白，不是很清楚。","core":"意思是指心里不太明白，不是很清楚","exs":["有些剧本杀实体店是由棋牌室转项的，经营者对如何运营剧本杀实体店不甚了了，花几百元钱甚至几十元钱买个剧本就盲目入行。","单位领导看到的是窗口工作人员说“自己干得很好”的年终述职报告，而对其一年来的具体表现情况，不甚了了。","但看魏晋“微博”时，因为当时的人、事距今太远，如果没有注解，《世说新语》的不少故事就会不甚了了，难以读懂。"]},{"id":579,"w":"默默无闻","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"不知道","type":"four","expl":"意思是指做事无声无息，无人知晓，做了好事不声张，不图名利，没人知道。","core":"意思是指做事无声无息，无人知晓，做了好事不声张，不图名利，没人知道","exs":["上了“好汉墙”的官兵是好汉，但那些默默无闻、无私奉献的无名好汉也都是真正的好汉。","现在，越来越多像牛德成、管益辉一样的一线职工，从最初的默默无闻到如今“高光”下的闪亮登场，成为新时代山东产业工人的“新偶像”。","6年时间，我们从零起步，一步一个脚印，从默默无闻到逐渐走上舞台。"]},{"id":580,"w":"鲜为人知","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"不知道","type":"four","expl":"鲜：少。为：被。知：知道。很少有人知道。","core":"少","exs":["实际上，有关蔬菜中的农残，存在着不少鲜为人知的规律。","对很多人来说，“飞虎队”这个名字并不陌生，但这个名字的由来、他们在中国大地上经历的故事，却鲜为人知。","而在它的背后，也有很多鲜为人知的故事。"]},{"id":581,"w":"匪夷所思","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"近义辨析","type":"four","expl":"形容人的思想、言谈、技艺、事情等离奇，超出寻常，指行为举止离奇古怪，超出常情，不是一般人根据常理所能想象的。","core":"形容人的思想、言谈、技艺、事情等离奇，超出寻常，指行为举止离奇古怪，超出常情，不是一般人…","exs":["柯林斯认为，目前美国将佩戴口罩政治化的做法匪夷所思。他呼吁美国民众能佩戴上口罩并保持社交距离，尽量减少新冠病毒的传播。","“微观保龄球”可以被看为变成了两个“分身”，从两道缝隙间同时穿过。这在宏观世界中是匪夷所思的。","美方此番炒作，对于业内人士来说，在技术上实属匪夷所思，在政治上则可理解为推动对华“脱钩”、替代“中国制造”寻找借口。"]},{"id":582,"w":"不可思议","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"近义辨析","type":"four","expl":"原有神秘奥妙的意思，是佛教用语。现多指无法想象，难以理解。","core":"现多指无法想象，难以理解","exs":["近日在以色列一家野生动物园出现了一对不可思议的组合，一只猕猴居然“收养”了一只小鸡。","古村里人人会直播，户户做电商的潮流，也让来自全球各地的国际学徒们惊呼不可思议。","可能是嫌那天周围环境太嘈杂，喜乐把自己胖乎乎的身子卡在拱桥边的一道缝里，看似不可思议，但它没过一会儿就倍儿轻松地扭出来了。"]},{"id":583,"w":"感同身受","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"代入他人处境","type":"four","expl":"意为内心感激就如同亲身受到恩惠一样。后指虽未亲身经历，但感受就同亲身经历过一样。","core":"后指虽未亲身经历，但感受就同亲身经历过一样","exs":["同样获得“加油木兰”项目理赔的双井村低保户龙老书老人一家更是感同身受。","我们生于斯、长于斯，熟悉这片土地的烟火百态，感同身受各民族相融共生的温暖，更深知中华非遗文脉的珍贵。","当代年轻人这种害怕孤独、渴望陪伴却又如此恐惧真实情感投入的状态，让同样在大城市生活的我感同身受。"]},{"id":584,"w":"设身处地","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"代入他人处境","type":"four","expl":"设：设想；身：自身。指设想自身处在别人的地位或环境中，替别人的处境着想。","core":"指设想自身处在别人的地位或环境中，替别人的处境着想","exs":["思想碰撞中，大家对“政绩为谁而树、树什么样的政绩、靠什么树政绩”有了更深刻的理解，最终形成共识：只有设身处地倾听基层诉求，想方设法解决官兵难题，才能赢得信任与拥护。","一年的基层挂职经历，使他在参与制定相关政策时更有底气，更能设身处地站在基层角度考虑问题。","其本质就是把“人民”二字融入司法血脉，感其痛苦、明其诉求、捍卫权益、传递温度，设身处地感受群众的急难愁盼。"]},{"id":585,"w":"身临其境","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"代入他人处境","type":"four","expl":"身：亲身。指亲自到了那个境地，获得切身的感受。","core":"指亲自到了那个境地，获得切身的感受","exs":["这座“工业地标+数字艺术+精酿餐饮+文创零售”四位一体的潮玩空间，迅速成为打卡胜地，为市民游客带来一杯爽口的青岛啤酒、一场身临其境的数字沉浸展，以及一份独特记忆。","把语文和地理课堂搬到诗词的“取景地”，让学生们在身临其境的体验中更好学习课本知识。","来宾们在各展台流连忘返、乐在其中，通过汉字书写、吹墨画、非遗剪纸、骏马拓印、汉服试穿和投壶、套圈传统游戏等，身临其境地感受到中国优秀传统文化的博大精深和独特魅力。"]},{"id":586,"w":"推己及人","part":"c","gn":"四十六","gt":"熟悉、了解、知晓相关","sub":"代入他人处境","type":"four","expl":"推：推想。指以自己的心思去推想别人的心思，设身处地为别人着想。","core":"指以自己的心思去推想别人的心思，设身处地为别人着想","exs":["明确将修身置于核心位置，从内向的认知到外向的实践，搭建了从个人、家庭关系扩展到社会关系，推己及人、由近及远的道德自觉过程。","负责人表示，希望通过此次画展，以绘画和手工艺创作为媒介，让特殊儿童的艺术天赋和内心世界被看见、被理解、被尊重，传递将心比心、推己及人的同理心，促进社会更加和谐有爱。","当发生矛盾冲突时，大家相互能设身处地、推己及人，“己所不欲，勿施于人”，于是化干戈为玉帛，达到“和合”。"]},{"id":587,"w":"司空见惯","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"原指司空看惯了某事以为平淡；后比喻常见之事；不足为奇。","core":"原指司空看惯了某事以为平淡","exs":["枪支暴力事件在美国已经司空见惯，媒体和公众对频发的枪击事件感到麻木。","大街上车水马龙，来来往往……日复一日，相信大家都司空见惯了。不过对于某些特殊的人群，早晨却是个危险的时刻。","督促村“两委”班子坚持从群众司空见惯的小事入手，对全镇人居环境治理工作进行细化，坚持由易到难、从点到面全覆盖，形成镇村干部齐抓共管、广大群众人人参与的良好局面。"]},{"id":588,"w":"屡见不鲜","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"鲜：新鲜。经常见到，并不新鲜。同“数见不鲜”。","core":"新鲜","exs":["近几年，在经济社会生活中，不讲信用、恶意拖欠、拒不执行合同及法院裁决等现象屡见不鲜。","商家违法违规成本不高，导致类似行为还是屡见不鲜。要想改变这种现状，还得进一步加大惩处力度，对商家形成有力震慑，同时要进一步畅通维权通道，鼓励消费者站出来维权。","现实生活中，这样的事例屡见不鲜，有些家长以“爱孩子”的名义剑走偏锋，沉湎于家庭暴力而不自知，甚至给孩子造成无法挽回的伤害。"]},{"id":589,"w":"习以为常","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"常做某种事情或常见某种现象，成了习惯，就觉得很平常了。","core":"常做某种事情或常见某种现象，成了习惯，就觉得很平常了","exs":["习近平总书记强调，调查研究是获得真知灼见的源头活水，是做好工作的基本功，调查研究要经常化。由此可见，调查研究作为做好工作的“看家本领”，不仅要能用善用，而且要多用常用，“曲不离口、艺不离手”，使之习以为常。","电平稳、冰箱能正常使用，对于翁多来说曾是一种奢望，而如今已习以为常。翁多说，自己和许多居民都受益于吉布洛水电站的修建。","南方孩子发自内心对雪的好奇与热爱，西岭雪山滑雪冬令营的滑雪教练吕辉已经习以为常。"]},{"id":590,"w":"不足为奇","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"不值得奇怪。指某些现象或事物很平常，没有什么特别的。","core":"指某些现象或事物很平常，没有什么特别的","exs":["对于很多打算抄底中国房地产的外资来说，表面唱空实际做多是他们多年来一贯使用的伎俩，早已不足为奇。","移动互联时代，多元的阅读场景增加了人们对配音人员的需求，雨后春笋般涌现的配音兼职招聘信息自然也就不足为奇了。","我们带着这些局限去想问题、做事情，最后出现过失也不足为奇，所以才有了“人非圣贤，孰能无过”这样的说法。"]},{"id":591,"w":"见怪不怪","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"看到奇异的事物，镇定自若，不大惊小怪。","core":"看到奇异的事物，镇定自若，不大惊小怪","exs":["一楼政务大厅一名工作人员说，她一年多前进入单位时就有这个指示牌了，“不管是工作人员还是周围群众，早已见怪不怪。”","各级领导干部要善于发现问题、研究问题，不能对问题见怪不怪、习以为常。","众所周知，舞台艺术的演出成本不菲，所以几十元甚至百元以上的票价就见怪不怪，许多人也因此望而却步，并与其渐行渐远。"]},{"id":592,"w":"无独有偶","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"意思是虽然罕见，但是不止一个，还有可以配对的，表示两件事或两个人十分相似。","core":"意思是虽然罕见，但是不止一个，还有可以配对的，表示两件事或两个人十分相似","exs":["“在新的历史时期，中国梦的本质是实现国家富强、民族复兴、人民幸福。”无独有偶，今天的拉美和加勒比国家也有着与此高度一致的梦想：发展经济、改善民生。","近日，宁波一名11岁男孩开设科普账号，用视频方式向公众解说昆虫知识的新闻引发不少的关注。无独有偶，浙江杭州一名初中生在网上发布的一系列视频也引起不小的动静。"]},{"id":593,"w":"习焉不察","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"习：习惯；焉：语气词，有“于此”的意思；察：觉察。指经常接触某种事物，反而觉察不到其中存在的问题。","core":"指经常接触某种事物，反而觉察不到其中存在的问题","exs":["通过古今对比，读者能够直观了解到今天人们习焉不察的寻常巷陌、残碑断础、古寺旧苑的往昔辉煌。","面对海量世界文学经典，我们常常习焉不察，忽略了文学的真谛需要百转千回地品读回味。","从习焉不察的刷脸入园到引人尖叫的AR玩法，科技让江苏旅游变得“更先进”“更好玩”。"]},{"id":594,"w":"微不足道","part":"c","gn":"四十七","gt":"很常见不奇怪","sub":"很常见不奇怪","type":"four","expl":"微：微小；道：谈起。意义、价值等小得不值得一提。","core":"微小","exs":["米兰冬奥会精彩纷呈，中国体育代表团在收获三枚奖牌的同时，在多个项目上还实现了成绩突破。虽然只是一点看似微不足道的进步，但都将成为中国冰雪未来通往更大成功的一座座丰碑。","在他看来，每一个看似微不足道的基因，都可能蕴含着应对某种未知挑战的独特密码——有的能抵御干旱，有的能耐受盐碱。","“堤溃蚁孔，气泄针芒”，私德的失守，往往从不经意的细枝末节开始，一些看似微不足道的“人之常情”“下不为例”，往往就可能暗藏丢私德、损公德、失大德的“病毒”“细菌”。"]},{"id":595,"w":"各持己见","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"持：抓住不放。各人都坚持自己的意见。","core":"抓住不放","exs":["11月的美国大选，双方各持己见，一方认为这次选举是美国历史上最公平的选举之一，一方认为存在大量舞弊行为。","庭审中，五兄妹各持己见。老二认为老大一直居住在外地，老五目前居住的房产也系祖产之一，两个姐妹早已出嫁，按照当地农村风俗没有继承权，故这三间祖产房屋应归他一人所有。","面对几栋近代建筑是否拆除的问题，刘子力与张杰团队各持己见。刘子力认为建筑本身文物价值较低，不如重建几栋与周边风格相统一的建筑。张杰团队则认为，这是陶阳里历史的一部分，在不影响整体建设格局的前提下，应该保存下来。"]},{"id":596,"w":"众说纷纭","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"纷纭：多而姑乱。人多嘴杂，议论纷纷。（前面可加主语，也可不加主语；有时可做形容词）（侧重观点多）","core":"有时可做形容词）（侧重观点多）","exs":["对普通人而言，日常生活的“短视频化”意味着什么？对此的回答众说纷纭，正反两方面的结论都不乏例证支撑，最关键的不是去重复这些例证，停留于赞成或批判的表面文章，而是要全面思考短视频所带来的媒介逻辑变更，在此前提下努力增强个体的自觉意识与应对能力。","尽管“地震云”的研究似是有所收获，但诸多专家的研究并不共通，不仅“地震云”的成因众说纷纭，就连“地震云”到底呈长条带状、豆状、蜂窝状还是漩涡云也没有共识。","目前，淀粉肠的标准众说纷纭，各企业在送检时，采用的是各自的企业标准，导致检测结果“自说自话”。"]},{"id":597,"w":"莫衷一是","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"莫：不能。衷：折衷，判断。是：对。不能断定哪个对，哪个不对。也指意见纷纭，分歧很大，不能得出一致的结论。（侧重观点难以统一）","core":"也指意见纷纭，分歧很大，不能得出一致的结论","exs":["个中原因莫衷一是，有的专家将之归咎为英国近年来执行的紧缩政策导致高校科研和培养师资的经费不足，有的专家则认为，这是生源水平下降的结果。","对于不同学科间的交叉领域由哪些知识要素、观念要素、程序要素等构成，各方仍然莫衷一是，导致科学教材难以基于要素特性来设计内容，尚未从科学教育体系内部、在学习者心智层面上实现深度联结。","各类信息芜杂繁复，让人莫衷一是。对此，应保持清醒。如果偏听偏信，很有可能误伤某一方。"]},{"id":598,"w":"针锋相对","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"意思是针尖对锋芒。比喻双方在策略、论点及行动方式等方面尖锐对立。","core":"意思是针尖对锋芒","exs":["1975年他开始主持党、国家、军队日常工作，为扭转“文化大革命”造成的严重混乱局面，开展大刀阔斧的全面整顿，同“四人帮”进行针锋相对的斗争。","韩国各地实习和住院医生大规模集体请辞和离岗进入第三天，政府在维持严正应对立场的同时下达了复工命令。专业医生团体“大韩医师协会”表示，国民的生命权固然重要，但医生选择职业的自由同样是国民的基本权利，应获得尊重，与此同时，韩国政府坚持按照原则执法的立场，双方针锋相对，互不相让。","在美国政治极化、两党长期针锋相对的背景下，政府预算问题同样沦为党争的战场，而随着2024年美国总统大选的临近，两党争斗会变得愈加激烈，这种政治上的不稳定正在给美国社会带来越来越多的不确定性。"]},{"id":599,"w":"各执一词","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"指不同的人或群体持有不同的说法或观点，且这些观点往往相互对立，强调多方观点的对立与争论。核心在于展现不同立场间的矛盾冲突，常用于描述公开争论或复杂局面。","core":"指不同的人或群体持有不同的说法或观点，且这些观点往往相互对立，强调多方观点的对立与争论","exs":["前端排查网格化，纠纷化解在萌芽，邻里间的情谊本应如潺潺溪流，温润绵长，然而4月23日，一场因屋边果树地界不清引发的纠纷，却让大发乡某村的谭某某与邻居两家关系陷入了僵局，双方各执一词，言语间的争执不断升级。","发生医疗纠纷，医患双方往往是“公说公有理，婆说婆有理”，双方各执一词，矛盾不断激化。","接到12345热线后，白沟新城党群工作部（人力资源和社会保障局）迅速响应，专门成立了调查小组深入到企业核实调查，并分别与双方进行了面对面的沟通交流，由于双方存在争议，现场各执一词，僵持不下。"]},{"id":600,"w":"见仁见智","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"对同一事物或问题，不同的人因立场、角度或认知差异会产生不同的理解和看法。强调观点的主观性和多样性，常用于表达对分歧的包容态度。","core":"强调观点的主观性和多样性，常用于表达对分歧的包容态度","exs":["素以凝练含蓄见长的中国古诗，常以一当十，意蕴内敛，许多文本理解起来颇具难度，见仁见智，完全逸出或偏离作者本意的也不鲜见。所以古人云：“诗无达诂。”","如果让你说出，最能代表中国文化的一个字，相信一定会见仁见智，各有所钟。中华文化博大精深，中国文字浩如烟海，这不足为怪。","如果执着于还原原作场景，难免见仁见智，可能是一件吃力不讨好的事情。“戏剧幻城”的主创团队拓展了《红楼梦》文本内容，突破性地把“读者的故事”搬上舞台，让读者成为主角。"]},{"id":601,"w":"各抒己见","part":"c","gn":"四十八","gt":"看法一致与否","sub":"不同观点","type":"four","expl":"抒：抒发、发表；见：见解。意指各人充分表达自己的见解。","core":"意指各人充分表达自己的见解","exs":["此外，针对AI对外语学科的冲击、外语人才培养模式面临的新要求与挑战等议题，与会专家各抒己见，为后续学科建设提供思路。","不同岗位的职工们围绕书籍内容各抒己见，既有对经典篇章的深度解读，也有对职业发展的深刻思考，更有对美好生活的热切向往，现场思想碰撞、精彩纷呈，掌声不断。","让知名医院、街道社区医疗机构、乡村卫生机构各抒己见，集思广益，努力把“人工智能+医疗”从部分学科、部分医院的“点状尝试”，升级为可借鉴、可复制、可推广的实践成果。"]},{"id":602,"w":"不置可否","part":"c","gn":"四十八","gt":"看法一致与否","sub":"态度模糊两边倒","type":"four","expl":"置：搁置，安放；可否：可以不可以。不说可以，也不说不可以。指不表明自己的态度。","core":"指不表明自己的态度","exs":["宋女士在劳动仲裁阶段主张该公司承诺过工龄承接，并且签署过一份书面工龄承接协议，但由于她无法拿到这份协议的原始材料，加之公司当庭对此不置可否，导致无法将此前5年时间的工龄连续计算至解除劳动关系经济补偿金之中，对宋女士的权益造成明显的损害。为此，宋女士向工会寻求帮助。","面对记者的质问，对方不置可否，未予回应。","在致电详细了解4980元是否包含全周期所有费用时，商家客服人员不置可否，再三追问下才说还包括额外费用。"]},{"id":603,"w":"模棱两可","part":"c","gn":"四十八","gt":"看法一致与否","sub":"态度模糊两边倒","type":"four","expl":"模棱：含糊，不明确；两可：可以这样，也可以那样。指不表示明确的态度，或没有明确的主张。","core":"指不表示明确的态度，或没有明确的主张","exs":["提案国对决议草案作出改进，但有些修改意见没有纳入案文，决议草案在若干关键问题上仍模棱两可，令中方担忧可能达不到预期效果，甚至带来消极后果，导致地区紧张局势进一步升级。因此中方在表决中投了弃权票。","罗弘在书中写道，在西方一些人对中国污名化的背后，是以美国为首的西方国家声称要维护所谓“基于规则的秩序”，“但这一规则实际上是模棱两可、孤立于国际法之外的规则”。","“自产自销农产品免税政策我们之前不了解，很多地方都还模棱两可，还好税务局的干部下乡进行宣传，原本觉得复杂的问题几分钟就解决了。”蔬菜种植农户老王高兴地说。众人对某一个人态度"]},{"id":604,"w":"人心所向","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"意思指的是人民群众所拥护的、向往的事物或者方向。","core":"意思指的是人民群众所拥护的、向往的事物或者方向","exs":["瑙鲁政府的决定，再次充分说明，一个中国原则是人心所向、大势所趋，不可阻挡！台湾从来不是一个国家，过去不是，今后更不是。","中方欢迎这一历史性的决议，因为它反映了国际社会的人心所向。中方认为，“两国方案”是解决巴以问题的唯一现实出路，巴勒斯坦成为联合国正式会员国是迈向这一目标的重要一步。","世界绝不会退回到相互封闭、彼此分割的状态，开放合作仍是历史潮流，互利共赢仍是人心所向。"]},{"id":605,"w":"人心向背","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"人心：民众的意愿；向背：拥护或反对。指人民群众出自内心的拥护或反对。","core":"指人民群众出自内心的拥护或反对","exs":["对党员、干部特别是领导干部而言，政绩观不是抽象的理论概括，而是世界观、人生观、价值观在政治实践中的集中投射，关乎人心向背，关乎党和国家事业成败。","遵循执政规律，首先要深刻认识“人心就是力量”的历史逻辑。任何政党的前途和命运最终都取决于人心向背，这是历史反复证明的铁律。","“党的作风就是党的形象，关系人心向背，关系党的生死存亡。”政绩观正不正，关系到党员干部的作风硬不硬，影响其干事创业的成效。"]},{"id":606,"w":"不负众望","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"意思是指为人所信服，很争气，不辜负大家的期望。","core":"意思是指为人所信服，很争气，不辜负大家的期望","exs":["中央政治局的同志要在全面学习、全面把握、全面落实党的二十大精神上带好头、作表率，不辱使命、不负众望，切实把思想和行动统一到党的二十大所作出的各项决策部署上来。","对于这次获得上海市五一劳动奖章的荣誉，王建永表示，这份荣誉不单单属于他个人，而是属于和他奋斗在同一战线上的全体同仁，五一劳动奖是对我们劳动者最高的褒奖，作为这份认可的回报，我们将继续不负众望，在建筑移位的领域中攻坚克难。","辽宁女乒不负众望再次夺冠。"]},{"id":607,"w":"不孚众望","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"孚：信服。不能使群众信服。","core":"信服","exs":["新上任的书记，因不孚众望，很快就下台了。","“不孚”指不能使人信服，“不孚众望”只能理解成不能使大众信服、辜负了大家的期望。这显然和赞扬梅西的本意大相径庭。","这次选举，本来他是最有希望的，但由于他近来的所作所为不孚众望，结果落选了。※注：人民网关于不负众望和不孚众望的辨析：“不负众望”误为“不孚众望”。2022年12月18日，卡塔尔世界杯决赛，阿根廷队击败法国队夺得冠军，梅西不负众望，率领阿根廷队捧起大力神杯。有媒体在报道相关新闻时，把“不负众望”误为了“不孚众望”。“负”指辜负；“不负众望”即没有辜负众人的希望、期待。“孚”读fú，指令人信服，如“深孚众望”便指使大众非常信服，享有很高的威望。“不孚”指不能使人信服，“不孚众望”只能理解成不能使大众信服、辜负了大家的期望。这显然和赞扬梅西的本意大相径庭。"]},{"id":608,"w":"异口同声","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"不同的人说出相同的语，用于形容众人意见一致。","core":"不同的人说出相同的语，用于形容众人意见一致","exs":["于水情的沮丧很快被“井冈红”研支团的队友们发现了，他们给她鼓劲打气。“状态不好，我可以帮你代课，队友们都可以帮你代课。”队友陈俊奇、陈泽鹏和曾佳颖几乎异口同声地说。","张殿凤站出来说：“如果你们都不愿意，我来出吧！”姐弟异口同声地表示“这怎么好意思”，最终分摊了手续费。","他们的决赛对手是韩国组合金元昊/徐承宰，展望决赛，“梁王”组合异口同声地表示，要有耐心。"]},{"id":609,"w":"众口一词","part":"c","gn":"四十八","gt":"看法一致与否","sub":"近义辨析","type":"four","expl":"指所有人说同样的话，形容意见完全一致。","core":"指所有人说同样的话，形容意见完全一致","exs":["现存的历史文献都没有中国产狮子的记载，历代学者众口一词都认为狮子产于西域。","去年下半年，这位村民在“户户通”微信群看到大家“众口一词”对自己的负面评价，心中十分羞愧，依然戒断酒瘾，并主动加入到村文明实践站的志愿服务队伍。","在场的消费者众口一词：要么配料表上配料越少越好，要么就是标有“零添加”“清洁标签认证”等。"]},{"id":610,"w":"一孔之见","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"从一个小孔里看到的事物。比喻片面的观点见解。多谦称自己的看法。","core":"比喻片面的观点见解","exs":["纵观这几年的主题创作，中国作协创研部理论处处长、研究员岳雯感到，不少作家写一件事情，看山依然是山、看水依然是水，缺乏从高处和总体性上来观照这个时代的主题，“如果只局限在就事论事，写到的历史、所观察的时代永远是我们的一孔之见”。","提升效能，是机关工作必须改变的一种工作方式，就如何提升效能，我结合工作实际，谈谈个人的一孔之见。","由此可见，在深耕特定研究领域的科学家眼里，也不存在完全无用的“闲书”，而是注意通过广泛阅读，避免形成一孔之见。"]},{"id":611,"w":"管窥蠡测","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"管：竹管。窥：从孔隙中看。蠡：瓠瓢。测：测量。管中视天，以瓢量海水，喻眼光狭小，见识不广或不自量力。（中性词）（侧重整体与部分对比）","core":"（中性词）（侧重整体与部分对比）","exs":["“知屋漏者在宇下，知屋政失者在草野”。是的，如果主政者井蛙观天，孤陋寡闻，视世情必管窥蠡测，察时势则如坐云雾，一不小心就会压抑活力，积攒怨气。","现在的判断只是管窥蠡测，要想掌握整个案情，还得深入地调查才行。","“他们不曾说明，这是我的管窥蠡测。”这句话表达了说话者对自己的观点或了解的谦虚态度，认为自己可能只是看到了事情的表面，并没有深入了解。"]},{"id":612,"w":"盲人摸象","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"比喻看问题不全面，以偏概全。（现更多用字面义，形容做一件事毫无头绪地摸索）","core":"比喻看问题不全面，以偏概全","exs":["“世界上的事物总是有着这样那样的联系，不能孤立地静止地看待事物发展，否则往往会出现盲人摸象、以偏概全的问题。”深入学习领会习近平总书记的重要论述，我们深刻体会到，坚持普遍联系的观点，从客观事物本身的真实联系去把握事物、认识问题和处理问题，是一种科学思想方法。","像你这样东读一点，西背一点地记单词，就像盲人摸象，是学不好英语的。","实践问题总是复杂的、涉及多方面的、综合性的，如果在理论学习中一知半解、难窥全貌，理解上往往会盲人摸象，实践中就可能失之毫厘谬以千里。所以要系统全面学习，才能够登堂入室，获得真谛。"]},{"id":613,"w":"管中窥豹","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"管：竹管。从管中看豹。比喻见识狭小，看不到全面。（也可以比喻只看事物的一部分而推测全貌—最近多用）（中性词）（侧重整体与部分对比）","core":"比喻见识狭小，看不到全面","exs":["得其大者兼其小的同时，也须小中见大、管中窥豹，通过一年内大大小小的事情折射出党员干部党性立场的坚定、党性修养的砥砺、党员姓“党”觉悟的升华。","档案也能让人们管中窥豹，看见成都老茶馆和戏剧曲艺、文学诗词、烟火生活等紧密相连，在万千滋味背后，其收揽着四川万象，折射出兼容并蓄的人文精神。","管中窥豹，从一幅关于饮茶的画，可见中华文化的继承与典守，以及当时中国对西方文化的了解与吸收。"]},{"id":614,"w":"坐井观天","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"比喻眼界不开阔，见识不广。","core":"比喻眼界不开阔，见识不广","exs":["馆陶县张井寨村支部书记张国强在成都村政学院发展壮大集体经济专题班上很受震撼，当地的发展理念、物联网时代的营销模式打破了我以往坐井观天的沾沾自喜，同时也对集体经济的发展方向、发展模式、营销途径等有了一个新的认识和感受。","一些干部不能适应新环境、新任务的要求，“老办法不管用、新办法不会用”“遇到问题无计可施、面对难题束手无策”，甚至不自知、不自省，要么坐井观天、盲目乐观，总认为自己干得不错，要么推诿甩责、埋怨他人，却不查找自身的原因。","要树立“跳出大安看大安，站在全国看大安，放眼全球看大安”的大格局，冲破坐井观天的僵化思维、摆脱“一亩三分地”的狭隘思维，牢牢把握时代赋予的历史机遇，以大格局、高站位、宽视野，找准发展新坐标，增创发展新优势。"]},{"id":615,"w":"一叶障目","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"眼睛被一片树叶挡住，指看不到事物的全貌。","core":"眼睛被一片树叶挡住，指看不到事物的全貌","exs":["虽然今天的我们身处大数据时代，“足不出户便可知天下事”，调研工作也与时俱进，但不可因此一叶障目，切不可放弃实地察看、入户走访、开会座谈的方式。要实打实看见群众最直接最现实的问题，对问题追根溯源。","“小院党课”紧盯社区治理所需、居民所期所盼，让理论宣讲更“聚人气”，结合“微心愿”征集、“书记夜谈”“书记夜访”等活动，推动机关干部主动“沉下去”，倾听一线民意、把握一线情况、掌握一手资料，避免一叶障目。","一份数据翔实、考证严密、有理有据的考核台账和总结能够直观展现年度工作情况，但若过度依赖材料，容易一叶障目，难以精准“画像”。"]},{"id":616,"w":"断章取义","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"看法片面","type":"four","expl":"引用他人文章或谈话，只截取其中一段的意思，而不顾全文和原意。","core":"引用他人文章或谈话，只截取其中一段的意思，而不顾全文和原意","exs":["他的著作被人断章取义，用来批判别人。","男子断章取义、捏造事实网上诽谤他人被判诽谤罪。","美国杂志有关报道蓄意断章取义、歪曲事实，企图误导台湾民众和国际舆论，居心邪恶。"]},{"id":617,"w":"一叶知秋","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"能从小处推全局","type":"four","expl":"看见一片落叶，就知道秋天将临。比喻发现一点预兆就知道事物将来的发展趋向。也作“落叶知秋”“叶落知秋”。（侧重从预兆推知未来）","core":"比喻发现一点预兆就知道事物将来的发展趋向","exs":["一叶知秋，以管窥豹，《春风又绿江南岸》看似只写了江南县，实则折射出整个中国践行“绿水青山就是金山银山”理论的共识和实践。","滴水映日，一叶知秋。一批乡村题材纪录片摆脱概念化叙事模式，以小见大凸显艺术效果，从微观视角映射时代精神。","近来，波音公司多型飞机频频发生安全事故，737MAX9在美国和世界多地停飞，暴露出波音在生产、质检等环节的一堆问题，美国高端制造业跌落神坛、巅峰难再。一叶知秋，折射美国制造业衰落。"]},{"id":618,"w":"见微知著","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"能从小处推全局","type":"four","expl":"微：小，指事物微小的迹象。著：显明，指事物的发展。谓看到事物的苗头，就能知道它的未来发展趋势和实质。同“睹微知著”。（侧重大小对比）","core":"小，指事物微小的迹象","exs":["大家认为，该作品书写基点定位在基层，落点到基层群众，以普通人为主角，以人民为中心，通过描绘人与自然关系的流转、人的生活以及观念的变化来见微知著地反映漓江流域生态文明建设的历史与现实。","这个新春，我们追随远行的脚步，深入祖国各地，走进大街小巷、工厂码头，观新春佳节中的人潮涌动，察神州大地上的进取逐梦，见微知著，从不同方面感知中国经济新春的“面面”脉动。","科幻电影《流浪地球2》利用AI赋能产业，不仅成为中国科幻电影的新高峰，也见微知著地体现了国防、军工、基建等方面的综合国力。"]},{"id":619,"w":"由表及里","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"能从小处推全局","type":"four","expl":"表：表面；及：达到、直达；里：本质。从表面现象看到本质。","core":"表面","exs":["通过调研谈话、案例分析、绩效复盘等方式，由表及里分析工作背后潜藏的政绩观偏差，制定只唯上不唯实、忽视群众利益等8个方面政绩观偏差苗头问题清单。","沉到干部身边观察干部，多到基层群众中了解干部，做到对干部情况的了解由远及近、由表及里。","从农村文化产品服务供给、乡村文化遗产保护传承、推进高额彩礼综合治理等多方面综合发力，加快推动乡村由表及里、形神兼备的转变提升。"]},{"id":620,"w":"冰山一角","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"能从小处推全局","type":"four","expl":"比喻事物已经显露出来的一小部分，隐含的内容或真相往往更为复杂和深刻。","core":"比喻事物已经显露出来的一小部分，隐含的内容或真相往往更为复杂和深刻","exs":["陶虎补充道，硬件只是冰山一角，水面之下是算法、数据与临床验证的更漫长协同。","能被追踪到的空间碎片只是“冰山一角”，更多的是那些尚无法被追踪和识别来源的微小碎片，其危害同样不容小觑。","从全市1类创新药上市“零”的突破，到重庆首个纳入国家医保的自研1类创新药正式落地，赛立奇单抗的成功只是巴南区建设创新药产业生态圈的冰山一角。"]},{"id":621,"w":"可见一斑","part":"c","gn":"四十九","gt":"从细节看全貌","sub":"能从小处推全局","type":"four","expl":"一斑：豹身上的一块斑纹。比喻从观察到的事物的一部分可以推知其全貌。","core":"比喻从观察到的事物的一部分可以推知其全貌","exs":["从“当了总书记后，我第一个来科技组”，到弯下腰为获奖院士佩戴奖章，再到合影时请院士到自己身边就座。在这些年里的一幕幕鲜活场景中，总书记对人才的重视爱护可见一斑。","地面数据中心近在咫尺，而太空卫星远在数百公里之外，要建一个覆盖全球的太空算力网络，得靠几百甚至上千颗卫星协同工作，前期投入规模之大可见一斑。","如宁夏固原北朝时期的绿釉扁壶、甘肃的唐代鎏金铜胡腾舞俑、山西太原隋代虞弘墓的石椁上的乐舞图，陕西西安苏思勖墓唐代乐舞图壁画等，时人对这一舞种的喜爱可见一斑。"]},{"id":622,"w":"远见卓识","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"解释为有远大的眼光和卓越的见解。","core":"解释为有远大的眼光和卓越的见解","exs":["习近平主席提出的构建人类命运共同体理念非常富有远见卓识，“在全球冲突不断的当下，这也是一个关乎全球和平的理念”。","“过去几十年，中国在经济、社会、科学、文化等领域取得了巨大进步，国家实现了重大变革如果没有中国共产党具有远见卓识的领导，这一切都是不可能的。”马来西亚前驻华大使马吉德日前在吉隆坡接受新华社记者采访时说。","今天已发展成为“巨人”的中国向世人证明，在拥有远见卓识的领导人带领下，通过人民不懈地努力奋斗，就能取得举世瞩目的发展成就。如今，一切对中国道路的质疑都已在中国取得的现实成就面前不攻自破。"]},{"id":623,"w":"真知灼见","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"灼：明白，透彻。指正确而透彻的认识，高明的见解。","core":"指正确而透彻的认识，高明的见解","exs":["安吉县政协委员们还持续报送相关社情民意信息，提出很多真知灼见。委员们的意见建议，得到了县委县政府的高度重视，均已收到职能部门的答复。","调查研究是获得真知灼见的源头活水，是科学决策的重要前提，正确的决策离不开对客观实际的周密调查研究。谋于前才可不惑于后。","年会聚集全球各地专家为研究澳门贡献真知灼见，为培养本土研究人才提供更丰富的土壤。"]},{"id":624,"w":"鞭辟入里","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"形容做学问切实。今多形容分析问题透彻，切中要害。","core":"形容做学问切实","exs":["面对复杂多变的时局，一般人只是议论纷纷，常常困惑不解，而毛主席却看得清楚，而且还能把事情的是非曲直分析得鞭辟入里，他因此被同学们誉为“时事通”。","赵万一教授深入阐释了新《公司法》修订的内外部社会环境和社会发展目标发生深刻变化的时代背景，对相应的立法理念和制度设计等问题分析鞭辟入里、析毫剖芒。","读完文章后的宋庆龄深为认同毛泽东鞭辟入里的分析判断。她找到自己亲近的朋友、记者爱泼斯坦等人，把《论持久战》翻译成了英文，准备在海外出版。"]},{"id":625,"w":"一针见血","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"意思是比喻说话直截了当，切中要害。","core":"意思是比喻说话直截了当，切中要害","exs":["可接受上级评审时，一位集团军首长一针见血地指出：太保守了！为什么不考虑与其他作战力量有机协同？为什么没想过运用新质力量进行侦测打击？一个个问题如当头棒喝，既点中了要害，也直接敲在三连官兵心头。","同时，有经验的教练还能一针见血地指出教学过程中存在的问题。系统的训练能让教师在知识点的选取、内容的打磨、PPT动画的制作、板书结构的设计，甚至演讲的语气和站姿等方面得到系统地提升。","腾讯烟台新工科研究院首席科学家徐永龙则一针见血地表示，中国汽车企业必须结束“内卷”才能更好地面向全球。"]},{"id":626,"w":"一语中的","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"意思是指一句话就说中要害，一句话就说清了事情的重点。","core":"意思是指一句话就说中要害，一句话就说清了事情的重点","exs":["中共举办的与世界政党高层对话会吸引力为何这么大？摩洛哥议会第二大党真实性与现代党总书记奥马里一语中的：人类命运共同体理念的提出是中国共产党着眼全人类前途命运的证明。","商务部副部长姜增伟的话一语中的，“转变经营模式是实现零售业可持续发展的必然要求，中国百货业目前普遍采用的联营扣点制度造成了巨大的经营弊端”。","毛泽东读书不辍，胸藏万卷，一生都在研读历史、评说历史、借鉴历史。他在“黄鹤知何去？剩有游人处”的风物演化中感触历史；在“阅尽人间春色”的昆仑面前拷问历史；在“往事越千年，魏武挥鞭，东临碣石有遗篇”的文学经典中品味历史；在“子在川上曰：逝者如斯夫”的似水流年中解读历史；在“一从大地起风雷，便有精生白骨堆”的正邪争斗中审视历史。有学者用“掌上千秋史”评价毛泽东诗词的历史意味，一语中的。"]},{"id":627,"w":"一语成谶","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"就是一句（不好的）话说中了，就是“不幸而言中”（不吉利的事情，诅咒别人似的）。","core":"就是一句（不好的）话说中了，就是“不幸而言中”（不吉利的事情，诅咒别人似的）","exs":["斯大林的成就是伟大的，但是，他在去世之前却充满遗憾地对身边同志说“要有创新的理论，没有新的理论我们就会死”。结果呢，他一语成谶。世界上第一个社会主义的领导核心苏联共产党，在存在了93年后，黯然地、静静地就被解散了。","现实中有不少这样的案例，父母责备孩子不认真、没能力、怯懦，结果竟然一语成谶，孩子长大就真的变成了这样的人。","当时欧洲盛行的现代派美术并未登陆中国，鲁迅就一针见血指出了“为艺术而艺术”的现代派在中国的宿命。一语成谶，20世纪30年代中国现代派艺术的昙花一现成了这句话的注脚。"]},{"id":628,"w":"字字珠玑","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"比喻说话或文章的词句非常优美，就像每个字都是珍贵的珍珠一样。","core":"比喻说话或文章的词句非常优美，就像每个字都是珍贵的珍珠一样","exs":["毛泽东审阅中共山东省委批转历城县委《关于贯彻执行省委六级干部会师到田指示的报告》，感到官僚主义在基层如此严重，甚为忧心。3月30日，他亲自起草了《中共中央关于反对官僚主义的指示》（以下简称《指示》），要求各级党委（组）坚决反对官僚主义，肯定推广历城经验。这份《指示》篇幅有1000多字，字字珠玑，对坚决反对官僚主义提出了独到见解和重要论断。","5位专业学者、教授和一线中小学班主任走上讲台，基于各自的教育实践和前瞻视角，传道授业，指点迷津，或分享班主任育人新故事，或讲述班主任育人“新配方”，或诠释班主任育人新理念，字字珠玑，娓娓道来，既有思维高度，又有实践深度，更有现实温度，让在场很多学员产生共鸣，感慨万千。","《道德经》和《孙子兵法》在法国的影响力也非常大，因为这两部作品短小精悍，字字珠玑，最能代表中国的古老智慧。"]},{"id":629,"w":"颠扑不破","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"颠：跌到；扑：拍打；破：打破。比喻学说或理论正确可靠，无法被推翻。","core":"比喻学说或理论正确可靠，无法被推翻","exs":["今天的家庭结构与社会分工已不同于古代，但《大学》揭示了一个至今仍颠扑不破的道理：一个人若不能在亲密关系中学会信任、担当与自我约束，就很难真正承担更广泛的公共责任。","这一颠扑不破的道理，早已被两岸关系发展的实践所印证，也成为两岸同胞的普遍共识。","马克思主义是我们立党立国、兴党兴国的根本指导思想，是颠扑不破的真理。"]},{"id":630,"w":"针砭时弊","part":"c","gn":"五十","gt":"看事情透彻","sub":"见解精准正确","type":"four","expl":"针：中医针刺疗法；砭：砭石刮治医术；时弊：特定时期的社会问题。比喻用尖锐的言辞揭示社会弊端，批评时代错误，以求改正和社会进步。","core":"比喻用尖锐的言辞揭示社会弊端，批评时代错误，以求改正和社会进步","exs":["留存至今的黑白旧照记录了张伯苓先生讲戏的场景，他用一台自编自导的《用非所学》，寓教于戏叩问青年学子思学之道，亦针砭时弊求索民族发展之路。","《狂人日记》以锐利之笔刺破封建礼教的虚伪面纱，时至今日依然振聋发聩。鲁迅的文字针砭时弊，以如椽巨笔勾勒众生相。","在艺术百花园中，漫画以幽默诙谐的方式针砭时弊，成就一道既辛辣又鲜活、既通俗又深刻的独特风景。"]},{"id":631,"w":"洞若观火","part":"c","gn":"五十","gt":"看事情透彻","sub":"看事情透彻","type":"four","expl":"洞：透彻。指清楚得就像看火一样，形容观察事物透彻分明。","core":"指清楚得就像看火一样，形容观察事物透彻分明","exs":["在反洗钱看不见的战线中，检察官们洞若观火，用高超的专业水平与勇毅探究的精神与犯罪行为展开较量，精准有力打击洗钱犯罪。","要树立正确的世界观、人生观、价值观，掌握了这把总钥匙，再来看看社会万象、人生历程，一切是非、正误、主次，一切真假、善恶、美丑，自然就洞若观火、清澈明了。","具有战略眼光的伍子胥对吴越两国的形势洞若观火，竭力劝谏夫差不要上当受骗。"]},{"id":632,"w":"明察秋毫","part":"c","gn":"五十","gt":"看事情透彻","sub":"看事情透彻","type":"four","expl":"明：视觉敏锐；察：看；秋毫：鸟兽秋天新长出的细毛。本义为视力好到能查辨秋天鸟兽的细毛；后多形容人精明，目光敏锐，能洞察一切。","core":"后多形容人精明，目光敏锐，能洞察一切","exs":["组织选人公正严明、明察秋毫，干部干事接受组织安排，随时听从组织召唤，党组织和党员干部连为一体、相互信任、同舟共济，共同推动党和国家事业不断前进。","着力推进审计在党的领导下实现全覆盖，瞪大眼睛、明察秋毫，紧盯重点、动真碰硬，以高质量审计监督保障全省经济社会高质量发展。","要善于因时势而谋，见微知著、明察秋毫，科学研判面临形势。"]},{"id":633,"w":"一目了然","part":"c","gn":"五十","gt":"看事情透彻","sub":"看事情透彻","type":"four","expl":"一目：看一眼。了然：清楚，明白。一眼就可以看清楚。（侧重看得清楚）","core":"（侧重看得清楚）","exs":["展览会的说明书写得简明扼要，使人对展览内容一目了然。","打开手机地图，搜索“工会驿站”，附近站点一目了然。","立足让消费者对“吃的什么、分量多少”一目了然，不断加强指导。"]},{"id":634,"w":"一览无余","part":"c","gn":"五十","gt":"看事情透彻","sub":"看事情透彻","type":"four","expl":"览：看。余：剩余。形容一下子就可以看清楚。同“一览无遗”“一览而尽”。（侧重看的全）","core":"形容一下子就可以看清楚","exs":["他们漫步登上坡顶，一时感到视线非常开阔，鸟瞰西关全景，一览无余。","站在市区东门城楼上，柳江景色一览无余。","汴京繁华忙碌的景象一览无余，平凡人物的劳动风采跃然纸上。"]},{"id":635,"w":"大有可为","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"比喻指前途极有希望，值得去做。","core":"比喻指前途极有希望，值得去做","exs":["正如习近平总书记深刻指出的：“实践证明，我国自主创新事业是大有可为的，我国广大科技工作者是大有作为的。”","习近平总书记强调：“新征程上，年轻干部重任在肩、大有可为”。","开发森林食物，守好森林“粮仓”，不断提升森林食品供给能力，既是保障民生、提升百姓生活品质的切实需要，也是有力有效推进乡村全面振兴的题中应有之义，必将大有可为，也必定大有作为。"]},{"id":636,"w":"无可厚非","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"意为不可过分指责，表示虽有缺点，但是可以理解或原谅。也说未可厚非。","core":"意为不可过分指责，表示虽有缺点，但是可以理解或原谅","exs":["在交通基础设施改善的背景下，很多群众尤其是农村群众更愿意到大城市接受更好的诊疗服务，这样的选择无可厚非。","微短剧制造戏剧冲突本无可厚非，但刻意放大和渲染夫妻矛盾、婆媳矛盾、代际矛盾，片面丑化某类人群的形象，把不平等、扭曲的婚恋关系和家庭关系描绘成普遍存在的现象，偏离了社会主流价值，变成了“毒鸡汤”，影响社会风气、家庭和谐。","比起以前，现在的童书无论是印刷品质还是绘画要求都更高一些，成本有所上升，定价略高些也无可厚非。但作为重要文化产品，图书有其特殊属性，应当把价格控制在合理区间。"]},{"id":637,"w":"无可非议","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"意思是没有什么可以指责的，表示言行合乎情理。可用来形容人、事、思想、行动、品质等。","core":"意思是没有什么可以指责的，表示言行合乎情理","exs":["中方在本国管辖海域开展正常的巡航执法、生产作业等活动，符合包括《联合国海洋法公约》在内的国际法，无可非议。","面对菲方船只的强行冲闯，中国海警不得不采取必要执法措施，现场操作正当合法、专业克制，无可非议。","中国在东海和南海的活动完全符合国际法，无可非议。钓鱼岛及其附属岛屿自古以来就是中国固有领土，中方将坚决应对侵犯中国主权的不法行为。"]},{"id":638,"w":"差强人意","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"差：尚，稍微。强：振奋。还算能振奋心意。形容大致上还能够令人满意。（现多误用，辨析词义）","core":"形容大致上还能够令人满意","exs":["然而冰雪赛场上瞬息万变，朱运锋的比赛用枪出现了故障，由于气压不足，造成连续脱靶，只得使用不熟悉的备用枪征战冬残奥，成绩差强人意。","你这篇文章还算流畅，但意念不够深刻，整体而言，差强人意而已。","在排片的8部影片中，4部影片赢得满堂彩，4部影片撤档，虽然其中不乏质量上乘之作，但是票房差强人意。由此可见，一部好片子需要让观众看到并认可，不仅仅要质量优质，还要顺应不同档期及观众心理。"]},{"id":639,"w":"毋庸讳言","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"意思是指用不着隐讳，可以直说的内容。毋庸指不用。","core":"意思是指用不着隐讳，可以直说的内容","exs":["毋庸讳言，科学是严肃的，有时候甚至略显乏味。相比之下，“伪科学”往往是轻浮和聒噪的。非如此，不足以强化偏见、撩拨情绪。","毋庸讳言，目前，“待遇找人”对跨区域、跨部门信息共享提出了更高要求。","毋庸讳言，演出门票具有一定的时效性和特殊性，允许随意退票会给经营者带来较大影响。同样毋庸讳言的是，在利益的刺激之下，不能排除有人剑走偏锋，以“跳票”来欺骗消费者。"]},{"id":640,"w":"缄口不言","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"缄：封闭；言：说话。封住嘴巴；不开口说话。","core":"封闭","exs":["新华社北京4月24日电美国知名调查记者、普利策新闻奖得主西摩·赫什23日爆料：西方国家明知供给乌克兰的武器大量流入黑市，西方主流媒体却对此缄口不言。","也就是说，医生选择缄口不言，主要是求自保、怕惹事。","这篇课文讲述了二战期间一位名叫尼古拉斯·温顿的英国人从德国纳粹手中救出669名犹太儿童的故事，这位“英国辛德勒”50年间对自己的善举缄口不言。"]},{"id":641,"w":"乏善可陈","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"善：良好成绩；陈：陈述，告诉。意思是没有什么好的可以称道的。","core":"意思是没有什么好的可以称道的","exs":["但有时，脑海中思绪万千，诉诸笔端却单薄片面，读起来干巴巴的、乏善可陈。","近一年来，卓荣泰在行政治理上乏善可陈，劣迹斑斑，但在充当赖清德政治打手、担当护“赖”先锋方面不落人后，乱台“卓”有成效。","吕文灿是泰国一所中文学校的校长，2004年从曲靖远赴泰国工作定居，“以前因交通不便，总觉得家乡风光乏善可陈，难以向人介绍。”"]},{"id":642,"w":"外强中干","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"外强：外表强大；中干：内部枯竭，缺乏支撑或实质力量。指外表强大，内实空虚。","core":"指外表强大，内实空虚","exs":["本事硬是骨头硬的前提与底气，若无硬本事，空有骨头硬就成了虚张声势、外强中干。","布鲁斯·韦恩除了缺乏过人的洞察力和坚韧的毅力，甚至有时候幼稚脆弱，还外强中干。然而正是这些普通人身上的各种小瑕疵，小毛病，却让年轻的布鲁斯·韦恩有了人性的味道。","加快补齐育肥和加工短板，改变种植业玉米“一粮独大”、养殖业肉牛“外强中干”局面，提高稳产保供能力和产品竞争实力，为保证国家粮食安全作出更大贡献。"]},{"id":643,"w":"名副其实","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"名：名声；副：符合；实：实际。指名声或名称与实际相符合。","core":"指名声或名称与实际相符合","exs":["《青年实话》作为共青团中央局机关报，在中央苏区时期具有广泛的影响力，发行量仅次于中华苏维埃共和国临时中央政府机关报《红色中华》，是苏区青年名副其实的良师益友。","数据要素化是一块名副其实的“硬骨头”。它不是某一个环节的难题，而是一个系统性、全局性的挑战。","走进沐川竹海，满目苍翠铺展山野，清风穿林、竹浪翻涌，山间空气清新通透，负氧离子含量充沛，是名副其实的“天然氧吧”。"]},{"id":644,"w":"当之无愧","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"当：担当、承当；无愧：毫无愧色，不必感到惭愧。指承受得起某种称号或荣誉而毫无惭愧，强调资格或成就与所获荣誉相匹配。","core":"指承受得起某种称号或荣誉而毫无惭愧，强调资格或成就与所获荣誉相匹配","exs":["湖北省博物馆内，春秋越王勾践剑是当之无愧的“顶流”，观众奔向这件国家宝藏，在有限的时间里领略宝剑那一道穿越历史的寒光。","这一拔节向上的乡村故事，浙江省嘉善县大云镇缪家村党委书记陆荣杰的敬业与奉献，他用实际行动诠释着一名基层村干部的责任与担当，成为了村民心中当之无愧的共富带头人。","这些学校尽管物质条件有限，但课程设置全面，制度管束严格，培养出了大批抗战骨干，成为当之无愧的革命熔炉。"]},{"id":645,"w":"色厉内荏","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"色：神色、模样；厉：严厉强硬；荏：软弱怯懦。指外表强硬，内心虚弱。","core":"指外表强硬，内心虚弱","exs":["演员精湛的演技让角色的特点深入人心，赵达声的铁面无私、崔名贵的色厉内荏、麦思源的莽撞市侩等，被诠释地入木三分。","有的推诿扯皮当“甩锅”高手，要求别人时色厉内荏，动辄对下级搞“一票否决”的责任状。","他跑遍租界的各处，观察了帝国主义爪牙的色厉内荏的窘态。"]},{"id":646,"w":"敬而远之","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"敬：尊敬；远：表示不接近。指表面上表示尊敬却不愿接近。","core":"表示不接近","exs":["困难面前，是迎难而上还是绕道而行，检验着干部担当作为的底色。现实中，有些干部只愿意干锦上添花、凸显政绩的“好事”，对硬骨头、真问题避之不及、敬而远之。","现实中，为啥有的调研群众敬而远之，有的调研人们争相倾诉？表面看是方式方法问题，实则指向根子上的政绩观导向。","该旅干部古家林从其他岗位转任连队指导员之初，一心想靠“高标准、严要求”树立威信，却因对战士批评过多、沟通不足，导致不少战士“敬而远之”，思想政治工作效果不佳。"]},{"id":647,"w":"难能可贵","part":"c","gn":"五十一","gt":"对事情的态度与评价","sub":"对事情的态度与评价","type":"four","expl":"难：困难；能：能够、有能力做到；可：值得；贵：珍贵。指难以实现之事得以完成而显得珍贵。","core":"指难以实现之事得以完成而显得珍贵","exs":["在去年一季度高基数、今年外部环境复杂严峻的情况下，经济运行开局良好，难能可贵，充分体现了我国经济的韧性。","更难能可贵的是，我国充分发挥制度优势，以全国一盘棋的战略思维构建起灵活高效的能源调控体系。","那一刻，你喝下的，不只是汤，更是南黄海的潮汐，是古镇千年的呼吸，是至味人间里，那份最难能可贵的清欢本味。"]},{"id":648,"w":"凤毛麟角","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容少","type":"four","expl":"凤毛：凤凰的毛。麟角：麒麟的角。比喻珍贵而稀少的人或事物。","core":"比喻珍贵而稀少的人或事物","exs":["当下收藏书画、玉器、瓷器，甚至明清家具者众多，而收藏乌木者却是凤毛麟角。","行业鱼龙混杂，具有研发实力的企业凤毛麟角，相当一部分企业选择简单的来料加工模式，缺乏专业的质量管理人员，不具备基本的检验能力，导致电子门锁产品质量参差不齐。","纵观世界足坛百余年，称得上“大师”的球员其实并不算多，如今仍活跃在五大联赛舞台上的，更是凤毛麟角，来自比利时的德布劳内，算是其中一位。"]},{"id":649,"w":"寥若晨星","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容少","type":"four","expl":"稀少得好像清晨的星星一样。形容很少。","core":"形容很少","exs":["一部中国书法史，女书家的名字虽然寥若晨星，却从未缺席。","近年来，赣州市国投集团把典型选树工作作为加强队伍建设和推动工作的强大“引擎”，先进典型从“寥若晨星”到“满天繁星”，带动全体干部职工“脚踏实地、志存高远”，在新征程中争取更大作为。","海外学界关于中国文言小说的研究著述依然寥若晨星。"]},{"id":650,"w":"屈指可数","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容少","type":"four","expl":"屈：弯曲。指：手指。可数：可以数清。扳着手指就可以数清楚，形容数量极少、非常稀少。","core":"手指","exs":["香炉山顶、普陀村、大坝、铁炉坝，是国内屈指可数的顶级“观星天堂”。","这位在高原坚守了二十七年的老通信工，回家过年的次数屈指可数，但技术的革新让他和同事们的春运保障多了一份从容。","全球范围内相关研究相对有限，超过百例个体基因组的史前社会研究更是屈指可数，对石峁遗址这种具有超大规模、复杂多样殉葬形式的等级社会的研究尚属首例。"]},{"id":651,"w":"九牛一毛","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容少","type":"four","expl":"九头牛身上的一根毛，比喻极大数量中极其微小、微不足道的一部分。","core":"九头牛身上的一根毛，比喻极大数量中极其微小、微不足道的一部分","exs":["过去几十年，地热能虽被大量开发利用，但与其巨大的储量相比，可谓九牛一毛。","很多人粗浅地认为环保志愿者的工作就是捡捡垃圾而已，其实这只是日常工作的九牛一毛。","朱岩石表示，不能否认，邺城考古40年来取得了很大收获，但距离科学、全面、准确地解释邺城那个时代、解释邺城都城全貌还差得很远，考古工作者们掌握的信息仍然九牛一毛。"]},{"id":652,"w":"沧海一粟","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容少","type":"four","expl":"沧海：大海；粟：谷子、小米。大海里的一粒小米，比喻非常渺小、微不足道，在宏大的事物里占极其微小的一部分。","core":"大海里的一粒小米，比喻非常渺小、微不足道，在宏大的事物里占极其微小的一部分","exs":["刘超表示，自己的付出只是沧海一粟，但他相信，只要每个人都能够像他一样用心去交心、用行动去奉献，临港的未来一定会更加美好。","历史长河中，40多年犹如沧海一粟，但就在这40多年间，陕西发生了天翻地覆的变化。","数千年来，人类文明在与这些热带氤氲间起舞的巨影相识和抗争里，已有了不断的认识，只是这些认识仍如同沧海一粟，更多隐秘于这些顶天立地身影里的未知，也是气象学相关领域科研人员正在探求的前方。"]},{"id":653,"w":"车载斗量","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"能用车载，能用斗量，比喻数量多，不可胜数，多指不足为奇，很常见。","core":"能用车载，能用斗量，比喻数量多，不可胜数，多指不足为奇，很常见","exs":["历代文人墨客吟咏春天的诗歌车载斗量，耳熟能详者，莫过于宋代政治家、文学家王安石的《元日》：爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。","在乡村振兴的最前沿，新型农民正用科技之笔书写答卷；在潜心科研的实验室，创新先锋正在聚精会神开展头脑风暴；在遥远漫长的边境线，戍边战士正用忠诚无畏铸造精神界碑；在每一条战线上，普通的奋斗者正在脚踏实地破土深耕，期待着生活的硕果，车载斗量、满载而归。","以中国近现代学术史为例，有关梁启超、胡适、郭沫若等学术名家的研究就具有重要性，不过，这一方面的研究成果车载斗量，必须从新的角度切入。"]},{"id":654,"w":"不胜枚举","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"胜：尽。枚：量词，个。举：列举。不能够一个一个地全部列举出来。形容数量很多。（多用于形容举例子/枚举时）","core":"形容数量很多","exs":["这里的好人好事不胜枚举。","从一条高铁，到一个经济带。不只有沉甸甸的成果，更有值得期待的未来。像这样以一个基础设施项目为依托，久久为功推动一个地区经济发展和现代化建设的故事，在共建“一带一路”实践中不胜枚举。","习近平主席语重心长地对我们说，每个人的成长过程，都要主动将自身发展同国家和民族的命运紧密联系在一起。这也是每一个大学生都应该有的人生选择。很多老一辈的革命家、科学家，他们为了救国救民，奋发读书。这样的典型事例，不胜枚举。"]},{"id":655,"w":"俯拾皆是","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"形容到处都有，很容易取得。","core":"形容到处都有，很容易取得","exs":["当前，共建“一带一路”成果俯拾皆是，这一合作共赢的进程绝不会放缓，而会沿着正确方向不断向前推进。","杭州素有“人间天堂”美誉，湖光山色、人文美景俯拾皆是。西湖十景或近观、或远眺，引人无限遐思，流连忘返。","今天，人们沿着习近平总书记考察时的足迹，徜徉在占地约240亩的孔府，感受九进院落、三路布局的堂皇威严，驻足于俯拾皆是的楹联家训前，汲取文化的力量。"]},{"id":656,"w":"数不胜数","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"数：计算。胜：尽。形容数量极多，数也数不完。","core":"形容数量极多，数也数不完","exs":["中国作为一个拥有“四大发明”的文明古国，具有历史悠久而技艺高超的手工业，薪火相传的能工巧匠们留下了数不胜数的传世佳作。","“沧海横流，方显英雄本色啊。一方有难，八方支援。支援的队伍数不胜数了，已经分不清是哪个组织的，哪个方面的，哪里来的。”习近平总书记说。","“城里三山古越都，楼台相望跨蓬壶。”2200余年岁月风华给福州古城留下数不胜数的历史印记，坐落于城市中心的三坊七巷便是时间年轮的漫长见证。"]},{"id":657,"w":"不一而足","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"不是一事一物能够使之满足的。后也用来形容所说的事物或现象不止一种，而是很多，不能一一列举。","core":"后也用来形容所说的事物或现象不止一种，而是很多，不能一一列举","exs":["最近一些地方上的调查表明，社会上各种学会、协会层出不穷，联谊会、研究会不一而足。","自民进党当局上台以来，各种“去中国化”的动作不断。去孔子、去孙中山、废止“课纲微调”、中学历史教育不再单列中国史、语文课本中古文比重降低、推行国语多元化……凡此种种，不一而足。","中国人民银行再次部署开展专项整治工作，此次公示的典型案例即为此次整治工作的部分成果。从中梳理一些经营者拒收现金的理由，从“无法找零”“现金容易遗失”到“不接受拆分支付”“商业模式创新”……不一而足。"]},{"id":658,"w":"五花八门","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"原指五行阵和八门阵。这是古代两种战术变化很多的阵势。比喻变化多端或花样繁多。","core":"原指五行阵和八门阵","exs":["市场上五花八门的床上用品层出不穷，价格也从几十元到几千元不等，到底是“黑科技”还是“智商税”？","从中可以看出骗子的套路五花八门，令人防不胜防。只不过，许多的回答都没有明确这一点：在我国，彩票发行由财政部审批，民政部、体育总局下设的彩票管理中心组织发行，一般都是以实体门店方式进行销售。","记者梳理发现，经营主体拒收人民币现金的理由五花八门，但这些都不能为拒收行为开脱。"]},{"id":659,"w":"包罗万象","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"包罗：包括；万象：宇宙间的一切景象，指各种事物。形容内容丰富，应有尽有。","core":"宇宙间的一切景象，指各种事物","exs":["《潜夫论》也因此被誉为“真实反映当时社会的镜子”“一座包罗万象的学术宝库”。","景德镇陶溪川文创街区，成百上千的年轻人涌进街道，支起帐篷和桌子，摆上精心制作的手工艺品，道路瞬间变身包罗万象的创意集市。"]},{"id":660,"w":"林林总总","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"林林：众多的样子；总总：众多而杂乱的样子。形容众多。","core":"形容众多","exs":["行走在天津的解放北路，两侧林林总总的西洋建筑令人目不暇接，因其独特的地理优势，这条路在近代中国成为对外开放的一个重要窗口，国际金融机构的聚集也使其有着“东方华尔街”的称呼。"]},{"id":661,"w":"比比皆是","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"比比：到处、处处。到处都是，形容数量非常多、随处可见。","core":"到处都是，形容数量非常多、随处可见","exs":["农文旅融合发展的持续推进，让乡村旅游设施也不断“升级换代”，如今民宿集群、露营地、研学基地、特色步道等，在小镇和乡村比比皆是。","近年来，尽管美国舆论充斥了大量关于中美关系的消极声音，但事实上，民间友好交流的例子比比皆是。","她看到咖啡逐渐融入中国人的日常生活，咖啡馆在中国城市比比皆是，同时她还感受到中国在科技、经济与城市发展方面的活力与现代化，因此决定以艺术方式呈现这一段独特的文化体验。"]},{"id":662,"w":"不可胜数","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"胜：尽。多的数不尽，形容数量极多。","core":"多的数不尽，形容数量极多","exs":["中华文明源远流长，历史文化遗产不可胜数。","在收集筛选展演曲目时，主办方发现，来自全国各地的艺术家、词曲爱好者为雄安创作的主题曲目不可胜数。","历史上，关于庐山与九江的诗歌与绘画不可胜数，它们与这里的山水风景一起，构成了一幅美丽的人文与自然长卷。"]},{"id":663,"w":"不计其数","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容多","type":"four","expl":"没法计算数目，形容数量极多。","core":"没法计算数目，形容数量极多","exs":["修复过的书画不计其数，杜少飞总有种“对话感”。","从艺50余年，他绘制的脸谱不计其数，春节前后，每天天不亮就开工，只为让每一位社火队员都能带着“精气神”登台。","网络文学仅用20余年，就发展出200多个大类，小流派更是不计其数，这是传统文艺所不具备的“进化速度”。"]},{"id":664,"w":"汗牛充栋","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容书多","type":"four","expl":"充：装满。栋：栋宇，房屋。形容藏书或者著作极多。","core":"形容藏书或者著作极多","exs":["中华民族5000多年文明史留下的史料浩如烟海，众多史学家撰著了汗牛充栋的史学典籍。","星罗棋布的文物古迹和历史遗存、汗牛充栋的历史文献与古籍版本、日用而不觉的文化民俗与典章礼仪，承载着中华民族的历史记忆，利用融媒体技术将这些优秀传统文化元素数字化是发展趋势。","中华文化，源远流长；中国古籍，汗牛充栋。"]},{"id":665,"w":"浩如烟海","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容书多","type":"four","expl":"浩：广大。烟海：雾气弥漫的大海。形容事物（多指书籍、文献等）数量繁多，极其丰富。","core":"形容事物（多指书籍、文献等）数量繁多，极其丰富","exs":["在这浩如烟海的汉字中，我们究竟需要掌握多少呢？","古今中外，人们的思想、文化、历史通过书籍代代传承，形成的书籍浩如烟海。","共产党人千千万万，他们的动人事迹浩如烟海，选取什么样的故事入书？这需要编选者有独到的眼光，真挚的情怀。"]},{"id":666,"w":"卷帙浩繁","part":"c","gn":"五十二","gt":"数量多与少","sub":"形容书多","type":"four","expl":"形容书籍很多或一部书的篇幅很长。","core":"形容书籍很多或一部书的篇幅很长","exs":["一排排卷帙浩繁的书籍，一个个埋头读书的身影，偶尔传出书页翻动的声音，都像城市在积蓄力量。","第一张合影，1952年1月8日设计好的丰田式锭子装配图、1954年须昌弟师傅将型板“铣出型了”的铣床，1958年授予王春风同志的“第三季度先进生产者”奖状……在小小的文创咖啡厅里，时空深刻浓缩，厂史卷帙浩繁。","为使那些斑驳陆离的简牍、模糊不清的语句，不至于湮没在历史的尘埃中，作者用真心与努力，跋涉在卷帙浩繁的茫茫文字沙海，千淘万漉，洗磨文明的吉光片羽，向导人们走出困顿心胸的大漠，追逐内心世界的光明。"]},{"id":667,"w":"错落有致","part":"c","gn":"五十三","gt":"建筑相关","sub":"形容建筑排列","type":"four","expl":"意思是形容事物的布局虽然参差不齐，但却极有情趣，使人看了有好感。","core":"意思是形容事物的布局虽然参差不齐，但却极有情趣，使人看了有好感","exs":["走上农场观景台俯瞰龙尚村全景，远处，一座座风格别样的民宿错落有致。","走进秦阳村，干净整洁的道路、秀丽小巧的菜园、错落有致的房屋、优美宜居的庭院。","仲夏时节，吉林省长白县金华乡青山层峦叠翠，民居错落有致，构成一幅美丽的田园画卷。"]},{"id":668,"w":"鳞次栉比","part":"c","gn":"五十三","gt":"建筑相关","sub":"形容建筑排列","type":"four","expl":"鳞：鱼鳞。次：次序。栉：梳子和篦子的总称。比：排列。像鱼鳞或梳篦的齿那样紧密地排列着。形容建筑物等密集、排列整齐的样子。","core":"形容建筑物等密集、排列整齐的样子","exs":["据了解，中南门古城有明清建筑103栋、保存完好的四合大院35个，青砖黛瓦，鳞次栉比，是铜仁保存最为完整的明清历史文化街区。","一座座倒映水面的石桥，一个个鳞次栉比的亭台，处处可见江南韵味。","飞驰而过的高铁、鳞次栉比的高楼、金黄似锦的麦田，构成了一幅绝美画卷。"]},{"id":669,"w":"星罗棋布","part":"c","gn":"五十三","gt":"建筑相关","sub":"形容建筑排列","type":"four","expl":"意思是像天空中的星星和棋盘上的棋子一样罗列、分布着。形容数量众多，散布的范围很广。","core":"意思是像天空中的星星和棋盘上的棋子一样罗列、分布着","exs":["在安徽六安固镇，当地利用星罗棋布的堰塘养鹅，发展鹅肉、鹅绒和羽毛加工，构建起一条数十亿元产值的综合产业链。","青海被称作“万水之源”，长江、黄河、澜沧江从这里发源，5000多个湖泊星罗棋布，4200多条河流纵横交错，守护好“中华水塔”，确保一江清水向东流是青海义不容辞的政治使命。","如今的七房村水网、水田纵横交错，星罗棋布的村舍遍布其中，构成了一幅美丽的水乡画卷。"]},{"id":670,"w":"美轮美奂","part":"c","gn":"五十三","gt":"建筑相关","sub":"建筑美","type":"four","expl":"多用于形容建筑物雄伟壮观，富丽堂皇；也用来形容雕刻或建筑艺术的精美效果。","core":"多用于形容建筑物雄伟壮观，富丽堂皇","exs":["历史与现代交融，传统与时尚携手，就在钟楼街美轮美奂的光影中，就在流光溢彩的迎泽之夜里。","星空下、晨曦中，整个城市如同海市蜃楼，美轮美奂，令人叹为观止。","大雨过后，夜晚的汝州市区流光溢彩，美轮美奂。"]},{"id":671,"w":"富丽堂皇","part":"c","gn":"五十三","gt":"建筑相关","sub":"建筑美","type":"four","expl":"形容建筑物宏伟豪华。","core":"形容建筑物宏伟豪华","exs":["他们衣锦还乡后，大兴土木，建起了一座座富丽堂皇的深宅大院，形成江淮地区最大的一片明清时期的古村落建筑群。同时，它还是江淮第一侨乡。","穿过摇曳的树影，走进探知馆专门为番禺神楼建造的展厅，高大厚重、富丽堂皇的巨型木雕端坐在内。","在河北涞水县王村镇佳和金属工艺品制造有限公司掐丝珐琅博物馆，铜鎏金掐丝兽鸟香炉形象逼真、铜鎏金掐丝寿字瓶端庄大气、铜鎏金嵌料石升降塔钟富丽堂皇。"]},{"id":672,"w":"雕梁画柱","part":"c","gn":"五十三","gt":"建筑相关","sub":"建筑美","type":"four","expl":"彩绘装饰得十分华丽的房屋。","core":"彩绘装饰得十分华丽的房屋","exs":["在村里走一走，随处可见雕梁画柱、石刻石窗，轻轻拂过留在上面的岁月印痕，不觉产生一种穿越时空的年代感。","在颐和园、雍和宫、天坛、前门等地的高大古建筑物上，它们筑巢繁衍。清晨日暮时分，大片雨燕倾巢而出，与飞檐翘角、雕梁画柱相映成趣，成为古老京城的标志景观。","喜欢畅游古镇的人，都有那么一丝丝浪漫因子，总想将那些安静的怀想，在岁月腐朽的雕梁画柱间安放。"]},{"id":673,"w":"流光溢彩","part":"c","gn":"五十三","gt":"建筑相关","sub":"建筑美","type":"four","expl":"流动的光影，满溢的色彩。形容光彩明亮绚烂、色彩华丽耀眼。","core":"形容光彩明亮绚烂、色彩华丽耀眼","exs":["夕阳西下，金色余晖洒满连片大棚，流光溢彩。","夜幕降临后，景区东区将变成流光溢彩的梦境，各式造型灯组依次点亮。","夜幕降临，峨眉河两岸流光溢彩，沉浸式演艺轮番上演，非遗器乐潮奏、非遗鳌鱼水上巡游、非遗打铁花等节目接连登场，传统非遗与现代光影、武侠国潮深度融合，呈现一场震撼视听的文化盛宴。"]},{"id":674,"w":"飞阁流丹","part":"c","gn":"五十三","gt":"建筑相关","sub":"建筑美","type":"four","expl":"飞阁：凌空高架的楼阁、廊桥。流丹：朱红漆彩鲜亮欲滴，像在流动。形容建筑高耸凌空、彩绘鲜艳夺目，精巧华丽。","core":"形容建筑高耸凌空、彩绘鲜艳夺目，精巧华丽","exs":["当气度恢宏的京腔雅韵，回环于古雅的飞阁流丹之上，200余年的湖广会馆霎时重焕光辉。","歌曲演绎与美轮美奂的视觉特效，带领受众穿越时空领略千载流传的中式美学和飞阁流丹的建筑之美。","以北京中轴线为灵感的创演秀《栋梁》，带领观众沉浸式领略千载流传的中式美学，以及飞阁流丹的建筑之美。"]},{"id":675,"w":"如出一辙","part":"c","gn":"五十四","gt":"相同与不同","sub":"一样","type":"four","expl":"辙：车辙。好像出自同一车辙。比喻两种事物非常相似。（或两种以上事物）","core":"比喻两种事物非常相似","exs":["历史上有些事情非常相像，如出一辙。","“现在炒作所谓中国新能源‘产能过剩论’和当时日本的遭遇如出一辙。”正如西班牙《起义报》网站近日发表的文章所说，这不过是基于地缘政治理由的经济保护主义。","“美方歪曲、诋毁联大第2758号决议的谬论，同日前美方公然宣称要求加沙立即停火的安理会第2728号决议‘没有约束力’如出一辙，都是美国对国际法和国际关系基本准则合则用、不合则弃的体现，是霸凌霸道的象征。”"]},{"id":676,"w":"千篇一律","part":"c","gn":"五十四","gt":"相同与不同","sub":"一样","type":"four","expl":"一千篇文章都是一个样子。形容事物形式、内容呆板雷同，没有新意、毫无变化。","core":"形容事物形式、内容呆板雷同，没有新意、毫无变化","exs":["以服务暖心：细节到位收获好口碑好看的场景千篇一律，舒服的旅行万里挑一。","“五一”假期，没有大都市的人潮汹涌，却有洛江畔的桨声灯影；没有千篇一律的商业街，却有千年古榕下的宁静。","夜间经济不是简单的延长营业时间，更不应是千篇一律的灯光秀和小吃街，而应当以本土文化为内核，打造兼具特色辨识度与消费吸引力的夜间消费生态。没沟通过却得出同样的"]},{"id":677,"w":"不约而同","part":"c","gn":"五十四","gt":"相同与不同","sub":"结果","type":"four","expl":"原意是事先没有约定而一齐前来会合。后用来指没有事先商量约定而彼此的看法或言行相同。（侧重行为上）","core":"后用来指没有事先商量约定而彼此的看法或言行相同","exs":["如今，聚焦现实题材成为网络作家不约而同的选择，并且现实题材网络文学作品显示出日益强劲的生命力，作品数量节节攀高，总体艺术质量不断提升。","看“红色大片”、忆历史瞬间、谈感想领悟……如今，在兴安盟乌兰浩特市，每周六相约在兴安领创“体验一次共有精神家园”，成了不少市民不约而同的选择。","谈及成功秘诀，他们不约而同地说：“学习上只要确立了目标，就要迎难而上，永不言弃，脚踏实地走好每一步。天道酬勤，只要付出了总会有回报，经历了风雨总会见彩虹。”"]},{"id":678,"w":"不谋而合","part":"c","gn":"五十四","gt":"相同与不同","sub":"结果","type":"four","expl":"谋：商量；合：相同。事先没有商量而彼此的做法或意见却相同。也作“不谋而同”。（侧重思想上）","core":"（侧重思想上）","exs":["对这个问题的看法，你们两人不谋而合。","物流服务供应商DHL快递全球首席执行官蒋明燊表示，国际物流行业正朝着更绿色、更清洁的方向发展，与中国积极推进绿色与数字化转型不谋而合。","低碳战略和进博会的要求不谋而合。自2021年第四届进博会起，中国太保与中国国际进口博览局共同启动进博碳中和项目，探索“零碳进博零塑办博”的创新实践。"]},{"id":679,"w":"殊途同归","part":"c","gn":"五十四","gt":"相同与不同","sub":"结果","type":"four","expl":"殊：不同的；途：道路，途径；归：趋向。从不同的道路，走到同一个目的地。比喻采取不同的方法而得到相同的结果。","core":"比喻采取不同的方法而得到相同的结果","exs":["抗日战争时期，许多知识分子和青年学生，尽管各有各的情况，但殊途同归，都聚集到了革命圣地延安的宝塔山下。","“京郊乡镇和城区街道的责任规划师在职权、职能和所辖区域上都有明显差异，但我认为是殊途同归的，都要匠心独运，共建城乡美好未来。”","“音乐是追求和谐的艺术，与教育向善的目标殊途同归。学习音乐的过程，也是不断完善人格的过程。”刘项明说，“感受音乐之美，最终是塑造人性之美。”音乐不仅是内心的滋养，还是情感的流露。"]},{"id":680,"w":"异曲同工","part":"c","gn":"五十四","gt":"相同与不同","sub":"结果","type":"four","expl":"曲：曲调。工：工巧，精致。比喻不同人的文艺作品同样精彩。也比喻不同的做法有同样的好的效果。","core":"比喻不同人的文艺作品同样精彩","exs":["开放大学与拆除围墙有异曲同工之妙，背后透露的恰恰是更加开放的心态。","联合国教科文组织在四川开展的“熊猫大使”自然教育工作坊，强调将自然教育与科研工作、社区管理和人才培养相结合起来，和我们四川推进的自然教育工作理念，不谋而合，具有异曲同工的示范意义。","黎城黄崖洞是一处集自然风光与革命传统于一体的国家级森林公园，海拔1600多米，奇峰突兀，怪石嶙峋，这种独特而壮观的地貌，与美国科罗拉多大峡谷有着异曲同工之妙。"]},{"id":681,"w":"大相径庭","part":"c","gn":"五十四","gt":"相同与不同","sub":"不同","type":"four","expl":"径：门外小路。庭：厅堂前的院子。指彼此相差很远或截然不同。","core":"指彼此相差很远或截然不同","exs":["语言的发展使得汉语里很多字、词的古今义大相径庭。","面对群众遇到的问题，基层是立刻回应、主动作为，还是怠惰因循、坐等来办，实际效果大不一样，群众感受也大相径庭。","许多人误以为我们是志愿者，是心理医生，其实这与真正的安宁疗护理念大相径庭。安宁疗护不是安乐死，它也不会加速死亡，我们的目标是让终末期患者拥有尊严，维护生命的质量，感受生命的意义和价值。"]},{"id":682,"w":"泾渭分明","part":"c","gn":"五十四","gt":"相同与不同","sub":"不同","type":"four","expl":"泾、渭：甘肃、陕西境内的两条河。古人认为泾水清、渭水浊。泾水流入渭水时，清浊不混。比喻界限清楚、是非分明。","core":"比喻界限清楚、是非分明","exs":["一直以来，泾渭分明也是城乡间发展不平衡，农村城市居民生活悬殊差距的真实写照。","办案检察官表示，知识产权案件专业性强，对侵权行为性质的认定，不是路归路、桥归桥非黑即白那么一目了然、泾渭分明。","中医要生活化，但生活化项目不能侵入专业化领域，两者要确保泾渭分明。在无证行医、生活服务与医学服务相混淆比较普遍的当前，这类风险值得警惕。只有筑牢依法行事的底线，“中医生活化”才能做到趋利避害。"]},{"id":683,"w":"千姿百态","part":"c","gn":"五十四","gt":"相同与不同","sub":"不同","type":"four","expl":"形容姿态、形态多种多样，各不相同。","core":"形容姿态、形态多种多样，各不相同","exs":["泊山洞是典型的喀斯特地貌溶洞，洞内钟乳石千姿百态，宛如地下仙境。","无论是山中的小径、溪水、山峦，抑或千姿百态的树木都被距离抽象成了蓬勃原始的绿色。","有人追寻“最初的”年节氛围，也有不少家庭选择走出熟悉的环境，感受大好河山的辽阔壮美、风土人情的千姿百态。"]},{"id":684,"w":"相去甚远","part":"c","gn":"五十四","gt":"相同与不同","sub":"差距大","type":"four","expl":"互相之间存在很大差异和距离。","core":"互相之间存在很大差异和距离","exs":["2014年过去了，中国房地产表现的确有所疲软，但同“崩盘说”相去甚远。","可见，无论是从整体战力、武器装备还是官兵士气来看，台军都与解放军相去甚远。既然“打不过”，赖清德为何要挑衅？二问赖清德：“挑衅后果接踵而来”，如何善后？","哈马斯6日宣布同意斡旋方提出的加沙地带停火提议，但以色列方面表示哈马斯答应的条件与其要求相去甚远。哈马斯、以色列和相关斡旋方7日起在埃及首都开罗举行停火谈判。"]},{"id":685,"w":"判若云泥","part":"c","gn":"五十四","gt":"相同与不同","sub":"差距大","type":"four","expl":"意思是高低差别就像天上的云彩和地下的泥土那样悬殊。","core":"意思是高低差别就像天上的云彩和地下的泥土那样悬殊","exs":["走进厦门市翔安区香山街道沙美社区，整洁有序的环境，日新月异的容貌，与以往判若云泥，让人始料未及。","而想象与现实间判若云泥，真实的渔人生活，除了生存方式迥异，更有漂泊的孤寂，恰如胡俨《题米元晖画》其一中云：独泛扁舟江海上，信知天地一浮萍。","走进瑞泰马钢新材料科技有限公司节能环保型高温材料数字化车间，由一系列数字化设备组成的生产线正悄然高效运转，干净整洁的车间环境与之前“机器轰鸣、粉尘纷飞”判若云泥。"]},{"id":686,"w":"天壤之别","part":"c","gn":"五十四","gt":"相同与不同","sub":"差距大","type":"four","expl":"指高天和平地的区别。极言差别之大。","core":"指高天和平地的区别","exs":["飞有人机和飞无人机，一字之差却天壤之别。操控无人机是用大脑去构建战场，隔着屏幕、隔着数据、隔着千里，要实现人机合一难度很大。对于新手来说，往往有一种失控感。","云南的猪是跑山猪，牛羊是“马拉松”放养，鸡是山地散养，鱼是江河湖泊中自然生长的，这些天然食材，与用激素饲料喂养出的荤腥食材，有着天壤之别。","细小的差别与微弱的变化有可能引起研究结果的天壤之别，因此从研究的“细枝末节”处着手，以“显微镜式”的分析方法观察和思考问题往往会在学术研究中发现一些新的闪光点。在追根求源中解析问题。"]},{"id":687,"w":"天差地别","part":"c","gn":"五十四","gt":"相同与不同","sub":"差距大","type":"four","expl":"形容两者差距极大、完全不一样，一个天上一个地下。","core":"形容两者差距极大、完全不一样，一个天上一个地下","exs":["现在用无人机吊运，五六分钟就能完成，效率真是天差地别。","从“世界屋脊”到“东海前哨”，自然环境天差地别，但戍边卫国的职责始终不变。","从“卖桃赚钱”到“以桃兴业”，和十几年前相比，桃源村每年的水蜜桃产量变化幅度并不算太大，但消费方式却是天差地别。"]},{"id":688,"w":"迥然不同","part":"c","gn":"五十四","gt":"相同与不同","sub":"差距大","type":"four","expl":"迥然：相差很远的样子。形容事物之间差异显著、毫无相似之处。","core":"形容事物之间差异显著、毫无相似之处","exs":["容易与不易，往往因人所处之位、所见之物而迥然不同，有时甚至判若云泥。","中国幅员辽阔，各地情况千差万别，城市与乡村、东部与西部、传统产业与新兴业态，资源禀赋和面临的具体问题迥然不同。","尽管两地相隔万里，文化风貌也迥然不同，但两大文明在探索自然奥秘、构建精神信仰、表达审美追求上的深层共鸣，跨越山海、直抵人心。"]},{"id":689,"w":"各有千秋","part":"c","gn":"五十四","gt":"相同与不同","sub":"不分高下","type":"four","expl":"千秋：千年，指久远。各自有其可以长久流传的价值。也比喻各有各的优点和特色。","core":"千年，指久远","exs":["日前，外媒为我们带来了两平台的画质对比，从视频中来看，两者各有千秋。","不能光盯着“新三样”，不能大呼隆、一哄而起、一哄而散，一定要因地制宜，各有千秋。","比赛现场，小选手们扮相俊美、有板有眼，生旦净丑各有千秋。吉剧《包公赔情》、评剧《花为媒》、京剧《四杰村》等50余个经典剧目片段异彩纷呈，展现了扎实的基本功和演唱才华，彰显吉林省少年儿童的蓬勃朝气。"]},{"id":690,"w":"平分秋色","part":"c","gn":"五十四","gt":"相同与不同","sub":"不分高下","type":"four","expl":"原指昼和夜平均分占秋天景色。后比喻双方各得一半。也比喻两方平手，不分上下。","core":"原指昼和夜平均分占秋天景色","exs":["在摄影诗词作品中，照片和诗词有时并非势均力敌、平分秋色。","成都和绵阳作为传统强队互不相让，在六个组别中平分秋色，各自夺得三枚冠军。","黔南师院根据社会需要，提出了“擦亮师范底色、打造产业标杆”战略发展思路，师范和非师范平分秋色，互济发展，战役上集中打好师范“申硕”“师范认证”“预科集中教育”攻坚战；非师范类突出服务新型工业化、农业现代化。"]},{"id":691,"w":"分庭抗礼","part":"c","gn":"五十四","gt":"相同与不同","sub":"不分高下","type":"four","expl":"庭：庭院。抗：对等。客人与主人分立在庭的两侧，以平等的地位相对行礼。后用来比喻彼此地位或势力相等，平起平坐或互相对立。","core":"后用来比喻彼此地位或势力相等，平起平坐或互相对立","exs":["“微阅读”正在改变我们这个时代的阅读生态，在可预见的时间内，电子书将与纸质出版分庭抗礼。","我国学者张岱年、程宜山也曾指出：“在与西方近代文化接触之前，她（即中华文化）一向是一个文化辐射源，在她目力所及的‘天下’，还找不到第二个可以与之分庭抗礼的文化中心。”","“欲与天公试比高”，毛泽东从来不信邪，要与不可一世的统治阶级和社会制度分庭抗礼。“天翻地覆慨而慷”，中国革命推翻了压在人民头上的三座大山。“敢教日月换新天”，新中国成立后，人民当家做主。"]},{"id":692,"w":"巧夺天工","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"夺：压倒，胜过。人工的精巧胜过天然。形容技艺精妙高超。","core":"形容技艺精妙高超","exs":["在大连首届寿山田黄石展暨工艺美术大师石雕作品展上，一组巧夺天工的寿山石石雕作品格外吸引眼球。","当地观众陈婷见到以1∶40比例制作的“样式雷——滕王阁模型”，连连称赞它的栩栩如生、巧夺天工，表示以后一定要去江西亲眼看看这座千年名楼。走进“数字科技”展区，数字技术与传统文化相互融合，精彩纷呈。","一代代木雕艺人因循物性，将对自然的谦恭与生活的诗意结合起来，以巧夺天工的精湛技艺，充分发掘利用不同木材的天然之美，追求天人合一的境界。"]},{"id":693,"w":"精雕细琢","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"精心细致地雕刻琢磨。形容做事仔细用心。多指艺术品的创作。","core":"形容做事仔细用心","exs":["在“一带一路”国际技能大赛上，精细木工项目的比赛标准非常严格，选手们精雕细琢、分毫必较，一起去现场看看他们的精湛技艺。","古老的建筑，各个细节都精雕细琢，让城市文化建设和市政建设相统一，从而提高市民对城市的认同感、幸福感。历史文化融入城市血脉，融入百姓生活，不仅陶冶市民情操，还提升了城市软实力。","为此，设计方案精雕细琢，力求将交通设计与城市路网、主辅路敷设与城市空间、绿化景观与城市生态、市政配套设施与城市服务功能、品质提升与城市人文进行全方位融合。城市更新，“破”的不仅是道路，还有各种壁垒。"]},{"id":694,"w":"鬼斧神工","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"形容技艺高超神妙。同“神工鬼斧”。（侧重非人工的）","core":"形容技艺高超神妙","exs":["抛开对海蚀洞黑暗幽深、令人毛骨悚然的成见，大自然的鬼斧神工着实值得惊叹。","泛舟水上，大家感叹大自然的鬼斧神工。雨中的石林，别有一番韵味。近处的绝壁，高耸入云，秀美壮丽；远处的山峰，影影绰绰，若隐若现。撑伞漫步在炳灵寺石窟的小道上，1600多年的石窟艺术近在眼前。","激活地方文旅产业造血能力助力武隆别样“出圈”典型的喀斯特地貌，千百年大自然鬼斧神工，在武隆造就了三座天生的石拱桥。"]},{"id":695,"w":"炉火纯青","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"意思是认为炼到炉里发出纯青色的火焰就算成功了，后用来比喻功夫达到了纯熟完美的境界。","core":"意思是认为炼到炉里发出纯青色的火焰就算成功了，后用来比喻功夫达到了纯熟完美的境界","exs":["在炉火纯青的技艺背后，他传承了砥砺创新的家国情怀。","元青花瓷出土和传世文物数量极少，带有人物故事图案的更是屈指可数，而元青花四爱图梅瓶罕见地在四个海棠形开光内，绘有被称为“四爱图”的四幅人物故事画，不仅反映了元代景德镇陶瓷工匠炉火纯青的造物技艺，且彰显出中国传统文人雅士的审美旨趣。","毛泽东是独领风骚的诗人，诗艺技巧炉火纯青，诗词作品脍炙人口。但他的自我评价一向低调，不轻易发表作品，对作品修改炉火纯青，与人谈诗论词时态度平和，对别人的意见建议从谏如流。"]},{"id":696,"w":"登堂入室","part":"c","gn":"五十五","gt":"技艺精湛","sub":null,"type":"four","expl":"堂、室：古代宫室前为堂后为室。比喻学识由浅入深，逐步达到很高的成就。同“升堂入室”。","core":"比喻学识由浅入深，逐步达到很高的成就","exs":["龙舟、柔力球等基层开展活跃的群众体育项目登堂入室，进入全运赛场，本身就是对近几届全运会执行奥运战略的一次重新认识和扩展。","所以要系统全面学习，才能够登堂入室，获得真谛。系统学习的关键点又在哪里呢？在于建立起知识体系。有的党员干部认为，零零散散地学些理论要点，还能做到。结构化、体系化，这就太难了。","除了郑州，位于上海静安区的一家珠宝店里，培育钻石早已登堂入室，以天然钻石三分之一的价格，和其同台竞争。"]},{"id":697,"w":"登峰造极","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"意思是登上顶峰，指到达最高点；比喻学问、技艺等已达到最高的境界。","core":"意思是登上顶峰，指到达最高点","exs":["他的小说创作已经达到了登峰造极的地步，成为了当代文学的经典作家。","在文学作品中，写女性之美，曹植的《洛神赋》可谓登峰造极，超越了宋玉的《神女赋》。《洛神赋》是一篇幻想作品，是一个梦，一段神话，也是一首绮丽凄美的长诗。","一棵长7米、高4米的巨型淄博琉璃柿子树——由山东金祥琉璃文化艺术有限公司总设计师袁世祥设计，通过跨界融合，融琉璃、铁艺、扎染等多项工艺于一体的大型艺术作品《秋实》，曾获得中国美术金奖，体现了淄博琉璃技艺的登峰造极及创意水平。"]},{"id":698,"w":"目无全牛","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"比喻技艺熟练到了得心应手的境界。","core":"比喻技艺熟练到了得心应手的境界","exs":["锻造举重若轻的本领。庖丁解牛的故事许多人耳熟能详，庖丁之所以能达到“目无全牛”的境界，靠的是深钻细研、反复磨砺。","读书为学，亦需“目无全牛”，才能找到合适的切入点，“学者初看文字，只见得个浑沦物事，久久看作三两片，以至于十数片，方是长进。”"]},{"id":699,"w":"庖丁解牛","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"解：分解。比喻经过反复实践，掌握了事物的客观规律，做事得心应手，运用自如。","core":"比喻经过反复实践，掌握了事物的客观规律，做事得心应手，运用自如","exs":["毛泽东这位“辩证法大师”，熟稔地挥动矛盾分析法的“手术刀”，以庖丁解牛般的冷静与精准，剖析着抗日战争深处的沟壑","王卫却能敏锐地分辨出正常货物与可疑物品的细微差别。熟练排除干扰、快速分析成像、精准识别疑点，王卫在日复一日的工作中练就了“庖丁解牛”的本领。","若能在工作中既有雷厉风行、紧抓不放的“张”力，亦具审时度势、适时调整的“弛”态，事业发展才能如“庖丁解牛”般事半功倍、卓有成效。"]},{"id":700,"w":"出神入化","part":"c","gn":"五十五","gt":"技艺精湛","sub":"技艺精湛","type":"four","expl":"形容技艺、文笔、表演等高超到绝妙的境界，达到神妙完美、炉火纯青的地步。","core":"形容技艺、文笔、表演等高超到绝妙的境界，达到神妙完美、炉火纯青的地步","exs":["他既注意从中国传统军事理论著作中汲取营养，又善于总结现实的经验，把《孙子兵法》的思想精髓在中国革命战争中运用得出神入化。","守正不守旧、创新不失本，推动技术创新与产业应用实现融合，才能“让老手艺更出神入化”，实现旧中出新。","“禽鸟百兽一身带，真假难辨惊满堂”，凭借其高超技艺和出神入化的表演，口技已是我国脍炙人口的一种表演艺术。"]},{"id":701,"w":"蔚为大观","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"蔚：茂盛；大观：盛大的景象。发展成为盛大壮观的景象。形容事物美好繁多，给人一种盛大的印象。","core":"形容事物美好繁多，给人一种盛大的印象","exs":["贺匾蔚为大观，以鲜艳的中国红为底色，正面是习近平总书记“建设美丽新疆共圆祖国梦想”的题词，背面是维吾尔、哈萨克、蒙古、柯尔克孜4种少数民族文字对习近平总书记题词的翻译。","中国人民是在源远流长、根深叶茂、蔚为大观的中华文明历史中生长、熏陶、培塑起来的，而中华文明之所以能在世界民族之林中自立自强、灿烂夺目，又是与中国人民的文化基因密切相关的。","历经十四载，海峡论坛不断推动两岸交流走深走实、蔚为大观。两岸交流大潮中青春飞扬感谢海峡论坛一直致力于加强两岸民间交流，让台湾少数民族的声音被更多人听到。"]},{"id":702,"w":"洋洋大观","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"洋洋：盛大、众多的样子；大观：丰富多彩的景象。形容美好的事物众多丰盛。","core":"形容美好的事物众多丰盛","exs":["诗风词韵各烂漫，你方唱罢我登台。海涵百川的风格流派成就了中华诗词的洋洋大观。","万里河山、人间四季、百年悲欢、千古哲思，多姿多彩的世界为文人墨客提供了取之不尽的创作源泉，成就了中华诗词的洋洋大观。","更可贵的是丰德园重视地方文献的收藏，将园内雅积阁辟为藏书楼，今已收集了为数不少的有关书籍，并将继续搜集嘉定古今地方文献，相信未来必定会形成洋洋大观，成为该园一处令人关注的亮点。"]},{"id":703,"w":"琳琅满目","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"琳琅：美玉。所见皆美玉。比喻杰出人才、好文章或精美物品很多。（多形容商品）","core":"比喻杰出人才、好文章或精美物品很多","exs":["昔日的中国，是贫穷的，落后的，没有各种各样的家用电器，没有琳琅满目的商品。","影片多，活动多，星光熠熠，熙来攘往，仅就内容来说，上海国际电影节已经算得上琳琅满目。","最近几年，市场上的益生菌产品琳琅满目，他们还都有着各种各样让人眼花缭乱的健康作用。"]},{"id":704,"w":"引人入胜","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"引：吸引。胜：胜地。带人进入风景优美的地方。形容风景、作品很吸引人。","core":"形容风景、作品很吸引人","exs":["剧情跌宕起伏，引人入胜。","中哈合作出版《美丽中国美丽哈萨克斯坦》画册，向世界展示两国引人入胜的自然人文景观，体现中哈两国人民友谊，具有重要意义。","面向世界讲述中国故事，不能自话自说、自娱自乐，而要遵循国际传播规律，提升传播技巧，以平和的心态、平视的视角、平等的对话，用情用力把故事讲得更打动人心，把对外传播做得更引人入胜，让国际社会和国际受众喜闻乐见。"]},{"id":705,"w":"雅俗共赏","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"文雅的人和通俗的人都能欣赏。形容文艺作品格调适中、既有内涵又通俗易懂，大众和行家都喜欢。","core":"形容文艺作品格调适中、既有内涵又通俗易懂，大众和行家都喜欢","exs":["全书诗史互鉴、深入浅出、雅俗共赏，既有学术厚度，更有大众温度，是一部适合全年龄段、全社会共读的精品佳作。","村T的“村”正逐渐成为地球村的“村”，其草根属性也与高端平台的专业属性完成了一次次深度融合，诠释了新大众文艺“雅俗共赏、全民共享”的本质。","阳春白雪与下里巴人，自古雅俗共赏或雅俗各赏，皆无不可。自媒体时代，二者更可以各美其美、美美与共。对美景欣赏（主语是人）叹为观止、赏心悦目、目不暇接、眼花缭乱、心驰神往、"]},{"id":706,"w":"叹为观止","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"叹：赞叹。观止：看到这里就停止，不再看别的了，称赞所看的事物尽善尽美。赞美所看到的事物好到了极点。","core":"赞叹","exs":["本届冬奥会奥运村独具匠心，场馆令人叹为观止，组织工作非凡卓越。","勤劳智慧的柬埔寨人民创造了璀璨夺目的吴哥古迹，其宏伟的建筑和精美的浮雕壁画巧夺天工，令人叹为观止，在人类文明史上留下了不朽篇章。","惊险刺激的杂技表演，身穿古装的小姐姐梦幻联动，精彩的马术表演，让人目不暇接，叹为观止……"]},{"id":707,"w":"赏心悦目","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"悦目：看了舒服。指看到美好的景色而心情愉快。","core":"指看到美好的景色而心情愉快","exs":["足球的魅力还在于赛场情况瞬息万变，结局不可预测。我希望中国国家队和印尼国家队能为大家带来一场赏心悦目、友好精彩的比赛。","比景色更让人赏心悦目的，是文明观景的行动自觉，是人与自然和谐相处的画面。","让生活更美好，让人民更幸福，让我们身处的环境更加赏心悦目，这是全市干部群众的共同心愿。"]},{"id":708,"w":"目不暇接","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"暇：空闲。接：接触。眼睛来不及看。形容吸引人的事物很多，看不过来。（主语是人）","core":"形容吸引人的事物很多，看不过来","exs":["正是菊花飘香时。在白马湖生态旅游度假区菊花园内菊花盛开，芬芳多姿，让游客目不暇接。","新经济高速发展，令人目不暇接。","初夏时节，广西百色市西林县土黄庄园里的月季竞相绽放，让人们目不暇接。"]},{"id":709,"w":"眼花缭乱","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"缭乱：纷乱。因看到繁杂的事物而感到迷乱。（主语是人）","core":"纷乱","exs":["县城南边的交易市场简直令人眼花缭乱。一大片空地，挤满了各式各样买卖东西的人。","工业机器人盖房子、3秒就能喝上凉白开、现场体验飞机模拟器……进博会上的炫酷高科技真不少，让人眼花缭乱。","“黄旗武会”是当地一种独具特色的民间艺术表演形式，传承至今有300多年，表演以传统武术为基础，以双人对打为主，你来我往，闪转腾挪，武器相碰劈啪作响，令人眼花缭乱，惊心动魄，颇具观赏性。"]},{"id":710,"w":"心驰神往","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"驰：奔驰。心神奔向所向往的事物。形容一心向往。","core":"形容一心向往","exs":["在这片辽阔的土地上，大漠孤烟、江南细雨，总让人思接千载、心驰神往；黄河九曲、长江奔流，总让人心潮澎湃、豪情满怀。","今天，中国式现代化的壮丽图景令人心驰神往，中华民族伟大复兴的嘹亮号角让人心潮澎湃。","无论是嘈杂的市井，还是静谧的山水，都散发着独特的魅力，让人心驰神往。"]},{"id":711,"w":"魂牵梦萦","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"在梦魂中还牵挂萦绕着。形容思念深切，无法排遣。","core":"形容思念深切，无法排遣","exs":["这种无需精心照料的野菜，被崇明人制作成一道质朴却令人魂牵梦萦的春日限定美味——草头烧饼。","今年春节假期为期8天，文旅市场迎来新一轮热潮。作为全球知名度最高、覆盖面最广、参与人数最多的节日，春节不仅是物质的，更是精神的，那生生不息、一脉相传的年俗文化，正是中华儿女魂牵梦萦的根与魂。","随后的50年间，人形机器人不断解锁新本领，从弹钢琴、双足行走、做表情等简单行为，再到踢足球、做外科手术、跑马拉松、练武术等复杂任务，让机器人掌握高难度的人类技能，成为令许多研究者魂牵梦萦的挑战。"]},{"id":712,"w":"拍案叫绝","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"拍：拍打；案：桌子。形容对某事物极度赞赏。","core":"形容对某事物极度赞赏","exs":["这里既有让人拍案叫绝的自然风光，更在发展浪潮中积极作为。","木偶戏绝活频出，让人叫好不绝，看过川剧变脸，木偶的变脸技艺更让人拍案叫绝。","无论你轻轻推开哪家店铺的门扉，都能邂逅一场味觉的奇遇，领略到令人拍案叫绝的美味佳肴。"]},{"id":713,"w":"目不转睛","part":"c","gn":"五十六","gt":"与观看欣赏相关","sub":"近义辨析","type":"four","expl":"眼睛一动不动地盯着看，形容注意力高度集中。","core":"眼睛一动不动地盯着看，形容注意力高度集中","exs":["舞狮演员太厉害了，把狮子的各种形态演得活灵活现，看得人目不转睛。","孩子们骑在家长肩头目不转睛，市民们举着手机全程跟拍，现场掌声、欢呼声接连不断。","考古队员在发掘现场详细介绍了发掘进展和浮选流程，孩子们围在浮选设备旁，目不转睛地盯着水流中翻滚的土粒，亲自体验在土粒中翻拣微小的遗存。"]},{"id":714,"w":"侃侃而谈","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"“侃侃”指理直气壮，从容不迫。该成语可以表示一个人在说话时表现出的自信和从容，也可以形容一个人善于交谈、风度翩翩。（褒义词）","core":"“侃侃”指理直气壮，从容不迫","exs":["镜头面前，她侃侃而谈，很自然地与业主交流，引导她们介绍新上的服饰。看到王晓平这位老大姐都能当主播，年轻的女业主从开始的羞涩腼腆，逐渐也尝试着拓展业务做起直播带货。","马临街道沔山村党支部副书记王成能指着远处的养猪场侃侃而谈。位于马临街道沔山村的贵州猪倌乐园科技有限公司养殖基地。","在该公司的展示现场可以看到，不同的展示屏里，有上百名“主播”正在侃侃而谈。“说”相关（22个）"]},{"id":715,"w":"高谈阔论","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"指漫无边际地大发言论（多含贬义）。","core":"指漫无边际地大发言论（多含贬义）","exs":["民主不是高居庙堂、高谈阔论，而要食人间烟火、造福于民。","他认为，革命家不能只是高谈阔论，要做各种各样的实际工作。“吃饭穿衣，就是一件大事，一件难事”，绝不是小事。","要有高度的使命感和责任感，用敢于担当作为的态度和行动，力戒坐而论道的高谈阔论。"]},{"id":716,"w":"夸夸其谈","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"说话或写文章浮夸、不切实际。","core":"说话或写文章浮夸、不切实际","exs":["教育他人，与其夸夸其谈，不如以身作则。","领导干部需剔除“做事做秀”的诟病，多做为民造福“好把式”，避免纸面政绩“假把式”、夸夸其谈“嘴把式”。","抓落实，不能夸夸其谈、陷于“客里空”，而要当实干家，紧扣党中央重大决策部署，真抓实干、埋头苦干、善作善成。"]},{"id":717,"w":"口若悬河","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"“悬河”指瀑布。意为说话滔滔不绝，像河水倾泻一样，形容能说善辩，话语不断。","core":"“悬河”指瀑布","exs":["平时在同学面前口若悬河的队员们，在陌生的环境中，面对陌生人顿时语塞，即使壮胆开口讲解，也语无伦次。","一些单位在召开座谈会、听取工作汇报时仍存在一些问题：有的风气不实，汇报成绩口若悬河，提出问题蜻蜓点水。","“豫笑堂”剧场座无虚席，相声演员在台上口若悬河，为观众散播欢乐。"]},{"id":718,"w":"巧舌如簧","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"意思是舌头灵巧，能言善辩，形容能说会道，善于狡辩。","core":"意思是舌头灵巧，能言善辩，形容能说会道，善于狡辩","exs":["如果经济进一步低迷，不管执政党国民力量党如何巧舌如簧，都可能会在明年4月的国会选举中惨败。","为了15元，不良商贩巧舌如簧、上下其手，昧心钱赚得着实廉价。","有些老年人面对市场上花样繁多的金融产品不知如何选择，容易被一些巧舌如簧的人员欺骗，在不怎么了解产品的情况下盲目投资，造成资金损失。"]},{"id":719,"w":"巧言令色","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"用来形容那些擅长使用花言巧语和伪善的面容来取悦他人的人。（含贬义）","core":"用来形容那些擅长使用花言巧语和伪善的面容来取悦他人的人","exs":["拷问室的黑暗阴冷不能冷却江姐心中的“血与火”，敌人的威逼利诱、巧言令色绝不能动摇江姐永远爱党、忠党之心。","现在网络流行的“厚黑学”“潜规则”，这些不经之论在伪装之下容易让年轻干部将荒诞论调当做不刊之论，将巧言令色当做金科玉律，将油嘴滑舌奉为圭臬。“热情礼貌，一问三不知；尊重感谢，一概不负责。”","民进党当局这番歪曲事实、巧言令色的诡辩话术，欺骗不了岛内民众。"]},{"id":720,"w":"娓娓道来","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"是一种说话的方式，意思是不紧不慢地、从容地讲述。","core":"是一种说话的方式，意思是不紧不慢地、从容地讲述","exs":["《北京的山》延续他一贯娓娓道来、平实中有巧思的文风，语言表达简练有度且韵味十足，颇具个人特色。比如“河在山中，纵横交错，闪巧转身，坚定向前。八方之水，汇聚峡谷底部，两边各起峰峦。”","在这片原本就是村民们日常休闲和交流的花海长廊中，志愿宣讲员们用生动而丰富的内容，将党的二十大精神娓娓道来。","5位往届选调生代表结合自身成长经历，就年轻干部如何健康成长成才、如何增强防范化解风险本领、如何妥善处理工作棘手难题等问题话初心、谈体会、说经验，情真意切、娓娓道来，极具启发和教育意义。"]},{"id":721,"w":"信口雌黄","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"信：任凭，听任；雌黄：即鸡冠石，黄色矿物，用作颜料。古人用黄纸写字，写错了，用雌黄涂抹后改写。比喻不顾事实，随口乱说。","core":"比喻不顾事实，随口乱说","exs":["民进党一些人信口雌黄，进行政治操作，用心险恶，无助于问题的解决。","在事实和公理面前，一切信口雌黄、指鹿为马的言行都是徒劳的。","英方上述涉华言论纯属无中生有、信口雌黄、恶意诋毁。"]},{"id":722,"w":"言简意赅","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"赅：完备。形容言语简练而意思完备。","core":"形容言语简练而意思完备","exs":["您可以针对自己关心的领域提出意见建议，既可以是言简意赅的真知灼见，也可以是观点鲜明、论证严谨的系统论述。","汇报问题言简意赅，剖析症结鞭辟入里；讨论环节简洁高效，大家发言“干货”满满。","明确要求述职报告必须直奔主题、言简意赅，严格控制篇幅和时间。"]},{"id":723,"w":"直言不讳","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容说话言辞","type":"four","expl":"讳：避忌、隐瞒。指说话坦率直白，毫无隐瞒与顾忌，有话直说。","core":"指说话坦率直白，毫无隐瞒与顾忌，有话直说","exs":["这些用户年轻有活力，喜欢给予创作者最热情的肯定和赞美，也能直言不讳、给创作者提意见。","敢于动真碰硬、直言不讳，一针见血地指出病灶，方能取得“红脸出汗、排毒治病”的实效，把问题消弭于萌芽。","针对调研中发现的一些堵点难点，体验代表直言不讳地反馈问题，相关职能部门现场回应，承诺将对反映集中的问题建立台账，明确整改时限，推动立行立改与长效提升。"]},{"id":724,"w":"人云亦云","part":"c","gn":"五十七","gt":"“说”相关","sub":"学别人","type":"four","expl":"云：说。人家怎么说，自己也跟着怎么说。指没有主见或创见。（侧重于说）","core":"指没有主见或创见","exs":["在大是大非面前，是含糊不清还是立场坚定；在杂音噪音面前，是人云亦云还是保持定力。","这也说明，面对那些热点事件，要多留个心眼，多冷静思考，多推敲推敲，等一等权威信息，而不是人云亦云。","很多年轻人之所以选择“熬夜水”，一是自身不懂养生，盲目听信商家宣传，人云亦云。"]},{"id":725,"w":"拾人牙慧","part":"c","gn":"五十七","gt":"“说”相关","sub":"学别人","type":"four","expl":"拾：捡取。牙慧：指别人说过的话。比喻袭用他人的意见或言论。","core":"指别人说过的话","exs":["拾人牙慧不是读书的意义，领略自己才是读书的意义。","一个不懂唐诗、宋词、元曲之美的人，不是一个合格的现代人，更甭说文化人或自称是作家、诗人、评论家，充其量是识字者，从扫盲班里走出，谈笑皆吃穿，往来尽钱财，人云亦云，拾人牙慧，不求甚解，没有担当，没有品位。","这些反转基因的“斗士”，经常使用的一个方法是到西方拾人牙慧。"]},{"id":726,"w":"推心置腹","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容坦诚","type":"four","expl":"意思是把赤诚的心交给人家。比喻真心待人。","core":"意思是把赤诚的心交给人家","exs":["习近平总书记非常关心青年成长，多次来到青年中间，同大家推心置腹谈理想信念、谈人生价值、谈奋斗奉献。","古城司法所司法协理员马庆贞先通过谈心谈话，了解到买某的心结所在后，推心置腹与其深入交流，在不断沟通与帮助下，买某对生活充满了希望。","“经过几次思想教育和推心置腹的谈话后，我心里的‘疙瘩’解开了，请组织放心，我一定踏实工作，干出成绩。”"]},{"id":727,"w":"开诚布公","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容坦诚","type":"four","expl":"开诚：敞开胸怀，表示诚意。布公：公正无私地发表自己的见解。表示坦白无私，真诚相待，能诚恳坦率地提出自己的看法。","core":"敞开胸怀，表示诚意","exs":["中方进行对话的大门始终是敞开的，我们愿随时与美方进行开诚布公的沟通，开展解决问题的对话。","此次党性分析贯穿了“严”的标准和“实”的要求，既开诚布公开展自我批评、又相互交流意见建议，既锤炼了党性修养、又厚植了思想根基，达到了荡涤浮尘、净化灵魂的效果。","在地缘政治、地缘经济比较严峻的大背景下，中欧双方领导人以开诚布公的态度寻求对话，朝着有利的方向升华双边关系，消除了很多战略方面的误解。"]},{"id":728,"w":"披肝沥胆","part":"c","gn":"五十七","gt":"“说”相关","sub":"形容坦诚","type":"four","expl":"披：剖露。沥：滴下。露出肝脏，滴出胆汁。比喻对人对事非常忠诚。","core":"比喻对人对事非常忠诚","exs":["最是艰险见初心，披肝沥胆铸忠诚。面对生与死的考验，江善忠用自己的生命和鲜血践行了对党的绝对忠诚。","系统全员全时坚守岗位，众志成城提质增效，创造了历史上前所未有的经营业绩，实现了浴火重生；刮骨疗毒完善机制，披肝沥胆推进改革，探索形成了全国首家“上参下”农信改革模式。","从披肝沥胆的“肝胆外科之父”吴孟超，到一稻济天下的“杂交水稻之父”袁隆平，囊萤星火青年讲师团的8名青年讲师从不同角度阐释了党的二十大精神丰富内涵，深入浅出的解读、平凡生动的故事、直抵人心的表达，深深打动了每一位听众。"]},{"id":729,"w":"老调重弹","part":"c","gn":"五十七","gt":"“说”相关","sub":"重复性表达","type":"four","expl":"调：调子；曲调。陈旧的曲调重新弹奏。比喻已经说过的话再说过；也指说话或文章没有新意。","core":"比喻已经说过的话再说过","exs":["不过，分析人士普遍认为，这份报告相比之前的版本仍是老调重弹，而且缺乏明确的执行计划。","中国驻欧盟使团发言人表示，北约峰会公报连篇累牍，老调重弹，充斥冷战思维和意识形态偏见。","国际战略竞争日趋激烈，大国之间信任缺失，冷战思维卷土重来，意识形态对抗老调重弹，恃强凌弱、巧取豪夺、零和博弈等霸权霸道霸凌行径危害深重，恐怖主义、网络攻击、跨国犯罪、生物安全等非传统安全挑战上升。"]},{"id":730,"w":"陈词滥调","part":"c","gn":"五十七","gt":"“说”相关","sub":"重复性表达","type":"four","expl":"陈词：陈旧的不合实用的言辞；滥：空泛；失真。陈旧、空泛、不切实际的论调。","core":"陈旧的不合实用的言辞","exs":["七国集团峰会公报再次操弄涉华议题，污蔑攻击中国，翻炒没有事实基础、缺乏法律依据、也没有任何道义可言的陈词滥调，充斥着傲慢、偏见与谎言。","其实，所谓“中国产能过剩论”不过是陈词滥调，指责中国“产能过剩”对其他国家构成威胁完全是一个伪命题，是单边主义、保护主义的具体体现，实质是逆全球化思潮作祟。","日方有关文件沿袭抹黑指责中国的陈词滥调，渲染所谓“中国威胁”，无理干涉中国内政，中方对此坚决反对。"]},{"id":731,"w":"老生常谈","part":"c","gn":"五十七","gt":"“说”相关","sub":"重复性表达","type":"four","expl":"老书生经常讲的话。比喻听厌了的没有新鲜意思的话。（也做中性）","core":"比喻听厌了的没有新鲜意思的话","exs":["究竟选择专业还是院校，选择热门的还是有兴趣的，这些看似老生常谈的问题，每年高考落幕后，就成为家长们的烦心事。","“将群众知之甚少的产业密码翻译成喜闻乐见的文化语言，老百姓才知道原来咱们老生常谈的潼南柠檬已经有了这么多‘黑科技’和‘金招牌’。”李永恒认为，这样的展演拓展了区域农文旅品牌打造的路径和平台。","读着读着，他会觉得一个人在他面前老生常谈、无病呻吟。"]},{"id":732,"w":"不经之谈","part":"c","gn":"五十七","gt":"“说”相关","sub":"近义辨析","type":"four","expl":"不经：不合常理、没有根据。指荒诞无稽、没有根据的言论。","core":"指荒诞无稽、没有根据的言论","exs":["对于部分人散布的“中国科技完全依赖外国”的观点，中国在航天、量子信息、5G等领域取得的原创成果已让其沦为不经之谈。","质疑中国脱贫攻坚成就真实性的声音，在无数脱贫群众过上幸福生活的生动事例面前，不过是站不住脚的不经之谈。","对于任何否定中国特色社会主义道路历史必然性的言论，我们必须清醒认识到，这纯属不经之谈，绝不动摇我们的道路自信、理论自信、制度自信、文化自信。"]},{"id":733,"w":"无稽之谈","part":"c","gn":"五十七","gt":"“说”相关","sub":"近义辨析","type":"four","expl":"无稽：没有考证、没有根据。指完全没有事实依据的说法和言论。","core":"指完全没有事实依据的说法和言论","exs":["首先，喝骨头汤补钙纯属谣言，常喝骨头汤预防骨质疏松更是无稽之谈！","蛋白质是个好东西但不是越多越好但话说回来，再好的蛋白质，没有一定“量”作为支撑，也是无稽之谈。","对此，南开大学化学学院星光科普团成员刘明钰在接受科技日报记者采访时表示，说燃放烟花爆竹可以消毒防疫纯属无稽之谈。"]},{"id":734,"w":"流言蜚语","part":"c","gn":"五十七","gt":"“说”相关","sub":"近义辨析","type":"four","expl":"毫无根据的坏话、谣言和私下议论，多指背后恶意中伤、搬弄是非的话。","core":"毫无根据的坏话、谣言和私下议论，多指背后恶意中伤、搬弄是非的话","exs":["交流沟通内容不是家长里短、流言蜚语、绯闻八卦，而是有明确的主题，共同围绕感兴趣的话题交流探讨。","成长是自己的事，与其过于在乎别人的评价，被纷繁复杂的流言蜚语所扰，不如把功夫和心力用来修炼自己。","我们走访核查，发现林强到企业都是为协调解决企业发展问题，属于正常公务交往，相关举报缺乏事实根据。但有关流言蜚语广为传播，给他带来了心理负担。"]},{"id":735,"w":"危言耸听","part":"c","gn":"五十七","gt":"“说”相关","sub":"近义辨析","type":"four","expl":"故意说吓人、夸张离谱的话，使人听了震惊害怕。","core":"故意说吓人、夸张离谱的话，使人听了震惊害怕","exs":["新闻媒体、传播机构不可危言耸听，断章取义。这种专挑“致癌”等刺激字眼做标题的做法，跟旧时天桥卖大力丸的有一拼，锣鼓敲得震天响，真章全抛在边角料里。","家属懵了，我孩子明明不喘，你们怎么给下个哮喘的诊断呢？那么，医生真的在危言耸听吗？当然不是。","“脑腐”现象并非危言耸听，是信息时代的思维困境。这一现象的背后，是其附带产生的注意力涣散、精神疲劳等问题，尤其对低龄人群影响显著。"]},{"id":736,"w":"绘声绘色","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"绘：描绘。形容描写、叙事生动逼真。同“绘声绘影”“绘影绘声”。","core":"形容描写、叙事生动逼真","exs":["报告会上，解放军的战斗英雄绘声绘色地讲述着战斗经过。","各村居积极投入“四史”学习教育之中，书籍阅读、咏唱红歌等各类活动开展得绘声绘色、如火如荼。","袁钰森授课条理清晰，案例丰富，用绘声绘色地表达描述历史事件，给团员青年带来了形象生动的体验感。"]},{"id":737,"w":"活灵活现","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"意思是形容神情逼真、传神，使人有亲眼所见的感觉。","core":"意思是形容神情逼真、传神，使人有亲眼所见的感觉","exs":["他聆听讲解员的讲解，很怕落下了哪段精彩环节，并不时地想去摸摸这些活灵活现的标本。","再说王氏闻丈夫凶信，初时也疑惑。被吕宝说得活灵活现，也信了。","齐白石笔下的花鸟虫鱼活灵活现，呼之欲出。“演”相关（7个）"]},{"id":738,"w":"惟妙惟肖","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"惟：语气助词。肖：相像。形容描写、模仿得非常逼真。","core":"形容描写、模仿得非常逼真","exs":["湖南省郴州市飞天山风景区，从空中俯瞰神奇的丹霞地貌，天然形成的“心”形图案惟妙惟肖，让人叹为观止。","在这次创意剪纸画里，“蓝姐姐”们的神情、动作惟妙惟肖，英姿飒爽。","近日，云南一群剪纸艺术家巧手创作了一组反映云南北移亚洲象群的剪纸作品，惟妙惟肖地表现了象群的“北移之旅”。"]},{"id":739,"w":"栩栩如生","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"栩栩：生动的样子。指艺术形象非常逼真，如同活的一样。","core":"指艺术形象非常逼真，如同活的一样","exs":["虽然是镶嵌作品，然而衣纹栩栩如生，人物动态也很自然。","这些画里的虾之所以栩栩如生，是由于他深刻观察过真正的虾的生活，笔墨变化、写照已经达到了极高境界的缘故。","这些贴画作品栩栩如生，生动地展现了体育健儿在运动场上拼搏的场面。"]},{"id":740,"w":"有声有色","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"形容说话或表演精彩生动。","core":"形容说话或表演精彩生动","exs":["叶嘉莹领衔的23位名师用魅力独具的声音，对《唐诗三百首》中的全部313个篇目进行了逐一解读，让《唐诗三百首》多了一个“有声有色、视听兼美”的短视频版本。","突出面向基层群众，组织开展一系列铸牢中华民族共同体意识宣传活动，形式内容有声有色、精彩纷呈，助力铸牢中华民族共同体意识示范区建设。"]},{"id":741,"w":"一板一眼","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"比喻言语、行动有条理或合规矩。有时也比喻做事死板，不懂得灵活掌握。","core":"比喻言语、行动有条理或合规矩","exs":["原本本学习，一板一眼研讨，安安静静参观，扎扎实实工作，实实在在宣传，真正做到学纪、知纪、明纪、守纪。","我们必须担起该担的责任、负起该负的职责，立足实际把上级作出的决策、定下的事情、明确的任务，一步一动抓到底、一板一眼落到位。"]},{"id":742,"w":"呼之欲出","part":"c","gn":"五十八","gt":"“演”相关","sub":"“演”相关","type":"four","expl":"字面意思是叫一声就像会出来似的，形容画像或文学作品的人物描写非常生动逼真，也可指某事即将揭晓或出现。","core":"字面意思是叫一声就像会出来似的，形容画像或文学作品的人物描写非常生动逼真，也可指某事即将…","exs":["在“十五五”开局之年，中国式现代化夯实基础、全面发力的关键时期，一部保障在法治轨道上科学编制和有效实施国家发展规划的法律呼之欲出，旨在以法治固根本，用规划谋长远，确保现代化建设一张蓝图绘到底。","展望未来，“十五五”规划纲要呼之欲出，新的目标任务催人奋进。不驰于空想，不骛于虚声，只要锚定目标、一抓到底，我们必将以“干字当头”的担当和奋发有为的状态，将美好蓝图落为实景。","专家团队翻阅县志、走遍街巷；社区干部挨家挨户，走访调研；社区群众各抒己见，出谋划策……最终，“小尺度、渐进式、微改造”的“针灸式”改造模式呼之欲出。"]},{"id":743,"w":"此起彼伏","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音到处都是","type":"four","expl":"这里起来，那里落下。表示频繁地出现或产生。同“此起彼落”。（多形容声音或事物接连不断出现）","core":"表示频繁地出现或产生","exs":["近几年，电视剧的改名现象此起彼伏。一部电视剧的取名往往要经过三道坎：剧本阶段的名字、上报审批时使用的名字、过审后播出时的名字。","会场上，铿锵的声音穿透此起彼伏的掌声，回荡久远。","在鲜榨橙汁生产车间，整个生产流程井然有序，机器的轰鸣声此起彼伏，一筐筐金黄色的脐橙由隔板提升机传送到鼓泡清洗机进行自动清洗，真正做到了每一颗脐橙都能清洗得干净透亮。"]},{"id":744,"w":"不绝如缕","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音到处都是","type":"four","expl":"缕：线。像一根细线那样连着，差一点儿就要断了。①形容形势十分危急。②形容声音微弱而悠长。（现在用法有改变，常被用来形容不断绝）","core":"①形容形势十分危急","exs":["余音袅袅，不绝如缕。","中国共产党成立后，不仅同国民党之间有着剧烈的道路之争，同其他中间势力的道路比较和争论也是不绝如缕。“听”相关（7个）","农村公路示范创建不仅实现了道路环境畅通有序，也进一步改善了旅游交通条件，过往游客不绝如缕，乡村旅游蔚然成风。"]},{"id":745,"w":"经久不息","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音到处都是","type":"four","expl":"经过长时间停不下来。","core":"经过长时间停不下来","exs":["国家主席习近平宣布：杭州第十九届亚洲运动会开幕！顿时，全场沸腾，“数字焰火”绚烂绽放，全场掌声欢呼声经久不息。","中国民乐团与罗马尼亚小快板合唱团还共同表演了中国名曲《茉莉花》和罗马尼亚名曲《卡特里娜》，中国传统乐器的“中国风”和罗马尼亚风情的完美融合，赢得了现场观众经久不息的掌声。","在一个多小时的演出中，中国艺术家们凭借深厚的演奏功底和艺术素养征服了观众，掌声经久不息。最后，音乐会还加演了马耳他传统乐曲《太阳》，更让在场观众一起随着音乐起舞。"]},{"id":746,"w":"震耳欲聋","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音大","type":"four","expl":"形容声音很大，耳朵都快震聋了。","core":"形容声音很大，耳朵都快震聋了","exs":["在震耳欲聋的炮声中，情景合唱与舞蹈《战旗美如画》呈现抗美援朝的激战场面，讴歌志愿军战士保家卫国的炽热情怀。","当习近平主席把项目“金钥匙”交到萨勒总统手中时，全场沸腾了。掌声、鼓乐声、欢呼声此起彼伏、震耳欲聋。","除了来逛街的游客外，绝大多数都是为看2024年“海口杯”青少年三人篮球联赛而来，篮球场上格外热闹，球迷们的欢呼声震耳欲聋，场上打得不分伯仲、难以决出胜负，场外的球迷、市民和游客看得津津有味，他们时不时掏出手机拍摄现场精彩瞬间。"]},{"id":747,"w":"人声鼎沸","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音大","type":"four","expl":"鼎：古代煮食器；沸：沸腾。形容人群的声音吵吵嚷嚷，就像煮开了锅一样。","core":"形容人群的声音吵吵嚷嚷，就像煮开了锅一样","exs":["18日晚，容纳近6万名观众的武汉体育中心主体育场人声鼎沸、气氛热烈。","5月19日是第十三个“中国旅游日”，长白山景区面向所有游客免门票开放，长白山再现人声鼎沸、热闹非凡的火爆场景。","夜幕降临，贵阳市南明区护国路醉苗侗凯里酸汤鱼甲秀楼店内人声鼎沸，苗侗歌舞悠扬跃动，红亮飘香的特色酸汤翻腾不息，肥美亮白的鱼肉浸满酽香的辣椒蘸水美味诱人。"]},{"id":748,"w":"沸反盈天","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音大","type":"four","expl":"沸：沸腾。反：翻转。盈：充满。像沸腾的水那样翻滚着，响声充满了空间。形容喧哗吵闹，一片混乱，强调现场声音的极度喧闹与混乱，直接描述具体场合的嘈杂声（如集会、争吵现场）。（程度稍重）","core":"形容喧哗吵闹，一片混乱，强调现场声音的极度喧闹与混乱，直接描述具体场合的嘈杂声（如集会、…","exs":["贸易战下，美国那边沸反盈天，中国则继续按既定节奏前行。","时间倒退回10余年前，恰逢南京的彭宇案，真相还在扑朔迷离的时候，社会舆论已经沸反盈天，从此以后，“老人倒地，扶还是不扶”成了一个道德拷问。","应该说，这是一起较为普通的刑事案件，但是在舆论场中却沸沸扬扬，乃至沸反盈天。一个重要原因，就是有人“带节奏”、炮制“阴谋论”。"]},{"id":749,"w":"沸沸扬扬","part":"c","gn":"五十九","gt":"“听”相关","sub":"声音大","type":"four","expl":"像水沸腾后气泡、热气蒸腾翻滚一样，形容人声喧扰，议论纷纷，侧重描述议论的广泛传播，多用于抽象信息（如流言、政策）的传播扩散。","core":"像水沸腾后气泡、热气蒸腾翻滚一样，形容人声喧扰，议论纷纷，侧重描述议论的广泛传播，多用于…","exs":["此外，江苏还将支持各地打造“一市一主题”品牌矩阵，点亮多元场景，推动形成“来来往往、熙熙攘攘、红红火火、沸沸扬扬”的消费氛围。","姓刘的一家人因遗产继承问题闹得沸沸扬扬。","市场“鬼秤”乱象，其不仅仅是扰乱市场秩序，损害消费者合法权益，同时一旦被曝光，尤其是在网络上闹得沸沸扬扬，还会给整个城市的形象带来严重损害，甚至影响当地的旅游行业。"]},{"id":750,"w":"佶屈聱牙","part":"c","gn":"六十","gt":"“写”相关","sub":"形容文辞","type":"four","expl":"佶屈：曲折；聱牙：不顺口。指文章读起来不顺口。","core":"指文章读起来不顺口","exs":["比如先秦部分，吴氏叔侄放弃佶屈聱牙的《尚书》，直接从相对容易理解、善于讲故事的《左传》开始，不会一上来就给读者一个下马威，拒读者于千里之外，而是引起读者阅读的兴趣。","百廿年来，几代学人如老吏断狱、神探破案，从历史的缝隙中探求线索，考释出佶屈聱牙的文字逾千个。","全书近35万字，不乏引经据典之处，但读来毫无晦涩艰深、佶屈聱牙之感，而是深浅相宜、雅俗共赏。"]},{"id":751,"w":"入木三分","part":"c","gn":"六十","gt":"“写”相关","sub":"形容文辞","type":"four","expl":"形容书法笔力强劲。后也比喻看问题精辟、深刻。（也可形容对人物的描写刻画形象深刻）","core":"形容书法笔力强劲","exs":["中纪委的这组漫画，简直入木三分。“写”相关（14个）","在中央和国家机关党的建设工作会议上，习近平总书记入木三分地给昏官、懒官、庸官、贪官四类人画像。","全图共分为听乐、观舞、暂歇、清吹、散宴五个段落，以“连环画”的构图叙事形式表现各个情节，布局有起有伏、情节有张有弛，人物神态栩栩如生、入木三分。画卷本身的构图和精妙娴熟的绘画技法，成为艺术研究的重要范本。"]},{"id":752,"w":"只言片语","part":"c","gn":"六十","gt":"“写”相关","sub":"形容文辞","type":"four","expl":"简短零碎的话语、文字。形容语言文字数量极少。","core":"形容语言文字数量极少","exs":["汪曾祺通过细微处的刻画，往往能传神地塑造出人物，只言片语间仿佛已千载道尽。","仅凭只言片语，110接警员迅速锁定求助者位置。","看到职工们留下的只言片语，协会创办人直言，“看到书友们如此认真，如此投入，我深深地被大家感动了。”"]},{"id":753,"w":"妙笔生花","part":"c","gn":"六十","gt":"“写”相关","sub":"形容文辞","type":"four","expl":"比喻文笔高超、才思敏捷，写出的诗文或书画精彩动人。","core":"比喻文笔高超、才思敏捷，写出的诗文或书画精彩动人","exs":["校园里，诗文剧社搭建起闪耀的舞台，鼓励同学们用儒雅的谈吐、细腻的笔触将思考化为实践，在声情并茂间体悟“文思泉涌、妙笔生花”的乐趣。","许多家长学生来此打卡，都是为了沾一沾“文气”，希望考生妙笔生花、金榜题名。","他们全神贯注，以道源小镇的自然与人文景观为蓝本，融入端午等传统节日元素，挥毫泼墨、妙笔生花。"]},{"id":754,"w":"春秋笔法","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"即用笔曲折而意含褒贬的写作手法。","core":"即用笔曲折而意含褒贬的写作手法","exs":["中国驻法国大使馆在2020年12月的回应中指出《北京认为病毒来自国外》一文中运用“春秋笔法”混淆概念，通过重新翻炒“中国应对疫情延误论”误导公众。","鲁迅先生的杂文鞭辟入里，深得春秋笔法的要义。","欧阳修其时文坛之上南唐与后周词臣的影响力依旧还在，骈四俪六、浮夸浓艳的文风大行其道，他以“史家的春秋笔法”，泼墨挥毫，秉笔直书。"]},{"id":755,"w":"皮里阳秋","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"意思是藏在心里不说出来的言论，表面上不直接发表评论，但实际上内心有着褒贬不同的看法。","core":"意思是藏在心里不说出来的言论，表面上不直接发表评论，但实际上内心有着褒贬不同的看法","exs":["从前唯马首是瞻的几个经济大国现在是皮里阳秋，虚与委蛇，同为英语系的澳大利亚和加拿大都甩手眺望隔山风景。","众兄弟互相望望，都没有说话，只是皮里阳秋地笑笑。","场下众人被他大贤威势一压，顿时全都罢口不言，纷纷在肚里暗暗地皮里阳秋。"]},{"id":756,"w":"微言大义","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"意思是包含在精微语言里的深刻的道理。","core":"意思是包含在精微语言里的深刻的道理","exs":["富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善——这24字微言大义，无不渗透着对中华优秀传统文化因素的吸收和运用。","他致力于对民众普及哲学，《不朽哲学家咖啡馆》便是赫斯勒践行道德哲学的方式，亦是其哲学观点的集中表达，微言大义，洋溢着赤子之心和童真之趣。","人们在解读毛泽东诗词时，往往容易偏重于解读其“经纶”中的微言大义，而忽视经邦济世之外的“余事”，甚至把“余事”误作“经纶”。"]},{"id":757,"w":"字斟句酌","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"用来形容人在写作或说话时的态度非常认真和细致，对于每一个字词和句子都会进行仔细地考虑和推敲。","core":"用来形容人在写作或说话时的态度非常认真和细致，对于每一个字词和句子都会进行仔细地考虑和推…","exs":["参与翻译工作的专家学者精益求精、字斟句酌，与中央编译出版社的编辑团队一起，共同打造了这批党史经典外译著作。","夜深人静，他们还在伏案写作编辑，为记录两会每一个精彩瞬间字斟句酌……","收到政府提交的条例草案后，议员们逐字逐句厘清细节，务求清晰准确、精益求精；对关键条文反复讨论、字斟句酌。"]},{"id":758,"w":"连篇累牍","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"形容篇幅过多，文辞冗长。","core":"形容篇幅过多，文辞冗长","exs":["“假大空”不良文风的形成本质上违背了实事求是的思想路线，背离了全心全意为人民服务的根本宗旨，导致官话、套话、空话、假话连篇累牍。","在煽情、说教无以为继的时候，则往往以繁复的史料或冗长的考据代之，看似琳琅满目、翔实丰赡，实则连篇累牍、臃肿不堪。","中国驻欧盟使团发言人表示，北约峰会公报连篇累牍，老调重弹，充斥冷战思维和意识形态偏见。公报涉华内容罔顾基本事实，肆意歪曲中方立场和政策，刻意抹黑中国，中方对此坚决反对和拒绝。"]},{"id":759,"w":"妙趣横生","part":"c","gn":"六十","gt":"“写”相关","sub":"近义辨析","type":"four","expl":"洋溢着美妙的意趣，多指语言、文章、故事、表演等生动有趣，一点不枯燥。","core":"洋溢着美妙的意趣，多指语言、文章、故事、表演等生动有趣，一点不枯燥","exs":["气势铿锵的英歌舞、妙趣横生的踩高跷也将相继亮相，为本次庙会文化周再添盛景。","在非遗展示区，传承人现场演示非遗技艺；猜灯谜区域一条条妙趣横生的谜语引得男女老少争相竞猜，欢声笑语中洋溢着智慧与乐趣。","流光溢彩的鳌鱼灯飞舞翻腾，灵动的鱼灯队伍穿行于古巷，钟馗巡游表演妙趣横生，多项特色民俗展演吸引了众多游客驻足，带动古村“夜经济”持续升温。"]},{"id":760,"w":"一气呵成","part":"c","gn":"六十","gt":"“写”相关","sub":"形容表达流畅","type":"four","expl":"①形容文章的气势首尾贯通。②形容完成整个工作的过程中不间断，不松懈。","core":"①形容文章的气势首尾贯通","exs":["一个长达54秒的长镜头一气呵成，完美诠释了军队在党的指引下走来的内涵，完成这个叙事任务的是一个最长可达18米，重量超过1吨的重型伸缩摇臂。","要时刻保持清醒头脑，坚决克服麻痹思想、松劲心态，进一步坚定信心、排除万难，咬紧牙关、一鼓作气，以更加有力有效的措施，尽快实现社会面动态清零目标，一气呵成打赢万年突发疫情“围剿清零”歼灭战。","在田地里伴随着马铃薯一体化播种机的“突突突”声，施肥、播种、起垄、全膜覆盖……全套农业生产流水线种植作业一气呵成。"]},{"id":761,"w":"倚马可待","part":"c","gn":"六十","gt":"“写”相关","sub":"形容表达流畅","type":"four","expl":"倚靠着即将出征的战马起草文件，却可以立等完稿。形容文思敏捷，文章写得快。","core":"形容文思敏捷，文章写得快","exs":["江苏队以倚马可待、开局就是决战的行动，精彩诠释什么叫“疫情就是命令”！","乔羽写歌词，也并非总能倚马可待。他对待创作十分认真，没有想好绝不轻易下笔。","他戎马倥偬，倚马可待，创作了大量记录革命岁月的诗词。"]},{"id":762,"w":"一挥而就","part":"c","gn":"六十","gt":"“写”相关","sub":"形容表达流畅","type":"four","expl":"原义是一挥笔就能成功（就：完成）。指才思敏捷，写字、作文或画画速度很快。","core":"指才思敏捷，写字、作文或画画速度很快","exs":["东北全面振兴不是轻轻松松一挥而就的，唯有咬定目标不放松，敢闯敢干加实干，才能走出一条高质量发展、可持续振兴的新路子，谱写东北全面振兴新篇章。","春天的雁鸣湖，到处山清水秀、生机勃勃、景色宜人，尽是“春风一拂千山绿”“一江春水绿如蓝”的美好，好似大自然一挥而就的写意水彩画。","随着“百千万工程”的深入推进，一篇篇强县富民的“土特产”大文章一挥而就。"]},{"id":763,"w":"文不加点","part":"c","gn":"六十","gt":"“写”相关","sub":"形容表达流畅","type":"four","expl":"点：古人写文章在字的右上角涂一点，表示删去。文章不用涂改，一气写成。形容文思敏捷，写作技巧高超。","core":"古人写文章在字的右上角涂一点，表示删去","exs":["想要能够文不加点，下笔有神，除了天资之外，还必须不断地勤练。","汉·祢衡《鹦鹉赋序》：“衡因为赋，笔不停辍，文不加点。”","外甥小小年纪，写起文章来却能文不加点，一气呵成。"]},{"id":764,"w":"身无长物","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"除自身外再没有多余的东西。形容贫穷。","core":"形容贫穷","exs":["明代医圣李时珍常告诫子孙，居家戒奢靡，崇勤俭，在他的言传身教下，长子李建中在四川蓬溪县当了12年县令，回到家乡时，身无长物，仅带一些川糖孝敬父母。","噩梦终醒，警示心存侥幸者20年前出逃后没多久，齐跃侵吞的公款就被花光，身无长物的他只能选择藏匿在流动人口多、位置偏僻的房山区某村以打零工为生，东躲西藏、度日如年。","他自己一生清廉正直，身无长物，就连去世入殓时衣衾棺木的费用都是友人筹集，所欠医药费用也是夫人典当衣物支付。毛泽东同志为其所题的“学界泰斗，人世楷模”可以说是对蔡先生人格魅力的最好概括。“钱”相关（11个）"]},{"id":765,"w":"一文不名","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"形容人非常穷困，一文钱都没有。","core":"形容人非常穷困，一文钱都没有","exs":["如果我没有经历过出国后“一文不名、一无所有”的生活，没有这些起起落落、沉沉浮浮的经历，我的人生不会有第二次启航。","王家卫解读，从一文不名的阿宝摇身到叱咤风云的宝总，皇皇大时代，人人争上游，时代是“繁花”背后的主角，托住个体命运的是时代之手。","几年前，网上有一篇题为《白米饭垃圾食品之王》的文章竟将白米饭贬得一文不名，声称米饭几乎不含蛋白质、脂肪、维生素、矿物质，只有淀粉和糖，是典型的高糖、高热量、低蛋白的垃圾食品。"]},{"id":766,"w":"一穷二白","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"穷：指物质基础差；白：指文化和科学落后。比喻基础差，底子薄。","core":"指物质基础差","exs":["新中国成立以来，我国由一穷二白到全面小康，已踏上以中国式现代化全面推进强国建设、民族复兴的新征程，这是中国共产党团结带领全国各族人民艰苦奋斗取得的巨大成就。","战火催生的哈军工，在一穷二白中开拓，在筚路蓝缕中跋涉。","茶商龙雪，8年前返乡创业种茶，几年时间家里的茶园就从10多亩扩大到了现在的200多亩，从当初一穷二白的茶叶种植户一步步成长为茶叶收购商再到成立自己公司。"]},{"id":767,"w":"积贫积弱","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"意思是长期积累的贫困衰弱，形容极度的贫困和弱小。或指以前的行为导致现在的衰弱局面。","core":"意思是长期积累的贫困衰弱，形容极度的贫困和弱小","exs":["90年前，我国处在半殖民地半封建社会，中华民族处在积贫积弱、内忧外患的苦难深渊，中国人民处在饥寒交迫、民不聊生的悲惨境地。","中华人民共和国的成立，彻底改变了近代以后100多年中国积贫积弱、受人欺凌的悲惨命运，中华民族走上了实现伟大复兴的壮阔道路。","上世纪50年代中期，在戈壁荒原建立大型钢铁企业，对于技术经验极其缺乏的第一批包钢建设者来说无比艰难，对于国力积贫积弱、建设物资匮乏的新中国来讲，困难史无前例。"]},{"id":768,"w":"筚门圭窦","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"筚门：柴门（用竹条或树枝编成的门）。圭窦：上尖下方的圭形的门洞。形容住室极其简陋。旧指穷人住处。","core":"形容住室极其简陋","exs":["吾倚吾筚门圭窦而以为安也。","他们家已是筚门圭窦了，哪能再收他们的钱。","筚门圭窦系贫士之居；瓮牖绳枢皆篓人之室。"]},{"id":769,"w":"桑枢瓮牖","part":"c","gn":"六十一","gt":"“钱”相关","sub":"贫穷","type":"four","expl":"枢：门上的转轴；瓮牖：简陋的窗户。用桑树做门轴，用瓦罐做窗户，比喻贫苦之家。","core":"用桑树做门轴，用瓦罐做窗户，比喻贫苦之家","exs":["我便是桑枢瓮牖，他也情愿的布袄荆钗。","这间屋子真是桑枢瓮牖，连个转身的地方都没有。","他的住处虽然桑枢瓮牖，但他依然心满意足。"]},{"id":770,"w":"肥马轻裘","part":"c","gn":"六十一","gt":"“钱”相关","sub":"富有","type":"four","expl":"裘：皮衣。骑肥壮的马，穿轻暖的皮衣。形容阔绰。","core":"形容阔绰","exs":["家业家私，待你六亲；肥马轻裘，待你一身，倒贴了奁房和你为眷姻。","例如，有的党员、干部无视政治纪律和政治规矩，存在“七个有之”问题；有的罹患信马由缰的“政绩冲动症”，弄虚作假、阳奉阴违；有的马放南山、骑曹不记马，甚至追求肥马轻裘、声色犬马；有的披上“新马甲”，大搞新型腐败和隐性腐败。","当然也有一些肥马轻裘前呼后拥的达官贵人出来行猎，他们不是为了生计，不是为了获取食物与皮毛，仅仅是将行猎这当成一大乐趣。"]},{"id":771,"w":"钟鸣鼎食","part":"c","gn":"六十一","gt":"“钱”相关","sub":"富有","type":"four","expl":"钟：古代乐器；鼎：古代炊器。击钟列鼎而食。形容贵族的豪华排场。","core":"形容贵族的豪华排场","exs":["近距离观看“长江微笑天使”江豚，听着天井小镇三千年青铜文化的回响，欣赏着风雅的青铜宴舞，仿佛时光倒流，梦回秦汉钟鸣鼎食的生活。","在兔年中央广播电视总台春晚亮相的《锦绣》，是《五星出东方》里的重要段落，它展现着奉口中钟鸣鼎食的大汉都城最繁华富庶的一面。","在如梦似幻的氛围中，舞剧以《入府》拉开宝黛凄美爱情帷幕，用《幻境》引出“十二金钗”，在《含酸》《省亲》《游园》《葬花》《元宵》等剧情中一边展现贾府家族的钟鸣鼎食、一边呈现宝黛感情的变化。"]},{"id":772,"w":"养尊处优","part":"c","gn":"六十一","gt":"“钱”相关","sub":"富有","type":"four","expl":"养：指生活。指生活在有人伺候、条件优裕的环境中。","core":"指生活","exs":["群团机关不能成为安排养老的场所，不能成为养尊处优、混天度日的地方，更不能成为投机取巧、升官晋爵的跳板。","你们搞医学的应该学学，不要使人养尊处优，只想吃好、穿好，不想工作还行？更不能小病大养。保健不是保命，不要搞什么补养药品，我是从来不信这些的。主要是革命乐观、心胸开阔、锻炼身体。","“平时养尊处优惯了，吃喝消费都是高档次，我很享受这种感觉。”钟某为了保持自己的“高档”生活水平不减，虚假列支工作经费，只为满足一己之私。渐渐地，“节日病”演变成难以医治的“慢性病”。"]},{"id":773,"w":"待价而沽","part":"c","gn":"六十一","gt":"“钱”相关","sub":"待机谋利","type":"four","expl":"待价：指等待高价；沽：卖，出售。多比喻等待有好的待遇、条件才肯答应任职或做事。","core":"指等待高价","exs":["医疗服务也不是待价而沽的商品游戏，患者的信赖与托付，才是诊所安身立命之本。","待价而沽的心态，往往会错过最好的市场机遇，攥着“宝贝”不撒手，最终导致好产品砸在手里。","“恶意注册行为”是指违背诚实信用原则的行为，比如不以使用为目的而是为了待价而沽或者阻碍他人经营的行为等。"]},{"id":774,"w":"奇货可居","part":"c","gn":"六十一","gt":"“钱”相关","sub":"待机谋利","type":"four","expl":"奇货：珍贵的货物；居：囤积。意为把稀有的货物储存起来，等待高价卖出去，后比喻拿某种专长或独占的东西作为资本，等待时机，以捞取名利地位。","core":"意为把稀有的货物储存起来，等待高价卖出去，后比喻拿某种专长或独占的东西作为资本，等待时机…","exs":["大模型不能成为少数厂商掌握在手里奇货可居的赚钱利器，360支持开源，“让人人都能获得大模型带来的技术红利，实现安全行业新质生产力变革。”","在这些作品中，看不到创作者骄狂、浮躁的心态，看不到奇货可居、自我炒作的谋划。","随着注册制全面推进，上市公司奇货可居的时代已经一去不复返，新股上市数量势必增多，竞争也愈发激烈。"]},{"id":775,"w":"随遇而安","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"随：顺从。遇：境遇。安：安然。处在任何环境中，都能安然自得，感到满足。","core":"顺从","exs":["有一种心境叫随遇而安，有一种心态叫知足常乐。","对于青年人来说，最酷的青春，不是佛系，不是随遇而安，而是在生命里最旺盛的日子里，像爬山虎一样，向着心中的梦想，不断向上攀缘，把青春的绿色铺满征途。","想得太多，就注定逃不开庸人自扰，有时与其委屈自己，不如随遇而安。"]},{"id":776,"w":"安之若素","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"素：平常。指身处逆境、遭到困难或遭受挫折时能泰然处之，跟平常一样。","core":"指身处逆境、遭到困难或遭受挫折时能泰然处之，跟平常一样","exs":["冰心也有其他老年人的毛病，如她曾经中风、右半身偏瘫、摔跤折断过左胯骨、动过大手术。对于所有这些，她都是安之若素──抱着既来之则安之的态度。","只要还有一家一户乃至一个人没有解决基本生活问题，我们就不能安之若素；只要群众对幸福生活的憧憬还没有变成现实，我们就要毫不懈怠团结带领群众一起奋斗。“心态”相关（17个）","星河流转，四季轮换，有人在物变境迁中遇见新的生活，有人在两点一线间安之若素，也有人在日升月落中勇对澎湃浮生。"]},{"id":777,"w":"安贫乐道","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"道：主张，思想。安于贫穷，以坚持自己的信念为乐。旧时士大夫所主张的为人处世之道。","core":"主张，思想","exs":["“安贫乐道”，“穷自在”，“等、靠、要”，怨天尤人，等等，这些观念全应在扫荡之列。弱鸟可望先飞，至贫可能先富，但能否实现“先飞”“先富”，首先要看我们头脑里有无这种意识。","我们要安贫乐道。这个“道”就是革命的理想。","安贫乐道是许多文化人士追求的生活方式，他们不追求物质上的享受，而是注重精神上的富足。"]},{"id":778,"w":"泰然处之","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"面对紧急情况或困难时，保持冷静并妥善处理，强调对具体问题的应对态度和行动。","core":"面对紧急情况或困难时，保持冷静并妥善处理，强调对具体问题的应对态度和行动","exs":["总之，面对人生沉浮、名利得失，要抱有平常之心，泰然处之——有所得时，无须得意忘形；有所失时，不必失魂落魄。","这些通行网络的新词，在著名语言文字专家、《咬文嚼字》主编郝铭鉴眼中不过是一种玩具，对汉字实质上不会构成威胁和伤害。“这些新鲜的流行语今天即使再红、再火爆，我们也可以泰然处之。这些怪异语言的追捧者多是青少年，那不过是孩子们之间的一种游戏而已”。","当选家委会成员既应感到光荣更应泰然处之。家委会是服务的机构，需要当选的家长付出更多。但这并不意味着家委会的成员具备比其他家长更高的地位和权力。"]},{"id":779,"w":"神色自若","part":"c","gn":"六十二","gt":"“心态”相关","sub":"心态好","type":"four","expl":"外表神态自然，不显露紧张或慌乱，侧重于外在表情的平稳，不因外界影响而变化。","core":"外表神态自然，不显露紧张或慌乱，侧重于外在表情的平稳，不因外界影响而变化","exs":["她说，经历了这么一次大型的比赛，以后再遇到什么情况都会处事不惊、神色自若，这是射击带给她的精神财富。","记者注意到，在管控区，虽然居民只能在指定区域活动，但大家神色自若，颇为淡定。街上，两名志愿者正帮助一位刚生产完的居民回到住处。","在裁判员宣布“开始比赛”后，少年们以迅雷不及掩耳之势拿起面前五颜六色的魔方，“唰唰唰”地转动起来，反转、拼凑、合并，眼疾手快而又神色自若。"]},
