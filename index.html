机都想实现却只能实现一种；(2)回避回避型，即两种事物都想拒绝而又必须选择一样；(3)向往回避型，即对一种目标既想争取又想回避。③指文艺作品中人和人，人和环境，或人物内心的矛盾及其激化。是构成情节的基础和展现人物性格的重要手段。戏剧作品特别重视冲突，没有冲突就没有戏剧。","冷落":"冷清、不热闹，也指受到轻视、不理睬或不重视。","净化":"清除杂质使物体纯净～污水ㄧ～城市空气◇～心灵 ㄧ～社会风气。","凄风苦雨":"凄风寒冷的风；苦雨久下成灾的雨。形容天气恶劣◇用来比喻境遇悲惨凄凉。","凋敝":"生活穷困或事业衰败、萧条零落。","凋零":"草木花叶凋谢脱落，也比喻人才流失衰落或事物衰亡。","凝神":"1.聚精会神。","出现":"1.显露出来;呈现。 \n2.产生出来。","分寸":"说话或做事的适当限度与尺度，掌握好进退规矩。","分析":"把复杂的整体分解为各个组成部分分别加以考察与研究。","划分":"把整体分成若干部分或界限。","刚好":"恰好、正合适，指时间、数量或程度不早不晚、不多不少。","刚正不阿":"阿迎合，偏袒。刚强正直，不逢迎，无偏私。","创新":"抛弃旧事物、创立新方法、新技术或新思想。","创设":"创造建立或设定相应的环境、机制与条件。","创造":"想出新方法、做出新成果，建立前所未有的事物。","删繁就简":"删除去；就趋向。去掉繁杂部分，使它趋于简明。","判别":"辨别；判定真真假假，难以判别。","判断":"①断定判断准确｜正确的判断。②判决雨村便徇情枉法，胡乱判断了此案。③对事物情况有所肯定或否定的思维形式。如马克思主义是真理。”所作的肯定或否定符合客观实际，判断就是真的，否则就是假的。检验判断真假的唯一标准是社会实践。判断由概念组成，是在实践的基础上反映现实的结果。判断总是表现为句子，但是并非所有的句子都表示判断。同一个判断可以用不同的句子来表示，同一个句子也可以表示不同的判断。","判若两人":"形容某人前后的言行明显不一致，象两个人一样。","利器":"锋利的兵器，比喻行之有效、极具威力的有力工具或方法。","别具匠心":"匠心巧妙的心思。指在技巧和艺术方面具有与众不同的巧妙构思。","别无长物":"长物多余的东西。除一身之外再没有多余的东西。原指生活俭朴。现形容贫穷。","别有用心":"用心居心，打算。心中另有算计。指言论或行动另有不可告人的企图。","制定":"定出；拟订制定计划。","刷新":"淘汰旧的，创造新的刷新世界纪录。","前赴后继":"前面的冲上去了，后面的紧跟上来。形容不断投入战斗，奋勇冲杀向前。","剖析":"分析；辨析剖析事理｜仔细剖析。","力所不逮":"逮指达到。自身能力达不到或无法办到。","劣势":"情况或条件比较差的形势处于～ㄧ变～为优势。","助力":"1.帮助;援助。","勃兴":"蓬勃发展并迅速兴起。","勇往直前":"勇敢地一直向前进。","勤俭持家":"以勤劳和节俭的态度操持家庭生活与事务。","勤力同心":"齐心协力、共同勤勉奋斗。","包含":"里面含有、包括在内。","区分":"辨别、把不同的人或事物区别开来。","区别":"①把两个或两个以上的不同事物分别开来区别好坏｜难以区别。②差别；不同错误性质没有区别。","千奇百怪":"形容各种各样奇怪的事物。","千秋万代":"一千年，一万代。指世世代代，时间久长。","升山采珠":"到山上去采珍珠。比喻办事的方向、方法错误，一定达不到目的。","半青半黄":"农作物还没有长好，青黄相接。比喻时机还没有成熟。","印记":"1.公章;图章。唐张彦远《历代名画记》有《叙古今公私印记》。 \n2.盖章的印迹。 \n3.痕迹;标记。","危机感":"对潜藏危险与困境的敏锐警惕与忧患意识。","危若朝露":"危险得像清早的露水一样容易消失。比喻面临死亡。","历史性":"具有重大历史意义、能被载入史册或影响深远的性质。","原则":"言行所依据的准则坚持原则｜四项基本原则｜原则分歧｜不讲原则。","原封不动":"原封没有开封。原来贴的封口没有动过。比喻完全按照原样，一点不加变动。","原形毕露":"原形原来的形状；毕完全。本来面目完全暴露。指伪装被彻底揭开。","去粗取精":"除去杂质，留取精华。","参与":"参加进某一活动或事务中并发挥作用。","参加":"加入某种组织或参与某项活动。","反响":"回响；反应她曾经登台演出，～不一 ㄧ此事在报上披露后，在社会上引起强烈～。","反复":"①一遍又一遍；多次重复～思考 ㄧ～实践。②颠过来倒过去；翻悔～无常ㄧ说一是一，说二是二，决不～。③重复的情况斗争往往会有～。","反复无常":"无常变化不定。形容常常变化，一会儿是这样，一会儿又是那样，变动不定。","反躬自问":"躬自身；问检查。回过头来检查自己的言行得失。","发动":"动员并组织起来，也指启动、引发。","发展":"①事物由小到大、由简单到复杂、由低级到高级的变化事态还在～ㄧ社会～规律。②扩大（组织、规模等）～新会员 ㄧ～轻纺工业。","发挥":"把潜在的能力、特长或内在作用充分展现出来。","发掘":"挖掘埋藏在地下的文物、资源，比喻深入挖掘发现潜在的人才或内涵。","发端":"事情的开端、起源或起始之点。","发起":"首倡、首先倡议并着手组织。","取长补短":"吸取别人的长处，来弥补自己的不足之处。也泛指在同类事物中吸取这个的长处来弥补那个的短处。","变幻无常":"指事物经常变化，没有规律性。","变本加厉":"厉猛烈。指比原来更加发展。现指情况变得比本来更加严重。","变迁":"情况或环境随着时代的发展而发生的演化与改变。","叙述":"将事情的经过写下来或说出来叙述事情的经过｜他的叙述很有条理。","口口相传":"不著文字，口头相传。","口碑载道":"口碑比喻群众口头称颂象文字刻在碑上一样；载充满；道道路。形容群众到处都在称赞。","另起炉灶":"另外重支炉灶。比喻放弃原来的，另外从头做起。","可惜":"值得惋惜、令人觉得遗憾。","各执一端":"各自坚持自己的一方面观点或片面立场，互不相让。","合法":"符合法律规定与法律要求。","合理":"合乎情理、合乎规律与客观逻辑。","同化":"①使不相同的事物逐渐变得相同或相近反对民族同化政策。②见适应③”(640页)。","名无虚传":"传出的名声与实际情况完全符合，并非虚假虚名。","后患无穷":"以后的祸害没有个完。","否定":"①否认事物的存在或事物的真实性（跟‘肯定’相对）全盘～ㄧ～一切。②表示否认的；反面的（跟‘肯定’相对）～判断。","否极泰来":"否、泰《周易》中的两个卦名。否卦不顺利；泰卦顺利；极尽头。逆境达到极点，就会向顺境转化。指坏运到了头好运就来了。","含有":"里面包含或拥有某种成分、内容。","听之任之":"听、任随，任凭；之代词，代人或事物。任凭事物存在发展而不去过问。","听天由命":"由听从，随顺。听任事态自然发展变化，不做主观努力。也比喻碰机会，该怎么样就怎么样。","启发":"①开导指点，使产生联想并有所领悟启发式教学｜这番话对我很有启发。②阐明；阐释启发篇章，校理秘文。","呈现":"显露；表现湖光山色呈现在眼前｜呈现出缤纷的色彩。","周而复始":"周环绕一圈；复又，再。转了一圈又一圈，不断循环。","呼唤":"大声呼喊，也比喻时代的需要或内心的热烈召唤。","呼应":"彼此彼此支持、相互配合联动或内容首尾关照。","和颜悦色":"颜面容；悦愉快；色脸色。脸色和霭喜悦。形容和善可亲。","咫尺千里":"比喻距离虽近，但很难相见，象是远在天边一样。","咬文嚼字":"形容过分地斟酌字句。多指死扣字眼而不注意精神实质。","唇枪舌剑":"舌如剑，唇象枪。形容辩论激烈，言词锋利，象枪剑交锋一样。","喧嚣不已":"声音嘈杂喧闹，长久停不下来。","团结奋进":"团结一心、共同努力奋斗奋发向前。","困难":"阻碍事物正常进行的阻力、障碍或窘境。","固有":"本来有的；不是外来的～文化。","坚决":"（态度、主张、行动等）确定不移；不犹豫态度～ㄧ认识了错误就～改正 ㄧ～抓好安全生产的各项工作。","坚定不移":"移改变，变动。稳定坚强，毫不动摇。","增量":"在原有基础上的增加部分、新增规模或增益幅度。","声声入耳":"形容各种声音清晰地传入耳中，常指关心世事或乐音动人。","备受瞩目":"受到社会或外界极大的关注与注视。","复杂":"事物交错纠缠、多变难理，不简单。","多姿多彩":"形容颜色、形态、样式丰富繁多，绚丽多样。","多管齐下":"多方面同时采取措施或多项工作同步并进。","大包大揽":"1.方言。把事情全部包揽过来。亦表示有把握﹐负得起责任。","大同小异":"大体相同，略有差异。","大开眼界":"开阔视野，增回见识。","大快朵颐":"朵颐指鼓动腮帮子进食。指痛痛快快大吃美食，极其享受。","大饱口福":"吃到丰盛美味的食物，嘴巴享受到了极大满足。","失误":"1.亦作\"失悮\"。 \n2.差错;过错。 \n3.疏忽;耽误。","夸大其词":"把事情说得超过原有的程度。","夹杂":"搀杂脚步声和笑语声～在一起。","奄奄一息":"奄奄呼吸微弱的样子。只剩下一口气。形容临近死亡。","奉为至宝":"奉信奉，敬奉；至宝最珍贵的宝物。敬奉为最珍贵的宝物。","奋发有为":"奋发精神振作。精神振作，有所作为。","奔流不息":"水流奔腾流淌不停，比喻事物向前发展永不停止。","如法炮制":"炮制用烘、炒等针药材制成中药。本指按照一定的方法制作中药。现比喻照着现成的样子做。","娇生惯养":"娇爱怜过甚；惯纵容，放任。从小就被溺爱、娇养惯了。","存积":"储存积蓄，放置聚集起来。","存量":"原有已经存在的数量、规模或固定资产底数。","孤立无援":"只有一个人或一方面的力量，得不到外力援助。","学以致用":"为了实际应用而学习。","安于现状":"对目前的情况习惯了，不愿改变。","安如泰山":"形容象泰山一样稳固，不可动摇。","安身立命":"安身在某处安下身来；立命精神有所寄托。指生活有着落，精神有所寄托。","定格":"①电影、电视片的活动画面突然停止在某一个画面上，叫做定格。②固定不变的格式；一定的规格写小说并无～。","实事求是":"指从实际对象出发，探求事物的内部联系及其发展的规律性，认识事物的本质。通常指按照事物的实际情况办事。","实质性":"触及事物内在本质或具有实质意义的，非表面化的。","宠儿":"备受喜爱、青睐与优待的人或事物。","客观":"独立于人意识之外的实在，也指真实公正、不带主观偏见。","宣扬":"1.广泛传布;传扬。 \n2.谓张扬于外。 \n3.对众讲解﹑说明。 \n4.高声念诵。","寄身":"托身、栖身于某处或某种环境中。","密不可分":"关系极其紧密，无法分割开来。","察觉":"看出；发现我用儿童的狡猾的眼光察觉，她爱我们，并没有存心要打我们的意思。","寡廉鲜耻":"寡、鲜少。旧指不廉洁，不知耻。现指不知羞耻。","对话":"双方或多方交流交谈，比喻不同文明、思想平等的交流与互动。","导向":"引导的方向新闻工作要坚持正确的舆论导向。","将信将疑":"将且，又。有点相信，又有点怀疑。","将心比心":"设身处地地为别人着想。","小桥流水":"形容江南水乡清新宜人、小巧幽雅的自然风光。","尔虞我诈":"尔你；虞、诈欺骗。表示彼此互相欺骗。","尝试":"试验、试探性地去做，探索可能的结果。","尺度":"量度标准的准绳，比喻衡量行为或作品的标准与限度。","尽善尽美":"极其完善，极其美好。指完美到没有一点缺点。","尽显":"充分、完全地显露展现出来。","屏蔽":"遮挡、隔离使不受外界影响或看不见。","屡屡":"副词。表示情况一再出现屡屡创造新记录｜屡屡战胜对方。","山穷水尽":"山和水都到了尽头。比喻无路可走陷入绝境。","岸芷汀兰":"岸边的香草与小洲上的兰花，比喻美好芬芳、品格高洁之物。","差别":"1.差异;不同。 \n2.区分，分别。","差异":"①差别，不相同两地风俗，差异甚大。②指统一体内在的差异，即事物内部包含着的没有激化的矛盾。是矛盾的一种表现形式。它反映了矛盾的普遍性。","差池":"差错、错误，常指由于疏忽导致的不利后果。","席不暇暖":"席坐席；暇空闲。连席子还没有来得及坐热就起来了。原指东奔西走，不得安居◇形容很忙，多坐一会儿的时间都没有。","平平无奇":"平淡无奇，没有任何出彩或特殊之处。","广泛":"涉及的范围宽广、普及面大。","庆幸":"因为意外地逢凶化吉或得到好结果而感到高兴与幸运。","应对":"用言语答对善于应对｜入则与王图议国事，以出号令；出则接遇宾客，应对诸侯。","应有":"1.所有，一切。 \n2.应当具有。","度德量力":"度估量；德德行♀量自己的德行是否能够服人，估计自己的能力是否能够胜任。","延绵不断":"接连不断、绵延延伸不绝。","建设":"创立新事业；增加新设施经济～ㄧ组织～ㄧ～家园ㄧ～现代化强国 ◇思想～。","开启":"打开、开始新的局面、进程或大门。","开拓":"开辟、拓展未知的领域、市场或境界。","开放":"①（花）展开百花～。②解除封锁、禁令、限制等公园每天～ㄧ图书馆～时间每天上午八时至下午六时ㄧ机场关闭了三天，至今日才～。③性格开朗性格～。","开明":"思想开放通达、通情达理，不保守拘泥。","开朗":"①地方开阔，光线充足豁然～。②（思想、心胸、性格等）乐观、畅快、不阴郁低沉胸怀～，精神焕发。","异化":"事物发展中逐渐偏离原有本质，甚至转化为反对自身的异己力量。","弃如敝屣":"敝破烂的。屣鞋。像扔破鞋一样扔掉。比喻毫不可惜地扔掉或抛弃。亦作弃若敝屣”、去如敝屣”、如弃敝屣”。","弃若敝屣":"敝破；屣鞋。象扔破鞋一样把它扔掉。比喻毫不可惜地抛弃掉。","弊端":"弊害和毛病，制度或管理中的缺陷与漏洞。","引人关注":"引起外界或公众的重视与瞩目。","引人注目":"注目注视。吸引人们注意。","引发":"1.指出殡。 \n2.犹启发。","引述":"1.谓援引叙述他人的文章言词。","强调":"1.特别着重或着重提出。","形成":"事物经过发展演进，构建出一定的形态或格局。","彻底":"1.通透到底。形容深透﹑完全而无所遗留。 \n2.形容水清见底。","徒托空言":"白把希望寄托于空话。指只讲空话，而不实行。","得不偿失":"偿抵得上。所得的利益抵偿不了所受的损失。","得意洋洋":"洋洋得意的样子。形容称心如意、沾沾自喜的样子。","得过且过":"且暂且。只要能够过得去，就这样过下去。形容胸无大志。","循规拘礼":"拘泥于旧规矩礼节，思想保守拘谨不知变通。","心中有数":"对情况和问题有基本的了解，处理事情有一定把握。","心口不一":"心里想的和嘴上说的不一样。形容人的虚伪、诡诈。","心向往之":"对某个人或事物心里很向往。","心领神会":"领、会领悟，理解。指对方没有明说，心里已经领会。","必修课":"与选修课”相对。指高等学型中等专业学校中学习某一专业的学生必须修习的课程。通常包括公共课、基础课和专业课。","必要":"不可缺少；非这样不行开展批评和自我批评是十分～的ㄧ为了集体的利益，～时可以牺牲个人的利益。","忍俊不禁":"忍俊含笑；不禁无法控制自己。指忍不住要发笑。","志得意满":"志向实现，心满意足。","忘乎所以":"指因过分兴奋或得意而忘了应有的举止。","忽略":"没有注意到或疏忽没有顾及。","忽视":"不重视、不放在心上而故意或疏漏地略去。","怀揣":"1.胸怀里藏着。","思维":"①与感性认识”相对。指理性认识，即思想；或指理性认识的过程，即思考。是人脑对客观事物间接的和概括的反映。包括逻辑思维和形象思维，通常指逻辑思维。②与存在”相对。指意识、精神。","思路":"1.思想的门径;思维的条理脉络。","总开关":"控制全局的总闸门，比喻世界观、人生观、价值观等核心根本环节。","总揽全局":"从宏观全面掌控总体局势与方向。","恢弘壮丽":"气势极其宏伟壮观、气派瑰丽。","息息相关":"息呼吸时进出的气◆吸也相互关联。形容彼此的关系非常密切。","情有可原":"按情理，有可原谅的地方。","惜墨如金":"惜爱惜。爱惜墨就象金子一样。指不轻易动笔。","感悟":"有所感触而领悟在奋斗中～到人生的真谛。","感知":"感官接收外界刺激并认识理解的感觉认知过程。","成因":"1.形成的原因。","成效":"效果；功效成效卓著｜初见成效。","战胜":"1.在战争中取胜;经战斗而获胜。 \n2.指一种思想克服另一种思想。 \n3.指科举考试登第。","手到病除":"刚动手治疗，病就除去了。形容医术高明。也比喻工作做得很好，解决问题迅速。","托底":"1.垫底。谓衬托在下面。 \n2.谓有底，有依托。","扪心自问":"摸着胸口，自己问自己怎么样。指自己反省。","扬名天下":"名声传播传扬到普天之下，极言知名度之高。","扭转乾坤":"乾坤天地。比喻从根本上改变整个局面。","扶手称颂":"按手称道赞赏，形容大家一致交口称赞。","承担":"1.担负;担当。","技压群芳":"技艺精湛绝伦，压倒并超越了所有的同行或对手。","把握":"抓住、掌控，也指成功的可靠性与分寸感。","抚掌大笑":"抚拍。拍手大笑。形容非常高兴。","抵触":"彼此矛盾、不协调或产生排斥、抗拒的情绪。","拈轻怕重":"指接受任务时拣轻的担子挑，怕挑重担。","拉锯战":"双方反复争夺、互不相让、持续相持的艰难战局。","拍手叫好":"拍手鼓掌表示极其赞同、满意或叫绝赞赏。","拘泥":"①固执；不知变通～成说。②拘束；不自然～不安。","指手画脚":"指说话时做出各种动作。形容说话时放肆或得意忘形。","指摘":"1.亦作\"指谪\"。挑出错误，加以批评。 \n2.指出并摘录。","挑剔":"①在细节上过分严格地指摘你这人怎么那样挑剔?!②(ｔｉǎｏ－)拨弄剔除他照例抽来一根香签，挑剔着烟哨里的烟粪。也指挑动挑剔学潮。③(ｔｉǎｏ－)指点阐明请师挑剔。","挖掘":"向深处挖掘开采，比喻深入发掘提炼精神内核与潜在优势。","挫折":"事情进行中遇到的阻碍、失利或打击失败。","振奋人心":"振奋振作奋发。使人们振作奋发。","挽留":"请求准备离去的人留下来大妈挽留远方来客再住几天｜对于请调工作的教师，校长一再挽留。","捕获":"捉住、捕捉获取，也指科学中捕捉到信号或粒子。","排斥":"排挤斥逐、排挤不容纳。","探求":"1.探索寻求。","接连不断":"一个接着一个而不间断。","推知":"1.推想而知;推究而知。","措手不及":"措手着手处理。来不及动手应付。指事出意外，一时无法对付。","掷地有声":"金石钟磬之类的乐器，声音清脆优美。比喻文章文辞优美，语言铿锵有力。","描述":"1.描写叙述。","提倡":"提议，倡导，希望大家去做提倡自强不息。","插入":"把某种事物放进另一事物之中，或中途插话、穿插内容。","揠苗助长":"揠拔。把苗拔起，以助其生长。比喻违反事物发展的客观规律，急于求成，反而把事情弄糟。","援引":"引用经典、条例或先例作为依据或佐证。","援用":"1.引荐使用。 \n2.引用。","摈斥":"摈弃排斥，坚决排挤排除在外。","改天换地":"彻底改变原来的面貌。指改造社会，改造自然。","攻克":"攻下夺取阵地，比喻攻下难关、解决重大科学难题。","放任自流":"听凭自然的发展，不加领导或过问。","放弃":"丢掉（原有的权利、主张、意见等）～阵地ㄧ工作离不开，他只好～了这次进修的机会。","敷衍了事":"敷衍做事不认真；了完。指办事马马虎虎，只求应付过去就算完事。","方式":"说话做事所采取的方法、形式与样式。","旋涡":"水流旋转形成的深涡，比喻复杂危险、难以脱身的漩涡处境。","无关痛痒":"痛痒比喻疾苦或紧要的事。指与自身利害没有关系或无足轻重。","无影无踪":"踪踪迹。没有一点踪影。形容完全消失，不知去向。","无理":"1.没有纹理。 \n2.没有法度。 \n3.没有道理。","无视":"1.不放在眼里;漠视;不认真对待。","日积月累":"一天一天地、一月一月地不断积累。指长时间不断地积累。","日薄西山":"薄迫近。太阳快落山了。比喻人已经衰老或事物衰败腐朽，临近死亡。","旷日持久":"旷荒废，耽误。荒废时间，拖得很久。","明白":"1.清楚;明确。 \n2.确实。 \n3.明净;白净。 \n4.清白;光明。 \n5.公然;显然;不含胡。 6.了解;知道。 7.聪明;懂道理。 8.犹明证。 9.辩明;辩白。 10.了当。","显现":"1.显露;呈现。","显示":"1.明显地告知;明显地表示。 \n2.显现。","显著性":"突出、明显的性质与特征。","显露":"1.谓明白直截。 \n2.显出;表露。","普遍":"广泛存在于一般事物之中，具有通用性与全面性。","晶莹剔透":"光亮晶莹，像水晶一样明澈通透没有任何杂质。","暗藏":"1.隐蔽或隐藏。","暴殄天物":"暴损害，糟蹋；殄灭绝；天物指自然生物。原指残害灭绝天生万物◇指任意糟蹋东西，不知爱惜。","曲径通幽":"曲弯曲；径小路；幽指深远僻静之处。弯曲的小路，通到幽深僻静的地方。","更新":"除去旧的，换上新的；使事物呈现新面貌。","更迭":"轮流更替、接连交换变换。","替换":"1.把原来的(工作着的人﹑使用着的衣物等)调换下来;倒换。","有备无患":"患祸患，灾难。事先有准备，就可以避免祸患。","有心无力":"有愿望和打算，但没有力量付诸实现。","有迹可循":"有具体的痕迹、线索可以寻找与考据。","服从":"听从命令遵从指示，顺从规章安排。","望文生义":"文文字，指字面；义意义。不了解某一词句的确切涵义，光从字面上去牵强附会，做出不确切的解释。","朝气蓬勃":"朝气早上的空气，引伸为新生向上，努力进取的气象；蓬勃旺盛的样子。形容充满了生命和活力。","机关算尽":"机关周密、巧妙的计谋。比喻用尽心思。","杂乱无序":"又多又乱，没有条理。","松懈":"①松弛懈怠斗志松懈。②不密切关系松懈。","构建":"建立（多用于抽象事物）～新的学科体系。","构思":"做文章或制作艺术品时运用心思～精巧ㄧ艺术～。","构筑":"建造；修筑～工事。","构造":"各个组成部分的安排、组织和相互关系人体～ㄧ地层的～ㄧ句子的～。","果断":"决断坚决迅速，不犹豫不拖泥带水。","标准":"①衡量事物的准则技术～ㄧ实践是检验真理的唯一～。②本身合于准则，可供同类事物比较核对的事物～音ㄧ～时。","标志物":"具有代表性或标志象征意义的实物、标志。","格局":"对事物的结构形态与宏观规模的规划、见识与气魄。","模式":"1.事物的标准样式。","模本":"1.亦作\"橅本\"。 \n2.照书画原件临摹或翻刻拓印的复制品。 \n3.照原本摹写或摹画。","欢声笑语":"充满欢乐的欢呼声与笑声，形容气氛极其热烈欢快。","欣欣向荣":"欣欣形容草木生长旺盛；荣茂盛。形容草木长得茂盛。比喻事业蓬勃发展，兴旺昌盛。","止步":"停止前进的脚步，不再往前行进。","正确":"1.谓符合事实﹑规律﹑道理或某种公认的标准。与\"错误\"相对。","此起彼落":"这里起来，那里下去。形容接连不断。","步履艰难":"走路十分困难吃力，比喻事业进展十分艰难沉重。","步步为营":"步古时以五尺为一步，步步”表示距离短。军队每向前推进一步就设下一首营垒。形容防守严密，行动谨慎。","比肩接踵":"犹比肩继踵。形容人很多或接连不断。","毫不逊色":"丝毫也不比别人差，两者水平相当出众。","民不聊生":"聊依赖，凭借。指老百姓无以为生，活不下去。","气势磅礴":"磅礴广大无边的样子。形容气势雄伟壮大。","永垂不朽":"垂留传后世；朽腐烂，磨灭。指光辉的事纪伟大的精神永远流传，不会磨灭。","汇合":"水流或各方力量聚集汇拢到一处。","沉迷":"深深陷入某种事物或嗜好中，难以自拔。","沦落":"境况变坏、陷入穷困悲惨境地。","治忽无常":"国家治理良好与政权衰败混乱交替变幻，没有恒常不变的定数。","沾沾自喜":"形容自以为不错而得意的样子。","波折":"事情进行过程中出现的波浪起伏、曲折与阻碍。","泥泞":"烂泥淤塞积聚，比喻道路艰难困苦、满是坎坷泥淖。","洋洋盈耳":"洋洋众多；盈充满。指宏亮而优美的声音充满双耳。形容讲话、读书的声音悦耳动听。","洗涤":"1.冲荡;清洗。 \n2.除去(罪过﹑积习﹑耻辱等)。","洛阳纸贵":"比喻著作有价值，流传广。","洞悉":"很清楚地知道～内情。","流口常谈":"人人挂在嘴上的老话。","流连":"留恋不止，舍不得离去～忘返。也作留连。","测试":"1.测量试验。","浓缩":"①使溶液中溶剂蒸发溶液浓度增大的过程。广泛应用于化学、食品等工业中。②指物体中使部分含量减少，另一部分含量增加的过程。如浓缩铀等。③泛指用一定方法减少事物中不需要的部分，从而使需要部分的相对含量增加浓缩铀｜文学要求浓缩，集中，概括，凝练。","浸透":"①泡在液体里以致湿透他穿的一双布鞋被雨水～了。②液体渗透汗水～了衬衫。③比喻饱含（某种思想感情等）这些诗篇～着诗人眷念祖国的深情。","消沉":"1.亦作\"消沈\"。 \n2.消逝。 \n3.情绪低落。","涉及":"牵涉、关联到某一方面的问题或人事物。","涌现":"1.(人和事物)大量出现。 \n2.突然出现。","深渊":"很深的水落入万丈深渊。也比喻艰难的境地和险境苦难的深渊｜堕入罪恶深渊。","混为一谈":"把不同的事物混在一起，当作同样的事物谈论。","混淆视听":"混淆混杂。用假象或谎言让旁人分辨不清是非。","溯源":"顺着水流往上推求源头，比喻追寻探求事物的本源根由。","溺爱不明":"过分溺爱纵容导致是非不分、糊涂不明事理。","滋补":"1.供给身体以养分;补养。","滔滔不绝":"滔滔形容流水不断。象流水那样毫不间断。指话很多，说起来没个完。","满城风云":"指某种传闻或事件闹得整座城市轰动，人人议论纷纷。","满足":"1.对某一事物感到已经足够。 \n2.使满足。 \n3.达到一定期限。","漠然置之":"置放≤冷淡地把它搁在一边。指对人或事态度冷淡，放在一边不理。","漫步":"悠闲随意地慢步行走。","潜形匿迹":"隐蔽形迹，不露真相。","潮流":"潮水涨落的流动，比喻时代发展的方向与趋势动向。","激流勇进":"在急流险滩中勇敢迎难逆流而上，比喻无所畏惧勇往直前。","火候":"（～儿）①烧火的火力大小和时间长短烧窑炼铁都要看～ㄧ她炒的菜，作料和～都很到家。②比喻修养程度的深浅他的书法到～了。③比喻紧要的时机这儿正缺人，你来得正是～。","点石成金":"比喻修改文章时稍稍改动原来的文字，就使它变得很出色。","焕然一新":"焕然鲜明光亮的样子。改变旧面貌，出现崭新的气象。","煞有介事":"原是江浙一带的方言。指装模作样，活象真有那么一回事似的。多指大模大样，好象很了不起的样子。","牵强附会":"把本来没有某种意义的事物硬说成有某种意义。也指把不相关联的事物牵拉在一起，混为一谈。","牵扯":"1.牵连拉扯。 \n2.牵拉。 \n3.犹牵制。 \n4.拉平，平均。","特有":"1.特别具有，独有。","犹豫不决":"犹豫迟疑。拿不定主意。","独断专行":"行事专断，不考虑别人的意见。形容作风不民主。","独特":"独有的；特别的风格～ㄧ～的见解。","独立":"不依附于他人或外力，单独自主存在。","独辟蹊径":"自己开辟一条路。比喻独创一种风格或新的方法。","狼吞虎咽":"形容吃东西又猛又急的样子。","现实":"当前存在的客观事物；符合客观实际的希望变成现实｜建议合乎客观现实｜现实生活。","玲珑剔透":"玲珑精巧细致；剔透孔穴明晰。形容器物精致通明，结构细巧。也比喻人精明灵活。","理解":"懂；了解互相～ㄧ加深～ㄧ你的意思我完全 ～。","生动":"1.指生物。 \n2.谓意态灵活能感动人。 \n3.活动。 \n4.指有活力﹑能起积极作用的。","生意盎然":"形容生机蓬勃、生命力旺盛，充满勃勃生机。","生成":"1.养育。 \n2.长成。 \n3.指生物。亦泛指物品。 \n4.指人民。 \n5.自然形成;生就。 6.保全性命。 7.必定。","生机勃勃":"形容自然界充满生命力，或社会生活活跃。","生生不息":"生生中国哲学术语，指变化和新生事物的发生；不已没有终止。不断地生长、繁殖。","画蛇添足":"画蛇时给蛇添上脚。比喻做了多余的事，非但无益，反而不合适。也比喻虚构事实，无中生有。","画龙点睛":"原形容梁代画家张僧繇作画的神妙◇多比喻写文章或讲话时，在关键处用几句话点明实质，使内容生动有力。","界定":"划定界限，给出明确严格的范围或定义。","留存":"1.存留，保存。","留意":"留心、注意察看或放在心上。","疏漏":"1.亦作\"踈漏\"。亦作\"?漏\"。 \n2.粗略错漏;疏忽缺失。 \n3.轻率﹐不谨严。 \n4.破漏﹐破敝。 \n5.泄露;走漏。 6.引申为脱逃。","疲于奔命":"原指因受命奔走而搞得很累◇也指忙于奔走应付，弄得非常疲乏。","疾言厉色":"疾急速。说话急躁，脸色严厉。形容对人发怒说话时的神情。","白手起家":"白手空手；起家创建家业。形容在没有基础和条件很差的情况下自力更生，艰苦创业。","百思不解":"百多次；解理解。百般思索也无法理解。","目标":"1.射击﹑攻击或寻求的对象。 \n2.想要达到的境界或目的。","直接":"不经过中间事物的。与间接”相对直接取用｜直接关系。","相为表里":"1.谓内外互相配合，共为一体。","相伴相生":"彼此互相伴随，共同产生并共同发展。","相信":"1.互相信赖，信任。 \n2.单指信任对方。 \n3.指互相信得过的人。 \n4.认为正确或确实，不怀疑。","真抓实干":"真正下功夫去抓，踏踏实实务实地去干。","瞠目结舌":"瞪瞪着眼；结舌说不出话来。瞪着眼睛说不出话来。形容窘困或惊呆的样子。","破釜沉舟":"比喻下决心不顾一切地干到底。","硕果累累":"结出极其丰硕的大批果实，比喻取得极多的巨大成果。","福祸无常":"福气与祸患变幻莫测、难以预测预料。","积习深重":"长久形成的坏习惯根深蒂固，难以轻易改掉。","积厚流光":"积累的功业越深厚，则流传给后人的恩德越广。","积蓄":"逐渐聚集积存起来的财物、力量或储备。","移风易俗":"移改变；易变换。改变旧的风俗习惯。","稳扎稳打":"扎安营。稳当而有把握地打击敌人。比喻有把握、有步骤地工作。","空无一物":"里面空荡荡的，没有任何东西。","空洞无物":"空空洞洞，没有什么内容。多指言谈、文章极其空泛。","穿梭":"像织布梭子一样快速来回往返穿行。","突显":"突然显著显露出来，格外突出显眼。","突破":"1.集中兵力向一点进攻或反攻﹐打开缺口。 \n2.冲破;超过。","窘境":"十分为难、尴尬、陷入困顿的艰难处境。","筑牢":"构筑建造得极其坚固牢靠，防范风险。","策动":"策划鼓动策动叛乱｜幕后策动。","粉墙黛瓦":"雪白的粉墙与青黑色的瓦片，典型中国江南传统建筑风貌。","粘合":"1.粘贴胶合。 \n2.引申为聚合。","粘合剂":"1.使两个物体互相黏合的物质，如各种胶﹑水玻璃以及赛璐珞的丙酮溶液等。","精准":"极其准确精细，无差错分歧。","精密":"构造精细、细密周全，测量或制作十分精当。","精雕细刻":"精心细致地雕刻。形容创作艺术品时的苦心刻画。也比喻认真细致地加工。","紧迫感":"感到时间紧急、形势逼人的迫切感与危机感。","累赘":"拖累人的多余物，比喻累及拖延、麻烦冗长。","繁殖":"生物产生新的个体，以传代。","纠纷":"由于矛盾争执未决而产生的争吵与诉讼纠葛。","纠葛":"纠缠不清的事情；纠纷他们之间有过～。","纯净":"纯洁干净，不掺杂任何杂质或污秽。","纷繁芜杂":"繁多杂乱，杂质繁琐混杂在一起。","细致入微":"细微周密到了极点，连极小之处都照顾考量到了。","经年累月":"经经历。指经过很久的时间；长时间。","绘制":"画（图表）～工程设计图。","绝地反击":"在身处绝境、濒临失败时展开全力以赴的反扑攻击。","继承":"承接前人的事业、财产、传统或遗志继续下去。","绰绰有余":"绰绰宽裕的样子。形容房屋或钱财非常宽裕，用不完。","维护":"1.维持保护。","维持":"1.维系;保持。 \n2.维护;帮助。 \n3.主持;保持。","绵延不绝":"连续不断、绵长延伸永不中断。","绵绵用力":"持续不断、温和而坚韧地持续使劲施加力量。","综合体":"把多种不同功能或要素有机结合在一起的复合整体。","缩小":"1.由大变小。","置之脑后":"放在一边不再想起。","置换":"1.替换。 \n2.化学名词。指一种元素把某种化合物中的其他元素替换出来﹐如镁和硫酸铜作用而置换出铜。","美不胜收":"胜尽。美好的东西很多，一时看不过来。","美化":"使变得更加美观美好，有时也指掩饰缺点修饰外表。","群龙无首":"一群龙没有领头的。比喻没有领头的，无法统一行动。","翻云覆雨":"形容人反复无常或惯于耍手段。","耆宿":"年老而德高望重、学问深厚的老前辈老学者。","聚焦":"使光或电子束等聚集于一点～成像。","肩负":"担负在肩膀上，比喻承担起重大责任、使命或重任。","胜出":"在竞争或竞赛中战胜所有对手并获得胜出。","胸有成竹":"原指画竹子要在心里有一幅竹子的形象◇比喻在做事之前已经拿定主意。","自上而下":"从最高层领导或顶层设计逐步贯穿落实到基层各级。","自强":"1.亦作\"自强\"。 \n2.自己努力图强。","自律":"1.遵循法度﹐自加约束。","自我反省":"自己对自己的思想、行为和过失进行深入检查与检讨。","自欺欺人":"欺骗自己，也欺骗别人。","自觉":"①自己感觉到自觉这几天腿不太灵活。②自己有所觉察醒悟自觉性｜自觉遵守厂纪厂规。","自重":"1.谨言慎行﹐尊重自己的人格。 \n2.自己重视。 \n3.抬高自己的身价或地位。 \n4.书简习用套语。意谓自珍自爱。 \n5.自累。 6.物体自身的重量。","舞文弄墨":"舞、弄故意玩弄；文、墨文笔。故意玩弄文笔。原指曲引法律条文作弊◇常指玩弄文字技巧。","艰苦卓绝":"卓绝极不平凡。坚忍刻苦的精神超过寻常。","艰难跋涉":"在极度艰难险阻的环境中长途跋涉前行。","苛求":"过严地要求不要～于人。","苛责":"过分苛刻严厉地批评指责，要求过于苛求。","茫然失措":"心中茫然迷惑，不知道该怎么做才好，惊慌失措。","茫然若失":"茫然失意的样子；若失好像失去了东西。形容精神不集中，恍惚，若有所失的样子。","荡然无存":"荡然完全空无。形容东西完全失去，一点没有留下。","荣膺":"1.荣任，荣受。","莫名其妙":"说不出其中的奥妙。指事情很奇怪，说不出道理来。","营造":"①建筑，修筑营造桥梁。②制造；做营造器物｜岁岁营造功德。","萧条":"①凋零；冷落村落萧条｜要是没有窗外繁密的竹枝，那个房间真太萧条了。②指经济衰退，不景气生意萧条｜市面萧条，经济恐慌。","萧索":"①萧条；凄凉苍黄的天底下，远近横着几个萧索的荒村，没有一点生气｜荒城自萧索，万里山河空。②稀疏尔来飘流二十载，鬓发萧索垂霜冰。","蓄势待发":"积蓄蕴藏充足的力量，等待最佳时机随时发动爆发。","蓬勃":"繁盛朝气蓬勃｜蓬勃向上的事业。","虽然":"1.即使如此。 \n2.犹即使。","蛛丝马迹":"从挂下来的蜘蛛丝可以找到蜘蛛的所在，从马蹄的印子可以查出马的去向。比喻事情所留下的隐约可寻的痕纪线索。","蜕故孳新":"1.犹言去旧生新。","衍变":"发展变化一些基本的东西互相影响融合，衍变成丰富多样的东西｜一切事物都在不断衍变。","衡量":"用尺度去测定重量长短，比喻比较评定优劣利弊。","补偏救弊":"偏偏差；弊赞美。补救偏差漏洞，纠正缺点错误。","表达":"表示（思想、感情）感激之情，难以～ㄧ提高学生的口头～能力。","表里相依":"指关系密切，互相依存。","袒露":"露出身体袒露腹部，让医师检查。","裸露":"暴露没有覆盖遮蔽，呈现在外面。","规定":"权威部门制定的关于行为规则、指标等的准则与规范。","视而不见":"指不注意，不重视，睁着眼却没看见。也指不理睬，看见了当作没看见。","解构":"1.见\"解构\"。","解释":"说明原因、含义或理由，消除误解疑惑。","言之无物":"指文章或言论空空洞洞，没有实际内容。","言过其实":"实实际。原指言语浮夸，超过实际才能◇也指话说得过分，超过了实际情况。","警醒":"警惕清醒，从沉迷麻木中猛然醒悟察觉。","认可":"承认并同意支持，表示肯定与赞许。","认同":"认为一致、赞同并产生情感或理念上的归属感。","认知":"1.认识和感知。","认识":"人的头脑对客观事物的反映与把握，也指认得了解。","记忆":"对过去经历过的事物在头脑中保存再现的心理过程。","记载":"把事情用文字记录下来。","论证":"证明中从论据到论题的推演。通过推理形式进行，有时是一系列推理形式。因此，论证必须遵守推理的规则。","证明":"①用可靠的材料或事实来表明或判定真伪对错等证明一条定理｜我证明他当时不在场。②可用来证实的材料事实是最好的证明。③以若干判断为根据，断定另一个判断为真的思维形式。断定一个判断为真，不等于该判断确实为真，也不等于一个判断的真实性确实得到断定。只有正确的证明，才能确实断定一个判断的真实性。一切证明都由论题、论据和论证组成，都通过推理实现，论据相当于推理的前提，论题相当于推理的结论，论证相当于推理形式。因此，证明必须遵守推理的规则。","评价":"衡量评定人或事物的价值、水平与优劣得失。","评头论足":"原指轻浮地议论妇女的容貌。现也比喻任意挑剔。","试验":"①为达到某种效果先做探测行动这种方法好不好，要先试验。②旧时指考试；测验学年试验完毕之后，我便到东京玩了一夏天。","诱发":"①引导启发。②致使发生。","说长道短":"议论别人的好坏是非。","调和":"调配使其和谐协调，也指折中平息排解矛盾冲突。","调节":"根据实际情况进行自我微调控理使其适应平衡。","调适":"调节调整以适应新的环境、要求或心理变化。","调配":"调动分配人力、资源，或按比例调制调配配方。","谆谆不倦":"恳切耐心地教诲，不知疲倦。","谨小慎微":"谨、慎小心，慎重；小、微细小。过分小心谨慎，缩手缩脚，不敢放手去做。","谱写":"1.写作(乐曲等)。","谷底":"比喻下降到的最低点；升降中的最低限度产品销量大幅度下降，目前已跌至～。","责任":"①分内应做的事教育下一代是父母与教师的共同责任。②没做好分内事而应承担的过失先别追究责任，救人要紧。","责任感":"1.自觉做好分内事的心情。","责备":"批评指摘别人的缺点或过错。","贻笑大方":"贻笑让人笑话；大方原指懂得大道的人，后泛指见识广博或有专长的人。指让内行人笑话。","起早贪黑":"起得早，睡得晚。形容辛勤劳动。","起源":"1.事物产生的根源。 \n2.发源。","趁热打铁":"铁要趁烧红的时候打。比喻要抓紧有利的时机和条件去做。","趾高气扬":"趾高走路时脚抬得很高；气扬意气扬扬。走路时脚抬得很高，神气十足。形容骄傲自满，得意忘形的样子。","跃然纸上":"活跃地呈现在纸上。形容文学作品叙述描写真实生动。","跃进":"1.跳跃式前进。 \n2.快速前进。","跟随":"紧跟在后面走，也指效仿跟从别人的行动或榜样。","跨越":"跨过、超越障碍或界限，迈上新的高度阶段。","轰轰烈烈":"轰轰象声词，形容巨大的声响；烈烈火焰炽盛的样子。形容事业的兴旺。也形容声势浩大，气魄宏伟。","轻描淡写":"原指描绘时用浅淡的颜色轻轻地着笔。现多指说话写文章把重要问题轻轻带过。","轻视":"1.小看，不重视。","辅助":"从旁协助、协助帮助起补充支撑作用。","辩证":"①辨析考证反复～。也作辨证。②合乎辩证法的～关系ㄧ～的统一。","迎难而上":"哪怕面临巨大困难危险，依然勇敢坚定地主动迎击前进。","运作":"按特定规程运行运转，进行业务活动操作。","还原":"使事物回复到原来的面貌、位置或本质状态。","连成一气":"融会贯通、联系整合为一个紧密协作的完整整体。","连接":"①（事物）互相衔接山岭～。②使连接～线路。‖也作联接。","连绵不断":"连绵连续不断的样子。形容连续不止，从不中断。","追求":"①竭力寻找或探索追求真理｜追求名利地位｜他一生都在追求着光明。②特指向异性求爱他狂热地追求这位姑娘。③长篇小说。茅盾作。1928年发表。大革命失败后，章秋柳、史循、张曼青、王仲昭等几个青年知识分子愤世嫉俗，又悲观失望。有的虽不甘沉沦，想有所追求，但在社会的压迫下终遭失败，不能幸免消沉和堕落的命运。","追逐":"1.追赶;追击。 \n2.跟随;追随。 \n3.追求;逐取。 \n4.交往过从，征逐。 \n5.追求异性。","退无可退":"退路全部断绝，已经没有任何后退回避的余地。","适度":"1.程度适当。","逃之夭夭":"本意是形容桃花茂盛艳丽◇借用逃之夭夭”表示逃跑，是诙谐的说法。","逆水行舟":"逆着水流的方向行船。比喻不努力就要后退。","逆流":"1.水倒流。 \n2.泛指液体倒流。 \n3.倒流的水。 \n4.比喻反动的潮流。 \n5.迎着水流方向。 6.兵法指军阵处于河流下游。 7.拒纳水流。","选择":"1.挑选;选取。 \n2.指拣选吉利日子。","透彻":"深入详尽，理解领会得极其深刻透亮、毫无阻碍滞涩。","途径":"1.见\"途径\"。","遗忘":"对识记过的材料不能再认与回忆，或者错误的再认与回忆。分为暂时性遗忘和永久性遗忘，前者指在适宜条件下还可能恢复记忆的遗忘；后者指不经重新学习就不可能恢复记忆的遗忘。","遗憾":"因未能称心如愿而惋惜全集已刊行，先生无遗憾矣｜遗憾终生。外交上常用来表示不满贵方所提条件太高，我们不能接受，深表遗憾。","遥不可及":"非常遥远，远远够不着摸不到，形容极难实现或到达。","遥遥领先":"遥遥远远。远远地走在最前面。","遵从":"1.遵照并服从。","遵守":"依照规 function getWordDef(w){
  if(!w) return '';
  const d = (WORD_INDEX[w]||[])[0];
  if(d){
    const expl = (d.expl || '').trim();
    if(expl) return expl;
    const core = (d.core || '').trim();
    if(core) return core;
  }
  return EXTRA_EXPLS[w] || '—';
}

  const d = S.days[t] = S.days[t] || {cards:0, quiz:0, ok:0};
  if(kind==='card') d.cards++;
  else if(kind==='quiz'){ d.quiz++; if(ok) d.ok++; }
  save();
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 1600);
}

function dur(t){ const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=Math.floor(t%60); return (h?h+'小时':'')+(m?m+'分':'')+s+'秒'; }

function streak(){
  const keys = Object.keys(S.days);
  if(!keys.length) return 0;
  let c=0; let d=new Date();
  const kk = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!S.days[kk(d)]) d.setDate(d.getDate()-1);   // 今天还没学不算断
  while(true){ if(S.days[kk(d)]){ c++; d.setDate(d.getDate()-1); } else break; }
  return c;
}
/* SRS（简化 SM-2） */
function srsDue(){
  const now = Date.now();
  return DATA.filter(d => { const s = S.srs[d.id]; return s && s.due <= now; })
             .sort((a,b)=>(S.srs[a.id].due - S.srs[b.id].due));
}
function srsRate(id, q){ // q: 1 忘了 / 3 模糊 / 5 记得
  let s = S.srs[id] || {rep:0, ef:2.5, due:Date.now()};
  const DAY = 864e5;
  if(q < 3){
    s.rep = 0; s.ef = Math.max(1.3, s.ef - 0.2);
    s.due = Date.now() + 10*60*1000;
  } else {
    s.rep += 1;
    if(q === 5) s.ef = Math.min(3.2, s.ef + 0.1);
    const steps = [1, 3, 7, 15, 30, 60, 120, 240, 365];
    let days = steps[Math.min(s.rep - 1, steps.length - 1)];
    if(q === 3) days = Math.min(days, 1);
    s.due = Date.now() + days * DAY;
  }
  S.srs[id] = s; save();
}
function srsLabel(d){
  const s = S.srs[d.id];
  if(!s) return '未学';
  const days = Math.ceil((s.due - Date.now())/864e5);
  if(days <= 0) return '待复习';
  return days + '天后';
}

  if(!expl) return '';
  return esc(expl).replace(/([\u4e00-\u9fa5]{1,7})：/g, '<b>$1：</b>');
}

/* ================= 随机工具 ================= */
function shuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor((rnd||Math.random)()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function seeded(seed){
  let t = seed >>> 0;
  return function(){ t = (t * 1664525 + 1013904223) >>> 0; return t / 4294967296; };
}

/* ================= 做题引擎 ================= */
let Q = null;   // 当前会话 {kind, scope, num, grading, items, i, picked[], start, dailyKey}
function qkey(q){ return q.part+':'+q.no; }
function buildItems(kind, scope, num, opts){
  opts = opts || {};
  let items = [];
  if(kind === 'real'){
    let pool = QUESTIONS.filter(q => scope==='all' || q.part===scope);
    if(opts.onlyWrong) pool = pool.filter(q => S.quizStat.wrongs[qkey(q)]);
    pool = shuffle(pool);
    items = pool.slice(0, num===0 ? pool.length : num).map(q => ({kind:'real', q}));
  }
  else if(kind === 'blank'){
    let pool = DATA.filter(d => scope==='all' || d.part===scope);
    pool = shuffle(pool);
    for(const d of pool){
      if(items.length >= (num===0?20:num)) break;
      const sent = pickSent(d);
      if(!sent) continue;
      items.push({kind:'blank', d, sent});
    }
  }
  else if(kind === 'meaning'){
    let pool = DATA.filter(d => scope==='all' || d.part===scope);
    pool = shuffle(pool);
    for(const d of pool){
      if(items.length >= (num===0?20:num)) break;
      if(!d.core || d.core.length < 4) continue;
      items.push({kind:'meaning', d});
    }
  }
  else if(kind === 'daily'){
    const seed = opts.seed || 20260908;
    const rnd = seeded(seed);
    const real = shuffle(QUESTIONS.filter(q=>scope==='all'||q.part===scope), rnd).slice(0,8)
      .map(q=>({kind:'real', q}));
    const dw = shuffle(DATA.filter(d=>scope==='all'||d.part===scope), rnd);
    const blanks = []; const means = [];
    for(const d of dw){
      if(blanks.length<6){ const s = pickSent(d); if(s) blanks.push({kind:'blank', d, sent:s}); }
      if(means.length<6 && d.core && d.core.length>=4) means.push({kind:'meaning', d});
      if(blanks.length>=6 && means.length>=6) break;
    }
    items = shuffle(real.concat(blanks, means), rnd);
  }
  return items;
}
function pickSent(d){
  if(!d.exs || !d.exs.length) return null;
  const cands = d.exs.filter(x => x.includes(d.w) && x.length >= 12 && x.length <= 110);
  if(!cands.length) return null;
  return cands.sort((a,b)=>a.length-b.length)[0];
}
function blankSent(sent, w){
  const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  let first = true;
  return sent.replace(re, m => { if(first){ first = false; return '<span class="blank">____</span>'; } return m; });
}
function blankOpts(d){
  const mates = clusterMates(d);
  const pool = [];
  const push=(x)=>{ if(x && x!==d.w && !pool.includes(x) && WORD_INDEX[x]) pool.push(x); };
  mates.forEach(push);
  GROUPS_FOR(d).forEach(push_mate);
  function push_mate(w){ push(w); }
  DATA.forEach(x => { if(x.part===d.part && x.type===d.type) push(x.w); });
  const opts = [d.w, ...shuffle(pool).slice(0,3)];
  return shuffle(opts);
}
function GROUPS_FOR(d){
  return (CLUSTERS.find(c=>c.part===d.part&&c.gn===d.gn&&c.ws.includes(d.w)) || {ws:[]}).ws;
}
function meaningOpts(d){
  const core = d.core;
  const pool = [];
  const push=(t)=>{ if(t && t!==core && !pool.includes(t) && t.length>=4) pool.push(t); };
  (GROUPS_FOR(d)||[]).forEach(w => { const x = WORD_INDEX[w] && WORD_INDEX[w][0]; if(x) push(x.core); });
  DATA.forEach(x => { if(x.part===d.part && x.id!==d.id && x.core) push(x.core); });
  const opts = [core, ...shuffle(pool).slice(0,3)];
  return shuffle(opts);
}
function renderQuiz(){
  if(!Q){ quizSetup(); return; }
  const item = Q.items[Q.i];
  const total = Q.items.length;
  const pct = Math.round(Q.i / total * 100);
  const grading = S.quiz.grading;
  const oi = Q.picked[Q.i];
  const done = oi != null;
  const reveal = grading === 'instant' && done;   // 即时判题：答完即揭开
  const ans = ansOf(item);
  const isLast = Q.i >= total - 1;
  let body = '';
  if(item.kind === 'real'){
    const q = item.q;
    body = `
      <div class="qstem">${esc(q.stem).replace(/_{3,}/g, '<span class="blank">____</span>')}

      <div class="opts">${'ABCD'.split('').map((lt, x) => optHTML(lt, q.o[x], x, reveal, ans, oi)).join('')}
      </div>

    body = `
      <div class="qstem"><span style="color:var(--ink-faint);font-size:13px">【选词填空】选出填入横线处最恰当的词语</span><br>
        ${blankSent(item.sent, item.d.w)}
        <div class="qfill">出自真题例句${grading==='instant'?' · 点选答案即时判题':' · 答案交卷后揭晓'}</div></div>
      <div class="opts">${opts.map((w,x)=>optHTML('ABCD'[x], [w], x, reveal, ans, oi)).join('')}</div>
      ${reveal?explHTML(item):''}`;
  } else {
    const opts = item.opts || (item.opts = meaningOpts(item.d));
    body = `
      <div class="qstem"><span style="color:var(--ink-faint);font-size:13px">【词义选择】「<b style="font-size:18px;color:var(--accent)">${esc(item.d.w)}</b>」最准确的释义是？</span>
        <div class="qfill">${grading==='instant'?'点选答案即时判题':'答案交卷后揭晓'}</div></div>
      <div class="opts">${opts.map((t,x)=>optHTML('ABCD'[x], [t], x, reveal, ans, oi)).join('')}</div>
      ${reveal?explHTML(item):''}`;
  }
  let buttons;
  if(grading === 'instant'){
    buttons = done
      ? (isLast
          ? `<button class="abtn" id="nextQ" style="background:var(--accent);color:#fbf6e9;border-color:var(--accent)">查看成绩 →</button><button class="abtn" id="quitQ">提前交卷</button>`
          : `<button class="abtn" id="nextQ" style="background:var(--accent);color:#fbf6e9;border-color:var(--accent)">下一题 →</button><button class="abtn" id="quitQ">提前交卷</button>`)
      : `<span style="font-size:12px;color:var(--ink-faint);letter-spacing:.06em">点选答案，即时判题</span>`;
  } else {
    buttons = (!isLast ? `<button class="abtn" id="nextQ">${done?'下一题 →':'跳过 →'}</button>` : '')
      + `<button class="abtn" id="submitQ" style="background:var(--accent);color:#fbf6e9;border-color:var(--accent)">${isLast?'交卷看成绩 ●':'交卷 ●'}</button>`;
  }
  $('#main').innerHTML = `
    <div class="sec-head">
      <button class="back-btn" data-back>← 首页</button>
      <h2>${quizTitle()}</h2>
      <span class="hint">第 ${Q.i+1} / ${total} 题 · ${quizSubtitle(item)}</span>
      <div class="right"><span class="qcount">已答 ${Q.picked.filter(p=>p!=null).length}${grading==='final'?' / 交卷后判分':''}</span></div>
    </div>
    <div class="quizwrap">
      <div class="qprog"><i style="width:${pct}%"></i></div>
      <div class="qmeta"><span class="pill">${quizTitle()}</span>${grading==='instant'?'<span class="pill">即时判题</span>':'<span class="pill">交卷判题 · 可改选</span>'}</div>
      ${body}
      <div class="actions" id="quizActs">${buttons}</div>
    </div>`;
  if(reveal) $('#main .qexpl').scrollIntoView({block:'nearest'});
}
function quizTitle(){
  const k = S.quiz.kind;
  if(k==='real') return '真题实战';
  if(k==='blank') return '选词填空';
  if(k==='meaning') return '词义选择';
  return '每日一练';
}
function quizSubtitle(item){
  if(item.kind==='real') return `${item.q.part==='c'?'成语':'实词'} · 例题${item.q.no}（${esc(item.q.src)}）`;
  if(item.kind==='blank') return `${esc(item.d.gt)} · ${esc(item.d.w)}`;
  return `${esc(item.d.gt)} · ${esc(item.d.w)}`;
}
function optHTML(lt, toks, oi, reveal, ans, picked){
  let cls = '', res = '';
  if(reveal){
    if(oi === ans){ cls = 'right'; res = '✓'; }
    else if(picked === oi){ cls = 'wrong'; res = '✗'; }
  } else if(picked === oi){
    cls = 'sel'; res = '已选';
  }
  const dis = reveal||picked===oi ? 'disabled' : '';
  return `<button class="opt ${cls}" ${dis} data-opt="${oi}"><span class="lt">${lt}</span><span class="tx">${toks.map(t=>`<span class="tok">${esc(t)}</span>`).join('<span class="tgap">　</span>')}</span>${res?`<span class="res">${res}</span>`:''}</button>`;
}
function ansOf(it){ return it.kind==='real' ? it.q.ans : it.ans; }
function explHTML(item){
  const grading = S.quiz.grading;
  const picked = Q.picked[Q.i];
  let h = '';
  if(item.kind === 'real'){
    const q = item.q;
    const ansIdx = q.ans;
    const mine = picked === ansIdx;
    const mineTxt = picksToString(q.o[picked]);
    const ansTxt = picksToString(q.o[ansIdx]);

function startQuiz(onlyWrong){
  const cfg = S.quiz;
  let items;
  if(onlyWrong){
    items = [];
    QUESTIONS.forEach(q => { if(S.quizStat.wrongs[qkey(q)]) items.push({kind:'real', q}); });
    DATA.forEach(d => {
      if(S.quizStat.wrongs['blank:'+d.w]){ const sent = pickSent(d); if(sent) items.push({kind:'blank', d, sent}); }
      if(S.quizStat.wrongs['meaning:'+d.w] && d.core) items.push({kind:'meaning', d});
    });
    if(!items.length){ toast('错题本是空的，不用重做啦'); return; }
    items = shuffle(items);
    if(+cfg.num > 0) items = items.slice(0, +cfg.num);
  } else {
    items = buildItems(cfg.kind, cfg.scope, +cfg.num, { seed: Number(today().replace(/-/g,'')) });
    if(!items.length){ toast('没有题可做'); return; }
  }
  items.forEach(it => {
    if(it.kind === 'blank'){ it.opts = blankOpts(it.d); it.ans = it.opts.indexOf(it.d.w); }
    if(it.kind === 'meaning'){ it.opts = meaningOpts(it.d); it.ans = it.opts.indexOf(it.d.core); }
  });
  Q = { kind: cfg.kind, items, i: 0, picked: items.map(()=>null), start: Date.now() };
  renderQuiz();
}
function keyOf(it){ return it.kind==='real' ? qkey(it.q) : (it.kind+':'+it.d.w); }
function submitAnswer(oi){
  if(!Q) return;
  const item = Q.items[Q.i];
  if(S.quiz.grading === 'instant' && Q.picked[Q.i] != null) return;
  Q.picked[Q.i] = oi;
  if(S.quiz.grading === 'instant'){
    const right = oi === ansOf(item);
    const k = keyOf(item);
    S.quizStat.done++;
    if(right){ S.quizStat.ok++; delete S.quizStat.wrongs[k]; }
    else { S.quizStat.wrongs[k] = (S.quizStat.wrongs[k]||0) + 1; }
    tick('quiz', right);
  }
  save();
  renderQuiz();
}
function quizResult(){
  if(!Q) return;
  const items = Q.items;
  const answers = Q.picked;
  const total = items.length;
  let answered = 0, okN = 0;
  const wrongNow = [];
  items.forEach((it, i) => {
    const p = answers[i];
    if(p == null) { wrongNow.push({it, i, p}); return; }
    answered++;
    const right = p === ansOf(it);
    const k = keyOf(it);
    if(right){ okN++; delete S.quizStat.wrongs[k]; }
    else { S.quizStat.wrongs[k] = (S.quizStat.wrongs[k]||0) + 1; }
  });
  S.quizStat.done += answered;
  S.quizStat.ok += okN;
  const t = today();
  const d = S.days[t] = S.days[t] || {cards:0, quiz:0, ok:0};
  d.quiz += answered; d.ok += okN;
  const secs = Math.round((Date.now()-Q.start)/1000);
  const miss = total - answered;
  const pct = answered ? Math.round(okN/answered*100) : 0;
  S.lastQuiz = { kind: Q.kind, total, ok: okN, answered, secs, date: t };
  save();
  const list = items.map((it, i) => {
    const p = answers[i];
    const right = p != null && p === ansOf(it);
    const label = it.kind==='real' ? `例题${it.q.no}（${esc(it.q.src)}）` : `「${esc(it.d.w)}」`;

      <div class="resgrid">
        <div class="statcard"><div class="n">${okN}<small>/${answered}</small></div><div class="l">答对 / 已答</div></div>
        <div class="statcard"><div class="n">${pct}%</div><div class="l">正确率</div></div>
        <div class="statcard"><div class="n">${Math.max(0,answered-okN)}</div><div class="l">答错（已入错题本）</div></div>

      const pIdx = Math.min(S.compare.pIdx || 0, parts - 1);

        <span style="font-size:12px;color:var(--ink-faint)">${k==='syn'&&view==='table'?'✓/★/⚑ 快速标记 · 点行看释义例句':(view==='card'?'空格：全部翻面':'点击行查看释义例句')}</span>

  },

/* ================= 词表结果 ================= */
function listFiltered(){
  const st = S.list;
  let arr = DATA;
  const q = (st.q||'').trim();
  if(q){
    arr = arr.filter(d=> d.w.includes(q) || (d.expl||'').includes(q) || (d.core||'').includes(q) || (d.gt||'').includes(q));
  }
  if(st.part!=='all') arr = arr.filter(d=>d.part===st.part);
  if(st.type!=='all') arr = arr.filter(d=>d.type===st.type);
  if(st.grp!=='all'){ const [p,gn] = st.grp.split(':'); arr = arr.filter(d=>d.part===p && d.gn===gn); }
  if(st.state==='unseen') arr = arr.filter(d=>!S.seen[d.id]);
  else if(st.state==='seen') arr = arr.filter(d=>S.seen[d.id]);
  else if(st.state==='mastered') arr = arr.filter(d=>S.mastered[d.id]);
  else if(st.state==='starred') arr = arr.filter(d=>S.starred[d.id]);
  else if(st.state==='flagged') arr = arr.filter(d=>S.flagged[d.id]);
  else if(st.state==='due'){ const dueIds = new Set(srsDue().map(d=>d.id)); arr = arr.filter(d=>dueIds.has(d.id)); }
  return arr;
}
function renderListResults(){
  const arr = listFiltered();
  const perPage = 48;
  const totalPages = Math.max(1, Math.ceil(arr.length/perPage));
  let page = Math.min(Math.max(1, S.list.page||1), totalPages);
  S.list.page = page;
  const slice = arr.slice((page-1)*perPage, page*perPage);
  const cells = slice.map(d=>{
    const m = marksOf(d.id);
    return `<div class="gcell" data-id="${d.id}">
      <div class="marks">${m.join('')}</div>
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.core||d.gt||'')}</div>
    </div>`;
  }).join('');
  const pgBtns = [];
  if(totalPages<=9){
    for(let i=1;i<=totalPages;i++) pgBtns.push(`<button class="pg ${i===page?'active':''}" data-page="${i}">${i}</button>`);
  } else {
    pgBtns.push(`<button class="pg ${page===1?'active':''}" data-page="1">1</button>`);
    if(page>4) pgBtns.push('<span class="pgellipsis">…</span>');
    for(let i=Math.max(2,page-2); i<=Math.min(totalPages-1,page+2); i++) pgBtns.push(`<button class="pg ${i===page?'active':''}" data-page="${i}">${i}</button>`);
    if(page<totalPages-3) pgBtns.push('<span class="pgellipsis">…</span>');
    pgBtns.push(`<button class="pg ${page===totalPages?'active':''}" data-page="${totalPages}">${totalPages}</button>`);
  }
  const c = $('#listCount'); if(c) c.textContent = `共 ${arr.length} 词 · 第 ${page}/${totalPages} 页`;
  const r = $('#listResults'); if(r) r.innerHTML = `
    <div class="grid">${cells || '<div class="empty" style="grid-column:1/-1"><p>没有匹配的词儿</p></div>'}</div>
    ${totalPages>1?`<div class="pagination">
      <button class="pg" data-page="${page-1}" ${page<=1?'disabled':''}>← 上一页</button>
      ${pgBtns.join('')}
      <button class="pg" data-page="${page+1}" ${page>=totalPages?'disabled':''}>下一页 →</button>
    </div>`:''}`;
}

let randId = null;
function drawRandom(){
  const unseen = DATA.filter(d=>!S.seen[d.id]);
  if(!unseen.length){ closeRand(); toast('全部看过啦！'); return; }
  randId = unseen[Math.floor(Math.random()*unseen.length)].id;
  const d = DATA[randId];
  $('#randCard').innerHTML = cardHTML(d);
  $('#randLbl').textContent = `随机 · 未看剩 ${unseen.length} 个`;
  refreshRandUI();
}
function openRand(){
  drawRandom();
  $('#overlay').classList.add('show');
}
function closeRand(){ $('#overlay').classList.remove('show'); }
/* 辨析-词卡弹层 */
let wordId = null, wordMates = [];
function openWordCard(id, mates){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  wordId = id;
  wordMates = (mates && mates.length) ? mates : (clusterMates(d).length ? clusterMates(d) : []);
  $('#wordCard').innerHTML = cardHTML(d, {flipped:false});
  $('#wordLbl').textContent = `详解 · ${d.gt}${d.sub?' · '+d.sub:''}`;
  refreshWordUI();
  $('#wordOverlay').classList.add('show');
}
function closeWordCard(){ $('#wordOverlay').classList.remove('show'); }
function refreshWordUI(){
  if(wordId==null) return;
  $('#wordMark').classList.toggle('on', !!S.mastered[wordId]);
  $('#wordStar').classList.toggle('on', !!S.starred[wordId]);
  $('#wordStar').classList.toggle('gold', !!S.starred[wordId]);
  $('#wordFlag').classList.toggle('on', !!S.flagged[wordId]);
  $('#wordFlag').classList.toggle('warn', !!S.flagged[wordId]);
  $('#wordNext').style.display = wordMates.length ? '' : 'none';
  const corner = $('#wordCard .face.front .corner');
  if(corner) corner.innerHTML = marksOf(wordId).join('');
  // 刷新弹层内卡片角标与背面同组 chips
  const backWord = $('#wordCard .bword');
  if(backWord) backWord.textContent = DATA.find(x=>x.id===wordId).w;
}

function refreshRandUI(){
  if(randId==null) return;
  $('#randMark').classList.toggle('on', !!S.mastered[randId]);
  $('#randStar').classList.toggle('on', !!S.starred[randId]);
  $('#randStar').classList.toggle('gold', !!S.starred[randId]);
  const corner = $('#randCard .face.front .corner');
  if(corner) corner.innerHTML = marksOf(randId).join('');
}

/* 主区委托 */
$('#main').addEventListener('click', e=>{
  const flipEl = e.target.closest('.flip');
  if(flipEl && !e.target.closest('[data-jump]') && !e.target.closest('[data-act]') && !e.target.closest('[data-rate]')){
    const id = +flipEl.dataset.id;
    markSeen(id);
    flipEl.classList.toggle('flipped');
    return;
  }
  const jump = e.target.closest('[data-jump]');
  if(jump){
    const w = jump.dataset.jump; const d = (WORD_INDEX[w]||[])[0];
    if(d){
      if($('#wordOverlay').classList.contains('show')) closeWordCard();
      setMode('card'); S.cardMode='browse'; S.cardIdx = d.id; S.browse.hidden = true; save(); renderers.card();
    }
    return;
  }
  const exline = e.target.closest('.ex.clamp');
  if(exline){ exline.classList.toggle('exp'); return; }
  const tg = e.target.closest('[data-toggle="expl"]');
  if(tg){ S.browse.hidden = !S.browse.hidden; save(); renderers.card(); return; }
  const go = e.target.closest('[data-go]');
  if(go){
    if(go.dataset.go==='random'){ openRand(); return; }
    if(go.dataset.kind){
      S.quiz.kind = go.dataset.kind; save();
      setMode('quiz');
      if(go.dataset.kind==='daily' && go.dataset.auto){ startQuiz(); }
      return;
    }
    setMode(go.dataset.go);
    return;
  }
  const gb = e.target.closest('[data-goto]');
  if(gb){ setMode(gb.dataset.goto); return; }
  const gcell = e.target.closest('.gcell');
  if(gcell){
    setMode('card'); S.cardMode='browse';
    const d = DATA.find(x=>x.id===+gcell.dataset.id);
    S.cardIdx = d.id; S.browse.hidden = true; save(); renderers.card();
    return;
  }
  const rowop = e.target.closest('[data-op]');
  if(rowop){
    e.stopPropagation();
    const id = +rowop.dataset.id, f = rowop.dataset.op;
    toggle(f, id);
    rowop.classList.toggle('on', !!S[f][id]);
    if(f==='starred') rowop.classList.toggle('star', !!S.starred[id]);
    if(f==='flagged') rowop.classList.toggle('flag', !!S.flagged[id]);
    return;
  }
  const wrow = e.target.closest('.syn-row[data-word], .ant-row .side[data-word]');
  if(wrow){
    const w = wrow.dataset.word;
    const d = (WORD_INDEX[w]||[])[0];
    if(d){
      const g = CLUSTERS.find(c=>c.part===d.part && c.gn===d.gn && c.sub===d.sub && c.ws.includes(d.w));
      openWordCard(d.id, g ? g.ws : []);
    }
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const id = +act.dataset.id, a = act.dataset.act;
    if(a==='mastered'||a==='starred'||a==='flagged'){
      toggle(a, id);
      const btn = act;
      btn.classList.toggle('on', !!S[a][id]);
      btn.classList.toggle('gold', a==='starred'&&!!S[a][id]);
      btn.classList.toggle('warn', a==='flagged'&&!!S[a][id]);
    }
    return;
  }
  const rate = e.target.closest('[data-rate]');
  if(rate){
    if(rate.dataset.busy) return;              // 防连点：重复点击不再叠加时长
    rate.dataset.busy = '1';
    const id = +rate.dataset.id, q = +rate.dataset.rate;
    srsRate(id, q);
    const labels = {1:'忘了 · 10 分钟后重现',3:'模糊 · 明天复习',5:'记得 · 间隔加长'};
    rate.classList.add('on');
    toast(labels[q] + ' → 下一张');
    renderStatbar();
    if(S.mode === 'card'){
      setTimeout(()=>{ if(S.mode === 'card') stepAfterRate(); }, 320);   // 稍作停顿，让反馈可见再进下一张
    }
    return;
  }
  const ck = e.target.closest('[data-ck]');
  if(ck){ S.compare.kind = ck.dataset.ck; S.compare.gi = 0; S.compare.pIdx = 0; S.compare.view = 'table'; save(); renderers.compare(); return; }
  const cv = e.target.closest('[data-cv]');
  if(cv){ S.compare.view = cv.dataset.cv; S.compare.pIdx = 0; save(); renderers.compare(); return; }
  const cs = e.target.closest('[data-clearsearch]');
  if(cs){ S.list.q=''; const inp=$('#searchInput'); if(inp) inp.value=''; S.list.page=1; renderListResults(); const cb=$('#main .clearbtn'); if(cb) cb.style.display='none'; inp && inp.focus(); return; }
  const back = e.target.closest('[data-back]');
  if(back){ Q=null; setMode('home'); return; }
  const pg = e.target.closest('[data-page]');
  if(pg && !pg.disabled){ S.list.page = +pg.dataset.page; save(); renderers.list(); return; }
  const tb = e.target.closest('[data-lpart]');
  if(tb){ S.list.part = tb.dataset.lpart; S.list.page = 1; save(); renderers.list(); return; }
  const lb = e.target.closest('[data-ltype]');
  if(lb){ S.list.type = lb.dataset.ltype; S.list.page = 1; save(); renderers.list(); return; }
  const fb = e.target.closest('[data-lstate]');
  if(fb){ S.list.state = fb.dataset.lstate; S.list.page = 1; save(); renderers.list(); return; }
  const cm = e.target.closest('[data-cardmode]');
  if(cm){ S.cardMode = cm.dataset.cardmode; S.cardIdx = 0; save(); renderers.card(); return; }
  const opt = e.target.closest('[data-opt]');
  if(opt){ const sel = +opt.dataset.opt; if(S.quiz && Q) submitAnswer(sel); return; }
  const qk = e.target.closest('[data-kind]');
  if(qk && qk.closest('.mode-card')){ /* 已在 data-go 处理 */ }
  if(e.target.id==='startQuiz'){ startQuiz(); }
  if(e.target.id==='wrongQuiz' || e.target.closest('#wrongQuiz')){ S.quiz.kind='real'; save(); startQuiz(true); }
  if(e.target.id==='againQuiz'){ startQuiz(); }
  if(e.target.id==='clearWrongs'){ showConfirm('确定清空错题本？此操作不可撤销。', ()=>{ S.quizStat.wrongs = {}; save(); renderers.wrong(); toast('错题本已清空'); }, {title:'清空错题本', okText:'清空', danger:true}); }
  if(e.target.id==='nextQ' || e.target.closest('#nextQ')){
    if(Q){ if(Q.i < Q.items.length-1){ Q.i++; renderQuiz(); } else { quizResult(); } }
    return;
  }
  if(e.target.id==='submitQ' || e.target.closest('#submitQ')){
    if(Q){
      const miss = Q.items.length - Q.picked.filter(p=>p!=null).length;
      if(miss > 0){
        showConfirm('还有 <b>'+miss+'</b> 题未作答，确定交卷？<br>未答的题不计入正确率。', ()=>quizResult(), {title:'交卷确认', okText:'确定交卷'});
      } else {
        quizResult();
      }
    }
    return;
  }
  if(e.target.id==='quitQ' || e.target.closest('#quitQ')){
    if(Q && Q.picked.filter(p=>p!=null).length < Q.items.length){
      showConfirm('还没做完，确定提前交卷？<br>未答的题不计入正确率。', ()=>quizResult(), {title:'提前交卷', okText:'交卷'});
      return;
    }
    quizResult();
    return;
  }
  if(e.target.id==='shuffleCard'){ S.cardMode='browse'; S.cardIdx = Math.floor(Math.random()*DATA.length); save(); renderers.card(); return; }
  if(e.target.id==='prevBtn'){ step(-1); return; }
  if(e.target.id==='nextBtn'){ step(1); return; }
  if(e.target.id==='prevG'){ S.compare.gi = Math.max(0, S.compare.gi-1); S.compare.pIdx = 0; save(); renderers.compare(); return; }
  if(e.target.id==='nextG'){ const poolN = S.compare.kind==='syn'?CLUSTERS.length:ANTONYMS.length; S.compare.gi = Math.min(poolN-1, S.compare.gi+1); S.compare.pIdx = 0; save(); renderers.compare(); return; }
  if(e.target.id==='prevP'){ if(S.compare.pIdx>0){ S.compare.pIdx--; save(); renderers.compare(); } return; }
  if(e.target.id==='nextP'){ const g = (S.compare.kind==='syn'?CLUSTERS:ANTONYMS)[S.compare.gi]; const parts = Math.max(1, Math.ceil(g.ws.length/3)); if(S.compare.pIdx < parts-1){ S.compare.pIdx++; save(); renderers.compare(); } return; }
  if(e.target.id==='goRandom'){ openRand(); return; }
  if(e.target.id==='resetBtn'){
    showConfirm('确定清空全部学习记录？此操作不可撤销，包括：进度、掌握、收藏、错题本与打卡记录。', ()=>{ S = defaultState(); document.documentElement.dataset.theme = S.theme; save(); render(); toast('已清空'); }, {title:'清空学习记录', okText:'全部清空', danger:true});
    return;
  }
  if(e.target.id==='importBtn'){ $('#importFile').click(); return; }
  const kindBtn = e.target.closest('[data-kind]');
  if(kindBtn && !e.target.closest('.mode-card')){ S.quiz.kind = kindBtn.dataset.kind; save(); quizSetup(); return; }
  const scopeBtn = e.target.closest('[data-scope]');
  if(scopeBtn){ S.quiz.scope = scopeBtn.dataset.scope; save(); quizSetup(); return; }
  const numBtn = e.target.closest('[data-num]');
  if(numBtn){ S.quiz.num = numBtn.dataset.num; save(); quizSetup(); return; }
  const gradBtn = e.target.closest('[data-grading]');
  if(gradBtn){ S.quiz.grading = gradBtn.dataset.grading; save(); quizSetup(); return; }
});

  if(e.target && e.target.id==='grpSelect'){ S.list.grp = e.target.value; S.list.page = 1; save(); renderers.list(); }

$('#importFile').addEventListener('change', e=>{

  r.readAsText(f);
});
/* 随机 */
$('#randClose').addEventListener('click', closeRand);
$('#randNext').addEventListener('click', drawRandom);

  if(wordId==null || !wordMates.length) return;
  const cur = wordMates.indexOf(DATA.find(x=>x.id===wordId).w);
  const nw = wordMates[(cur+1) % wordMates.length];
  const nd = (WORD_INDEX[nw]||[])[0];
  if(nd) openWordCard(nd.id, wordMates);
});

$('#wordStar').addEventListener('click', ()=>{ if(wordId!=null){ toggle('starred', wordId); refreshWordUI(); } });

function toggle(field, id){
  S[field][id] = !S[field][id];
  save(); renderStatbar();
  if(S.mode === 'card') renderers.card();
}
function markSeen(id){
  if(S.seen[id]) return;
  S.seen[id] = true;
  tick('card');
  renderStatbar();
}
function stepAfterRate(){
  const list = (S.cardMode||'review')==='review' ? srsDue() : DATA;
  if(!list.length){ S.cardIdx = 0; renderers.card(); return; }   // 队列空 → 空状态
  const cur = S.cardId;
  const inList = cur != null && list.some(d=>d.id===cur);
  if(inList){
    // 浏览模式：当前卡还在列表里 → 下一张
    S.cardIdx = ((S.cardIdx||0) + 1) % list.length;
  } else {
    // 复习模式：当前卡已被弹出队列 → 原位置即“下一张”
    S.cardIdx = Math.min(S.cardIdx||0, list.length-1);
  }
  S.browse.hidden = true;
  save();
  renderers.card();
}
function step(dir){
  const list = (S.cardMode||'review')==='review' ? srsDue() : DATA;
  if(!list.length) return;
  let idx = S.cardIdx || 0;
  idx = ((idx + dir) + list.length) % list.length;
  S.cardIdx = idx;
  S.browse.hidden = true;
  save();
  renderers.card();
}
function focusSearch(){
  setMode('list');
  requestAnimationFrame(()=>{ const i=$('#searchInput'); if(i) i.focus(); });
}
/* 快捷键 */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'){ if(e.key==='Escape') e.target.blur(); return; }
  const over = $('#overlay').classList.contains('show');
  if(e.key==='Escape'){
    if(over){ closeRand(); return; }
    if($('#wordOverlay').classList.contains('show')){ closeWordCard(); return; }
    if($('#confirmOverlay').classList.contains('show')){ closeConfirm(); return; }
    if(Q){ Q=null; renderers.quiz(); return; }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); focusSearch(); return; }
  if(over){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(randId!=null){ markSeen(randId); $('#randCard .flip').classList.toggle('flipped'); } return; }
    if(e.key==='ArrowRight'){ drawRandom(); return; }
    if(e.key.toLowerCase()==='m'){ if(randId!=null) toggle('mastered',randId); return; }
    if(e.key.toLowerCase()==='s'){ if(randId!=null) toggle('starred',randId); return; }
    return;
  }
  if(Q && S.mode==='quiz'){
    const k = e.key.toLowerCase();
    if(['a','b','c','d'].includes(k)){
      const oi = k.charCodeAt(0)-97;
      const btn = $(`[data-opt="${oi}"]`);
      if(btn && !btn.disabled){ submitAnswer(oi); return; }
    }
    if(e.key==='Enter'){
      const n = e.target.closest('#nextQ') ? null : $('#nextQ');
      if(n && !n.disabled){ n.click(); }
      else if(!$('#nextQ') && e.target.id!=='nextQ'){ const nxt = $('#nextQ'); if(nxt) nxt.click(); }
      else if(Q && Q.picked[Q.i]!=null){ if(Q.i<Q.items.length-1){Q.i++; renderQuiz();} else quizResult(); }
      return;
    }
    if(e.key==='Escape'){ return; }
  }
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(S.mode==='card'){
      S.browse.hidden = !S.browse.hidden; save(); renderers.card();
    } else if(S.mode==='compare'){
      $$('#main .flip').forEach(f=>{ const id=+f.dataset.id; markSeen(id); f.classList.toggle('flipped'); });
    }
    return;
  }
  if(S.mode==='card'){
    if(e.key==='ArrowRight'){ step(1); return; }
    if(e.key==='ArrowLeft'){ step(-1); return; }
    const k = e.key.toLowerCase();
    const cid = S.cardId != null ? S.cardId : (DATA[S.cardIdx||0]||{}).id;
    if(k==='m'){ toggle('mastered', cid); return; }
    if(k==='s'){ toggle('starred', cid); return; }
    if(k==='f'){ toggle('flagged', cid); return; }
  }
  switch(e.key){
    case '1': setMode('home'); break;
    case '2': setMode('card'); break;
    case '3': setMode('list'); break;
    case '4': setMode('compare'); break;
    case '5': setMode('quiz'); break;
    case '6': setMode('mine'); break;
    case 'r': case 'R': if(S.mode==='home'||S.mode==='card'){ openRand(); } break;
  }
});

document.documentElement.dataset.theme = S.theme;

/* ================= 移动端手势与响应式增强 ================= */
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
document.addEventListener('touchstart', e => {
  if (e.touches && e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!e.changedTouches || e.changedTouches.length !== 1) return;
  const deltaX = e.changedTouches[0].clientX - touchStartX;
  const deltaY = e.changedTouches[0].clientY - touchStartY;
  const timeDiff = Date.now() - touchStartTime;

  // 水平滑动手势判定 (水平距离 > 48px, 且水平移动显著大于垂直移动, 耗时 < 500ms)
  if (Math.abs(deltaX) > 48 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4 && timeDiff < 500) {
    const isOverlay = $('#overlay') && $('#overlay').classList.contains('show');
    const isWordOverlay = $('#wordOverlay') && $('#wordOverlay').classList.contains('show');

    if (isOverlay) {
      if (deltaX < 0) drawRandom();
    } else if (isWordOverlay) {
      if (deltaX < 0) $('#wordNext').click();
    } else if (S.mode === 'card') {
      if (deltaX < 0) step(1);
      else step(-1);
    }
  }
}, { passive: true });

/* 窗口大小改变防抖 */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // 动态刷新需要精确宽度的组件 (如词表或辨析屏数)
    if (S.mode === 'compare' && S.compare.view === 'card') {
      renderers.compare();
    }
  }, 150);
}, { passive: true });
