"gt":"合理规划","sub":"合理规划","type":"four","expl":"开发财源，节省支出，以储蓄财力。","core":"开发财源，节省支出，以储蓄财力","exs":["经济下滑压力下，国务院国资委关于央企要“开源节流、降本增效”的调门提高。","对粮食而言，日常生活中的每一次“开源节流”，都是在加重安全的砝码、安心的保障。作为人口众多的大国，解决好吃饭问题始终是治国理政的头等大事。","开源节流是让钱袋子鼓起来的根本途径。通过构建完善的农民工职业技能培训体系，帮助农民工积累和提高人力资本，无疑是开源的重要手段。"]},{"id":313,"w":"精打细算","part":"c","gn":"二十五","gt":"合理规划","sub":"合理规划","type":"four","expl":"意思是精密地计划，详细地计算。指在使用人力、物力时计算得很精细。","core":"意思是精密地计划，详细地计算","exs":["这种精打细算过日子的方式，让许多煤矿尝到甜头。许厂煤矿副总会计师梁奉越告诉记者，如今，许厂煤矿每个月节约的材料费就超过400万元，煤炭综合成本也大为降低。","我国纪念今年“世界水日”“中国水周”的活动主题是“精打细算用好水资源，从严从细管好水资源”。","习近平总书记指出：“建城市、搞工业、保生态都要用地，必须精打细算，排出优先序，绝不能占用耕地和违背自然规律去搞造林绿化。”"]},{"id":314,"w":"细水长流","part":"c","gn":"二十五","gt":"合理规划","sub":"合理规划","type":"four","expl":"比喻节约使用财物，使经常不缺用。也比喻一点一滴不间断地做某件事，精细安排，长远打算。","core":"比喻节约使用财物，使经常不缺用","exs":["这种细水长流式的方法不显山露水，但可以聚少成多，冯大才以这种方式收受回扣达140余万元。","师者的大爱既体现在千钧一发之际的义无反顾，也体现在日常教育教学工作中的细水长流。","伴随着这趟夯实传统友谊、推动务实合作、推进和平发展之旅，美丽塞纳河、蓝色多瑙河将与长江黄河一道，静水流深、细水长流，浇筑出更加稳定、更加光明、更加美好的未来。"]},{"id":315,"w":"量入为出","part":"c","gn":"二十五","gt":"合理规划","sub":"合理规划","type":"four","expl":"入：收入。根据收入的情况来安排支出。","core":"收入","exs":["很多大学生目前还是“伸手党”，并没有实现经济独立，更应该做到量入为出，理性网购。","对信用卡持卡人而言，避免陷入财务困境的治本之策是学会科学理财，做到量入为出，并在平时为生活中可能发生的意外支出做好一定的储蓄和财务准备。","坚持过“紧日子”，量入为出是前提，改进作风是保障。"]},{"id":316,"w":"立竿见影","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"有效果","type":"four","expl":"在阳光下竖起竹竿，立刻就能看到它的影子。比喻效果显著迅速。","core":"比喻效果显著迅速","exs":["掌握了正确的学习方法，便可收到立竿见影的效果。","“巡察的最终目的就是推动问题解决，我们要通过边巡边改、立行立改实现快速纠偏，以‘立竿见影’的效果赢得群众的信任、彰显巡察监督的震慑力。”","我们今年的重大项目落地非常快，政府职能部门推进助企政策立竿见影，非常直观地感受到吉林营商环境正在越来越好。"]},{"id":317,"w":"一劳永逸","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"有效果","type":"four","expl":"逸：安逸。指辛苦一次把事情办好，以后就不用费力了。","core":"指辛苦一次把事情办好，以后就不用费力了","exs":["此物长生，种者一劳永逸。","脑起搏器治疗开机后并不是一劳永逸，想在术后达到理想恢复状态，除了患者要定期接受随访和程控，还需要患者和家人注重术后的运动康复、饮食和一些生活细节。","不少近视患者抱着“近视了大不了做个近视手术，跟好眼一样”的想法，认为近视手术可以一劳永逸。事实上，近视手术并非很多人想象得那么简单。"]},{"id":318,"w":"行之有效","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"有效果","type":"four","expl":"之：代词，它，指办法、措施等；效：成效，效果。实行起来有成效。指某种方法或措施已经实行过，证明很有效用。","core":"代词，它，指办法、措施等","exs":["要增强战略的前瞻性、全局性、稳定性，把历史、现实、未来贯通起来，把中国和世界连接起来，使我们制定的战略符合实际、行之有效，为中国式现代化提供强大的战略支撑。","要以公平正义为理念引领全球治理体系变革，维护以世界贸易组织为核心的多边贸易体制，在充分协商基础上，为人工智能、数字经济等打造各方普遍接受、行之有效的规则，为科技创新营造开放、公正、非歧视的有利环境，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展，让世界经济活力充分迸发出来。","中国不断发展全过程人民民主，建设行之有效的、具有中国特色的民主，取得了重要成就。"]},{"id":319,"w":"一蹴而就","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"有效果","type":"four","expl":"蹴：踏；就：成功。踏一步就可以获得成功，比喻事情很容易做。同“一蹴而得”。（多用于否定句中）","core":"踏一步就可以获得成功，比喻事情很容易做","exs":["他们认为胜利不能一蹴而就，必须用持久战。","然而，牙齿的移动并不是一蹴而就的，它需要一定的时间和过程。在这个过程中，牙齿周围的牙周组织也在逐渐适应新的牙齿位置。因此，即使牙套已经摘除，牙周组织仍然需要一段时间来巩固牙齿的新位置。","生态文明素养其实是人类生存和持续发展的重要能力，但要提升生态文明素养，不能一蹴而就，还得久久为功。生态科普应该面向更广泛的群体，通过更生动灵活的形式来开展。"]},{"id":320,"w":"迎刃而解","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"解决问题","type":"four","expl":"刃：刀刃。解：分开。把竹子劈开口，下面的一段竹子就迎着刀刃裂开了。比喻主要问题解决了，其他的问题就很容易解决。（常搭配“问题”）","core":"比喻主要问题解决了，其他的问题就很容易解决","exs":["笔者以为，现在《解释》的出台，将使以上“三大难题”迎刃而解。","企业正在进行生产许可证申报，时间紧迫，周耀斌的到来让难题“迎刃而解”。","广粤路广中路公交站大变样，拥堵难题迎刃而解！"]},{"id":321,"w":"事半功倍","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"解决问题","type":"four","expl":"事：所要做的事情，指措施。功：功效。形容费力小，收效大。","core":"所要做的事情，指措施","exs":["从这个意义上讲，弘扬丝路精神，高标准推进境外经贸合作区建设，将使开放共赢变得事半功倍。","针对不同人群、不同犯罪类别，因人施策，制定教育矫正方法和内容，在促进社区矫正对象融入社会、预防和减少违法犯罪等工作中取得“事半功倍”。","很多看似不起眼的小点子、巧办法，来自基层干部的亲身实践，简便易行，往往能起到事半功倍的效果，推动把好事办好、把实事办实。"]},{"id":322,"w":"釜底抽薪","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"解决问题","type":"four","expl":"釜：锅。薪：柴。从锅底下抽出柴火。比喻从根本上解决问题。","core":"比喻从根本上解决问题","exs":["扬汤止沸不如釜底抽薪，必须深化体制机制改革，自觉转变职能、简政放权，从根子上铲除滋生“四风”问题的土壤。","一个国家、一个民族要是没有自己的精神独立性，政治、思想、文化、制度等方面的独立性就会被釜底抽薪，就不可能走出、走稳、走好自己的道路。","要坚持多管齐下、多策并举，严格落实防范管控措施，做到釜底抽薪、标本兼治。"]},{"id":323,"w":"标本兼治","part":"c","gn":"二十六","gt":"政策措施的评价","sub":"解决问题","type":"four","expl":"标本：事物的枝节和根本。从枝节和根本方面都得到治理。","core":"事物的枝节和根本","exs":["必须对非法“灵修”类活动保持高压严打，深挖背后利益链条，寻求标本兼治。","标本兼治，把“当下改”与“长久立”结合起来，瞄准形式主义官僚主义之弊，对症施策、精准发力，方能做到真减负、见真效。","治理网络暴力，需要破立并举、标本兼治，既切除病灶，也铲除病根。"]},{"id":324,"w":"触手可及","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"伸手便可接触到。形容距离很近。","core":"形容距离很近","exs":["触手可及的金融服务，背后依靠的是科技的投入。","阜阳市颍东区积极落实就业促进暖民心行动，通过完善“三公里就业圈”和常态化开展就业技能培训，让群众高质量就业“触手可及”。","随着数字技术的不断运用，人民群众对数字法院的需求逐步提升，但就司法实践来看，数字法院建设距离通过群众考核、满足群众现代化司法期待、真正实现司法服务触手可及，还需过好统筹关、能动关和推广关。"]},{"id":325,"w":"唾手可得","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"唾手：往手上吐唾沫。比喻极容易得到。","core":"比喻极容易得到","exs":["如今，各种信息唾手可得，获取知识的门槛变低了。","创新成果，并非唾手可得。“良率在50%时好像遇到了瓶颈，每次都要推倒重来，很痛苦。”","技术的导入拓展了阅读的疆域。互联网消除时空界限，使得各类信息资源唾手可得，数字技术通过个性化推送与大数据分析，助力精准定位知识，提升阅读效率与针对性。"]},{"id":326,"w":"手到擒来","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"擒：捉拿。一出手就把人捉住。形容做事毫不费力或很有把握。","core":"形容做事毫不费力或很有把握","exs":["抓落实不是探囊取物，不会手到擒来。","群众的“急难愁盼”不少也是“老大难”的事，解决这些问题，不可能手到擒来、易如反掌，急于求成可能适得其反，问题没有解决，反而造成新的问题。","无论从整体实力还是个人能力上来说，中国男足亚运队想要小组出线几乎是手到擒来，但球队想要走得更远，特别是希望实现甚至赶超1994年广岛亚运会亚军的历史最佳战绩，就不能轻视任何对手。"]},{"id":327,"w":"信手拈来","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"信手：随手；拈：用两三个手指头捏东西。随手拿来，多指写文章时能自由纯熟地选用词语或应用典故、素材，用不着怎么思考。（多用于引用资料、数据、典故等）（也可形容做事不费力）","core":"用两三个手指头捏东西","exs":["王老师讲课时，许多历史小故事信手拈来。","读书时保持对话的心智，活化为自己的思想，写作时才能将读过的书信手拈来。","从《偶遇成诗》到《只此青绿》《一壶老茶》《一路芬芳》，无论是歌颂家乡风物还是抒写时代，别样的视角和细腻的笔触，于工整中求灵韵，看似信手拈来，其实匠心独运，为歌词创作提供了一种新的文本。"]},{"id":328,"w":"游刃有余","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"比喻工作熟练，实际经验很丰富，解决困难问题毫不费事。［近］应付自如。","core":"比喻工作熟练，实际经验很丰富，解决困难问题毫不费事","exs":["比赛现场，萌娃们全副武装，有的在蜿蜒的赛道里游刃有余、一路领先，有的跌倒了迅速站起，鼓足勇气冲向终点，家长和老师在场边暖心陪伴，献上加油和呐喊。","要学会将复杂的职业技能拆解成一个个可管理的小单元，做到“庖丁解牛，游刃有余”。二要戴上“显微镜”，刻意练习。","它不仅能够让我们在人际关系中更加游刃有余，还能够让我们在职业发展中更加成功。当我们能够坦诚地表达自己的想法和意见时，我们不仅能够得到他人的理解和支持，还能够激发出更多的创新思维和解决方案。"]},{"id":329,"w":"一步登天","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"指一步跨上青天，比喻一下子就达到很高的境界或程度，有时也比喻人突然得志，爬上高位。","core":"指一步跨上青天，比喻一下子就达到很高的境界或程度，有时也比喻人突然得志，爬上高位","exs":["这是我国第一条青霉素生产线，规模相当于一个示范厂或中试车间，比起昆明时候的小作坊，真是一步登天了。","对于车企来说，没有一步登天的“天梯”，少一些炫技的冲动，多一些务实的态度，才能稳扎稳打、步步为营。","一步登天当然好，但经历失败也不是很可怕的事。"]},{"id":330,"w":"轻而易举","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"形容非常轻松，毫不费力。","core":"形容非常轻松，毫不费力","exs":["人工智能让“用他人的外貌或声音演绎新的内容”变得轻而易举，但创作者如果想合法合规获得授权，却往往要面对信息不对称、流程复杂等现实障碍。","形成体系是理论成熟定型的显著标志，但体系化不是轻而易举、随心所欲的。","这并非一件轻而易举的事情，需要具体落实到推进高质量发展的每一个环节上，以正确政绩观推动高质量、可持续的发展。"]},{"id":331,"w":"得心应手","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"指心里怎么想，手就能怎么做。比喻技艺纯熟或做事情非常顺利。","core":"指心里怎么想，手就能怎么做","exs":["大事小情问问AI，我们总能得到的“贴心周到”的答复，正因为AI用得如此“得心应手”，所以才让不法分子有机可乘。","一批基层干部从过去的“经验型管理”逐渐转向“专业化发展”，在产业规划、项目运转和群众组织方面更加得心应手。","很多干部有干事积极性，遇到个别问题却不能得心应手，面临“有想法没办法”的本领恐慌，这时就必须要“更新装备”、增强能力。"]},{"id":332,"w":"举重若轻","part":"c","gn":"二十七","gt":"成功与失败","sub":"轻松成功","type":"four","expl":"举起沉重的东西像举轻物一样。比喻能力强且能轻松应对繁难事务或处理复杂问题。","core":"比喻能力强且能轻松应对繁难事务或处理复杂问题","exs":["这些举重若轻的表达，正是春晚与当代生活真诚对话的缩影。","底座杂技演员托举起两位队友，队友头上的两摞瓷碗稳如泰山，举重若轻。","这种不同层次的融合，能够举重若轻地拨动着观众心弦，让观众上一分钟还在欢笑，下一分钟就感动落泪。"]},{"id":333,"w":"束手无策","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"策：办法。手被捆住，无法应对。形容遇到问题没有解决的办法。","core":"形容遇到问题没有解决的办法","exs":["当危急情况出现时，有多少人并不是见义不为，而是束手无策？","像登录验证、选择细分功能、关掉广告弹窗、人脸识别等操作，常常会让视障者束手无策。","很多时候，遇到紧急情况，周围人即便很想施以援手，可限于技能缺乏，又不会操作急救设备，往往束手无策，只能干着急。"]},{"id":334,"w":"一筹莫展","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"筹：计策。展：施展。一点计策也施展不出。形容没有一点办法。","core":"形容没有一点办法","exs":["几个农民要搞科研，想解决专家都一筹莫展的难题，谈何容易。","日前，包头稀土高新区万水泉镇安泰社区居民刘大爷想以“信用积分”兑换礼品，正当他因信用积分不够一筹莫展之际，张老三粮油门市部的收银员接过刘大爷递来的积分卡，计算器快速操作一番后说道：“再补3元钱就可以了。”","就在他一筹莫展之际，家人的一句话，便让他想起前不久祁东农商银行工作人员正向其推荐过一款“惠农快贷”信贷产品。"]},{"id":335,"w":"功亏一篑","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"篑：盛土的筐，指一筐土。后用来比喻做事情只差最后一点而前功尽弃。","core":"盛土的筐，指一筐土","exs":["目前已到冲刺阶段，须防功亏一篑。","以色列对停火提议的拒绝令达成停火协议的所有努力功亏一篑。","或许由于中西文化差异和中美两国国情的不同，基辛格起初对毛泽东的这一想法未能完全理解，但随着交往的加深，他最终不得不承认：中国历史上不乏克服他人无法想象的深重苦难，但最终以文化优势或幅员辽阔而让侵略者功亏一篑的事例。"]},{"id":336,"w":"适得其反","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"适：恰好。结果与愿望恰好相反。（侧重取得反面结果）","core":"（侧重取得反面结果）","exs":["这么看来，商家封杀职业打假人只能适得其反，不仅阻挡不了职业打假者的行动，更会让自己的丑行败露，落得个拒绝监督、袒护问题商品的恶名。","给孩子施压的手伸进了医疗技术领域容易适得其反，可能导致家长期望的效果没有出现，却遭到医疗技术的反噬。对此，家长应当保持足够的谨慎。","美国对华贸易战徒劳且适得其反，不但并未改变美对华依赖程度，反而使全球供应链更加复杂脆弱。"]},{"id":337,"w":"功败垂成","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"垂：接近，将要。事情在将要成功的时候失败了。含惋惜意。同“事败垂成”。","core":"接近，将要","exs":["虽然离成功只有一毫之差、一步之遥，但终归不免功败垂成、留下缺憾。","古人早就认识到了最后阶段路难走的问题，“为山九仞，功亏一篑”，堆九仞之高的山，只欠最后一筐土，胜利在望却功败垂成，类似事情在古今中外历史上可谓不可胜数。","十余年里，他们追寻总冠军的道路上满是艰辛，一次次闯进决赛圈，却又一次次功败垂成。"]},{"id":338,"w":"失之交臂","part":"c","gn":"二十七","gt":"成功与失败","sub":"没能成功","type":"four","expl":"交臂：胳膊碰胳膊，指擦肩而过。形容当面错过。","core":"胳膊碰胳膊，指擦肩而过","exs":["“我心里一直憋着这口气，在里约奥运会上失之交臂的金牌，我一定要把它夺回来！”为了夺回这枚金牌，刘洋五年没有回过家，即使是带伤上阵，也要发挥到最完美！","上海女排已连续三年打进决赛，但都与冠军失之交臂。回顾这个赛季，上海女排既有高光时刻，也有遗憾瞬间。"]},{"id":339,"w":"高屋建瓴","part":"c","gn":"二十八","gt":"领导力","sub":"眼界高考虑全","type":"four","expl":"建：倾倒。瓴：水瓶。从高屋脊上往下倒瓶中的水。形容居高临下，不可阻挡的形势。","core":"形容居高临下，不可阻挡的形势","exs":["这些形象大都是从战争年代的叱咤风云的指挥员身上脱颖出来的，具有气壮山河的英雄气概和高屋建瓴的雄才大略。","大家表示，习近平总书记的重要讲话高屋建瓴、精辟深邃，具有很强的政治性、思想性、指导性，对进一步全面深化改革、扎实稳健推进中国式现代化具有重大意义，要认真学习领会、深入贯彻落实。","“习近平总书记对统筹‘五对关系’的重要论述高屋建瓴、内涵丰富，深刻回答了新时代如何推动旅游高质量发展、建设旅游强国的重大时代命题。”"]},{"id":340,"w":"高瞻远瞩","part":"c","gn":"二十八","gt":"领导力","sub":"眼界高考虑全","type":"four","expl":"瞻：望。瞩：注视。登高望远。形容目光远大。（更宏观）","core":"形容目光远大","exs":["亚投行、“一带一路”等宏大计划，显示出习近平的高瞻远瞩，也凸显了中国作为负责任大国的国际担当。","面对中美关系进一步发展的时代机遇，面对国际社会对中美加强合作的普遍期待，两国应高瞻远瞩，相互照顾彼此利益和关切，妥善化解分歧和矛盾，共同推进中美合作。","“习近平主席提出的共建‘一带一路’、构建人类命运共同体等重大倡议和重要理念，在促进各国共克时艰、共享机遇、共同繁荣等方面发挥了重要作用，习近平主席具有高瞻远瞩的战略眼光。”"]},{"id":341,"w":"深谋远虑","part":"c","gn":"二十八","gt":"领导力","sub":"眼界高考虑全","type":"four","expl":"计谋深远，考虑周密。","core":"计谋深远，考虑周密","exs":["综合国力竞争说到底是人才竞争。人才是衡量一个国家综合国力的重要指标。这是一项深谋远虑的重大改革。","以大开放促进大开发，是“立足一隅谋全局”的深谋远虑。","大食物观是以习近平同志为核心的党中央基于我国经济社会发展需要和人民群众对美好生活向往而提出的，体现了新时代中国共产党人的全局视野和长远眼光，是对中国发展方略的深邃思考和对人民根本利益的深切关怀，充分反映了对我国现代农业发展路径的深谋远虑，有力彰显了对中国粮食安全等“国之大者”的远见卓识。"]},{"id":342,"w":"审时度势","part":"c","gn":"二十八","gt":"领导力","sub":"眼界高考虑全","type":"four","expl":"审：详查，观察。时：当前情况。度：估计。势：发展趋势。观察时机，估计发展趋势。用来指对形势有洞察力。也作“审时定势”“审几度势”。","core":"用来指对形势有洞察力","exs":["同时，也为企业发展提出了一些中肯的建议：一要审时度势，强化核心竞争力；二要保持战略定力，坚守使命愿景，执着创新；三要坚守合规与现金流底线，确保稳健发展；四要趋势研判，形成产业链合力，共同应对挑战。","面对影响党长期执政、国家长治久安、人民幸福安康的突出矛盾和问题，党中央审时度势、果敢抉择，锐意进取、攻坚克难，团结带领全党全军全国各族人民撸起袖子加油干、风雨无阻向前行。","各方要审时度势、趋利避害，不断深化对新时代就业工作规律的认识，总结、丰富、发展以往的宝贵经验，强化就业优先政策，健全就业促进机制，推动就业形势持续改善。"]},{"id":343,"w":"运筹帷幄","part":"c","gn":"二十八","gt":"领导力","sub":"筹划全面","type":"four","expl":"筹：谋划。帷幄：古代军队中的帐幕。指在帐幕中谋划计策。后指在后方指挥、筹划。","core":"指在帐幕中谋划计策","exs":["我们的目标是为各行各业的专业人士提供整合的信息解决方案，帮助他们更快地作出决策、作出更明智的决策，从而在全球化的竞争中，运筹帷幄、决胜千里。","习近平运筹帷幄，带领中国人民在全面建设社会主义现代化国家开局之年迈出了新气象，创造了新辉煌。","褒斜道见证了楚汉相争的“明修栈道，暗度陈仓”，古汉台奠定了汉室四百多年的煌煌基业。历经秦风汉雨，又见三国传奇，不论是金戈铁马的运筹帷幄，还是碧血丹心的江湖驰骋，日夜东流的一江汉水是无数历史变迁的见证。"]},{"id":344,"w":"统筹兼顾","part":"c","gn":"二十八","gt":"领导力","sub":"筹划全面","type":"four","expl":"意思是统一筹划，全面照顾。","core":"意思是统一筹划，全面照顾","exs":["必须树立系统观念，以正确的历史观、大局观把握大势、统筹兼顾、掌握主动。","统筹兼顾是中国共产党的一个科学方法论。它的哲学内涵就是马克思主义辩证法。","优化营商环境牵一发动全身，是一项涉及经济社会改革和对外开放众多领域的系统工程，尤其需要坚持系统观念、增强系统思维，在统筹兼顾中实现整体推进。"]},{"id":345,"w":"身体力行","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"身：亲身。体：体验。指亲身体验，努力实践。","core":"指亲身体验，努力实践","exs":["增强安全意识、注意风险提示，敬畏自然、敬畏生命，每个人都该身体力行。","伴着续写《雷锋日记》的阵阵热潮，官兵学习雷锋、争做雷锋，用实际行动追寻雷锋同志的足迹，在身体力行中深刻感悟雷锋精神、赓续优良传统。","建设新青海绿色家园，我们每个人既是良好生态环境的“乘凉者”，更要身体力行、做好造福后人的“栽树者”。"]},{"id":346,"w":"亲力亲为","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"亲自参与，不由别人来代替。","core":"亲自参与，不由别人来代替","exs":["大到治安防范，小到邻里琐事，李柚池无不亲力亲为。","领导干部要亲力亲为，坚决杜绝侥幸心理，拿出“一竿子插到底”的劲头，以科学严肃的态度及时处置各类隐患事故，做到防患于未然、化解于萌芽。","要在作风建设上突出亲力亲为、求真务实、不图形式、依法按规矩办事，以良好精神状态和过硬工作作风保障工作落实。"]},{"id":347,"w":"克己奉公","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"克己：约束自己；奉公：以公事为重。克制自己的私心，一心为公。","core":"约束自己","exs":["全党同志都要明大德、守公德、严私德，清清白白做人、干干净净做事，做到克己奉公、以俭修身，永葆清正廉洁的政治本色。","大家心中要始终装着老百姓，先天下之忧而忧，后天下之乐而乐，做到不谋私利、克己奉公。对个人的名誉、地位、利益，要想得透、看得淡，自觉打掉心里的小算盘。","与腐败惯性作坚决斗争，是涵养克己奉公、清廉自守精神境界最重要、最根本、最艰难的任务，构成涵养克己奉公、清廉自守精神境界的本质性规定。"]},{"id":348,"w":"以身作则","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"身：自身。则：榜样。自己以行动给大家做出榜样。","core":"自身","exs":["遵守交通规则是每个人的责任，尤其是偶像明星，更要时刻慎独自省，以身作则，为社会做好示范。","“总书记以身作则，出行考察关心每一个细节，教育身边的人真正按照中央八项规定去做，给所有人树立了标杆，起到榜样作用。”","多年来，她一直以身作则，家庭美满和睦，热心帮助友邻，让文明家风代代相传。"]},{"id":349,"w":"上行下效","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"行：做。效：效法。指上面的人怎么做，下面的人就跟着怎么干。","core":"指上面的人怎么做，下面的人就跟着怎么干","exs":["以上率下是管党治党责任具体化的第一步，只有上下齐心、上行下效才能在落实上见成效。","很多时候，问题在下面，源头在上面，作风养成历来是上行下效。","要树立队伍管理永远在路上，永远是零起点的思想和理念，干部骨干要率先垂范、上行下效，严防“灯下黑”，紧盯“人、车、酒、网、赌”等重点环节，精准发力、精细管理、查漏补缺、堵塞漏洞。"]},{"id":350,"w":"事必躬亲","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"躬亲：亲自做。凡事都一定要自己亲自去做。","core":"亲自做","exs":["从邀请国内顶级专家学者，确定具体讲座时间、审查主讲人简介、讲座内容，到组织学生撰写主持词和大讲堂简报等，每一件事祁欢都竭尽全力、事必躬亲。","为了确保实景剧的质量和进度，马新明事必躬亲，要求下属“当日事当日毕”“只能说如何行，不能说不行”。","作为民宿“东澄山庄”主理人，她事必躬亲，茶园、果园、田地，餐厅、后厨、前台，都活跃着她的身影。"]},{"id":351,"w":"率先垂范","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"垂范：做出榜样。首先做出榜样。","core":"做出榜样","exs":["习近平总书记在地方工作期间，始终将人民群众的切身需求作为为政的出发点和落脚点，把百姓实际感受作为评判业绩的重要标尺，身体力行、率先垂范，有力推动了地方经济社会发展和民生福祉的改善。","因此，领导干部必须以身作则、率先垂范，成为自觉践行法纪的示范者、引领者、推动者。","事实证明，很多开新风、扬正气的单位，领导干部往往率先垂范、模范带头，形成无声的号召，达到不令而行的效果。"]},{"id":352,"w":"一马当先","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"原指作战时策马冲锋在前，后形容处于领先地位或工作中积极带头。","core":"原指作战时策马冲锋在前，后形容处于领先地位或工作中积极带头","exs":["翻看工业经济一季报，高技术制造业以“一马当先”之势领跑增长，成为我国经济良好开局、产业结构持续优化的生动写照。","中国科技创新正以“酷”劲十足、一马当先的姿态，为全球科技创新注入新动能。","领导干部要叫响“看我的”“跟我上”，勇于挑最重的担子、善于接最烫的山芋，特别是在事关战斗力生成提高的重要领域和关键环节上，要一马当先、一抓到底，切实以担当带动担当、以作为促进作为，把各方面的干劲都带起来。"]},{"id":353,"w":"身先士卒","part":"c","gn":"二十八","gt":"领导力","sub":"以身作则","type":"four","expl":"指作战时将领亲自带头，冲在士兵前面。现也指领导带头，走在群众前面。","core":"指作战时将领亲自带头，冲在士兵前面","exs":["干部身先士卒，项目倒排工期。","技术应用要长成支柱产业，离不开“国家队”的身先士卒与战略布局。","当前，军事斗争准备任务艰巨繁重，军队各级领导干部唯有身先士卒、立身为旗，在党性党风建设上走在前列，才能激励广大官兵锐意进取、奋勇前行，不断汇聚强军兴军的强大正能量。"]},{"id":354,"w":"一以贯之","part":"c","gn":"二十八","gt":"领导力","sub":"始终坚持","type":"four","expl":"指做人做事，按照一个道理，从始至终都不会改变。贯：一直，习惯。","core":"指做人做事，按照一个道理，从始至终都不会改变","exs":["加强纪律建设是全面从严治党的治本之策，必须把加强党的纪律建设作为永恒课题，把严的基调、严的措施、严的氛围长期坚持下去，推动管党治党一以贯之、一刻不停、一严到底。","陈吉宁强调，要在学习党章中更加深刻领悟党的纪律建设的内在逻辑，旗帜鲜明、一以贯之坚持严的导向，自觉维护党章党规党纪的严肃性、权威性。","“中央八项规定试出了人心向背，厚植了党的执政根基，已经成为我们党的一张‘金色名片’，要一以贯之地践行。”"]},{"id":355,"w":"矢志不渝","part":"c","gn":"二十八","gt":"领导力","sub":"始终坚持","type":"four","expl":"矢志不渝（矢：誓；渝：改变）指立下志愿，绝不改变。","core":"改变）指立下志愿，绝不改变","exs":["宁夏一代代矢志不渝的治沙人，用越来越广阔的“人工绿洲”抗衡、收拢甚至取代着曾经漫无边际的黄色丘脊。","“中国天眼”奠基人南仁东22年扎根深山，矢志不渝铸造大国重器。","忠诚是每一个重庆人的个性特点，重庆人不仅仅只是忠诚，而且还有不怕困难险阻、矢志不渝的坚韧。"]},{"id":356,"w":"前仆后继","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容英勇无畏","type":"four","expl":"意思是指前面的人倒下了，后面的人继续跟上去。英勇斗争，不怕牺牲。","core":"意思是指前面的人倒下了，后面的人继续跟上去","exs":["我们不能忘怀视死如归、前仆后继的抗争。历史不会因时代变迁而改变，事实也不会因巧舌抵赖而消失。","岁月流转，匆忙如梭，无数个青年前仆后继地谱写祖国和民族的华章。","为了实现中华民族复兴这个伟大的理想，无数仁人志士前仆后继，赴汤蹈火，只为了能够早日实现民族复兴。"]},{"id":357,"w":"视死如归","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容英勇无畏","type":"four","expl":"把死看得像回家一样平常。形容不怕牺牲生命。","core":"形容不怕牺牲生命","exs":["今天，为了拯救人民群众的生命财产我们义无反顾，明天，当那一天来临时，我们同样视死如归。","一百多年来，在理想信念的感召下，一大批视死如归的革命烈士、一大批顽强奋斗的英雄人物、一大批忘我奉献的先进模范，书写了感天动地的伟大史诗，谱写了气吞山河的英雄壮歌。","正是在党的领导下，中华儿女同仇敌忾，视死如归，用生命和鲜血打败了日本侵略者。"]},{"id":358,"w":"大义凛然","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容英勇无畏","type":"four","expl":"大义：正义。凛然：令人敬畏的样子。形容为了坚持真理而表现出的严峻不可侵犯的样子。","core":"形容为了坚持真理而表现出的严峻不可侵犯的样子","exs":["在敌人的法庭上，王若飞同志大义凛然，慷慨陈词。","他大义凛然，从文城监牢到校场坡沿途数里，一路高呼“打倒国民党反动派！”“共产党万岁！”等口号，英勇就义，牺牲时28岁。","难忘在鲁迅名篇《记念刘和珍君》中，作为北京学生运动领袖之一的刘和珍率领着一群和自己一般大的同学们，为了国家正义和思想解放，大义凛然、誓死不屈，最终用自己的热血开辟了一条中国革命的光明之道。"]},{"id":359,"w":"踔厉奋发","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容振作奋发","type":"four","expl":"踔chuō，形容精神振奋，斗志昂扬。","core":"踔chuō，形容精神振奋，斗志昂扬","exs":["面对又一次重大历史机遇，全区农牧系统干部职工纷纷表示要奋勇担当善作为，踔厉奋发闯新路，加快推进农牧业现代化，努力提升国家重要农畜产品生产基地综合生产能力。","在重温或加深红色记忆的过程中，不忘我们从哪里走来，于“初心”中牢记使命，于“知行合一”中接过英烈旗帜，在新的历史征程上，踔厉奋发、笃行不怠。","我们唯有踔厉奋发、笃行不怠，方能不负历史、不负时代、不负人民。"]},{"id":360,"w":"笃行不怠","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容振作奋发","type":"four","expl":"意思是切实履行自己所学的内容，不感到倦怠。","core":"意思是切实履行自己所学的内容，不感到倦怠","exs":["一路砥砺奋进，增强了一起向未来的信心和底气；向着更高目标进发，尤需我们踔厉奋发、笃行不怠。","其美多吉用自己的持之以恒与笃行不怠，在茫茫雪山上写下了独属于坚持的答案，将平凡一笔一划镌刻成伟大。","奋斗者追风赶月，贵在笃行不怠。"]},{"id":361,"w":"赓续前行","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容振作奋发","type":"four","expl":"意思是指不断地延续和发展，保持进步的态度和生活方式。","core":"意思是指不断地延续和发展，保持进步的态度和生活方式","exs":["深入宣传好、贯彻好、落实好福建省两会精神，赓续前行、奋楫争先，为在推进中国式现代化中展现福建作为、谱写福建篇章开好局、起好步。","赓续前行，不断推进高水平气象科技自立自强。","以“吾将上下而求索”的恒心，做赓续前行的传承者。"]},{"id":362,"w":"奋楫争先","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容振作奋发","type":"four","expl":"意思是奋力划动船桨的人争先恐后走在前头。","core":"意思是奋力划动船桨的人争先恐后走在前头","exs":["情牵人民，福暖中国，这个难忘的场景充分彰显了中国共产党为人民谋幸福的初心使命，也是“福”文化深入人心、沁入血脉的生动写照，激发起全省上下奋楫争先、为民造福的磅礴力量和坚定拥护“两个确立”、坚决做到“两个维护”。","时代在变，但时代对青年的殷殷关切不变；年轻的面孔在变，但其胸怀的奋进之心不变，青年永远保持奋楫争先的壮志豪情。","端午节到来之际，许多地方举行赛龙舟活动，人们在奋楫争先的热闹氛围中，感受端午的文化魅力。"]},{"id":363,"w":"砥砺前行","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容克服困难前进","type":"four","expl":"经历磨炼，克服困难，往前进步的意思。也作“砥砺奋进”。","core":"经历磨炼，克服困难，往前进步的意思","exs":["在推进中国式现代化的征程上，脚踏实地，砥砺前行，一点一滴地进步里，是一个越来越好的中国。","以英雄为榜样，从他们身上汲取力量，接续奋斗、砥砺前行，这是对他们最好的致敬。","中朝双方将继续风雨同舟，奋楫破浪，砥砺前行，续写两国友谊更加美好和精彩的新篇章。"]},{"id":364,"w":"勇毅前行","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容克服困难前进","type":"four","expl":"意思是勇敢并且坚毅地向前进步或发展。","core":"意思是勇敢并且坚毅地向前进步或发展","exs":["习近平全票当选国家主席、中央军委主席，极大鼓舞和激励着亿万中华儿女在新征程上踔厉奋发、勇毅前行。","厚植实现民族复兴的精神力量，始终保持锐意进取、敢为人先、迎难而上的奋斗姿态，保持战略定力、增强必胜信心，铆足干劲、勇毅前行，就一定能汇聚无坚不摧的磅礴伟力，胜利推进强国建设、民族复兴的历史伟业。","“我们要不畏浮云遮望眼，准确认识历史发展规律，不为一时一事所惑，不为风险所惧，勇敢面对挑战，向着构建人类命运共同体的目标勇毅前行。”越是困难时刻，越要坚定信心、激流勇进，向着构建人类命运共同体的目标勇毅前行。"]},{"id":365,"w":"披荆斩棘","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容克服困难前进","type":"four","expl":"指拨开荆丛，砍掉荆棘。比喻开创事业或在前进道路上清除障碍，艰苦奋斗。","core":"指拨开荆丛，砍掉荆棘","exs":["可以想见，在没有汽车、没有水泥路的古代，习武者一路披荆斩棘、只为上山练得一身本领的求教场景，没有决心和毅力者，还未入山门即会被自然淘汰。","从“忍看山河碎？愿将赤血流”到新时代“请党放心、强国有我”的青春强音，广大青年在披荆斩棘中开辟天地，共同定义了中国的模样。","站在新的历史起点，我们要沿着习近平总书记指引的方向，以只争朝夕的干劲、久久为功的韧劲，把基础研究的台阶一级级砌实、垫高，在奔赴科技强国的征程中披荆斩棘、砥砺前行。"]},{"id":366,"w":"百折不挠","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容克服困难前进","type":"four","expl":"指虽然受到很多挫折，但仍不动摇、退缩或屈服。形容意志坚强。","core":"指虽然受到很多挫折，但仍不动摇、退缩或屈服","exs":["百折不挠的坚韧意志，精卫填海、愚公移山、大禹治水等成为中华民族为实现理想而自强不息的历史之源。","我国科学家攻坚克难、百折不挠，一项项“中国发现”标注世界科学前沿新高度。","九曲黄河，奔腾向前，以百折不挠的磅礴气势塑造了中华民族自强不息的民族品格，是中华民族坚定文化自信的重要根基。"]},{"id":367,"w":"任重道远","part":"c","gn":"二十九","gt":"正义精神和做法","sub":"形容克服困难前进","type":"four","expl":"任：负担；道：路途。指担子很重，路很远。比喻肩负的责任重大，并且需要经过长期艰苦的努力。","core":"指担子很重，路很远","exs":["构建自主知识体系绝非一朝一夕之功，迈向自主自强仍然任重道远。","也要清醒看到，我国基础研究仍存在投入结构有待优化、原创供给仍显不足、平台支撑仍有短板、成果转化链条仍不顺畅等问题，从根本上实现高水平自立自强依然任重道远。","多项治理成果的背后，仍是顺风车安全治理的长期性与复杂性，出行安全没有止境，行业治理任重道远。"]},{"id":368,"w":"好高骛远","part":"c","gn":"三十","gt":"干部易犯错误","sub":"爱慕名利不务实","type":"four","expl":"骛：通“务”，追求。指不切实际地追求过高、过远的目标。","core":"指不切实际地追求过高、过远的目标","exs":["有读者并不认同，指出青年人好高骛远、物质至上、个人主义的“青春短板”，并认为这些可能会压垮青春梦想。","不好高骛远、不脱离实际，力戒形式主义、官僚主义，切实提高解决实际问题能力，才能更好肩负起新时代的职责和使命。","青年时期是苦练本领、增长才干的黄金时期，最忌好高骛远、浮于空想，最怕做事三天打鱼、两天晒网。"]},{"id":369,"w":"好大喜功","part":"c","gn":"三十","gt":"干部易犯错误","sub":"爱慕名利不务实","type":"four","expl":"喜欢做大事、立大功。多形容浮夸、不切实际的行为。","core":"多形容浮夸、不切实际的行为","exs":["在现实生活中，有少数领导干部好大喜功，乐于做面子工程、政绩工程，喜欢“作秀”或者工作上务虚不务实，“雷声大、雨点小”。","急躁冒进、好大喜功、违背科学，实际上是对时间资源的任性挥霍。","过去一段时间，一些地方在发展教育的时候好大喜功，热衷于建设豪华学校，不仅给地方财政带来了巨大的压力，也透支了地方教育发展的空间和未来。"]},{"id":370,"w":"沽名钓誉","part":"c","gn":"三十","gt":"干部易犯错误","sub":"爱慕名利不务实","type":"four","expl":"比喻故意矫情做作，用手段猎取名声或赞誉。","core":"比喻故意矫情做作，用手段猎取名声或赞誉","exs":["但对领导干部而言，沉溺于追名逐利，醉心于沽名钓誉，就无异于打开“潘多拉”盒子，万般恶事多因此而起。","做公益事业，最要避免的就是沽名钓誉。","书法不是沽名钓誉的工具，不是贪污腐败的渊薮，不是少数人的小圈子游戏，而是属于每一个中国人的宝贵艺术存在，是必须严肃对待的书写文化。"]},{"id":371,"w":"附庸风雅","part":"c","gn":"三十","gt":"干部易犯错误","sub":"爱慕名利不务实","type":"four","expl":"附庸：依傍，追随；风雅：泛指诗歌。指缺乏文化修养的人为了装点门面而结交文人，参加有关文化活动，以示自己有一定的文化素养（装文化人）。","core":"泛指诗歌","exs":["经查，蒋科荣身为党外领导干部，把党外当法外，毫无法律规矩意识，利用政协副主席的政治光环牵线搭桥、交朋结友，在附庸风雅的吹捧中迷失自我，挖空心思变现手中的权力，把政协资源当作大肆敛财的工具。","已近耳顺之年，江耀进认为，写诗不是为了附庸风雅，而是彻底地打开自己，让诗句穿透血液，敲击骨髓，获得内心的抚慰和解放。这些作品创作于2020年至2022年的三年间。","唐朝人姚汝能写过一本《安禄山事迹》，里面还有一则故事：话说叛臣史思明不识字却很喜欢附庸风雅，没事就爱作几首打油诗。"]},{"id":372,"w":"独善其身","part":"c","gn":"三十","gt":"干部易犯错误","sub":"近义辨析","type":"four","expl":"意思是不得志时也要注意自身的修养。后指只顾保持自身修养而不顾他人或全局。（语境要素：个人与外部的对比、保全保护）","core":"意思是不得志时也要注意自身的修养","exs":["如果整个社会不改好，个人想独善其身是不可能的。","构建海洋命运共同体理念启示我们，没有国家能够凭一己之力解决海洋生态环境问题，也没有国家能够袖手旁观、独善其身，各国唯有增强责任意识、加强团结合作，才能推动海洋可持续发展。","习近平总书记指出：“面对生态环境挑战，人类是一荣俱荣、一损俱损的命运共同体，没有哪个国家能独善其身。”"]},{"id":373,"w":"明哲保身","part":"c","gn":"三十","gt":"干部易犯错误","sub":"近义辨析","type":"four","expl":"明哲：聪明有智慧。指聪明有智慧之人，善于趋安避危，保全自身。也指为保全个人利益而回避原则问题的处世态度。","core":"指聪明有智慧之人，善于趋安避危，保全自身","exs":["科研只能实事求是，不能明哲保身，否则受害的将是患者。","广大党员干部应该认识到，如果采取“只要不出事，宁可不干事”的明哲保身态度，因为不敢担风险而索性不作为，那耽误的是党和国家事业发展，损害的是民生福祉。","“好好先生”看似与人为善，实则明哲保身，看似与世无争，实际上打的全是“小算盘”，说到底，就是怕得罪人，怕自己的利益受影响，是私心作祟、私利作怪。"]},{"id":374,"w":"虚与委蛇","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"虚：不真实，假意。与：跟。委蛇：敷衍。指对人虚情假意，敷衍应酬。","core":"指对人虚情假意，敷衍应酬","exs":["批评贵在坦诚真挚，来不得虚与委蛇，甚或苦心算计。","但也有一些人往往会用力过猛或准备过度，变成了尽说那些经过一再打磨的“正确的废话”，满口标准的“普通话”，没有个性，更没有棱角；有的还常常说那些虚与委蛇或顺杆爬的场面上的话，说些应景式的套话、空话、拜年话。","据了解，该剧的策划、创作、参演人员主要由民警、辅警组成，讲述了原本心地善良的小伙杨洋在被骗入诈骗集团后，为了生存，从起初的与诈骗分子虚与委蛇，到逐渐偏离正轨逐渐黑化成为诈骗分子骨干，在反诈中心民警谷宇所率领的小队的层层推进下最终弃暗投明。"]},{"id":375,"w":"委曲求全","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"曲意迁就，以求事成，或保全大局。","core":"曲意迁就，以求事成，或保全大局","exs":["爱好和平并不是纵容罪恶，更不等于委曲求全。","相比起调解的结果，更值得关注的是调解过程，以及产生争议的原因——劳动者到底是发自内心感到满意，还是迫于压力委曲求全？在一片口诛笔伐之中，涉事医院表示将积极整改，并更新了补偿方案。","委曲求全更需智慧誓死捍卫真理固然勇敢，而为了真理委曲求全，体现的则是另一种勇气。"]},{"id":376,"w":"敷衍塞责","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"敷衍：马虎应付。塞责：搪塞责任。做事马虎，应付一下以搪塞责任。","core":"马虎应付","exs":["严禁拒不执行组织决定和安排，严禁敷衍塞责、临危退缩等违反纪律行为，要积极主动参与救援，全力搜救失联人员，切实解决灾害处置中的困难问题。","实际工作中，面对不断变化的形势、艰巨繁重的任务、人民群众的期盼，倘若踟蹰不前、放松懈怠，甚至敷衍塞责，就可能耽误工作、贻误发展。","美方的声明内容，避重就轻、敷衍塞责，完全无法满足国际社会的真正关切。"]},{"id":377,"w":"曲意逢迎","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"曲意：违背本意。违背自己的本心，千方百计迎合或讨好别人。","core":"违背本意","exs":["微笑也是人与人之间最短的距离。达到这种结果的前提是发自内心的微笑，而不是曲意逢迎的。","要保持政治上的清醒，严格按照党的原则和政策办事，对上不曲意逢迎、不出卖原则，敢讲真话；对下不封官许愿，不以权谋私；对同级不讨好卖乖，不跑风漏气。","党员干部无论职务高低、权力大小，都要时刻以“君子检身，常若有过”的态度崇德戒俗，摒弃曲意逢迎的媚气，涵养无欲则刚的骨气。"]},{"id":378,"w":"投其所好","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"意思是迎合别人的喜好。","core":"意思是迎合别人的喜好","exs":["可以看出，投其所好、表达心意是年轻人送礼物更为在意的方面，重视礼物承载心意、展现尊重等情感价值，但对拿得出手有面子也同样重视，而这往往更直接地反映在礼物的经济价值上。","他们瞄准老年人警惕性不强、对视频剪辑知识匮乏等弱点，投其所好，编织骗局。无论骗谁，都于法不容，但“收割”老年人，更显卑劣。报道提供一个细节，2023年8月，一名受害者在短视频平台上刷到了一条视频。","当前，网上直播方兴未艾，网上演出蔚然成风，当越来越多的年轻人习惯于网络化生存，文艺院团不妨主动接近，投其所好，开辟新赛道，挖掘第二舞台，赋予传统演出以活力。这是一次令人欣慰的双向奔赴。"]},{"id":379,"w":"阿谀奉承","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"阿谀：为讨好而说好听的话。奉承：恭维别人。为讨好而说好听的话恭维别人。也作“阿谀逢迎”。","core":"为讨好而说好听的话","exs":["在影片中商纣王为了王权之争，宠信妲己，在一声声阿谀奉承中迷失自我，斩杀忠诚之士，修鹿台纵享酒池肉林之乐。这就要求基层干部要严守纪律规矩，自觉把好行为之舵，扭紧思想的方向盘，扣紧每一粒廉洁的“纽扣”。","形成规规矩矩的上下级关系，意味着上级对下级不能颐指气使，下级对上级不能阿谀奉承。严格党的纪律，要坚持党纪面前党员人人平等。","对党忠诚、光明磊落的老实人，从不在党性原则问题上打折扣、搞变通，也从不屑于搞拉拉扯扯、吹吹拍拍、阿谀奉承，当没有公心只有私心、没有正气只有俗气的“老好人”，而是在言行一致、表里如一中讲真话讲实话、干实事求实效。"]},{"id":380,"w":"趋炎附势","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"趋：奔走；炎：热，比喻权势。奉承和依附有权有势的人。","core":"热，比喻权势","exs":["作为青年团的成团大戏，该剧将家庭伦理的“拜寿”故事巧妙地融合在忠奸斗争中，描绘人情冷暖、世道人心，颂扬忠义温良的真善美，抨击趋炎附势的假恶丑。","翻译成今天的话就是：端庄稳重、严谨自律，不追求浮华，不趋炎附势，即使身居高位，也常常谦逊得像普通百姓一样。","民间传说中，陆游因其强烈的爱国精神，死后被赋予“阎王”身份，象征其精神永存，专门惩治生前阿谀奉承、趋炎附势之徒。地藏殿壁画。"]},{"id":381,"w":"如蚁附膻","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"附：趋附；膻：羊肉的气味。像蚂蚁趋附羊肉一般。比喻许多臭味相投的人追求不好的事物。也比喻许多人依附有钱有势的人。","core":"比喻许多臭味相投的人追求不好的事物","exs":["正是看到有机可乘，不法商人们如蚁附膻，无所不用其极。老板姚某为了承接水务集团的工程项目，千方百计讨好单国平，经常给他送钱送物。"]},{"id":382,"w":"掩人耳目","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"掩：遮盖。堵住人的耳朵，遮住人的眼睛。比喻以假象来蒙蔽别人。","core":"比喻以假象来蒙蔽别人","exs":["这些行为往往以“事先约定”“借手控制”等方式掩人耳目，将权钱交易包装在看似合法的外衣之下。","以增强所谓“反击能力”为由部署远超“自卫”之需的进攻性武器，是在玩一出掩人耳目的文字游戏。","令人大跌眼镜的是，有些地方为了掩人耳目，在“垃圾山”上覆盖了土层。"]},{"id":383,"w":"阳奉阴违","part":"c","gn":"三十","gt":"干部易犯错误","sub":"虚伪敷衍谄媚","type":"four","expl":"指表面遵从、暗地违背的行为。","core":"指表面遵从、暗地违背的行为","exs":["有的搞上有政策、下有对策，对上级决策部署打擦边球、搞选择性执行，甚至弄虚作假、阳奉阴违，对上糊弄、对下敷衍。","对贯彻落实党中央决策部署阳奉阴违、漠视侵害群众利益等问题特别是顶风违规违纪的，坚持抓典型抓现行抓通报。","要把政治标准放在首位，注重选拔政治过硬、信念坚定、对党忠诚的干部，坚决不用心怀二志、言行不一、阳奉阴违的两面人。"]},{"id":384,"w":"兴师动众","part":"c","gn":"三十","gt":"干部易犯错误","sub":"错误政策","type":"four","expl":"意思是指大规模出兵。现多指动用很多人力做某件事。","core":"意思是指大规模出兵","exs":["怕就怕一大帮子人兴师动众地下去应景应酬，检查方徒造声势，接待方“意思意思”，在走走转转、吃吃喝喝中败坏了党风、政风。","今年10月份，700多亩中稻收完后，刘峰花了一万多块钱，专门添置了一台油菜一体化播种机，兴师动众，准备大干一场。","有的没有认识到调查研究的必要性和重要性，对于调查研究或避而不谈，或浅尝辄止，或走马观花；有的带着框子找例子、带着论点找论据，把调查研究变成结论的预设；有的放不下架子，总是热衷于前呼后拥、兴师动众，这样的调查研究难以听到真话。"]},{"id":385,"w":"劳民伤财","part":"c","gn":"三十","gt":"干部易犯错误","sub":"错误政策","type":"four","expl":"意思是既使人民劳苦，又耗费钱财；现也指滥用人力物力。","core":"意思是既使人民劳苦，又耗费钱财","exs":["支持保护改革创新的同时，江西严禁打着改革创新旗号搞劳民伤财的“政绩工程”“形象工程”，坚决惩治借改革创新之名徇私舞弊、贪污受贿、假公济私以及严重侵害群众利益等行为。","应坚持节俭务实原则，切忌贪大求洋，不搞脱离实际、铺张浪费、劳民伤财的面子工程、形象工程。","现实中，个别领导干部“不是自己开头的不为，一定要刻上自己政绩印记的才干”，热衷搞“形象工程”“政绩工程”，既破坏工作稳定性和连续性，又劳民伤财，损害的是人民群众的根本利益。"]},{"id":386,"w":"朝令夕改","part":"c","gn":"三十","gt":"干部易犯错误","sub":"错误政策","type":"four","expl":"早上颁布的政令，晚上就改了。形容政令无常。也形容主张、办法等经常改变。","core":"形容政令无常","exs":["或许有人会说，改革时代政策多变，政府“朝令夕改”在所难免。但是要知道，根据形势调整政策、实施改革，并不是不看实际，罔顾民意，想改就改。","习近平总书记指出：“大国政贵有恒，不能朝令夕改，不要折腾”“不要一换届领导就兜底翻，更不要为了显示所谓政绩去另搞一套，不要空洞的口号满天飞”。","中消协有关负责人表示，平台和商家应认识到，规则简化不等于无规则，先提价再降价套路要不得，二次降价的朝令夕改也会伤及消费者感情和品牌形象，希望平台和商家遵循市场规律和契约精神，坚持合法合规，制定优惠政策。"]},{"id":387,"w":"粗枝大叶","part":"c","gn":"三十","gt":"干部易犯错误","sub":"不认真","type":"four","expl":"绘画，画树木粗枝大叶，不用工笔。比喻工作粗糙，不认真细致。","core":"比喻工作粗糙，不认真细致","exs":["调查研究要坚持实事求是的原则。坚持实事求是，最基础的工作就是了解实际、掌握实情。这就要求我们必须作深入系统而不是粗枝大叶的调查研究，使思想、行动、决策符合客观实际。","粗枝大叶、自以为是的主观主义作风，就是党性不纯的第一个表现；而实事求是，理论与实际密切联系，则是一个党性坚强的党员的起码态度。","绝不可粗枝大叶，或是避而不管。为民服务时，不妨多问一句。更好满足群众需求、更快解决群众困难，都需要认真细致的工作作风。"]},{"id":388,"w":"大而化之","part":"c","gn":"三十","gt":"干部易犯错误","sub":"不认真","type":"four","expl":"化：感化。原指把真诚、善良、完美的品德发扬光大，使人的思想品德得以完美。后用来形容做事大大咧咧，不谨慎，不细致。","core":"原指把真诚、善良、完美的品德发扬光大，使人的思想品德得以完美","exs":["注重调研成果转化运用，在调查的基础上深化研究，提高调研成果质量，切实把调研成果转化为解决问题、改进工作的实际举措，防止调查多研究少、情况多分析少，提出的对策建议大而化之、空洞抽象、不解决实际问题。","空喊口号、好大喜功、胸中无数、盲目蛮干不行，搞大水漫灌、走马观花、大而化之、手榴弹炸跳蚤也不行，必须在精准施策上出实招、在精准推进上下实功、在精准落地上见实效。","要防止调查多研究少、情况多分析少，提出的对策措施大而化之、空洞抽象。"]},{"id":389,"w":"具体而微","part":"c","gn":"三十","gt":"干部易犯错误","sub":"不认真","type":"four","expl":"具体：各部分已大体具备；微：微小。指事物的各个组成部分大体都有了，不过形状和规模比较小些。","core":"指事物的各个组成部分大体都有了，不过形状和规模比较小些","exs":["中国梦是国家的梦、民族的梦，也是每一个中国人的梦。“得其大者可以兼其小。”“宏大叙事”的国家梦，也是“具体而微”的个人梦。历史告诉我们，每个人的前途命运都与国家和民族的前途命运紧密相连。","在中国社会科学院考古学论坛上，本次入选的“六大”，共同为我们勾勒出具体而微的古人生产生活的生动画卷。","普通人身边具体而微的变化，彰显着我们不断深化改革开放取得的巨大成就，印证着“改革开放是当代中国发展进步的活力之源”。"]},{"id":390,"w":"哗众取宠","part":"c","gn":"三十","gt":"干部易犯错误","sub":"其他错误","type":"four","expl":"用浮夸的言词或做作的行动去迎合群众，以博取好感和支持。","core":"用浮夸的言词或做作的行动去迎合群众，以博取好感和支持","exs":["这是民进党当局倚美谋独企图的又一次充分暴露，终将是一场哗众取宠的闹剧。","经公安机关核查，渝北区范围内未发现相关案件和警情，系甘某某道听途说，为了哗众取宠，故意编造不实信息。甘某某对其违法行为供认不讳，南岸区公安分局已依法对甘某某处以行政处罚。","一类是假冒仿冒官方组织、新闻媒体、专家名人等账号，在一些社会事件进程中抢先发声，散布夸大其词、哗众取宠、未经证实的消息，带节奏炒热点，借以吸粉引流变现。"]},{"id":391,"w":"凌空蹈虚","part":"c","gn":"三十","gt":"干部易犯错误","sub":"其他错误","type":"four","expl":"形容不切实际、虚浮空泛。","core":"形容不切实际、虚浮空泛","exs":["要以自我革命精神引领履职方法创新发展，切实把政协党的建设新成效体现到防止凌空蹈虚、保证求实务实。","坐而论道、凌空蹈虚与马克思主义学风格格不入，也不符合干事创业的实践要求。理论只有与实际相结合，才能真正发挥对实践的指导作用，才能在理论的引领下做好实际工作。","没有哪一种文学创新可以完全凌空蹈虚，从零开始，与文学传统毫无关联。相反，只有熟知文学传统，才能改造文学传统，青出于蓝而胜于蓝。哪怕是激烈反对文学传统的作家也从文学传统之中获得反作用力。"]},{"id":392,"w":"厚此薄彼","part":"c","gn":"三十","gt":"干部易犯错误","sub":"其他错误","type":"four","expl":"厚：重视；薄：轻视。指重视这一方而轻视那一方，对人对事不能一视同仁。","core":"指重视这一方而轻视那一方，对人对事不能一视同仁","exs":["要在发展中更多考虑安全因素，切实增强风险意识，坚持底线思维和极限思维，积极有效防范化解重大安全风险，绝不能把高质量发展和高水平安全割裂开来、对立起来，绝不能厚此薄彼、顾此失彼。","做到公道正派，就要坚持一把尺子量到底，把标准条件摆上桌面，严格按照干部政策、原则、制度办事，不能搞“双重标准”，更不能搞亲亲疏疏、厚此薄彼。","如果对不同人才厚此薄彼，就可能丧失发展机遇。"]},{"id":393,"w":"从谏如流","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"谦虚接受建议","type":"four","expl":"谏：直言规劝。听从规劝像流水一样自然。形容乐于接受别人的批评意见。","core":"形容乐于接受别人的批评意见","exs":["在我们的领导干部队伍中，有的同志虚怀若谷、从谏如流，热忱欢迎监督。","党的领导机关和领导干部对各种不同意见都必须听取，领导干部特别是高级干部必须带头从谏如流、敢于直言。","面对批评，要保持从谏如流的谦逊态度，彰显党性修养。忠言逆于耳，良药苦于口。对待批评意见要虚怀若谷、闻过则喜，正确对待、虚心接受，有则改之、无则加勉，不搞无原则的纷争。"]},{"id":394,"w":"从善如流","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"谦虚接受建议","type":"four","expl":"从：听从；善：好的，正确的；如流：好像流水向下，形容迅速。形容能迅速地接受别人的好意见。","core":"好像流水向下，形容迅速","exs":["开展批评和自我批评要出以公心、严肃认真，自我批评不遮不掩、触及灵魂，相互批评坦诚相待、推心置腹，对待批评意见闻过则喜、从善如流，做到咬耳扯袖、红脸出汗。","这也启示我们，提高治理能力和治理水平，既要坚持眼睛向下，善于倾听、从善如流，拓宽群众反映利益诉求的渠道，更要善于携手共进，上下同心、协同发力，勇于尝试、大胆突破，最大限度释放政策红利。","相关方面认真倾听、从善如流、有则改之无则加勉，企业感到安全安心了，预期就好了，信心就强劲了。优化营商环境，让作为用户的企业来实事求是地、善意地“找茬”“纠错”，是很有必要的。"]},{"id":395,"w":"闻过则喜","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"谦虚接受建议","type":"four","expl":"过：过失；则：就。听到别人批评自己的缺点或错误，表示欢迎和高兴。指虚心接受意见。","core":"听到别人批评自己的缺点或错误，表示欢迎和高兴","exs":["对各种意见和批评，只要坚持党的基本理论、基本路线、基本方略，就要让大家讲，哪怕刺耳、尖锐一些，我们也要采取闻过则喜的态度，做到有则改之、无则加勉。","对同志的提醒批评，要闻过则喜、虚心接受。","同时，以闻过则喜的态度，经常听取一线官兵的意见建议，及时调整抓工作的思路，始终做到为党尽职尽责工作，为基层服务、为战斗力建设服务。处理好近和远的关系，科学思维是关键。"]},{"id":396,"w":"虚怀若谷","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"谦虚接受建议","type":"four","expl":"虚：谦虚；谷：山谷。胸怀像山谷一样深广。形容十分谦虚，能容纳别人的意见。","core":"形容十分谦虚，能容纳别人的意见","exs":["要有平等待人、与人为善的真诚态度，有虚怀若谷、海纳百川的宽阔胸襟，力争把各方面的真实意见掌握全、掌握准，进行反复研究、反复比较、择善而从。","民主党派在提高政党协商水平中担负着重要责任，但中国共产党担负着首要责任，因为我们是执政党，应该更加自觉地做到虚怀若谷、集思广益。","领导干部要做好“守门员”，把控好组织成员的素质，在选人方面，要坚持“德才兼备”；在育人方面，要将理论学习和实践锻炼相结合，以虚怀若谷的心态，广泛学习最新理论和知识，积极用新思维、新思路和新方法去分析、解决新情况新问题。"]},{"id":397,"w":"文过饰非","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"遮掩错误","type":"four","expl":"文、饰：掩饰；过、非：错误。用漂亮的言辞掩饰自己的过失和错误。","core":"掩饰","exs":["只要我们党牢牢坚持立党为公、执政为民，牢牢坚持为中国人民谋幸福、为中华民族谋复兴，不断检视自己，不掩饰缺点，不文过饰非，坚决同一切弱化党的先进性和纯洁性、危害党的肌体健康的现象作斗争，就一定能够始终立于不败之地。","领导干部要坚决反对事不关己、高高挂起，明知不对、少说为佳的庸俗哲学，坚决克服文过饰非、知错不改等错误倾向。","马克思主义政党的性质宗旨，决定了它始终代表最广大人民的根本利益，没有任何自己特殊的利益，从来不代表任何利益集团、任何权势团体、任何特权阶层的利益。不谋私利就能谋根本、谋大利，就能坚持真理、修正错误，敢于检视自身、常思己过，不讳疾忌医、不文过饰非，及时发现和解决自身存在的问题，就能摆脱一切利益集团、权势团体、特权阶层的“围猎”腐蚀，并向党内被这些集团、团体、阶层所裹挟的人开刀。"]},{"id":398,"w":"怙恶不悛","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"遮掩错误","type":"four","expl":"怙：依靠，依仗；悛：改过，悔改。坚持作恶，不肯悔改。","core":"依靠，依仗","exs":["针对美国国会众议长佩洛西不顾中方一再警告，执迷不悟、怙恶不悛，悍然窜访中国台湾地区，向“台独”分裂势力发出严重错误信号、严重违反一个中国原则和中美三个联合公报规定、严重冲击中美关系政治基础、严重侵犯中国主权和领土完整，外交部驻港特派员公署发言人3日表示坚决反对和强烈谴责。","《联合布告》指出：“对土匪中的首要分子，务必归案法办，如能率众投降，交出武器，准予将功折罪，保证其生命安全，从轻处理，或免予处分；对于胁从分子，只要脱离匪帮，交出武器，改恶从善，准予回家生产，不咎既往；凡怙恶不悛，继续祸害人民的土匪，必须坚决消灭，并严惩首恶，决不姑息。各地人民如能缉拿匪首、密报匪情，检举土匪隐藏的武器，协助剿匪有功者，分别予以奖赏。如有通藏匪、庇匪行为的，一律严办。”","台湾地区领导人无视“双少数执政”的现实，罔顾岛内主流民意，怙恶不悛、一意孤行，极力渲染大陆对台“威胁”，煽动“反中抗中”，蓄意升高两岸对立对抗。"]},{"id":399,"w":"欲盖弥彰","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"遮掩错误","type":"four","expl":"盖：遮掩；弥：更加；彰：明显。想掩盖坏事的真相，结果反而更明显地暴露出来。","core":"遮掩","exs":["经济工作有自身不可违背的客观规律，舆论引导不能说空话、说假话、说外行话，否则会适得其反，必须坚持实事求是，是成绩就是成绩，是问题就是问题，承认问题并分析清楚、提出解决思路是市场利好，遮遮掩掩反而欲盖弥彰。","陈斌华说，台湾地区领导人在讲话中，刻意包装、欲盖弥彰地宣称“中华民国台湾是一个主权独立的国家”“中华民国与中华人民共和国互不隶属”、台湾是“我们国家的名称”。","这完全是日本对其暗度陈仓发展航母、损害地区安全环境行径的欲盖弥彰。分析人士指出，通过技术改造，两艘出云级驱逐舰能各搭载至少10架F-35B战斗机，将成为具备较强攻击能力的轻型航母。"]},{"id":400,"w":"讳疾忌医","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"遮掩错误","type":"four","expl":"指隐瞒疾病、不愿医治，比喻怕人批评而掩饰自己的缺点和错误。","core":"指隐瞒疾病、不愿医治，比喻怕人批评而掩饰自己的缺点和错误","exs":["党员干部要坚决克服“爱惜羽毛”、讳疾忌医的心态，敢于“揭短亮丑”，真正从先进典型中见贤思齐、汲取力量，从反面案例中吸取教训、引以为戒。要深入剖析问题。","要以刮骨疗毒的勇气经常检视思想观念、工作方法上的不足，对实践暴露出的认知偏差和决策失误，要敢于正视、坚决纠正，决不讳疾忌医。","中国共产党的伟大不在于不犯错误，而在于从不讳疾忌医，敢于直面问题，勇于自我革命。"]},{"id":401,"w":"刚愎自用","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"不考虑别人建议","type":"four","expl":"愎：任性；刚愎：强硬固执；自用：自以为是。十分固执自信，不考虑别人的意见。","core":"任性","exs":["他已经预感到蒋介石不可靠，曾说蒋介石是一个刚愎自用之人，不可共事，这可能也是他退党的原因。","钟松此人刚愎自用，自恃援榆有功，异常骄傲。他在8月13日进入榆林城，不仅不休整补充部队，还把辎重留在榆林，14日便马不停蹄地率2个旅南下，孤军冒进，扬言“一战结束陕北问题”。","如果不先做学生，而是刚愎自用，先做先生，那就免不了误人子弟，装模作样。邓小平同志在谈到家庭联产承包责任制的创新时强调：“绝不是一个人脑筋就可以钻出什么新东西来。”"]},{"id":402,"w":"固执己见","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"不考虑别人建议","type":"four","expl":"顽固地坚持自己的意见，不肯改变。","core":"顽固地坚持自己的意见，不肯改变","exs":["但在承办法官前两次的耐心劝解下，张某与黄某仍然态度坚决、固执己见，对法律生效判决文书拒不承认，认为自己不应该归还申请执行人闻某案涉土地。","“老董呀，一辈子就是这个脾气，固执己见、不知变通，我们私下都叫他‘老古董’‘犟拐拐’，认定了的事很难改变。”他的妻子裴清莲在一旁打趣道。","甚至在家人提醒之下，一些老人仍固执己见，意识不到其中的问题，在偏执的路上越走越远。看到类似现象的年轻人，不妨多多提醒家中的老人，让他们尽量远离一些对生活无意义乃至有害的手机App。"]},{"id":403,"w":"自以为是","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"不考虑别人建议","type":"four","expl":"指自己认为自己正确，形容主观不虚心的态度。","core":"指自己认为自己正确，形容主观不虚心的态度","exs":["这就要求我们必须在调查研究上下功夫，深入基层、深入群众、深入一线，倾听他们的呼声、体察他们的情绪、感受他们的疾苦，避免浮在表面、流于形式，防止想当然、拍脑袋、自以为是，这样才能真正把情况摸清、把问题找准、把对策提实，使主观世界更好符合客观实际。","但经验有时也是包袱，会让人产生一种“经验自信”，自以为是。","如果自以为是，对整个工作不加分析，只讲成绩，怕讲缺点、错误，就无法使工作进步。"]},{"id":404,"w":"洗心革面","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"彻底改变","type":"four","expl":"洗心：指清除坏思想。革面：改变旧面貌。比喻彻底悔改。","core":"指清除坏思想","exs":["一个文明开放的社会是容许犯错的，抵制劣迹网红并非要将其一棒子打死，问题在于他们复出后的言行中毫无洗心革面的痕迹。","受疫情等因素影响，一些经营者在守信方面出现了“无心之失”，又或在失信后洗心革面，他们都渴望尽快恢复商誉，以健康状态获得更好的发展空间。","“针对未成年人犯罪，惩罚不是目的，通过教育、感化、挽救让失足少年洗心革面、回归社会做个有用的人才是司法的终极目标。”新北区法院院长任志清告诉记者。"]},{"id":405,"w":"脱胎换骨","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"彻底改变","type":"four","expl":"原为道教用语。指修道者得道以后，就转凡胎为圣胎，换凡骨为仙骨。现比喻通过教育，思想得到彻底改造。","core":"指修道者得道以后，就转凡胎为圣胎，换凡骨为仙骨","exs":["昔日“天上不飞雀，地上不长草，风吹砂砾满地跑”的干沙滩，真的脱胎换骨成了金沙滩，闽宁村升级成闽宁镇，村民收入翻了20倍。","老工业基地支柱产业要通过创新实现优化升级、脱胎换骨，进行深入改革创新，实现适应经济新常态的战略性调整。","经历改革成长的脱胎换骨，兵团国资国企焕发新活力，展现新气象，高质量发展的“龙头”高高昂起。改在“真”处农业产业链托起致富梦顶层基层良性互动，就能最大程度聚合改革效能。"]},{"id":406,"w":"改头换面","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"彻底改变","type":"four","expl":"①原为佛教语。指众生在轮回中形变神不变。②指改变面目。③指改正错误。④比喻只改变形式，而内容、实质不变。","core":"指众生在轮回中形变神不变","exs":["反腐高压之下，“四风”的公开表现少了，但改头换面、隐形变异仍不少见。","联合市场监管部门重点清理互联网改头换面、变相销售电子烟信息及虚假违法广告，强化短视频、营销号、自媒体等社交平台电子烟销售信息清理，推动互联网和电子烟生产经营企业落实主体责任，主动清理相关信息，全面停止网络销售及广告宣传行为。","以“智”提质万物互联1G到5G的变化，不仅是两代人的生活记忆，更是产业改头换面的历程。2019年10月31日，中国正式进入5G商用时代。"]},{"id":407,"w":"惩前毖后","part":"c","gn":"三十一","gt":"对待错误的态度","sub":"彻底改变","type":"four","expl":"指批判以前所犯的错误，吸取教训，使以后谨慎些，不致再犯。","core":"指批判以前所犯的错误，吸取教训，使以后谨慎些，不致再犯","exs":["回望百年党史，从延安整风到新时代主题教育，我们党始终坚持“惩前毖后、治病救人”。","“校园欺凌”问题一直备受关注，特别是围绕如何及时发觉、如何惩前毖后，讨论颇多。","批评和自我批评是每一名党员干部的必修课，要用好用活这一利器，实现既惩前毖后又团结同志的目的。"]},{"id":408,"w":"一成不变","part":"c","gn":"三十二","gt":"改变与不变","sub":"不变","type":"four","expl":"成：形成。指事物一形成就不再改变。多用于否定句中。","core":"指事物一形成就不再改变","exs":["要做好提醒指示跟其他交通管理措施一样，长实线不是独立存在的交通标线，也并非一成不变。“在交通管理领域，包括虚实线线型变化在内的交通标志和交通组织肯定是动态调整的。”","该研究发现地球地幔的运转模式并非一成不变：现代深俯冲板片可以进入下地幔以及接近全地幔对流的格局只是地球演化近期的过渡状态，不完全代表地球早期的动力学特征。","对于习近平经济思想的学理化阐释也应该是一个动态的、开放的、不断完善、不断发展的过程，而不是一成不变的。"]},{"id":409,"w":"亘古不变","part":"c","gn":"三十二","gt":"改变与不变","sub":"不变","type":"four","expl":"从古至今永远也不会改变。多褒义。","core":"从古至今永远也不会改变","exs":["中国与巴基斯坦的友谊亘古不变。","夜幕吞没了最后的红光，天地间，暮色勾勒出群山的轮廓。我明白自己什么也带不走，相较于亘古不变的高原，我所驻留的时间多么不值一提。","在绝大多数人心中，家乡到最后都会成为一个点，如同一座亘古不变的孤岛。"]},{"id":410,"w":"改弦更张","part":"c","gn":"三十二","gt":"改变与不变","sub":"改变","type":"four","expl":"更：改换；张：给乐器上弦。改换、调整乐器上的弦，使声音和谐。比喻改革制度或变更计划、方法。","core":"比喻改革制度或变更计划、方法","exs":["中国特色社会主义道路，开拓于中国人民共同奋斗，扎根于中华大地，是给中国人民带来幸福安宁的正确道路。无论遇到什么风浪，在坚持中国特色社会主义道路这个根本问题上都要一以贯之，决不因各种杂音噪音而改弦更张。","周武王灭商后，天下安定，声威显赫，八方来朝。有西蕃进贡一只名犬，召公奭（shì）担心武王玩物丧志，便写了一篇题为《旅獒》的文章进行劝谏，并说出了上面那番警示的话。武王听从了召公的劝告，改弦更张，守住了社稷。","奉劝民进党当局改弦更张，不要再用一些政治话术欺骗岛内民众，只有真正从台湾民众福祉出发，承认“九二共识”，以实际行动改善两岸关系，才是正途。"]},{"id":411,"w":"改弦易辙","part":"c","gn":"三十二","gt":"改变与不变","sub":"改变","type":"four","expl":"改弦：更换琴弦。易：改变。辙：车轮压过的痕迹，指道路。比喻改变方向或做法。同“更弦易辙”“改辕易辙”。","core":"车轮压过的痕迹，指道路","exs":["他接受了同志们的批评，从此改弦易辙，半年来工作大有起色。","“台独”是一条走不通的死路，即将上任的台湾地区新领导人应分清轻重缓急，改弦易辙、回头是岸。","美方应该改弦易辙，选择与中方相向而行，相互尊重，公平竞争，和平共处。一个健康稳定的中美关系不仅符合双方利益，也是国际社会的共同期盼。变化多，快"]},{"id":412,"w":"变幻莫测","part":"c","gn":"三十二","gt":"改变与不变","sub":"近义辨析","type":"four","expl":"变幻：没有规则地改变。变化奇特，不可预测。","core":"没有规则地改变","exs":["早春的天气真是变幻莫测，刚刚还是风和日丽，现在却雨雪交加。","如果说位于川西高原的阿坝州黄龙沟是一曲气势恢宏的交响乐章，那么丹云峡就是一道变幻莫测的色彩画廊。","三千里汉江的变幻莫测与中国时代风云变幻相互映衬，融入秦巴大山的美景、汉江航运的变迁和独具特色的民俗遗风，展现出向伟大中华文学传统和现实主义文学的回归和久违的经典小说的神奇叙事与诗意。"]},{"id":413,"w":"瞬息万变","part":"c","gn":"三十二","gt":"改变与不变","sub":"近义辨析","type":"four","expl":"瞬：一眨眼。息：一呼吸。在极短时间里就发生很多变化。形容变化很多很快。","core":"形容变化很多很快","exs":["信息时代的标志是瞬息万变，要与一日千里的技术经济发展同步，要为攻坚克难的社会改革实践出力。","战场态势瞬息万变，警惕智能化作战新挑战。","港中大更特设通识教育，以拓宽学生视野及培养综合思考能力，使学生在瞬息万变的现代社会中能内省外顾，成为出色的领袖人才，贡献社会。"]},{"id":414,"w":"光怪陆离","part":"c","gn":"三十二","gt":"改变与不变","sub":"近义辨析","type":"four","expl":"光怪：奇异的光彩；陆离：色彩繁杂。形容事物奇形怪状，五颜六色，常用来描述景象的离奇多变，也比喻世事离奇古怪、纷繁怪异。","core":"形容事物奇形怪状，五颜六色，常用来描述景象的离奇多变，也比喻世事离奇古怪、纷繁怪异","exs":["乘舟漫游，曲折蜿蜒的地下河水光怪陆离，配合迷离的灯光效果，宛若遨游龙宫，让人遐想万千。","“浪浪山小妖怪”的logo运用镭射烫金工艺，在不同光线与角度下呈现变幻色彩，生动呼应电影中“光怪陆离的妖怪世界”。","重演戏剧负责人胡蝶表示，该剧将结合互动体验与悬疑叙事，让观众成为剧情的推动者，沉浸式感受光怪陆离的场景。"]},{"id":415,"w":"经久不衰","part":"c","gn":"三十二","gt":"改变与不变","sub":"长时间繁荣昌盛","type":"four","expl":"①精神饱满的状态，身体健壮的外表，或幼年期到成年期之间的时期的精神特征；青年人的活力或朝气。②形容某事或某人经历很长时间仍旧保持较高的旺盛状态事例。","core":"②形容某事或某人经历很长时间仍旧保持较高的旺盛状态事例","exs":["玉文化，历经八千年经久不衰，无可替代，是源于玉之可贵；而玉之最可贵在于你用心养玉，最终玉来养心。","年轻人的耐力经久不衰，能够适应长久的训练。","走过二十二载，这一展会何以经久不衰？作为中国农业会展的金字品牌之一，长春农博会是吉林省现代农业的展示窗口，而农业发展的底气与信心又为展会注入持久活力。底气与信心从何而来？"]},{"id":416,"w":"长盛不衰","part":"c","gn":"三十二","gt":"改变与不变","sub":"长时间繁荣昌盛","type":"four","expl":"长久兴盛而不衰败，比喻长时间保持旺盛的势头。","core":"长久兴盛而不衰败，比喻长时间保持旺盛的势头","exs":["国乒教练组竞聘也已展开，对标奥运5金的战略目标，长盛不衰将是一代代国乒人最大的追求。","作为海上丝绸之路的始发港之一，广州港是我国唯一历经2000年长盛不衰的世界大港。","习近平总书记在青海考察时指出：“在中华民族大家庭中，大家只有像石榴籽一样紧紧抱在一起，手足相亲、守望相助，才能实现民族复兴的伟大梦想，民族团结进步之花才能长盛不衰。”"]},{"id":417,"w":"今非昔比","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"现在不能和过去相比。形容变化大。（多形容现在比过去好）","core":"形容变化大","exs":["西藏医疗救治水平今非昔比。","自古以来，人与海的对抗背后，恰恰体现了人类对于海洋的畏惧与无奈。然而近些年来，地球海洋的整体含氧量下降了2%，而低含氧量的沿岸海洋死区数量从50个左右增加到了近500个，海洋已然今非昔比。","11月1日，在荣县老城区，看看今非昔比的蜕变。"]},{"id":418,"w":"天翻地覆","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"覆：翻过来。形容变化巨大。也形容闹得很凶。","core":"形容变化巨大","exs":["一首首经典歌曲、一段段精湛表演，让人们重温风云激荡、天翻地覆的发展奇迹。","70年砥砺奋进，我们的国家发生了天翻地覆的变化。","这位见证西藏农业天翻地覆变化的老人，依然珍惜粮食，家里的餐桌上从来不见剩饭。他说：“攥在自己手里的糌粑，是幸福的味道。”"]},{"id":419,"w":"时过境迁","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"境：环境。迁：变迁。时间过去了，环境或情况也随之改变了。","core":"环境","exs":["时过境迁，我们往往只有回到经典作品产生的历史语境中，才能更清楚地看到其创新性之所在。","每段生命，都有别离的那一天，如同东寨港的“石禁碑”，时过境迁，刻碑的人早已远去，碑上的信念依然永续。","1968年12月，中国人自己设计建造的第一座铁路、公路两用长江大桥南京长江大桥建成通车。这座举全国之力建成的“争气桥”，极大地鼓舞了中国人民自力更生建设国家的信心。时过境迁，今天的南京，过江通道已从1座增加至11处13条。"]},{"id":420,"w":"沧海桑田","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"沧海：大海。桑田：种桑树的地。大海变为桑田，桑田变为大海。比喻世事变化非常大。","core":"比喻世事变化非常大","exs":["多年来，从无到有，从有到优，他们亲眼见证了一片又一片的大居发生了沧海桑田、翻天覆地的巨大变化。","18项全球重要农业文化遗产，见证沧海桑田，蕴藏古人智慧，镌刻着中华民族的精神追求，融生态美、农业美、人文美为一体。","从茹毛饮血到发出“人生三问”，百万年沧海桑田，似乎倏忽而过。"]},{"id":421,"w":"斗转星移","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"斗：北斗星。表示一夜之间时间的推移。后也指岁月流逝。","core":"表示一夜之间时间的推移","exs":["本次活动将读书现场搬到了新华书店阅览室，面对琳琅满目的书籍，浓厚的读书氛围迎面扑来，干警们在历史长河中感受斗转星移，在社科文学中体味百态人生，在法律知识中思考实践与应用……伴随着书页翻动的沙沙声，共赴一场阅读盛宴。","百年岁月，斗转星移、潮起潮落。中国共产党历经风雨洗礼，正带领中国人民意气风发地奋进在全面建设社会主义现代化国家、实现中华民族伟大复兴的新征程上。","从酸溜溜、香辣辣、筋道道的擀面皮里品味关中宝鸡农村一户人家四十多年来从饥饿、贫穷、挣扎到生存、发展、壮大的命运故事，展现出我国改革开放斗转星移、沧海桑田的巨大变化。"]},{"id":422,"w":"白云苍狗","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"苍：青色，泛指青黑色。比喻世事变化无常。也作“白衣苍狗”。","core":"青色，泛指青黑色","exs":["白云苍狗，世事无常，悠悠时光看似漫长，不过是白驹过隙，忽然而已。","白云苍狗，时过境迁，唯有对玉器的痴迷不变。","时至今日，历经两个甲子，白云苍狗，风云变幻，比较研究的主题也随时代而变易，从解读中国落后于西方的原因，到客观评判中西历史文化优劣、重塑文化自信，再到为中华民族复兴大业提供中外历史镜鉴。"]},{"id":423,"w":"恍如隔世","part":"c","gn":"三十二","gt":"改变与不变","sub":"变化巨大","type":"four","expl":"恍：仿佛；世：三十年为一世。仿佛隔了一个时代。指一种因人事或景物变化很大而引起的感触。","core":"指一种因人事或景物变化很大而引起的感触","exs":["那里山大沟深、破屋烂衫，只能靠天吃饭，“种下一袋子，收上一帽子”。习近平总书记接过照片仔细端详，不由感慨：“今非昔比，恍如隔世啊！”","如今的青和居社区已是高楼林立、环境优美、配套齐全的现代化社区。习近平说，生活在今天这个时代，同几十年前相比，真是沧桑巨变，恍如隔世。","如今，两人再次忆起当时的情景，都有恍如隔世之感。"]},{"id":424,"w":"根深蒂固","part":"c","gn":"三十二","gt":"改变与不变","sub":"难以改变","type":"four","expl":"蒂：草木之根。比喻基础稳固。（中性）（侧重深）","core":"比喻基础稳固","exs":["美国执法领域存在着根深蒂固的种族偏见。","一些西方媒体却罔顾事实真相、背离科学精神，恶意抹黑中国防疫政策调整，完全丧失了媒体的职业操守，毫无公信力可言，这是其根深蒂固政治偏见的充分暴露。","枪支改革推进缓慢，党争加剧立法分歧，枪支暴力问题在美国早已根深蒂固，悲剧或难以避免。"]},{"id":425,"w":"积习难改","part":"c","gn":"三十二","gt":"改变与不变","sub":"难以改变","type":"four","expl":"积习：指多年养成的习惯。长期形成的某种习惯，很难改变。","core":"指多年养成的习惯","exs":["官僚腐败从古到今一直存在，积习难改，反腐倡廉的工作要艰难而持久地进行下去。","“一些作风顽疾还没有彻底解决，形式主义、官僚主义问题积习难改、查而不绝，影响高质量发展质效、损害群众利益的问题易发多发。建议把督导督办作为促进作风转变的有力举措，推动压力传导一贯到底，推动上下同频共振，防止出现松劲、麻痹思想和前紧后松、上热下冷、高开低走等问题。”","节日前后，“四风”最爱冒头。“节点”即是“考点”。节日将至，党员领导干部尤其要自觉抵制不良风气侵蚀，在小事小节上严以修身、正心明道，严守纪律底线，坚决防范“节日腐败”，坚决破除积习难改、隐形变异的顽瘴痼疾。"]},{"id":426,"w":"积重难返","part":"c","gn":"三十二","gt":"改变与不变","sub":"难以改变","type":"four","expl":"积：积习。返：返回，回头。积习深重，难以改变。多指长期存在的恶习，弊端已经发展到了难以革除的地步。（侧重时间久）","core":"多指长期存在的恶习，弊端已经发展到了难以革除的地步","exs":["一旦躺在过去的功劳簿上，安于现状、止步不前，就会暮气丛生、积弊日深，最终积重难返。","当地舆论认为，美国枪支暴力问题积重难返，枪支泛滥严重威胁美国民众生命安全，控枪却成为无解命题。","在长期执政条件下，各种弱化党的先进性、损害党的纯洁性的因素无时不有，各种违背初心和使命、动摇党的根基的危险无处不在，如果不严加防范、及时整治，久而久之，必将积重难返，小问题就会变成大问题、小管涌就会沦为大塌方，甚至可能酿成全局性、颠覆性的灾难。"]},{"id":427,"w":"覆水难收","part":"c","gn":"三十二","gt":"改变与不变","sub":"难以改变","type":"four","expl":"倒在地上的水难收回来，说明一旦事情发生，就很难再改变或挽回。比喻事成定局，无法挽回。","core":"比喻事成定局，无法挽回","exs":["这种信任危机一旦形成，便如覆水难收，对网络生态造成长远的负面影响。","一方面，电商直播、粉丝群所采用的实时、直接的交互形式，在让货物销售突破时间、空间限制的同时，对竞争对手的影响往往也比传统营销手段的影响要大，一旦发表言论，便是“覆水难收”。","命令一旦发出，便如覆水难收，千万不可朝令夕改，以免动摇军心。"]},{"id":428,"w":"顺势而为","part":"c","gn":"三十三","gt":"顺势造势","sub":"顺势","type":"four","expl":"顺应形势做事情。","core":"顺应形势做事情","exs":["我们要因势而谋、应势而动、顺势而为，加快推动媒体融合发展，使主流媒体具有强大传播力、引导力、影响力、公信力。","要加快建设以实体经济为支撑的现代化产业体系，既要逆势而上，在短板领域加快突破，也要顺势而为，在优势领域做大做强。","高标准高质量推进数字中国建设，既要顺势而为，大力推进数字产业化、产业数字化，构建以数据为关键要素的数字经济，加快推进数字政府、新型智慧城市、数字乡村建设，提升全民数字素养与技能；也要乘势而上，以数字化转型整体带动生产方式。"]},{"id":429,"w":"大势所趋","part":"c","gn":"三十三","gt":"顺势造势","sub":"顺势","type":"four","expl":"大势：整个局势。趋：趋向。整个局势发展的方向。","core":"整个局势","exs":["台湾是我国领土不可分割的一部分，实现祖国和平统一，是大势所趋，人心所向。","正值中越建立全面战略合作伙伴关系15周年之际，双方提升关系新定位可谓大势所趋、水到渠成，必将为两国关系开辟更加光明的前景。","不论从何种维度来讲，调降存量房贷利率已是民心所向、大势所趋。"]},{"id":430,"w":"势在必行","part":"c","gn":"三十三","gt":"顺势造势","sub":"顺势","type":"four","expl":"势：形势。客观形势决定必须这样做。","core":"形势","exs":["我相信农村不久就会出现一个全新的局面，一切恐怕都势在必行了。","网络微短剧规范化可谓势在必行。只有相关部门制定更加详细的规范，落实监管责任，提升监管能力，才有可能减少网络微短剧领域的诸多乱象。","纪法教育已经成为关乎青年党员干部茁壮成长和健康发展的关键，加强青年党员干部纪法教育势在必行。"]},{"id":431,"w":"随波逐流","part":"c","gn":"三十三","gt":"顺势造势","sub":"顺势","type":"four","expl":"随：跟着。逐：追赶。随着波浪起伏，跟着流水漂荡。比喻自己没有主见，只是随着别人走。同“随波逐浪”。","core":"比喻自己没有主见，只是随着别人走","exs":["对于社会上有些不好的风气，我们的报纸不能听之任之，更不能随波逐流，而要善加引导，加强正面的教育。","即使现在“躺平”和“摆烂”之辞盛行，坚持越来越成为所谓难事，作为大学生的我们依然不可随波逐流，得过且过。","身处其中的我们更应看清世界发展之动向，不随波逐流，理应有自己的思考，在世界局势和中国变化中实现自己的理想和信念。"]},{"id":432,"w":"因陋就简","part":"c","gn":"三十三","gt":"顺势造势","sub":"顺势","type":"four","expl":"指在条件有限的情况下，利用现有简陋条件将就办事，强调适应环境而非追求完善。该成语褒贬取决于“简”的合理性—灵活务实则褒，降低标准则贬。","core":"指在条件有限的情况下，利用现有简陋条件将就办事，强调适应环境而非追求完善","exs":["坑道战、破袭战、掀帘战、地道战、地雷战、堡垒战、自卫队、联防队、工作队、武工队等因陋就简因地制宜的战术战法层出不穷，都是沦陷区民众的发明创造，更属“兵民是胜利之本”的真实体现。","当前部分幼儿园一味追求低投入、低成本，因陋就简，一部分则盲目追求高投入、高成本、“贪大求洋”，进而导致普惠质量不高。笔者看来，其根本原因在于没有科学核定学前教育实际成本。","针对这样的资源条件，这里的古人因陋就简，就地取材，对多种石材加以利用，开采方法简单实用、不拘一格。"]},{"id":433,"w":"推波助澜","part":"c","gn":"三十三","gt":"顺势造势","sub":"造势","type":"four","expl":"澜：大的波浪。比喻推动、助长事物的声势及发展。（中性词）","core":"比喻推动、助长事物的声势及发展","exs":["在经济利益的驱动下，借助于网络、手机、微博等新媒体的推波助澜，各式广告无孔不入。","至今秋十月，全国各铁路局承揽货物运输业务量和营业额均有不同程度的增长，让百姓客户享受到高效能的运输服务，为新经济时期内的“货畅其流”推波助澜。","少数国家奉行霸权强权，拉小圈子，立潜规则，搞干涉打压、“脱钩断链”，甚至对地区“三股势力”推波助澜，目的就是企图压制“全球南方”战略自主，封堵新兴市场和发展中国家的振兴之路。"]},{"id":434,"w":"顺水推舟","part":"c","gn":"三十三","gt":"顺势造势","sub":"造势","type":"four","expl":"舟：船。顺着水流的方向推船。比喻顺应某个趋势说话办事。","core":"比喻顺应某个趋势说话办事","exs":["在市场自然增长的时候，营销的作用是顺水推舟；在市场遭遇困境的时候，营销的作用是逆水行舟，更需体现担当，展现价值。","一些互联网公司和科技企业相中了这里的人口红利和成本优势，顺水推舟将部分研发机构和制造基地搬到了这里，带动了当地经济发展。类似的还有“好客山东”。","以工代赈顺水推舟，村民家门口打工增收，30多名村民还学会了建筑、电焊等技术。"]},{"id":435,"w":"理所当然","part":"c","gn":"三十四","gt":"自然会发生","sub":"自然会发生","type":"four","expl":"指从道理上讲，应该如此。","core":"指从道理上讲，应该如此","exs":["“我才知道，原来我在生活中遇到的很多事是可以拿起法律武器保护自己的，而不是一味地回避或忍受，甚至认为理所当然。这个讲座真是为我送来了一场‘及时雨’！”活动结束后，张女士含着泪感慨道。","他们在海外受困遇险，生命和财产受到威胁，我们感同身受，理所当然竭尽全力相助。","这是在中国这一国际法主体没有发生变化情况下的政权更替，中国的主权和固有领土疆域没有改变，中华人民共和国政府理所当然地完全享有和行使中国的主权，其中包括对台湾的主权。"]},{"id":436,"w":"顺理成章","part":"c","gn":"三十四","gt":"自然会发生","sub":"自然会发生","type":"four","expl":"意思是写文章、做事情顺着条理就能做好。比喻随着某种情况的发展而自然产生的结果。","core":"意思是写文章、做事情顺着条理就能做好","exs":["这么看，两岸融合“这副担子”落在福建的肩上，顺理成章。两岸融合是福建一直在做的事情，听起来有点儿“老调重弹”，但去年的情况还真不一样。","小满预示着小麦等农作物籽粒将熟未熟，但毕竟正是青黄不接的时候，而田间地头的野菜正蓬勃生长，旧时采食野菜度过饥荒，自然顺理成章。“苦苦菜，带苦尝，虽逆口，胜空肠。”","各种音乐、文艺在丝路上，乃至中原地区，长期相互影响、借鉴、充实、融通，酝酿着微妙的变局；等到隋唐大一统局面的到来，音乐、文艺会找寻合适的时机，发生重大而美妙的“化学反应”，而文艺高峰就顺理成章地出现了。"]},{"id":437,"w":"天经地义","part":"c","gn":"三十四","gt":"自然会发生","sub":"自然会发生","type":"four","expl":"指天地间理所当然而不能改变的道理；也指理所当然，不容置疑的问题。","core":"指天地间理所当然而不能改变的道理","exs":["解放军维护国家主权和领土完整，开展有关军事行动天经地义。","一个共产党员，要为党、为国家、为人民的事业奉献自己的一切，这是天经地义的，不需要任何理由！","任何人没有凌驾于法律之上的特权，无论是何身份背景，只要违反法律，就必须受到应有惩治，这在任何国家都是天经地义的。"]},{"id":438,"w":"水到渠成","part":"c","gn":"三十四","gt":"自然会发生","sub":"自然会发生","type":"four","expl":"意思是当水流到某处时，自然会形成一条水道。这个成语用来比喻当条件成熟时，事情会自然成功，并不需要强求。","core":"意思是当水流到某处时，自然会形成一条水道","exs":["上海市绿化管理指导站专家表示，近期发现的古树主要有两种情况：在持续“海选”中新发现的古树；前期的古树名木资源普查中已被绿化部门关注，今年年纪到了，入选古树大家庭便水到渠成。","正是凭借优质服务，兴业银行厦门分行赢得了有关部门的广泛认可，后续合作也就水到渠成。","中国与乌拉圭建立全面战略伙伴关系是水到渠成。"]},{"id":439,"w":"顺其自然","part":"c","gn":"三十四","gt":"自然会发生","sub":"自然会发生","type":"four","expl":"意思是顺着事物本来的性质自然发展。","core":"意思是顺着事物本来的性质自然发展","exs":["这是一本在微信群“首发”的书，先前没有周密的计划，启动后也没有详细的提纲，完全是“草鞋没样，边打变像”的过程，一切都是顺其自然、水到渠成的。","“比如对待长辈，我用同心话喊‘姨娘’，拉近关系，用心解答老人们关心的养老金、医保报销等问题，只要真诚，很多事就会顺其自然”。信任不是突如其来的“破壁”，而是日积月累的信服。","目前阶段，不能急功近利，训练中主要还是打好基础，至于成绩，顺其自然就好。新疆体育局体育训练一大队田径项目短跳组主教练张洋对记者说。"]},{"id":440,"w":"未雨绸缪","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"绸缪：缠绕，引申指修缮。比喻事先做好防备工作。","core":"缠绕，引申指修缮","exs":["面对错综复杂的宏观经济环境，我们既要看到推动经济发展的有利条件，坚定信心，积极作为，又要充分估计影响经济发展的不利因素，未雨绸缪，防范风险。","前进道路上，自觉用习近平新时代中国特色社会主义思想武装头脑，善于运用这一重要思想防范化解重大风险，增强底线思维，做到未雨绸缪，我们一定能把我国发展进步的命运牢牢掌握在自己手中，推动中国式现代化劈波斩浪。","防范城市内涝，郫都区同样未雨绸缪。“每年夏季的强降雨，郫温路下穿成灌高速处都会因雨水排放不畅而发生路面积水，影响有轨电车运行及行人车辆通行安全，存在防汛隐患。”"]},{"id":441,"w":"常备不懈","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"意思是时刻准备着，毫不松懈。","core":"意思是时刻准备着，毫不松懈","exs":["要改革完善疾病预防控制体系。坚决贯彻预防为主的卫生与健康工作方针，坚持常备不懈，将预防关口前移，避免小病酿成大疫。要健全公共卫生服务体系。","要强化责任担当，真抓实备，常备不懈，确保一旦有事能上得去、打得赢。要坚持实战实训、联战联训，加强对抗性、针对性、协同性训练，提升训练质量和水平。","要深入贯彻落实习近平总书记关于疫情防控的重要指示精神，切实把思想和行动统一到党中央决策部署上来，坚持人民至上、生命至上，坚持外防输入、内防反弹，突出防控重点、抓牢关键环节，进一步提高工作的预见性、前瞻性和大局观，下好“先手棋”、打好“主动仗”，常备不懈提升疫情应急处置能力。"]},{"id":442,"w":"防患未然","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"患：灾祸。未然：没有这样，指没有发生。在祸患还没有发生之前就进行防备。","core":"没有这样，指没有发生","exs":["治理宰客还应防患未然。","把问题想得充分些，把准备做得精细些，把预案做得周全些，只有防患未然，把“丰收在望”变成“丰收到手”，“小满”方得“圆满”。原熟，天下足。“打赢‘三夏’攻坚战，争取丰产又丰收！”","信息安全攻防战将是一场长期博弈，必须始终坚持安全至上的理念，以先进的信息安全技术手段为支撑，以科学完备的法律规范为制约，对军事数据实施全方位、全周期动态管理，防患未然、警钟长鸣。信息安全，人人有责。"]},{"id":443,"w":"防微杜渐","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"微：细小，指事物的苗头。杜：杜绝，堵塞。渐：事物的开头。指在不良的事物刚刚露出苗头时，就加以制止和杜绝，不让它发展下去。","core":"细小，指事物的苗头","exs":["安全生产，关键在于防患于未然、防微杜渐，把安全隐患发现在前、解决在先。","丹江街道纪工委选取《2023年查处严重违纪违法党员干部忏悔录》中的典型案例，以案释法，开展廉洁从业警示教育，强化党员干部纪法意识，增强纪法思维，做到防微杜渐，警钟长鸣。","党员干部要以在全党开展党纪学习教育为契机，深刻认识严守生活纪律的重要意义、全面把握生活纪律的内在要求，坚持把生活纪律融入日常、抓在经常，防微杜渐，不断增强政治定力、纪律定力、道德定力、抵腐定力，始终老老实实做人。"]},{"id":444,"w":"居安思危","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"处在安定的环境时而能想到可能会出现的危难。","core":"处在安定的环境时而能想到可能会出现的危难","exs":["居安思危，思则有备，有备无患。","“君子以惩忿窒欲”，即使身处顺心的境遇，也不忘居安思危。“君子以思患而豫防之”，以长远的眼光判断形势变化，做好危机的预防和处理，“是故君子，安不忘危，存不忘亡，治不忘乱，是以身安而国家可保也”。","新中国成立后，党中央居安思危，高度重视党的工作纪律建设。1949年11月，中共中央发出《关于成立中央及各级党的纪律检查委员会的决定》。随即，从中央到地方县以上、军队团以上的各级纪律检查委员会相继成立。"]},{"id":445,"w":"曲突徙薪","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"原义是把烟囱改建成弯的，把灶旁的柴草搬走；比喻事先采取措施，才能防止灾祸；在句子中可充当作谓语、定语。","core":"比喻事先采取措施，才能防止灾祸","exs":["一定要把排查放在首位，曲突徙薪，未雨绸缪，防患于未然。悦来投资集团领导高度重视隐患排查工作。","见兔顾犬、亡羊补牢，是为下策；积谷防饥、曲突徙薪，方为上策。","且料定新疆来日必然生事，急宜曲突徙薪，预为之计。林则徐一口气说到这里，突然起身激动地说：西北与新疆乃是中华安定的屏障，与国运息息相关，吾数年来留心人才，欲将此重任托付。"]},{"id":446,"w":"高枕无忧","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"前期准备","type":"four","expl":"垫高枕头睡觉，无所忧虑。","core":"垫高枕头睡觉，无所忧虑","exs":["今年雨水大，不要以为大堤修整过一次，就可以高枕无忧了。","城西的大堤上新建了大闸，调节里面的水位，使得每个内湖都能一年四季荡漾轻波细浪，市民们这才高枕无忧。一项新的决策更是应运而生：开挖几条河道，把湖泊连成一体，使得全城步步见水、家家亲水。","虽然我国粮食连年丰收，并不意味着可以高枕无忧。需要注意的是，2015年粮食产量突破1.3万亿斤，并在之后连续9年稳定在1.3万亿斤以上。"]},{"id":447,"w":"临渴掘井","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"出现问题进行补救","type":"four","expl":"临；接近。感到口渴才挖井。比喻平时没有准备，事到临头才想办法。","core":"比喻平时没有准备，事到临头才想办法","exs":["“临渴掘井”，拖到“问题扎堆”再改革万万要不得。","第二，为了能够对付临时的紧急任务，完成与自己研究无关或关系不大的文章，必须平时多多接触实际、联系群众，注意时事、研究政策，广泛阅读书报、随时积累材料，以免临渴掘井，手足无措。","等不来，要不来，“临渴掘井”讨不来。平日里营造好创新氛围，悉心呵护科创企业，才能在关键时刻涌出汩汩活水、汇起千顷澄碧。"]},{"id":448,"w":"江心补漏","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"出现问题进行补救","type":"four","expl":"指船到江心才补漏洞。比喻临到紧急关头才设法补救，为时已晚。偏正式结构；在句中一般作谓语、定语。","core":"指船到江心才补漏洞","exs":["事态已严重到了这种境地，你再怎么补救也是江心补漏，为时已晚。","当海马汽车仍在复制马自达老路，毫无研发突破之时，彼时的吉利已收购沃尔沃、奇瑞自研发动机打破技术壁垒，而海马汽车的技术储备已严重不足。等到海马意识到自主研发的重要性时，犹如江心补漏，已经来不及了。","领导干部读书学习水平，在很大程度上决定着工作水平和领导水平。要想获得做官、做人、做事的不竭动力，就要善于学习。关键要掌握理论知识、政策知识、法律知识、业务知识，培养哲学素养、历史素养、文学素养。这样才会厚积而薄发，形成“一桶水和一滴水”关系，否则“书到用时方恨少”“船到江心补漏迟”。"]},{"id":449,"w":"亡羊补牢","part":"c","gn":"三十五","gt":"提早准备和补救","sub":"出现问题进行补救","type":"four","expl":"意指丢失了再去修补羊圈，还不算晚。后用来比喻出了问题以后及时想法补救，以免继续受损失。也指出了问题才想法补救，已经太晚了。","core":"意指丢失了再去修补羊圈，还不算晚","exs":["纠正也好，改进也罢，都是“亡羊补牢”。说出口的话犹如泼出去的水，即便马上收回，可能已造成严重的影响。","亡羊补牢，为时未晚。","“我们办理案件，既要亡羊补牢，办准、办好已经发生的案件，又要未雨绸缪，以案为鉴，预防和减少这类案件的发生……”近日，在河南省新蔡县检察院第一检察部业务分析会上，该部主任张芯华结合自己办理的李某诈骗案深有感触地说。"]},{"id":450,"w":"尾大不掉","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形势不好","type":"four","expl":"掉：摇动，摆动。比喻属下势力强大，不服从指挥调度。也比喻事情前轻后重，难以驾驭的现象。","core":"比喻属下势力强大，不服从指挥调度","exs":["从晚清到民国，国家的行政体制始终未能一致，指臂不灵，尾大不掉，中央政府始终不能有效地号令全国。","拼贴、印章、题跋与过度装饰问题等，往往面临着“法不责众”与“尾大不掉”的难题。","由此，美国财政赤字不断膨胀，财政纪律逐步废弛，美债遂呈尾大不掉之势。"]},{"id":451,"w":"各行其是","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形势不好","type":"four","expl":"指各人按照自己认为正确的去做。","core":"指各人按照自己认为正确的去做","exs":["各自为政、各行其是，党就会变成一盘散沙，党的领导就会成为一句空话。","推动各领域各方面改革举措同向发力、形成合力，增强整体效能，防止和克服各行其是、相互掣肘的现象。","自觉在思想上政治上行动上同党中央保持高度一致，及时校正偏差，不打折、不变通、不走样，决不能各行其是、各自为政。"]},{"id":452,"w":"各自为政","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形势不好","type":"four","expl":"各人按自己的主张办事。（多用来形容工作，单位之间、部门之间）","core":"（多用来形容工作，单位之间、部门之间）","exs":["各部门互相协作，互相支援，消除了过去一定程度上存在的各自为政的现象。","自觉在思想上政治上行动上同党中央保持高度一致，及时校正偏差，不打折、不变通、不走样，决不能各行其是、各自为政。","“大课程观”的树立，要求学校、家庭、社会三者从各自为政走向密切配合，实现同向同行。"]},{"id":453,"w":"如鱼得水","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形容人工作的状态","type":"four","expl":"好像鱼得到水一样。比喻得到跟自己非常投合的人或对自己很适合的环境。","core":"比喻得到跟自己非常投合的人或对自己很适合的环境","exs":["优化营商环境，让各种类型的经营主体“如鱼得水”。不止在南京，江苏各地积极行动。","全省市场监管系统将坚持稳字当头、稳中求进，着力营造一流营商环境，服务构建全国统一大市场，加快建设质量强省和知识产权强省，让各类市场主体在江苏如鱼得水、如鸟归林。","政策“红利”换来企业效益“增量”，务实举措让市场主体“如鱼得水”。"]},{"id":454,"w":"面面俱到","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形容人工作的状态","type":"four","expl":"各方面都照顾得很周到。也指不仅各方面都照顾到，而且每一个方面都处理得很得当。","core":"也指不仅各方面都照顾到，而且每一个方面都处理得很得当","exs":["多措并举、面面俱到，才能把一个个问号拉直，让辛苦打拼一年的人们收获满满的获得感和幸福感。","工作多年，他依然是大家眼中那个面面俱到的“细节怪”。","展览的空间是有限的，不能面面俱到，只能通过一次次展览向观众呈现其所蕴含的丰富信息。"]},{"id":455,"w":"独当一面","part":"c","gn":"三十六","gt":"办公、管理相关","sub":"形容人工作的状态","type":"four","expl":"意思是指单独负责一个方面的工作或任务。","core":"意思是指单独负责一个方面的工作或任务","exs":["与地勤机械师多人合作的工作形式不同，每趟动车的随车机械师只有一人，必须独当一面，特别是在遇到突发情况的时候。","既有理科的基础，也有工科的动手能力，还能面向交叉领域，视野开阔，独当一面，这正是我们新工科人才的培养目标。","他明显感受到了自己的飞速成长，从一个只会纸上谈兵的职场小白成长到能够独当一面。"]},{"id":456,"w":"纸上谈兵","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"兵：用兵之道。比喻空谈理论，不能解决实际问题。（侧重只有理论而没有行动）","core":"比喻空谈理论，不能解决实际问题","exs":["书生都喜欢纸上谈兵，只说而不去实行。","脱贫攻坚、乡村振兴从来不是“纸上谈兵”，而是深入全国各地，落在了每家每户的生活实处。","搞研究不能“纸上谈兵”，只有真正了解非洲，才能真正做出实事。每到一个国家，我们都坚持“沉下去”，了解当地居民在农业上存在的实际困难与需求。"]},{"id":457,"w":"无根之木","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"意思是比喻没有根据或基础的事物。","core":"意思是比喻没有根据或基础的事物","exs":["技术源于思想，切断思想，技术就沦为无根之木，非死不可。","奋斗不是无根之木、无源之水，只有立根在祖国和人民最需要的地方，青春才能绽放绚丽之花。奋斗也不只是响亮的口号，而是要在做好每一件小事、完成每一项任务、履行每一项职责中见精神、显担当。","正因如此，我们的一切奋斗才不是无水之萍、无根之木，而是有着坚实的群众基础。"]},{"id":458,"w":"坐而论道","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"意思是坐着空谈大道理。指口头说说，不见行动。","core":"意思是坐着空谈大道理","exs":["坚定文化自信不能止步于坐而论道，必须体现在文化自强的行动上。","两会治霾，既要坐而论道，更待起而行之。","党把干部放在各个岗位上是要大家担当干事，决不能坐而论道、光说不练。"]},{"id":459,"w":"水中捞月","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"指在水中捞月亮；比喻去做根本做不到的事情，只能徒劳无功。含贬义。","core":"指在水中捞月亮","exs":["美国人眼里只有自身利益，民进党当局想依靠对美军购从根本上改变台军装备匮乏、军力羸弱的局面，不过是画饼充饥、水中捞月。","目前中国的护士总量严重不足，质量也不高，在这样的前提下，网约护士试点实施起来像是水中捞月一样。","对“正确”育儿方式的追求本身就是水中捞月，那些所谓“过去几个世纪以来主流的育儿方式”实际上并非主流，只不过它们已经历史足够悠久，又重新被现代的人发掘和使用。"]},{"id":460,"w":"画饼充饥","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"画个饼子来解饿。本比喻徒有虚名而于实际无好处。后多用来比喻以空想来安慰自己。","core":"本比喻徒有虚名而于实际无好处","exs":["冲绳国际大学教授前泊博盛表示，虽然日美达成了《日美地位协定》有关环境问题的补充协定，但日方进入美军基地调查需要得到美方许可，同时美方没有义务对日方实地调查要求作出回应，这无异于“画饼充饥”。","如果像有的国家那样政党纷争，只说不做，朝令夕改，再好的蓝图也只是画饼充饥、空中楼阁。中国式现代化进程，是世界和平、正义、进步力量的壮大。","所谓“纸上谈兵”，指的是在纸面上谈论打仗，空谈理论而不解决实际问题。换而言之，就是一种坐而论道、金玉其外、华而不实、画饼充饥的形式主义。"]},{"id":461,"w":"故弄玄虚","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"玄虚：用来掩盖真相，使人迷惑的欺骗手段。故意玩弄花招，迷惑人，欺骗人。","core":"用来掩盖真相，使人迷惑的欺骗手段","exs":["当下，我们也经常能看到，一些文章或讲话辞藻华丽却空洞无物，或是使用晦涩难懂的术语故弄玄虚，看似“高大上”，实则让人如坠云雾，无法准确把握其中的核心思想。","平心而论，那些做人做事的道理，大都没那么高深莫测，只要老老实实去讲，不故弄玄虚、哗众取宠，就难有讲不清、说不明的。","仅通过片段化信息就引导观众“对号入座”，这样的“网络自诊”故弄玄虚、弄虚作假、坑蒙拐骗，为了追逐利益不顾他人心理健康，应尽快予以遏制。"]},{"id":462,"w":"空穴来风","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"穴：洞，指有孔洞便会进风。比喻消息和传闻的产生都是有原因和根据的，现代汉语中多用来指消息和传说毫无根据。","core":"洞，指有孔洞便会进风","exs":["但公众的担忧也并非空穴来风，过量使用食品添加剂确实存在安全隐患。","不可否认，这些“标签梗”的诞生并非空穴来风，确实折射出少数基层干部在履职尽责中存在的不作为、乱作为、假作为等现实问题，为监督干部作风提供了一定的民意参照。","这话绝非空穴来风，而是基于我的实际观察。"]},{"id":463,"w":"天马行空","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"不靠谱的做法","type":"four","expl":"天马：汉武帝对从西域大宛国得到的汗血马的称号；行空：腾空飞行。指天马奔驰于天空，形容才华横溢，气势豪放，不受约束，也形容言论或行为浮躁、不踏实，不着边际。","core":"指天马奔驰于天空，形容才华横溢，气势豪放，不受约束，也形容言论或行为浮躁、不踏实，不着边…","exs":["这些源自青少年创意的实验项目曾在空间站真实环境中实施，充分展现了我国青少年扎实的科学素养与天马行空的想象力。","我们采用了“极繁主义”美学风格，还原梦境的天马行空。","我们要做的，是打开更加广阔的空间，塑造一个既清朗又包容的文化生态，乐见天马行空，欢迎“脑洞大开”。"]},{"id":464,"w":"空中楼阁","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"实现不了","type":"four","expl":"悬在空中的楼阁。比喻崇高通达。后多用来比喻虚构的事物或脱离实际的空想。","core":"比喻崇高通达","exs":["反观今天的中国篮球、足球等大球项目，关注职业联赛的“球评家”遍地，多是空中楼阁、纸上谈兵，真正呕心沥血致力于基层普及和幼苗培养的人寥寥无几。","必须深刻认识到，不注重抓落实，不认真抓好落实，再好的规划和部署都会沦为空中楼阁。","产业发展不是空中楼阁，特别是对特色产业来说，首先必须立足自身条件和优势。新疆乌伦古湖，渔民身穿皮袄、脚踩厚靴，在冰封湖面上凿洞下网，吸引无数游客前来观赏体验。"]},{"id":465,"w":"镜花水月","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"实现不了","type":"four","expl":"镜子里的花，水里的月亮。比喻虚幻的东西。","core":"比喻虚幻的东西","exs":["4K似乎正在沿着3D的足迹，成为看上去很美却让消费者够不到摸不着的镜花水月。","野生动物跟人类在城市共存的话题并不是镜花水月，而是每天都在切实发生。用源自身边的小视角，打开环保叙事的大视野，《一路前行》让观众不自觉地走入到生态保护的语境中。","对于领导干部来说，不谋远，工作就会缺乏预见性和前瞻性，犹如盲人骑瞎马、夜半临深池；不顾近，对当下形势和情况不了解，缺乏善作善为的能力，再好的蓝图也可能成为镜花水月、空中楼阁。"]},{"id":466,"w":"海市蜃楼","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"实现不了","type":"four","expl":"比喻虚无缥缈而不实际存在的事物，也比喻不可企及的虚无的梦想。","core":"比喻虚无缥缈而不实际存在的事物，也比喻不可企及的虚无的梦想","exs":["沈阳雾霾指数为中度污染，市区部分地区如“海市蜃楼”。","奋斗，无需固执于海市蜃楼般空洞的宏伟“字眼”，新时代的广大青年，当以脚步丈量祖国的每一寸土地，感知这个盛世的来之不易；用眼睛发现赓续于血脉中的中国精神，坚定那鲜血与汗水浇灌出的信念。","泉州市区上空被一层薄薄的雾笼罩着，在清源山上往市区看，高高的紫帽山被雾遮挡了一大半，只露出一个山顶，恍若“海市蜃楼”。"]},{"id":467,"w":"天方夜谭","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"实现不了","type":"four","expl":"本义指代《一千零一夜》的故事合集，引申义形容言论内容荒诞夸张、脱离现实。","core":"本义指代《一千零一夜》的故事合集，引申义形容言论内容荒诞夸张、脱离现实","exs":["听起来像是天方夜谭，却折射出中国商业航天产业加速迈向开放融合生态的良好趋势。","在太空轨道上部署计算能力，这个曾被视为“天方夜谭”的构想，已成为各国抢占未来制高点的新赛道。","比如手机，键盘机主导的时代，全屏触摸曾被斥为天方夜谭、毫无必要。"]},{"id":468,"w":"虚无缥缈","part":"c","gn":"三十七","gt":"空谈与虚幻","sub":"实现不了","type":"four","expl":"虚无：指空虚状态；缥缈：表示若有若无的形态。组合后特指难以把握的虚幻景象。","core":"指空虚状态","exs":["屏幕里的一帧一画，不是虚无缥缈的影视虚构，而是朝夕相伴的寻常风景，是双脚丈量过的土地，是融入血脉、刻入骨髓的责任与使命。","在今年的论坛年会上，科技不再是虚无缥缈的概念，而是实实在在地改变着人们的工作与生活。","立大志、明大德、成大才、担大任、干大事，不是虚无缥缈的口号，而是立足岗位、脚踏实地的行动，是将个人价值融入国家发展的自觉。"]},{"id":469,"w":"接踵而至","part":"c","gn":"三十八","gt":"来者众多","sub":"形容到来","type":"four","expl":"意思是指人们前脚跟着后脚，接连不断地来，形容人接连而来或事情持续发生。","core":"意思是指人们前脚跟着后脚，接连不断地来，形容人接连而来或事情持续发生","exs":["这些年来，我们面临的各种风险挑战接踵而至，大仗一个接一个，每一仗都是靠全体人民团结奋斗、顽强斗争闯过来的。","深圳将加快推动体育事业和体育产业高质量发展，品牌赛事、全民健身活动接踵而至，城市活力跃动、生机勃发的景象将全面展开。","一项项流程环环相扣，面对接踵而至的特情，操作号手们在各自战位上快速执行指令、冷静处置故障。该营刘营长说：“对于军人来说，训练须臾不可松懈。”"]},{"id":470,"w":"络绎不绝","part":"c","gn":"三十八","gt":"来者众多","sub":"形容到来","type":"four","expl":"络绎：前后相接、连续不断的样子。形容车船人马等前后相接，往来不断。","core":"形容车船人马等前后相接，往来不断","exs":["每年到了这时候，从全国各地，跋山涉水特意来韶山参观的人都络绎不绝。","莫斯科动物园，前来观赏大熊猫“如意”和“丁丁”的游客络绎不绝。","位于沅江江畔的常德河街历史悠久，惜乎毁于战火。近年来，常德复原老河街风貌，成为重要的文化展示窗口。老街焕发新生，游客络绎不绝。"]},{"id":471,"w":"纷至沓来","part":"c","gn":"三十八","gt":"来者众多","sub":"形容到来","type":"four","expl":"纷：众多。沓：又多又重复。形容连续不断地纷纷到来。","core":"形容连续不断地纷纷到来","exs":["旷日持久的总统选举，致使阿富汗国内局势受到严重影响，诸多挑战纷至沓来。","国庆档之后，各种类型片纷至沓来，令人目不暇接。","世界超市浙江义乌国际商贸城龙年新春开市后，各地客商纷至沓来，洽谈采购小商品，市场人气兴旺，一片繁荣景象。"]},{"id":472,"w":"蜂拥而至","part":"c","gn":"三十八","gt":"来者众多","sub":"形容到来","type":"four","expl":"像一窝蜂似地一拥而来。形容很多人乱哄哄地朝一个地方聚拢。","core":"形容很多人乱哄哄地朝一个地方聚拢","exs":["尽管当时很多村民听不懂汉语对白，每当有电影在村子放映，十里八乡的人依然会蜂拥而至。","位于南京市建邺区的紫金1912·玖悦荟港风夜市，在2023年刚开业时曾一度成为南京最热门的夜市和网红打卡点之一，不仅消费者蜂拥而至，也吸引了“郭阿姨月亮馍”和“朱姐烤苕皮”等众多南京网红摊主入驻。","在加盟店遍布全国300多个城市基础上，现在有意向加盟淮北碳锅的申请更是蜂拥而至。”淮北市碳锅协会负责人任爱全坦言，未来将淮北碳锅推广到五湖四海，他们信心满满。"]},{"id":473,"w":"门庭若市","part":"c","gn":"三十八","gt":"来者众多","sub":"近义辨析","type":"four","expl":"门庭：门口和庭院。若：如，好像。门口和庭院就像集市一样，热闹非凡。形容往来的人很多。","core":"形容往来的人很多","exs":["早上8点，在上海中华路的梦花街馄饨店门口早已门庭若市。","艺术教育普遍存在“两头热中间冷”的问题——在很多地方，少儿艺术教育琳琅满目，老年大学门庭若市，唯独处于中间地带的成年人艺术教育几近空白。","畲乡还经历了从“人迹罕至”到“门庭若市”的蜕变。近年来，当地大力发掘红色文旅、绿色产业、蓝色畲乡的三色资源，举办畲族特色活动，打造国家森林公园、省级森林康养基地，2023年，吸引游客十万余人次。"]},{"id":474,"w":"无人问津","part":"c","gn":"三十八","gt":"来者众多","sub":"近义辨析","type":"four","expl":"津：渡口。没有人来询问渡口。比喻没人过问、受到冷落。（形容某事物受冷落、无人理睬。程度较重）","core":"比喻没人过问、受到冷落","exs":["那些书皮五光十色的侠怪小说，渐渐变得无人问津。","居民对精神文化需求比较强烈，而仅有的一处休闲健身苑点处，部分宣传墙面脱落，休闲座椅破损，个别居民还会在周边乱扔垃圾，久而久之，这里成了无人问津之地。","曾经无人问津的“空心村”，在创业青年、年轻艺术家的改造运营下，成为精致考究的民俗村。"]},{"id":475,"w":"门庭冷落","part":"c","gn":"三十八","gt":"来者众多","sub":"近义辨析","type":"four","expl":"形容十分冷落，宾客稀少。","core":"形容十分冷落，宾客稀少","exs":["门庭冷落、乏人问津，广州4家民俗博物馆的烦恼，想必能寻觅到不少知音。","近来不少仿古镇经营冷淡，这些靠仿造景观售卖高价门票的仿古镇门庭冷落、渐显颓势，一些仿古镇正在被年轻人抛弃。","进入新世纪，国内图书市场生机勃勃，但马克思主义哲学通俗读物却“门庭冷落”。"]},{"id":476,"w":"门可罗雀","part":"c","gn":"三十八","gt":"来者众多","sub":"近义辨析","type":"four","expl":"罗：张网捕捉。大门之前可以张起网来捕麻雀。形容十分冷落，宾客稀少。","core":"形容十分冷落，宾客稀少","exs":["她发现，尽管近年来“博物馆热”成为热门话题，一些大博物馆一票难求成为常态，但是许多中小博物馆仍然存在门可罗雀的情况，当地人看到有外地游客到博物馆参观还会说“还有人到这里？”","作为科技创新的孪生姊妹和创新发展的一体两翼，科普要求通俗易懂，但有些科普文章堪比专业论文，常常让人“丈二和尚摸不着头脑”，部分科普场馆、科普展览高端大气，却往往门可罗雀。","走进复兴集镇的老街，只见昔日门可罗雀的老供销社又恢复了往日“门庭若市”的热闹场景，顾客们争相购物，不一会货架上的商品被一抢而空。“变‘闲’为‘现’，物尽其用。”"]},{"id":477,"w":"人迹罕至","part":"c","gn":"三十八","gt":"来者众多","sub":"近义辨析","type":"four","expl":"罕：少。指偏僻荒凉、少有人到的地方。（侧重偏僻荒凉）","core":"指偏僻荒凉、少有人到的地方","exs":["历史上曾人来人往的丝绸古迹，如今已变成人迹罕至的沙漠。","过去，人们若想目睹全缘叶绿绒蒿的风姿，往往需要长途跋涉，深入高山峻岭之间，在那些人迹罕至的地方，才有机会与它不期而遇。","很多田野文物都在人迹罕至的地方，部分古遗址、古墓葬所处位置甚至无路可达。"]},{"id":478,"w":"不期而遇","part":"c","gn":"三十八","gt":"来者众多","sub":"偶遇","type":"four","expl":"没约定而意外相遇。","core":"没约定而意外相遇","exs":["广大青年不仅是现在的生力军，也是未来的主力军。同向同心，当代青年与最鲜明的时代主题不期而遇。对当代青年来说，这是最大的人生际遇，也是最大的人生考验。","相比吴贺玲母子的满怀遗憾，来自滦县榛子镇的李震云姐妹则在心里庆幸同习近平总书记的不期而遇。","扎根人民，才能和正能量不期而遇。"]},{"id":479,"w":"不期而至","part":"c","gn":"三十八","gt":"来者众多","sub":"偶遇","type":"four","expl":"指事先没有约定而意外到来，没有预料地到来。","core":"指事先没有约定而意外到来，没有预料地到来","exs":["面对不期而至的螃蟹卡，很多人都忍不住想打开看一看，稍不留神就可能一步步落入骗子精心设置的圈套。","那些“不期而至”的过敏性皮肤病。"]},{"id":480,"w":"萍水相逢","part":"c","gn":"三十八","gt":"来者众多","sub":"偶遇","type":"four","expl":"比喻从不认识的人偶然相遇。","core":"比喻从不认识的人偶然相遇","exs":["我所衷心敬佩的人，不是那种什么事都可以找兄弟帮忙、仿佛大半个中国都有他哥们的人，而是那种跟所有萍水相逢的人都友善宽和、时时都在传播着正能量的人。","这些年，浙江小百花越剧团深入基层演出时，在当地引发了热烈反响；出国交流时，收获了外国友人热烈的掌声和喝彩。我时常能在观众席看到一些熟悉的面孔，有一些观众不远万里赶来看一场戏；有的观众，愿意自己花钱，请萍水相逢的学生戏迷看戏。","《爱的教育》中，把爱比成很多东西，的确是这样，又不仅仅是这些。我想，“爱是什么？”不会有明确的答案，但我明白，“爱”是没有限制的。同学之间的友好交谈，老师对学生的鼓励，父母对孩子无微不至地关爱，甚至萍水相逢的人们的一个微笑……"]},{"id":481,"w":"如影随形","part":"c","gn":"三十八","gt":"来者众多","sub":"偶遇","type":"four","expl":"好像影子总是跟着身体一样。比喻两个人关系亲密，常在一起。","core":"比喻两个人关系亲密，常在一起","exs":["监督和约束如同行驶中的安全带和登山时的防护索，是一种对党员干部如影随形的爱护。","然而，随着网络市场的迅速扩张，不正当竞争行为也如影随形，出现了利用数据、算法、平台规则以及网络技术实施的不正当竞争行为。山寨模仿、虚假宣传、网络黑公关等行为严重扰乱了市场竞争秩序，影响了市场公平交易。","税助发展之“安心服务”2023年2月份园区开工建设以来，税务部门工作团队一直如影随形，我们一期工程成功引进了9家航空配套制造企业，其中2家已经投产。"]},{"id":482,"w":"熙熙攘攘","part":"c","gn":"三十九","gt":"人多人少","sub":"近义辨析","type":"four","expl":"熙熙：和乐的样子。攘攘：乱纷纷的样子。形容人来人往，纷杂拥挤。","core":"形容人来人往，纷杂拥挤","exs":["集市上熙熙攘攘，热闹非凡。","夜晚的上海更是别有一番风味。灯火辉煌的高楼大厦、熙熙攘攘的人群，构成了一幅繁华的都市画卷。","熙熙攘攘的游客穿梭在林间小道，听花语、拍花照、晒花照，享受着这山间的春日美景。"]},{"id":483,"w":"人山人海","part":"c","gn":"三十九","gt":"人多人少","sub":"近义辨析","type":"four","expl":"形容聚集的人非常多。","core":"形容聚集的人非常多","exs":["习近平抵达黎明大街路口，换乘敞篷车，与金正恩同车前往锦绣山太阳宫广场。街道两旁，人山人海，盛况空前。","一个人拥有自信，我们便可以在他的身上感受到人格魅力的光芒，纵使在人山人海之中，也可以一眼领略他的光彩。","近年来，假日旅游“热辣滚烫”，休闲街区人山人海，“网红”景点层出不穷，文化游、红色游、研学游、非遗游等越来越热，不断丰富着文旅新业态、新模式，成为我国旅游发展的亮丽风景。"]},{"id":484,"w":"车水马龙","part":"c","gn":"三十九","gt":"人多人少","sub":"近义辨析","type":"four","expl":"车像流水，马如游龙。形容车马来来往往的热闹景象。同“马龙车水”。","core":"形容车马来来往往的热闹景象","exs":["这座沿海城市自从被列为经济开发区之后，一时华盖云集，车水马龙，一派繁忙景象。","冬日的天津，道路两旁灯笼高挂，大街小巷车水马龙。","大街上车水马龙、人来人往，这座城市正逐渐恢复到喧嚣热闹的场景。"]},{"id":485,"w":"川流不息","part":"c","gn":"三十九","gt":"人多人少","sub":"近义辨析","type":"four","expl":"形容行人、车马很多，像水流一样连续不断。","core":"形容行人、车马很多，像水流一样连续不断","exs":["历史川流不息，精神代代相传。","时间之河川流不息，每一代青年都有自己的际遇和舞台。","这是绵延万里的时代机遇。追赶机遇、把握机遇，热火朝天的工地、川流不息的车站，还有一座桥的修建、一条铁路的改造……面貌日新月异。"]},{"id":486,"w":"万人空巷","part":"c","gn":"三十九","gt":"人多人少","sub":"近义辨析","type":"four","expl":"空巷：街道里弄里的人全部走空。指家家户户的人都从巷里出来了。多形容庆祝、欢迎等盛况。","core":"指家家户户的人都从巷里出来了","exs":["1974年，北京电影制片厂译制的影片《瓦尔特保卫萨拉热窝》放映，万人空巷。一年后，又一部南斯拉夫影片《桥》在中国上映，其主题曲《啊，朋友再见》即便今天的00后也耳熟能详。","2024年6月6日—10日，2024中国·皖美山水暨第四届长三角体育节、中国·桃花潭第十一届龙舟赛在泾县桃花潭精彩上演，营造了万人空巷的场景，活动吸引了数万名游客前来观看和体验。","武契奇总统再一次回忆起2016年习近平主席到访钢厂时，万人空巷的盛况：“我永远不会忘记您对斯梅戴雷沃钢厂职工发表的讲话。”“看到他们的期盼、友好，看到他们淳朴地去讲述愿望，我当时也是深受感动。”"]},{"id":487,"w":"孑然一身","part":"c","gn":"三十九","gt":"人多人少","sub":"形容孤独","type":"four","expl":"孑然：孤单的样子。指孤身一人。（常用褒义，形容追寻事业或理想）","core":"指孤身一人","exs":["李桓英一生孑然一身，把毕生的精力都献给了麻防事业，在国内外麻风病防治领域取得了常人难以超越的成绩，赢得了国内外学术界的高度评价。","他离家几十年了，仍然是孑然一身，两手空空。","我在世上，如同天空的弯月，孑然一身，但是我却不能把任何东西照亮。"]},{"id":488,"w":"茕茕孑立","part":"c","gn":"三十九","gt":"人多人少","sub":"形容孤独","type":"four","expl":"茕茕：孤单，无依靠。孑立：孤立。形容一个人孤苦伶仃，无依无靠。","core":"形容一个人孤苦伶仃，无依无靠","exs":["在恢宏的历史主旋律之外茕茕孑立、喃喃自语，只能被淘汰和淹没。","人们在这里一边品味咖啡，一边观看展览，还有不少市民带着家人来这里感受一周一次的非遗课堂……曾经茕茕孑立的老建筑，如今内里满是欢声笑语。","在所有富裕国家中，有一个国家茕茕孑立，在4个月内反复遭受严重且不间断的暴发。这个国家就是美国。"]},{"id":489,"w":"形影相吊","part":"c","gn":"三十九","gt":"人多人少","sub":"形容孤独","type":"four","expl":"吊：慰问。只有自己的身体和影子相互慰问。形容无依无靠，非常孤单。","core":"形容无依无靠，非常孤单","exs":["在通往胜利的道路上，选手们茕茕孑立、形影相吊，而在王者之巅，他们更是独孤求败、高处不胜寒。","小山从小没了父母，一个人形影相吊，生活得很艰难。","这位老人，没有子女，没有至亲，落得茕茕孑立，形影相吊。"]},{"id":490,"w":"形单影只","part":"c","gn":"三十九","gt":"人多人少","sub":"形容孤独","type":"four","expl":"只：指单独。形容孤独，没有伴侣。","core":"指单独","exs":["作为世界第三大老龄化国家，德国1/4人口超过60岁，却只有8%的老人与子女共同生活，三代同堂的比例仅为1%，独居老人比例高达40%，形单影只的老人随处可见。","从最初的形单影只，到如今村民自发加入护林队伍；从零星的防火标语，到整片林区的生态自觉，冯再华用行动点亮了众人心中的绿色明灯。","除夕夜里，万绿园迎来了不少市民游客参观，人来人往中，一个形单影只的男孩引起了民警王明的注意。"]},{"id":491,"w":"参差不齐","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"参差：高低、长短、大小不齐的样子。形容不一致、有差别。（多搭配水平、质量、进展等）","core":"形容不一致、有差别","exs":["记者发现，虽说众多政府机构和部门都已开通了微博，但政务微博的运营情况良莠不齐，影响力参差不齐。","目前，宣称可用于儿童的化妆品琳琅满目，但质量安全水平参差不齐。","测评方法和标准五花八门，测评质量参差不齐，有的涉嫌“以商养测”及“以测养商”。"]},{"id":492,"w":"泥沙俱下","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"俱：都。泥土和沙子一同随水冲了下来。比喻人或事物好坏混杂在一起。（侧重量大且好坏都有）","core":"比喻人或事物好坏混杂在一起","exs":["鼓励内容创业的百花齐放，不等于支持内容市场的泥沙俱下。内容创业者在时代风口上受益，就应该为自己的影响力负责。","站在新的历史起点上，我们面对的问题更加错综复杂，同时各种思潮、观点不断涌现、泥沙俱下。","面对纷繁多变、鱼龙混杂、泥沙俱下的社会现象，面对学业、情感、职业选择等多方面的考量，一时有些疑惑、彷徨、失落，是正常的人生经历。"]},{"id":493,"w":"良莠不齐","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"莠：狗尾草，比喻坏人。指好人、坏人混在一起。同“良莠不一”。（现在用法不只形容人，也可形容事物）","core":"狗尾草，比喻坏人","exs":["目前，处在发展初期的微短剧内容良莠不齐，在带来大流量的同时，也存在剧情套路化、部分内容低俗化的问题。","随着留学之风愈刮愈烈，留学生队伍也更显良莠不齐。有相当一批小留学生，甚至是在中国高考落榜的情况下出国的。","政府应该重视专业人才的培养，夏令营负责人必须能对活动设计、组织、实施的全过程进行足够的专业性规划，否则很难治理目前夏令营市场中良莠不齐的现象。"]},{"id":494,"w":"鱼龙混杂","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"比喻坏人和好人混在一起。同“龙蛇混杂”。（现在用法不只形容人，也可形容事物）","core":"比喻坏人和好人混在一起","exs":["以前的艺术批评，地位非常高，也很自律；现在的批评界则是鱼龙混杂、门槛太低。","市场火爆、利润丰厚，但当前整个行业显然呈现出野蛮生长的状态，真正有经验的规划师明显供不应求，从业人员鱼龙混杂、服务水平参差不齐。","在利益驱动下，越来越多人“入局”医疗美容特别是“轻医美”行业，但其中不乏无资质人员鱼龙混杂。"]},{"id":495,"w":"鱼目混珠","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"用鱼眼睛假冒珍珠。比喻以假乱真。（也可指以次充好）","core":"比喻以假乱真","exs":["近年来，中药材市场价格不断上涨，少数不法分子铤而走险：用染色的玉米须冒充藏红花；用苹果皮代替牡丹片，甚至用萃取后的药渣“鱼目混珠”，让消费者防不胜防。","选人用人应坚持正确导向，激扬浊清，褒优戒劣，谨防各种投机分子、官场油子、蜕化变质分子混入地方各级领导班子。尤其是对那种肆意妄为、横冲直闯的“三敢干部”，应引起高度警惕，谨防他们鱼目混珠、招摇过市、带病提拔、高调“入阁”。","有些博主发布的内容真假难辨，质量良莠不齐，甚至有鱼目混珠、恶意误导之嫌。"]},{"id":496,"w":"滥竽充数","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"滥：失实，不真实。竽：一种簧管乐器。比喻没有真实本领的人，混在行家队伍里充数。也比喻以次充好。（可用于自谦）","core":"比喻没有真实本领的人，混在行家队伍里充数","exs":["教学是一个综合性的技能，没有专业资格证的人代表水平达不到，一旦遇到外籍教师中的滥竽充数者，学生很难获得高质量教学成果。","文具盲盒和其他盲盒一样，已经形成了热潮，但要警惕三无产品滥竽充数。","打造经久不衰的国货“潮品”，要有文化传承的定力，避免一哄而上的冲动；要引领和创造新需求，避免空有符号没有内涵；要有对传统文化的敬畏，避免滥竽充数。"]},{"id":497,"w":"买椟还珠","part":"c","gn":"四十","gt":"好坏掺杂","sub":"好坏都有","type":"four","expl":"椟：木匣子。还：退还。比喻没有眼光，不识货，取舍失当。","core":"比喻没有眼光，不识货，取舍失当","exs":["很多消费者有这样的经历：花高价购买包装精美的产品，拆开“里三层外三层”的包装，商品本身没多少价值。有人认为，过度包装是现代的“买椟还珠”。","买椟还珠式的包装与茶文化尚俭的意蕴背道而驰，与绿色低碳的新发展理念格格不入。","据报道，有消费者为“求娃”购买“代吃”服务，雇人代买代吃套餐获得盲盒，上演了“买椟还珠”的快餐版。"]},{"id":498,"w":"蔚然成风","part":"c","gn":"四十一","gt":"流行与名声","sub":"流行","type":"four","expl":"蔚然：草木茂盛的样子。形容一种事物逐渐发展流行，形成风气。（多含褒义）","core":"形容一种事物逐渐发展流行，形成风气","exs":["要在全社会积极营造鼓励大胆创新、勇于创新、包容创新的良好氛围，既要重视成功，更要宽容失败，真正让创新在全社会蔚然成风。","一场场读书会的举办，使全民阅读活动逐渐形成品牌效应，边城书香氛围日益浓厚，全民阅读蔚然成风。","让每个人都成为绿色低碳理念的传播者和绿色低碳生活方式的践行者，以生活方式的绿色革命促进生产方式的绿色转型，让绿色低碳蔚然成风。"]},{"id":499,"w":"风靡一时","part":"c","gn":"四十一","gt":"流行与名声","sub":"流行","type":"four","expl":"靡：倒下。风靡：风一吹，就随之倒下。形容某一种事物在一个时期内非常流行。（中性）","core":"形容某一种事物在一个时期内非常流行","exs":["当然，“经典化”的过程难免泥沙俱下，大部分风靡一时的流行读物都成了泥沙。","风靡一时的“四大名旦”，标榜着嘉兴制造业昨日的灿烂，承载着嘉兴制造业昔日之荣光，见证了改革开放后嘉兴轻工业的活跃与繁荣，是属于嘉兴特有的时代符号。","《说文别字》曾经是晋江市电视台风靡一时的方言节目。"]},{"id":500,"w":"如雷贯耳","part":"c","gn":"四十一","gt":"流行与名声","sub":"名声大","type":"four","expl":"形容人的名声很大。","core":"形容人的名声很大","exs":["肖飞的大名在敌占区里已如雷贯耳。","会议表示，全省审计机关将提升站位，狠抓落实，进一步强化政治建设、业务建设、能力建设、廉政建设，坚决做到“如臂使指、如影随形、如雷贯耳”，打造经济监督“特种部队”，全力推进新时代湖北审计高质量发展。","这些大作家的名字可谓如雷贯耳，相信很多人熟知。"]},{"id":501,"w":"炙手可热","part":"c","gn":"四十一","gt":"流行与名声","sub":"名声大","type":"four","expl":"炙：烤。手一靠近就感觉很烫，比喻气焰盛，权势大。","core":"手一靠近就感觉很烫，比喻气焰盛，权势大","exs":["如果他长袖善舞，广为接纳，也可以成为翻云覆雨炙手可热的好汉。","据介绍，邮轮游是今年春季炙手可热的旅游产品之一。","在吉林省松原市前郭县，冰天雪地的“冷资源”撬动了炙手可热的“热经济”。"]},{"id":502,"w":"名噪一时","part":"c","gn":"四十一","gt":"流行与名声","sub":"名声大","type":"four","expl":"意思是一时名声很大。指名声传扬于一个时期。","core":"意思是一时名声很大","exs":["这个名噪一时的社会事件引发了全国范围内对相关问题的关注和讨论。","金华是南宋浙学中心之一，吕祖谦作为宋代浙学的主要代表人物，其所创建的丽泽书院，见证了婺学发展的兴盛，是名噪一时的学术圣地。","2009年，为拍摄新版《水浒传》而建造的影视城曾名噪一时。"]},{"id":503,"w":"闻名遐迩","part":"c","gn":"四十一","gt":"流行与名声","sub":"名声大","type":"four","expl":"形容名声很大，主要指远近闻名。","core":"形容名声很大，主要指远近闻名","exs":["这座海岛因其美丽的海滩和清澈的海水而闻名遐迩，是一个度假胜地。","扬州国庆路得胜桥，富春茶社闻名遐迩，名人趣闻轶事数不胜数。","如今的仙坪村不仅是全国知名的“炎陵黄桃”四大主产区之一，更是闻名遐迩的“水果之乡”。"]},{"id":504,"w":"声名显赫","part":"c","gn":"四十一","gt":"流行与名声","sub":"名声大","type":"four","expl":"表示人的声望或事物的影响力极其盛大。","core":"表示人的声望或事物的影响力极其盛大","exs":["从大与小的角度来看，无论是声名显赫的大企业，还是名不见经传的小企业，都可能成为创新的重要力量。","兰花在中国的花界，声名显赫。","人工智能也声名显赫，应用普遍。"]},{"id":505,"w":"靡然成风","part":"c","gn":"四十一","gt":"流行与名声","sub":"近义辨析","type":"four","expl":"指相互跟风，群起效尤而成风气，贬义词，多指不好的风气。","core":"指相互跟风，群起效尤而成风气，贬义词，多指不好的风气","exs":["随着电子产品的普及，“机不离手”“眼不离屏”靡然成风，如何应对由此带来的潜在健康危害？","集团原领导班子主要成员官僚主义严重，带头搞特权讲排场，作风建设流于形式，系统上下请客送礼、奢靡浪费、拉帮结派等靡然成风。","有关部门的多次严格执法，为整个行业敲响警钟：偷税漏税行为是否在直播行业中靡然成风？"]},{"id":506,"w":"大行其道","part":"c","gn":"四十一","gt":"流行与名声","sub":"近义辨析","type":"four","expl":"新潮事物流行成为一种风尚。（中性，多贬义）","core":"新潮事物流行成为一种风尚","exs":["“洁厕块致癌”谣言何以大行其道？","金庸小说在越南大行其道。","如果放任生鲜灯大行其道，就是对消费者不负责任，就是无视市场监管总局下发的禁令。"]},{"id":507,"w":"甚嚣尘上","part":"c","gn":"四十一","gt":"流行与名声","sub":"近义辨析","type":"four","expl":"甚：很。嚣：喧闹。尘上：尘土飞扬。形容对某事议论纷纷。（中性词，多贬义）","core":"形容对某事议论纷纷","exs":["近几年，猪肉相关谣言甚嚣尘上，部分谣言在网络上仍“余威未减”。","近年来，单边主义、保护主义甚嚣尘上，世贸组织改革举步维艰，经济全球化遭遇重重挑战，世界经济复苏乏力。"]},{"id":508,"w":"声名鹊起","part":"c","gn":"四十一","gt":"流行与名声","sub":"突然出名","type":"four","expl":"鹊起：喻指名声大作。形容名声迅速提高。","core":"喻指名声大作","exs":["在经过很多年的努力以后，他突然声名鹊起，成为人人都知道的人物。","从一粒种子到一个产业，从无人问津到声名鹊起。","在行业内，慈溪常常被称为“家电之都”，当地上百家取暖器生产企业，出口量占全国的近三分之一，许多当地品牌在欧洲已渐渐声名鹊起。"]},{"id":509,"w":"名声大噪","part":"c","gn":"四十一","gt":"流行与名声","sub":"突然出名","type":"four","expl":"名声广泛地传播开去。噪：传扬。","core":"名声广泛地传播开去","exs":["柳敬亭也很久以前，就名声大噪，成了江南艺坛的一位领袖。","因苏轼被贬于此并写下名篇而名声大噪的黄州赤壁。","境内阿尔沟、萝卜寨、赵公山等秘境，因黄泥羌寨、日出、云海等奇观而名声大噪。"]},{"id":510,"w":"趋之若鹜","part":"c","gn":"四十一","gt":"流行与名声","sub":"突然出名","type":"four","expl":"鹜：鸭子。像鸭子一样成群地跑过去。比喻很多人争相追逐、趋附。含贬义。（现在有时非贬义）","core":"比喻很多人争相追逐、趋附","exs":["年轻人在面对公务员这个“金饭碗”之时，到底是应该趋之若鹜，还是理性回归？","通过北京车展，可以看到中国巨大的市场，中国的购买者对新车的趋之若鹜。","当经济发展提档升级呼唤新动力，当“低垂的果实”不再触手可及，创投圈不再对模式创新和平台经济趋之若鹜时，十年磨一剑的科技密集型、知识密集型创业成为时下的“流行”。"]},{"id":511,"w":"以讹传讹","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"把本来就不正确的话又错误地传出去，结果越传越错。","core":"把本来就不正确的话又错误地传出去，结果越传越错","exs":["但志书存世较少，虽经国家图书馆出版社影印出版，仍难济众需，加之本志的错讹以及引用者的以讹传讹，使许多历史资料乌焉成马，给人们带来诸多不便。","日方一些人发表不负责任的言论，要么是主观臆断、以讹传讹，要么是无视事实、别有用心。","希望岛内同胞特别是青年朋友们与其偏听偏信、以讹传讹，不如亲身来大陆走走看看，找寻答案。答案肯定五花八门，但最基本也最有普遍性的是“不一样”，就是大陆与“台独”势力、绿媒名嘴所说的“不一样”。"]},{"id":512,"w":"无孔不入","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"比喻见空子就钻；利用一切漏洞或机会（多指做坏事）。","core":"比喻见空子就钻","exs":["信息泄露现象严重！垃圾短信定向投放无孔不入，相关产业链已形成。","由于乱张贴者无孔不入，包括围墙、电线杆、公交站台、邮筒、天桥甚至路面等许多城市公用设施都被张贴得面目全非。","当手机中碎片化、娱乐性、缺乏逻辑性的信息无孔不入地侵入我们的生活时，我们的心理也发生了微妙的变化。这使我们越来越难以集中注意力，记忆力越来越差，越来越难以入眠，进而变得越来越焦虑和自我怀疑。"]},{"id":513,"w":"铺天盖地","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"形容来势猛，声势大，到处都是。","core":"形容来势猛，声势大，到处都是","exs":["俄罗斯期盼已久。这些日子，媒体上铺天盖地满是“如意”“丁丁”两个名字。一个多月前，它们从四川雅安碧峰峡长途跋涉，飞至莫斯科，落户“能够看雪景”的新家。","优秀作品并不拘于一格、不形于一态、不定于一尊，既要有阳春白雪、也要有下里巴人，既要顶天立地、也要铺天盖地。只要有正能量、有感染力，能够温润心灵、启迪心智，传得开、留得下，为人民群众所喜爱，这就是优秀作品。","处在工业文明时代，形形色色的物品铺天盖地向我们涌来，“断舍离”是人们对于塞满货架的商品做出的无能为力的消极抵抗。"]},{"id":514,"w":"道听途说","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"途：道路。在路上听来的话，又在路上向人传播。指没有根据的传言。","core":"指没有根据的传言","exs":["要坚持用事实说话、以理服人：不捕风捉影、道听途说，不说无事实依据的话、不做不负责任的事。","杜绝虚假报道，抵制有偿新闻，不凭道听途说或主观臆断采写新闻，不为追求轰动效应扭曲新闻事实，弘扬真善美，贬斥假恶丑，推动形成积极向上的良好社会氛围。讲“四力”，守正气，发扬优良作风。","重庆市药品监督管理局推出安全用药系列科普短视频第九期“药到病‘出’”，视频通过“真人演绎”的形式详细讲解了患者道听途说，模仿他人的错误用药观念，普及了相关安全用药常识。"]},{"id":515,"w":"街谈巷议","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"指人们在街头巷尾闲谈议论。也指街头巷尾人们的议论。","core":"指人们在街头巷尾闲谈议论","exs":["腊月渐近，人们对每年央视春晚的期许，从采购年货的当口开始，随归乡的旅程延伸，街谈巷议、交口不绝，渲染出一派馥郁喧腾的年味。","“治大国如烹小鲜”，习近平主席借用老子《道德经》里的一句话，说明治国理政的态度；以“盲人摸象”的寓言，说明中国之大、问题之复杂，需要全面了解情况。这些话不胫而走，在街谈巷议和网络空间中流传。","岁终年末，一份份挂历成为徐州市贾汪区百姓街谈巷议的话题；一个个榜样人物成为大家眼中的闪亮“明星”。原来，元旦前夕，贾汪区为当地百姓免费发放一份特殊的新年礼物——“贾汪正能量身边好榜样”挂历。"]},{"id":516,"w":"稗官野史","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"不同的传播方式","type":"four","expl":"稗官：古代专门给帝王讲述街谈巷议、风俗故事的小官，后作为小说的代称。野史：私家记载的逸闻琐事之作。后用来称小说及不见经传的逸闻琐事的著述。","core":"古代专门给帝王讲述街谈巷议、风俗故事的小官，后作为小说的代称","exs":["让读者印象深刻的是，作者如一位考古学家，对大量的历史文本、断烂朝报、稗官野史进行考据，由此呈现了历史上影响人们生活的具体器物，以及这背后的生活方式和人的活动。","除了读这些大部头的史籍之外，毛主席还读了大量的稗官野史、各种历史通俗演义、笔记小说、札记、随笔等才形成了这样独有的看法。","文史经典、世俗小说在《华英字典》中，除了被尊奉在庙堂之上的经史子集，不登大雅之堂的稗官野史也跃入了马礼逊的眼帘。"]},{"id":517,"w":"脍炙人口","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"传播广泛或深入","type":"four","expl":"脍：切得很细的肉。炙：烤熟的肉。美味的食品人人爱吃。比喻好的诗文或事物为众人所喜爱和传诵。","core":"比喻好的诗文或事物为众人所喜爱和传诵","exs":["众所周知，若就系列影片的整体票房而言，院线殿堂的王座应属《哈利·波特》《指环王》等脍炙人口的长篇系列。","曲目单中既有《北京喜讯到边寨》、江苏民歌《茉莉花》《在那遥远的地方》等脍炙人口的中国作品，同样也包含了《阿莱城姑娘》《今夜无人入睡》《波莱罗舞曲》等大家耳熟能详的西方交响乐名曲。","追忆党的百年辉煌征程，从井冈山到瑞金，从遵义到延安，从西柏坡到北京，一路唱响“三大纪律八项注意”，这首脍炙人口的歌曲成了中国人民解放军从一个胜利走向另一个胜利的“法宝”，个个牢记，代代相传，久唱不衰。"]},{"id":518,"w":"津津乐道","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"传播广泛或深入","type":"four","expl":"指很有兴趣地谈论。","core":"指很有兴趣地谈论","exs":["如果历史观错误，不仅达不到学习教育的目的，反倒会南辕北辙、走入误区。现在，一些错误倾向要引起警惕：有的夸大党史上的失误和曲折，肆意抹黑歪曲党的历史、攻击党的领导；有的将党史事件同现实问题刻意勾连、恶意炒作；有的不信正史信野史，将党史庸俗化、娱乐化，热衷传播八卦轶闻，对非法境外出版物津津乐道，等等。","习近平在包子铺内吃了一顿21元的便餐。点餐时，他坚持排队，亲自拿钱在点餐台和其他顾客一起点餐取餐。排队时，他还跟其他顾客亲切地说着话，聊着家常。“那种感觉好像是在街头遇见了老朋友一样。”现场一位顾客如是回忆。这无疑是一个标志，至今仍为民众所津津乐道。","现在“有矛盾来‘法治小院’，咨询法律知识来‘法治小院’”已经成为韩庄村村民津津乐道的话题，大小矛盾纠纷在乡贤们用拉家常的方式进行评理说事后，用喝杯下午茶的时间就予以解决，村民法治观念逐渐增强，村风民气大为改观。"]},{"id":519,"w":"喜闻乐见","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"传播广泛或深入","type":"four","expl":"意思是喜欢听，乐意看。形容很受欢迎。","core":"意思是喜欢听，乐意看","exs":["希望你们继续发扬科学报国的光荣传统，带动更多科技工作者支持和参与科普事业，以优质丰富的内容和喜闻乐见的形式，激发青少年崇尚科学、探索未知的兴趣，促进全民科学素质的提高，为实现高水平科技自立自强、推进中国式现代化不断作出新贡献。","要注意宣传群众、教育群众，用群众喜闻乐见、易于接受的方法开展工作，提高群众思想觉悟，让他们心热起来、行动起来。","活动通过定点搭设谜台，定期开展谜会，用“小谜台”讲好“大主题”，用“乡土话”讲好“大政策”，以群众喜闻乐见、雅俗共赏的灯谜形式，让广大职工群众在寓教于乐中凝聚起推动“百千万工程”的强大合力。"]},{"id":520,"w":"深入人心","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"传播广泛或深入","type":"four","expl":"指思想、理论等广泛地得到人们的理解和接受。","core":"指思想、理论等广泛地得到人们的理解和接受","exs":["各国政府、国际组织、重要金融机构以及大型跨国公司积极响应，充分说明“一带一路”倡议对世界稳定和发展的重要意义已深入人心。","在全媒体时代，我们只有充分利用新技术新手段，让普法内容呈现更生动更立体，才能变“单向输出”为“双向奔赴”，让法治理念深入人心。法律的生命力在于实施，厉行法治是最好的普法方式。","无论是设计富有创意的教育课程，还是引导学生参与社会实践，还是在课堂内外与学生深入交流，他们都倾注了极大心血，努力让思想政治教育更加深入人心。"]},{"id":521,"w":"三人成虎","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"谣言的误导效应","type":"four","expl":"比喻说的人多了，就能使人们把谣言当作事实。","core":"比喻说的人多了，就能使人们把谣言当作事实","exs":["在以讹传讹、“三人成虎”效应下，一些不靠谱的论调居然甚嚣尘上，严重扰乱社会视听。","拒绝“三人成虎”，更要谨记“不信谣，不传谣”。","“三人成虎”，当谣言“病毒”在暗处滋生、发酵，产生的破坏力不亚于一场飓风。"]},{"id":522,"w":"众口铄金","part":"c","gn":"四十二","gt":"与传播、传闻相关","sub":"谣言的误导效应","type":"four","expl":"铄：熔化金属。原指众人的言论能使金属熔化，后比喻舆论力量强大或流言积累可混淆是非。","core":"原指众人的言论能使金属熔化，后比喻舆论力量强大或流言积累可混淆是非","exs":["社交网络是当下大多数人的日常必需品，网络暴力带来的伤害集中、直接、实时，许多受害者在“众口铄金，积毁销骨”中百口难辩，或是想辩解找不到施暴者。","众口铄金，三人成虎。上述事件或因为纠纷小事无端造谣对当事人造成伤害，或编造事剧本非法引流，污染网络环境，对社会产生负面影响。","只有保持清醒的头脑，方能分清是非，就算众口铄金，也敌不过“谣言止于智者”。"]},{"id":523,"w":"烟消云散","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"比喻事物全部消失。同“烟消雾散”。","core":"比喻事物全部消失","exs":["在流了这么多的眼泪以后，这许多日子来的阴郁的思想都烟消云散了。","“漫步迭部，触摸历史文化的神奇与厚重，采撷民俗文化的神妙与芬芳，感悟红色文化的神圣与光辉，一切喧嚣和浮躁终将烟消云散，沉淀下来的唯有豁达的胸怀、纯洁的灵魂，以及繁华落尽时内心的温暖与宁静。”","党员、干部交友应慎之又慎，千万不要高估自己的定力、迷信自己的能力，一旦在真假难辨的赞美中迷失自我，在投其所好的拉拢面前放松警惕，上进心和克己心就会随之烟消云散，最终滑向明知故犯、知法犯法的深渊。"]},{"id":524,"w":"灰飞烟灭","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"比喻人或事物迅即消失。","core":"比喻人或事物迅即消失","exs":["曾让全世界瞩目的日本海军，为何三年多就灰飞烟灭？","抗联遗址都是土质遗迹，面临水蚀、冻融、风化等风险，如直接露天展示，很可能十年、二十年后就会灰飞烟灭。为做好抗联文物保护，吉林省从立法层面强力推进相应工作。","红军打一仗，胜一仗，攻城拔寨，无坚不摧，如风卷残云般横扫700里，歼敌3万余人，缴枪2万余支，使国民党对中央苏区的第二次“围剿”灰飞烟灭。"]},{"id":525,"w":"化为乌有","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"乌有：虚幻，不存在。指变得什么都没有。","core":"指变得什么都没有","exs":["她不甘愿看到这么好的创意泡汤，不愿意团队这么久的努力化为乌有。","在科技产业中，知识产权被剽窃是最让人头疼的问题之一，一项投入大量人力和资本研发出的技术成果，一旦被别人剽窃，足以让投入和预期收益化为乌有。","报告警告，加沙战事将导致巴勒斯坦人类发展指数大幅下降，视加沙战事激烈程度，巴勒斯坦11年到16年的发展成果将化为乌有。"]},{"id":526,"w":"子虚乌有","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"指假设的、不存在的事情。","core":"指假设的、不存在的事情","exs":["国内食品专家也指出，“十大垃圾食品名单”纯属子虚乌有。","美方对中国的指责纯系捕风捉影、子虚乌有。","一段时间以来，一部分西方势力编造、炒作子虚乌有的谎言，大肆捏造新疆棉花生产存在所谓“强迫劳动”，其本质不过是在借人权之名破坏新疆繁荣稳定。"]},{"id":527,"w":"稍纵即逝","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"纵：放松。逝：消失。稍微一放松就消失了。形容时间或机会很容易失掉。","core":"形容时间或机会很容易失掉","exs":["机遇千载难逢，机遇稍纵即逝，机遇不仅是“机”更是“遇”，抓住了、用好了，才不负时代的馈赠、历史的青睐。","坦克要在规定时间内通过多个险难路段，并穿插完成对多个固定目标和运动目标的射击，战机稍纵即逝。","他也是摄影爱好者，把保护区内珍稀动植物那些鲜为人知、稍纵即逝的画面一一定格在镜头下。多年来，从拍摄到守护，他与华南梅花鹿结下不解之缘。"]},{"id":528,"w":"昙花一现","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"比喻人或事物存在的时间很短，刚一出现就迅速消失了。","core":"比喻人或事物存在的时间很短，刚一出现就迅速消失了","exs":["像昙花一现地，这部影片只映了两天，便永远在我国人眼前消失了。","只有“微”而不弱、“短”而不浅、“剧”有品质，微短剧才能告别“昙花一现”，迎来“下一个春天”。","各国应加强对科创市场的监管，优化市场交易秩序，寻找更符合行业标准的估值方法。只有这样，科创企业才不会昙花一现，才能真正为世界经济复苏提供助力。"]},{"id":529,"w":"销声匿迹","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"销声：消除声音。匿迹：隐匿踪迹。指隐藏起来或不公开露面。同“消声匿迹”“匿迹销声”。","core":"指隐藏起来或不公开露面","exs":["一个曾经繁华一时的西域重镇，在此后的1500多年里再次销声匿迹。","一切有违奥林匹克精神的政治操弄都将销声匿迹，象征和平友爱的奥运火种一定会在“鸟巢”熊熊燃烧。","该镇村民通过“护农驿站”举报线索，镇纪委受理、调查、办结，很快找回“销声匿迹”的补偿款，充分展示“护农驿站”让监督无处不在的震慑力，得到村民群众的一致好评。"]},{"id":530,"w":"偃旗息鼓","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失或失去","type":"four","expl":"偃：放倒。息：停息。放倒旗帜，停止击鼓，指军队为不暴露目标而隐蔽行动或停止作战。后也比喻事情中止。也作“掩旗息鼓”。","core":"放倒旗帜，停止击鼓，指军队为不暴露目标而隐蔽行动或停止作战","exs":["王玉明充分发挥人熟、地熟、事熟的优势，让双方偃旗息鼓。","在9月的最后两天，我国降雨偃旗息鼓，全国大部地区进入晴好天气，美中不足的是南方部分地区仍有小到中雨天气。","一旦碰到瓶颈就偃旗息鼓，甚至开“空头支票”，说一套、做一套，最终留下“半拉子工程”，损害的是群众利益。把实事办实，才能取信于民。"]},{"id":531,"w":"死灰复燃","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失后又出现","type":"four","expl":"死灰：冷却了的灰。燃：烧。冷却的灰又重新烧起来。比喻失势的人又重新得势。也比喻已经消亡的事物又重新活动起来。多含贬义。","core":"比喻失势的人又重新得势","exs":["特别是当前煤炭需求量大，各地全力保供，在量价齐升、共同拉动下，之前几乎绝迹的非法盗采窝点又死灰复燃。","在巡视反馈的内容中不难发现，一些已经解决的问题有可能死灰复燃，一些新的问题还在不断出现。","要不断增强以自我革命精神推进作风建设的政治自觉，锲而不舍加固中央八项规定堤坝，以钉钉子精神纠治“四风”，绝不让“四风”反弹、死灰复燃。"]},{"id":532,"w":"卷土重来","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失后又出现","type":"four","expl":"卷土：卷起尘土。形容人马奔跑之状。比喻失败以后又重新恢复势力；也比喻消失了的人或事物重新出现。（中性，多贬义）","core":"形容人马奔跑之状","exs":["因春节假期人员流动和聚集导致大规模疫情卷土重来的可能性不大，这也是我国对有效精准统筹平衡疫情防控和社会经济发展，最大限度保障老百姓正常生产生活的一次考验。","反奢侈浪费之风在短时间内起到了良好的效果，但从长远来看，所谓风过无痕，奢侈浪费之风难免卷土重来。","不能纵容“擦边”直播间卷土重来，这是社会共识，更应该成为我们的一致行动。"]},{"id":533,"w":"沉渣泛起","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"消失后又出现","type":"four","expl":"渣：渣滓。泛：浮。已经沉到水底的渣滓又漂浮了起来。比喻已经绝迹了的腐朽、陈旧事物又重新出现。（贬义）","core":"比喻已经绝迹了的腐朽、陈旧事物又重新出现","exs":["临近年底，西方社会唱衰中国的论调又沉渣泛起。","樱井周之流背后，是日本政坛持续刮起的阵阵妖风：军国主义沉渣泛起，法西斯主义的幽灵还在作祟。","广大足球从业者应充分认识赛风赛纪和反兴奋剂工作对足球工作的特殊重要意义，提高政治站位，统一思想认识，以案为鉴、举一反三，深入查摆剖析问题，采取坚决有力措施推进赛风赛纪和反兴奋剂工作，以零容忍态度严打足球领域“假赌黑”沉渣泛起之势。"]},{"id":534,"w":"土崩瓦解","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"分裂","type":"four","expl":"瓦解：制瓦时先把陶土制成圆筒形，分解为四，即成瓦，比喻事物的分裂。像土崩塌，瓦破碎一样，不可收拾。比喻彻底垮台。","core":"制瓦时先把陶土制成圆筒形，分解为四，即成瓦，比喻事物的分裂","exs":["起义军进城后骄傲自满，庞大人马在京城里沉迷享乐、军纪松弛。清兵入关后，起义军仓促应战，人心涣散、一击则溃，短短几个月就土崩瓦解。","这个世界，和平、发展、合作、共赢成为时代潮流，旧的殖民体系土崩瓦解，冷战时期的集团对抗不复存在，任何国家或国家集团都再也无法单独主宰世界事务。","有的政党昙花一现，其兴也勃、其亡也忽；有的政党曾朝气蓬勃、生机盎然，久而久之却深陷沉疴、积重难返；有的政党曾长期执政、辉煌一时，却一朝倾覆、土崩瓦解……不一而足，令人唏嘘也发人深省。"]},{"id":535,"w":"分崩离析","part":"c","gn":"四十三","gt":"与消失、重现相关","sub":"分裂","type":"four","expl":"分：分开。崩：倒塌。离析：离散。形容家庭、集团、组织或国家分裂瓦解。","core":"形容家庭、集团、组织或国家分裂瓦解","exs":["有人期盼中国像苏联那样在一个早上分崩离析，但是，抱歉，让这些预言家一再失望了。","俄罗斯驻欧盟外交使团此前就欧盟制裁发表声明说，俄罗斯经济并未“分崩离析”，在欧盟等国际舞台上孤立俄罗斯的企图告以失败，使俄罗斯“遭受战略性失败”的目标没有得逞。","“一个政党，不严明政治纪律，就会分崩离析。”新时期以来，以习近平同志为核心的党中央把党的纪律建设纳入党的建设总体布局，党的二十大报告8次提到“全面从严治党”，5次提到“自我革命”。"]},{"id":536,"w":"毋庸置疑","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"毋：无。庸：用。置疑：怀疑。用不着怀疑。","core":"无","exs":["中国在人工智能、自动驾驶、机器人等尖端赛道的优势已毋庸置疑，在这些领域排名全球前十的企业中，中国企业往往占据半壁江山。","在啤酒工业历史悠久的德国，大麦的重要地位毋庸置疑。","毋庸置疑，成绩政绩的取得，关键是依法依规这个“总阀门”把得牢。"]},{"id":537,"w":"显而易见","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"事情或道理非常明显，极容易看清楚。","core":"事情或道理非常明显，极容易看清楚","exs":["这道理显而易见，谁都能看明白。","至于他们扭曲历史，淡化甚至抹灭孙中山先生和辛亥革命的丰功伟绩，正是他们推行“去中国化”、渐进“台独”的一环，造成的恶果是显而易见的。","秘中关系发展充分表明，与中国合作的好处显而易见，拉美国家应与中国成为朋友。"]},{"id":538,"w":"不言而喻","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"喻：明白。不用说什么就能明白。也作“不言自明”。","core":"明白","exs":["他坦承，对亚利桑那州来说，中国的重要性不言而喻。","对此现象，国台办发言人朱凤莲12日在例行新闻发布会上应询表示，孰是孰非，不言而喻。","在当前人口老龄化趋势日益加剧的背景下，养老服务行业的发展显得尤为关键，而养老体系的一系列认证，作为衡量养老服务质量和水平的重要标准，其重要性不言而喻，它不仅能够保证养老机构的服务质量达到行业规范，还能够增强消费者对养老机构的信任度。"]},{"id":539,"w":"昭然若揭","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"昭然：明显、显著的样子。揭：原意为高举，现也指揭开。意思是形容真相毕露，所有一切都已显现了出来。","core":"原意为高举，现也指揭开","exs":["美方对此选择性“失明”，完全是出于意识形态的偏见和不可告人的政治目的，其唯恐香港不乱的险恶用心昭然若揭。","B公司的一系列操作，其逃废债的目的昭然若揭，损害债权人利益的后果特别明显，这一行为严重损害了债权人的利益。"]},{"id":540,"w":"有目共睹","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"形容人人都可以看到，极其明显。","core":"形容人人都可以看到，极其明显","exs":["党的十八大以来，在以习近平同志为核心的党中央坚强领导下，我们党敢于刀刃向内、敢于刮骨疗毒、敢于壮士断腕，反腐败斗争力度前所未有、成效有目共睹。","“中国新疆很美好，发展成就有目共睹，我们要把所见所闻分享给更多人。”","中国人权事业取得的成就有目共睹。"]},{"id":541,"w":"一目了然","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":null,"type":"four","expl":"一眼就看得很清楚。形容事物、事情原委很清晰，一看就知道是怎么回事。","core":"形容事物、事情原委很清晰，一看就知道是怎么回事","exs":["立足让消费者对“吃的什么、分量多少”一目了然，不断加强指导，对以例、份、碗等为单位的菜品价格标示行为进行规范，督促餐饮经营者标明主要食材分量，严查缺斤短两行为。","打开手机地图，搜索“工会驿站”，附近站点一目了然。","当前台海局势紧张的前因后果一清二楚，是非曲直一目了然，美方是主动挑衅者和危机制造者。"]},{"id":542,"w":"大张旗鼓","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"形容进攻的声势和规模很大；也形容群众活动声势和规模很大。","core":"形容进攻的声势和规模很大","exs":["开展民营经济高质量发展先进县（市、区）综合评价，为的是激发各地做大做优做强民营经济的动力和创造力，大张旗鼓为服务民营经济发展树标杆、立榜样，让民营经济这一社会发展的关键力量进一步蓬勃壮大。","奏响大张旗鼓创新的时代最强音，为多彩贵州现代化建设提供强有力科技支撑。","吴海军要求，整个冬训的时间是3个月，可谓是“百日学”，切勿急于一时，匆忙收尾、虎头蛇尾，更不能春节前大张旗鼓、轰轰烈烈，春节后偃旗息鼓、悄无声息，而是要按照明确的时间节点，除集中培训之外，还要有序组织开展好相关的学习活动。"]},{"id":543,"w":"无处遁形","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容很明显","type":"four","expl":"遁：迁移、离去；形：形体、踪迹。指没有地方可以隐藏形迹，形容在严密检查或困境下彻底暴露，无法逃避。","core":"指没有地方可以隐藏形迹，形容在严密检查或困境下彻底暴露，无法逃避","exs":["一方面，提升物业服务质量，把账目亮出来，把规则建起来，让业主缴得心甘情愿；另一方面，加强缴费约束，让恶意拒缴无处遁形。","杜绝监管“走过场”，必须紧盯主体责任的“最后一公里”，抓紧抓实、落准到人、落细到事，将问题隐患闭环整改到位，才能让安全漏洞无处遁形。","丹江口市与河南淅川县两地检察机关联手，以一场跨区域协作的公益诉讼，终于让违法行为无处遁形。"]},{"id":544,"w":"语焉不详","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"是指虽然提到了，但说得不详细。","core":"是指虽然提到了，但说得不详细","exs":["这份报告虽涉及工程中的质量问题，但语焉不详，具体细节不明。","对党规党纪，必须十分明确地强调、十分坚定地执行，绝不能语焉不详、闪烁其词。","《三千年前的“双城记”——从“三星堆”到“金沙城”》文献价值与文学创新具有时代性与前瞻性，很多新的研究成果填补了历史学家语焉不详的记载。"]},{"id":545,"w":"讳莫如深","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"原意为事件重大，讳而不言。后指把事情隐瞒得很紧。","core":"后指把事情隐瞒得很紧","exs":["在谈判过程中，双方都讳莫如深，不愿意轻易透露自己的底牌。","美方对本国安全法网严密、刑罚严苛的客观事实置若罔闻、讳莫如深，却在香港履行国安立法宪制责任上指手画脚、说三道四。","提起殡葬行业，很多中国人讳莫如深，尤其是在长辈眼里，殡葬行业的工作并非一份理想、体面的工作。"]},{"id":546,"w":"暗度陈仓","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"意思是指暗中进行某种活动。","core":"意思是指暗中进行某种活动","exs":["虽然他表面看起来很单纯，但心里却很有心机，常常暗度陈仓，让人措手不及。","这完全是日本对其暗度陈仓发展航母、损害地区安全环境行径的欲盖弥彰。","美英澳企图把三国核潜艇合作包装成一个无核武器国家与机构秘书处之间的例行保障监督问题，要求援引全面保障监督协定第十四条作出豁免安排，这无异于掩耳盗铃，实际上就是想暗度陈仓，胁迫秘书处为这一合作背书。"]},{"id":547,"w":"不露声色","part":"c","gn":"四十四","gt":"明显、含糊相关","sub":"形容不明显","type":"four","expl":"意思是心里面的计划或者想法并不通过言语和面部表情直接表现出来。","core":"意思是心里面的计划或者想法并不通过言语和面部表情直接表现出来","exs":["他在不露声色地观察着周围的人和事，以便更好地了解情况。","比赛中，丁俊晖明显憋着一口气，尽管神情上不露声色，但他击球坚决，进攻也不保守。","主歌部分即使是概
